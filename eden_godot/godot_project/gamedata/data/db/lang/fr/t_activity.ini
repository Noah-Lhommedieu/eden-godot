241|Repousser les forces du Mal|Des Boss de nombreux donjons ont joint leurs forces pour semer le chaos dans un monde qui les a rejetés. Les Gardiens Éternels vont avoir la lourde tâche de renvoyer ces brutes d'où elles viennent.|Repousser les forces du Mal

