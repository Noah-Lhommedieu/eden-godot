4138|Event du Banquet
Obtenez une Invitation au Banquet et répondez aux critères requis pour organiser un Banquet. Les Invités peuvent s'amuser chez vous et gagnez des buffs spéciaux.

Conditions requises du Banquet
1. Au moins trois invités dans la Villa
2. Le Luxe, Confort et Rareté doivent répondre aux conditions.
3. Vous ne pouvez organiser qu'un Banquet par jour.

Effets du Banquet
1. Effets Temporaires : Buffs spéciaux qui n'ont d'effet que dans la Villa
2. Effets à Longue Durée : Buffs spéciaux qui vous affecteront même en-dehors de la Villa

Durée du Banquet
La durée du banquet

Taxe du Banquet
Le coût d'organisation du Banquet

Popularité :
Selon le nombre d'invités à votre Villa et la population dans une Ville, vous pouvez gagner des points de Popularité qui peuvent vous offrir des récompenses spéciales. Les points de Popularité sont remis à zéro à chaque maintenance.

200 points : Recevez un cadeau
450 points : Recevez deux cadeaux
700 points : Recevez trois cadeaux|
4139|L'Arène est ouverte aux horaires suivants :
14:00-16:00
19:00-21:00
23:00-01:00

Niveau de Personnage minimum : 30

Pendant chaque match d'arène, un rubis s'illuminera pour chaque round gagné par un joueur, le premier à obtenir trois rubis gagne. 

L’Arène commence automatiquement dès que 6 joueurs s'inscrivent à l'Arène. Vous aurez alors 10 secondes avant d'être téléporté en Arène. La formation des équipes dans l'Arène est totalement aléatoire.

Une fois inscrit à une Arène, vous ne pouvez pas participer aux Guerres de Territoires, entrer dans les donjons, ou changer de canal.

Chaque victoire d'arène donne au joueur trois Étoiles d'Honneur et un Jeton de classe, les joueurs de l'équipe perdante peuvent recevoir une Étoile d'Honneur. 

Quand un joueur a accumulé assez d'Étoiles d'Honneur, il peut rendre visite au Gérant de l'Arène, Rowan (483, 383) à Aven, pour échanger les étoiles contre des récompenses. 
