83|Chasse aux Œufs de Lapin chez les Oiseaux|Maintenant que l'hiver est parti, la chaleur du printemps enlace la terre. À cette belle période de l'année, tout le monde est tout sourire. C'est l'excitation partout, le festival pour célébrer l'arrivée du printemps est en pleine préparation.  

