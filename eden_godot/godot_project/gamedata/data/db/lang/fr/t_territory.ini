2|Monts Calcaire Combat|Règles de Combat
Dans les Guerres de Territoire, les joueurs sont répartis en une Équipe Rouge et une Équipe Bleue, en se basant sur leurs guildes. Le but de chaque équipe est de briser les quatre Cristaux de Zone sur le champ de bataille pour l'emporter. 

Récompenses de Bataille
Les joueurs qui finissent la quête quotidienne de l'Arène recevront des Coffres de Territoire qui renferment des Pierres de Guerre. Tous les joueurs qui aident à briser les Cristaux de Zone recevront des récompenses supplémentaires par message une fois la bataille finie. Si une guilde réussit à occuper un territoire, les membres de guilde peuvent recevoir un salaire quotidien de la part du PNJ du territoire. Ils recevront aussi un buff spécial quand ils visiteront ce territoire.

Comment gagner
L'équipe possédant le plus de cristaux sera déclarée victorieuse. S'il y a une égalité du nombre de cristaux, les gagnants seront désignés selon les points de guilde et le nombre de victimes de chaque équipe. 

Récompenses
Les vainqueurs auront la possibilité de recevoir plus de Coffres de Territoire selon le classement de la guilde et leur classement personnel. 

Conditions d'Occupation
La guilde qui a le plus grand nombre de points a l'avantage et peut s'emparer du territoire. Si deux guildes ont le même score, celle qui arrive en premier obtient le territoire.
*Une guilde ne peut envahir que 3 cartes maximum.|Règles de Combat
Dans les Guerres de Territoire, les joueurs sont répartis en une Équipe Rouge et une Équipe Bleue, en se basant sur leurs guildes. Le but de chaque équipe est de briser les quatre Cristaux de Zone.

Récompenses de Bataille
Les joueurs qui finissent la quête quotidienne de l'Arène recevront des Coffres de Territoire qui renferment des Pierres de Guerre. Tous les joueurs qui aident à briser les Cristaux de Zone recevront des récompenses supplémentaires par message une fois la bataille finie. Si une guilde réussit à occuper un territoire, les membres de guilde peuvent recevoir un salaire quotidien de la part du PNJ du territoire. Ils recevront aussi un buff spécial quand ils visiteront ce territoire.

Comment gagner
Pour occuper un territoire, brisez les Cristaux de Zone aussi vite que possible et défendez le cristal jusqu'à ce que la bataille soit finie. Détruisez autant de cristaux que possible pour gagner !

Conditions d'Occupation
La guilde qui a le plus grand nombre de points a l'avantage et peut s'emparer du territoire. Si deux guildes ont le même score, celle qui arrive en premier obtient le territoire.
*Une guilde ne peut envahir que 3 cartes maximum.|
