176|Tour des Épreuves|Ses origines restent inconnues mais elle renfermerait le les âmes de nombreux guerriers. 
À sa mort, l'esprit d'un guerrier 
rejoint toutes les autres âmes de la tour.

La façade de la tour s'est dégradée avec le temps.
Les murs sont marqués par la destruction. À l'intérieur, toutefois, le temps n'est que variation. 

Le Noble Guerrier Stalis a délibérément choisi d'envoyer son âme dans la tour.
L'Épreuve de Stalis fait maintenant partie de 
la liste d'épreuves de la Tour des Épreuves.||||||||||Tour - Épreuves des Esprits |
177|Caverne de Schiste|Cette caverne en ruine ensevelie sous les sables mouvants renferme le secret d'une société archaïque et technologique très développée.
Des scientifiques ont cherché pendant des années cette mine de savoir, en vain.  
Suite aux tremblements de terre, des fissures se sont formées sur les parois de la caverne, libérant un accès.

À l'intérieur, le temps semble s'être arrêté : même si les chercheurs ont disparu depuis longtemps, 
tous leurs instruments continuent de travailler
et d'effectuer des recherches. 

En comparant son matériel de recherche à celui du Labo Vingot,
le scientifique Nikola en a déduit que les ruines gardent un secret. Nikola a décidé d'enquêter
et a une fois de plus traversé ce labyrinthe de pièges. ||||||||||Percer les Secrets d'une Civilisation Antique|
178|Palais des Malices|La mousse et le lierre ont entièrement recouvert les murs de cet ancien palais.
Les fondations se sont, au fil des siècles, enfoncées dans le sol, obstruant l'entrée.
Les gravures de pierre ont fini par disparaître avec le temps.

Le dernier maître des lieux était un formidable magicien, père d'une ancienne dynastie de magiciens.
Il entama d'interminables recherches afin de découvrir la véritable essence de la vie.
Mais son insatiable curiosité le perdit. 

Éléa, la gardienne de la Racine Branda, tenta de rompre le cercle d'incarnation 
en trouvant un moyen de sceller Acilino à jamais. Toutes ses tentatives pour pénétrer dans l'enceinte du palais magique
cette fois. Cette fois, Éléa s'est munie du Sceptre Doré du Mage
et un petit groupe de gardiens l'ont accompagnée. ||||||||||Trésorie du Grand Magicien|
179|Fort Loselle|Le Fort Loselle domine, du haut de sa colline, les Plaines Dorées. 
dissuadant les étrangers d'approcher. 

Mais des hordes de monstres assaillirent ce fort, reconnu jadis comme une citadelle artistique.
Tous les citoyens se terrèrent dans les coins les plus reculés du fort. Plus tard, de vaillants citoyens
décidèrent de rétablir l'ordre et la sécurité.

Ils levèrent une armée de soldats pour se prémunir de nouvelles attaques. 
Les entraînements allant bon train, l'armée fut bientôt prête à protéger le fort des attaques ennemies 
et toutes sortes d'experts militaires naquirent. ||||||||||Fort du Mal, Géant des Plaines Dorées |
180|Écarlate |Écarlate : un fort impénétrable sous la supervision de <Chef> Clairon Dentsanglante. 
Grâce à travail acharné des Gardiens Éternels, l'énergie maléfique à été dissipée.

Mais, avec le temps, des créatures inconnues se sont glissées dans le fort
et ont créé une nouvelle puissance avec laquelle il faut compter. La disparition d'Ursun et l'expédition des Chevaliers de la Rose
sont annonciateurs d'évènements à venir.

L'unique message qui y a été laissé confirme qu'il faut fermer ce lieu à jamais en
y emprisonnant les créatures démoniaques , bien que cela leur prive de leur dernière chance 
de vivre...||||||||||?????????|
181|Royaume Vide|On raconte que cet ancien royaume, scellé pour des raisons exceptionnelles renferme
d'inestimables trésors.

En utilisant la Pierre Dimensionnelle de Kutin à l'endroit où l'espace-temps est déchiré dans la Forêt Ensorcelée, 
vous pouvez traverser le sceau et entrer dans le royaume.

Un isolement total a permis à la faune de prospérer. Des chasseurs de trésor piégés
ont été transformés en fantômes vengeurs. Des dangers insoupçonnés attendent 
le Gardien Éternel téméraire.||||||||||???????|
182|Temple Perdu|Ce grand temple millénaire était jadis la demeure d'un dragon bienveillant
qui vivait en paix et en harmonie avec toutes les créatures, petites ou grandes.

Mais un jour, le dragon rendit son dernier souffle et le temple disparut sous la Forêt de Delphes.
Depuis lors, l'existence du dragon et du temple ont sombré dans l'oubli...

Mais avec le temps, tout peut changer, et l'histoire tend à se répéter. Les remous perpétuels du monde ont tiré le temple de son sommeil séculaire, 
et de ses profondeurs autrefois merveilleuses 
résonne le gémissement d'un esprit dont le temps lui-même avait perdu le souvenir...|||||||||||
183|Plaines Séraphines|Les Plaines Séraphines sont le décor d'une beauté éclatante, 
situées au-delà des frontières de la Vallée de Vulcain et coupées du monde par des pics escarpés.

Autrefois terres de pureté, elles subissent la viciation d'une étrange créature issue d'un autre monde...
Cet être perfide a employé sa magie pour contaminer les créatures des plaines, 
changeant de paisibles bêtes en prédateurs cruels et carnassiers qui attaquent tout être vivant. Aujourd'hui encore, 

cette pestilence continue de se répandre dans la Vallée de Vulcain et au-delà...
D'innombrables surprises attendent le Gardien Éternel... et autant de périls.|||||||||||
184|Domaine Démoniaque Intérieur|Les Gardiens Éternels qui ont vécu de trop nombreux combats virent leur corps irradier d'une étrange
énergie sombre. Cette énergie non destructrice consumèrent les 
pouvoirs des Gardiens Éternels.

Ces énergies, émises par les Gardiens Éternels devinrent Ténèbres et Flammes 
et engloutirent entièrement le royaume. Mort et Malédiction s'abattirent et la puissance 
du Cristal Bleu s'affaiblit et disparut peu à peu.|||||||||||
185|Tombe du Samouraï|Le lieu de la bataille au sommet qui s'est déroulée entre les 3 grandes écoles : la vénérable école Florica,
l'Épée Unique Loroco et les Dagues Jumelles Statham. Ces trois s'y rencontrèrent
et une féroce bataille s'ensuivit qui laissa de profondes traces.

On prétend que leurs épées étaient faites d'un alliage venue d'un autre monde et infusées 
d'une énergie extraordinaire. Beaucoup d'aventuriers s'y aventurèrent et tentèrent de s'emparer de des 3 épées
mais aucun ne revint.
|||||||||||
186|Pays des Merveilles Diablepourpre|Dans la Plaine Fleurie, les hostilités ont cessé.
L'âme égarée a permis à Lily la Grande médium de détecter
une aura maléfique. Lorsqu'elle utilise la magie pour manipuler l'espace, un sort s'échappe de la faille
et tout se met à changer.

La bataille qui s'est déroulée ici est terminée.
Au milieu de ruines carbonisées, les corps des soldats vaincus jonchent le sol.
On peut encore sentir l'odeur de la poudre et du sang,

mais tout est silencieux. Le combat est fini et on ne trouve plus
âme qui vive, l'écho des tambours et des cris des guerriers s'est déjà dissipé.
Un silence pesant enveloppe ces lieux magiques et leur confère
une atmosphère lugubre.||||||||||Un Pays des Merveilles de la mort et de l'affrontement sanguinaire.|
187|Palais des Bourbes|Ce palais mystérieux est situé au milieu de terres bourbeuses. Derrière une entrée discrète, 
se cache un somptueux palais, truffé de pièges ingénieux.

Les Frères Aventuriers ont découvert le palais par hasard,
mais les nombreux pièges les ont empêchés d'y pénétrer.

Quel incroyable trésor nécessite donc d'installer tant
de pièges ? Seul un véritable aventurier pourra percer ce mystère.

||||||||||Une terre ancestrale cachant un mystérieux trésor.|
188|Vallée du Sacrifice|C'est une montagne sacrée dans le Culte de Bonmalmo. Une nature et un environnement apaisés entourent le
site rituel de la Sorcière. Il est très facile de se perdre sur ses sentiers balayés par les vents et
seuls ceux capables de suivre leur instinct trouveront leur chemin.

De nombreux monstres sont attirés par l'étrange énergie qui s'échappe de la vallée.
L'énergie féérique grandit inlassablement, perturbant les activités des
sorciers, obligés alors d'accomplir leurs rites dans un autre endroit.||||||||||Une vallée tranquille chargée d'une énergie mystérieuse.|
