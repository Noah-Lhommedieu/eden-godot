1924|Ordre de Valence
*Augmenter la gloire : Terminez les missions Hautes-terres.
*Emplacement de la Boutique de Gloire : Hautes-terres (513, 240)

Les Ordres de Valence se trouvent à l'entrée des Hautes-terres. Ils sont les premiers adversaires que rencontrent tout intrus. Pour eux, un combat contre l'Empire Heldentod est une partie de plaisir. 

Leur mission principale est de défendre le Fort du Lion. Les tentatives d'invasion sont nombreuses, mais ils n'ont encore jamais abandonné le Fort du Lion à un ennemi. Ils sont comme une enceinte imprenable qui protège, infatigable, l'Union de Valence. 

Ils se chargent également de maintenir la paix et l'ordre dans les Hautes-terres. Mais à cause des importantes attaques récentes de l'Empire Heldentod et de la Rébellion au sein de l'Union, Les Ordres de Valence sont plus que jamais sous pression.|
