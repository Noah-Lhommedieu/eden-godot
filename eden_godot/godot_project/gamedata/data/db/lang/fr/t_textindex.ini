4364|<Auto-Route>

"Perdu(e) dans Ezur ? L'Auto-Route vous permettra de vous y retrouver !"

Pour pouvoir l'utiliser, appuyez sur L pour ouvrir le Journal des quêtes et cochez l'option "Suivi des Quêtes".

Une petite fenêtre apparaîtra alors sur la droite de votre écran. Cliquez-droit sur le nom du PNJ ou de l'objet à trouver et roulez jeunesse ! Voilà que vous vous y rendez automatiquement ! Elle n'est pas belle, la vie ?|
4365|<Attaquer un Monstre>

"Ah, je sens que vous avez envie de taper du monstre ! Rien de plus simple."

Clic-gauche sur un monstre sur la carte pour voir les informations à son sujet et pour le prendre pour cible.
Le petit "?" à droite du nom vous permettra de voir les objets trouvables sur lui, ainsi que ses compétences.
Clic-droit sur le monstre pour l'attaquer.

|
4366|<Utiliser les Compétences>

"Je vous sens frémissant d'excitation à l'idée de pouvoir montrer vos compétences ! Envoyez donc une boule de feu sur Andrew, tiens !"

Pour pouvoir utiliser vos compétences, appuyez sur la touche K. Cela ouvrira la fenêtre de Classe.
Dans la colonne de gauche, vous pouvez voir les différentes Compétences Générales (il y a également l'onglet de Compétences de Classe).

Glissez l'icône des compétences que vous souhaitez dans votre barre de raccourcis. Ensuite, en combat, appuyez sur la touche de raccourcis pour utiliser cette compétence.|
4367|<Améliorer ses Compétences>

"Autrement dit, petite boule de feu deviendra grande !"

Pour améliorer vos compétences (niveau maximal : niveau de Personnage pour les compétences générales, niveau de Classe pour les compétences de Classe), appuyez sur K et cliquez ensuite sur "Améliorer" à droite de la compétence de votre choix. 

Attention, améliorer une compétence vous coûte soit de l'argent, soit des PC ! Il faut donc l'utiliser avec sagesse.|
4368|<Utiliser les Talents de Classe>

"Les Talents de Classe vous permettront d'améliorer vos talents naturels et de faire des étincelles dans les combats !"

Les Talents de Classe se trouvent dans le coin inférieur droit de la fenêtre de Classe (touche K). Pour augmenter de niveau un Talent de Classe, vous aurez besoin de Points de Savoir. 
Vous gagnez 1 Point de Savoir par niveau de Classe.

Le nombre de Points de Savoir nécessaire pour augmenter de niveau un Talent est le suivant :
Niv. 1-5 : 1 Point de Savoir
Niv. 6-15 : 2 Points de Savoir
Niv. 16-20 : 3 Points de Savoir |
4369|<Utiliser les Licences>

Ah, les licenses… Encore un p'tit bonus qui fera la différence !

Les licenses changent en fonction des classes et vous apportent des bonus supplémentaires.
Le nombre que vous pouvez équiper augmente en fonction de votre niveau.
Les licenses que vous aurez équipées ne disparaîtront pas en changeant de classe.|
4370|<Changer de Classe>

"ENFIN ! Voilà ! Et c'est seulement maintenant qu'on en parle ? C'est n'importe quoi ! Appelez-moi le responsable !"

Pour changer de Classe, il faut vous rendre dans le deuxième onglet principal de la fenêtre de Classe (touche K).

Dans la colonne de gauche, choisissez dans le menu déroulant la classe de votre choix, pour peu que vous répondiez au prérequis, et cliquez sur "Changer !" en haut à droite.

Pouf, vous avez changé de classe ! Votre barre de raccourcis changera également pour celle de la classe choisie. Faites attention cependant, vous ne pourrez pas changer de classe immédiatement après. Il faut attendre 10 minutes.|
4371|<Augmenter le volume de son Sac à Dos>

"Vous allez voir, c'est sacrément pratique ! Surtout pour emporter toute votre garde-robe avec vous !"

Appuyez sur la touche B pour ouvrir votre Sac à Dos. Le Sac à Dos de base est limité en place. Pour pouvoir augmenter son volume, il faut faire l'acquisition d'Expansions, à mettre en bas de la fenêtre.

Différentes tailles sont disponibles.|
4372|<Monde>

"Ezur est plus grand qu'il n'y paraît !"

Vous pouvez ouvrir la Carte du Monde en appuyant sur la touche "," (clavier AZERTY). 
La Carte vous donnera énormément d'informations utiles, telles que l'emplacement des PNJ marchands, des élites en vadrouille (monstres à combattre) ou de l'emplacement des autres membres de votre groupe.

À utiliser sans modération !|
