242|Préparer le feu d'artifice|  Le Duc Derek à Aven est très ennuyé : la Princesse Céline est en âge de se marier mais s'y refuse obstinément ! Bien qu'il soit enchanté de la conduite pieuse de sa fille, il est persuadé qu'elle serait très heureuse de partager sa vie avec l'élu de son cœur.

  L'<Aristocrate> Peter, ayant eu vent des tourments de son maître, a organisé un gigantesque Carnaval de l'été à Aven. Il a ainsi invité de nombreux princes, ducs et autres nobles à la fête dans l'espoir que la princesse trouve un prétendant.

  Tout se déroulait à merveille : le carnaval était une réussite et la princesse, qui semblait vraiment prendre son pied, était rayonnante. Mais des filous se sont cachés dans la foule, menaçant le calme d'Aven. Gardien Éternel, vous devez protéger la Princesse, garantir la sécurité de la cité et faire en sorte qu'il n'y ait pas d'accroc pendant la fête.|Préparer le feu d'artifice

*Les joueurs de niveau 15 ou plus peuvent accepter la quête Préparer le feu d'artifice auprès de l'<Aristocrate> Peter.

*En terminant la quête, vous obtenez 1 Médaille de Noble et le buff Lanceur d'élite (CHA +5 %. Dure 2 heures.).

*Cette quête ne peut être faite qu'une fois par jour.

*Vous pouvez échanger 4 Médailles de Noble contre 1 Boîte Cadeau Prestigieuse auprès de l'<Aristocrate> Peter.

*Vous pouvez échanger 30 Médailles de Noble contre 1 Masque en plumes bigarrées auprès de l'<Aristocrate> Peter.|
