7061|(Fantôme) Dascha Adwin : L'entraînement est fini pour aujourd'hui, Kzéna. Allez faire votre rapport à l'Officier Interne pour obtenir le déguisement requis. |
7062|(Fantôme) Kzéna : Oui, Duc ! |
