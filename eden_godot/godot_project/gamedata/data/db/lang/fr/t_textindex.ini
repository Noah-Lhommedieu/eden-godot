7237|Transformation de Cristal
La table à gauche montre les résultats possibles après transformation d'une Gemme d'Ezur.
Après transformation, vous pouvez récupérer l'objet obtenu
ou de poursuivre le processus.

Fonctionnement :
  1.  Chaque nouvelle série de transformation demande une Gemme d'Ezur au départ.
  2. À chaque étape, vous pouvez choisir de récupérer l'objet obtenu
    ou de poursuivre le processus.
  3. La valeur de la récompense est proportionnelle au niveau de transformation.
  4.  Pour acheter des Gemmes d'Ezur, rendez-vous à Aven
    et trouvez Gisèle, la Marchande de Gemmes d'Ezur. (306, 375)

Gemmes d'Ezur améliorées :
  1.  Durant la procédure, vous avez une chance d'obtenir
    des Gemmes Rayonnantes et Bénies d'Ezur. La transformation prend fin
    lorsque vous obtenez de telles gemmes.
  2. Les Gemmes Rayonnantes et Bénies d'Ezur
    sont stockées dans les emplacements de droite.
    Obtenez-en 10 pour passer au processus de  transformation avancée.
  3. Vous pouvez stocker jusqu'à 999 Gemmes Bénies et Rayonnantes d'Ezur.
    Passée cette limite,
    vous ne pourrez pas les garder.|
