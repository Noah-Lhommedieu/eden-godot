229|Envie de lait|L'Event Carnaval du Ranch est organisé par le <Propriétaire du Ranch> Brock pour familiariser les habitants avec la nature et les divertir pour les changer de leur train-train quotidien.

 Tout le monde sait que le Ranch Camina élève des alpagas. On raconte aussi que le Lait d'alpaga est idéal pour la croissance des enfants. Une certaine <Super Maman> Angelina est très amie avec Brock. Ses enfants sont nourris au lait d'alpaga dès leur premiers pas. Son cadet, <Garçon de ferme> Lulu, aime tellement le Ranch qu'il y passe toute ses journées à y jouer.

 Un jour, les Poulets du Ranch ont été volés par des brigands qui les ont bourrés de produits chimiques, les transformant en <Dopés aux Hormones> Poulets. Les Poulets, énervés, ont profité de leur nouvelle force pour s'échapper. Ils sèment désormais la panique dans Aven. Les Gardiens Éternels vont devoir calmer les poulets et leur faire comprendre qu'il existe des végétariens sur cette planète.|
