7092|Ouphie : Non ! Pourquoi a-t-il disparu dans un moment aussi crucial ?! C'est le dernier Mnemocristal !|
7093|Liarro : Aaargh. J'ai tout gâché. Toutes mes recherches... Pourquoi cela devait-il se finir ainsi ? Tout cela arrive à cause de vous ! C'est votre faute !|
