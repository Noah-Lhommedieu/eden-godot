André prend l'Arbre à Citrouilles joliment décoré et l'expose afin de renforcer l'atmosphère d'Halloween à Aven. L'arbre étant resté longtemps dans une cave, il a besoin d'être nettoyé. Lacus, la Magicienne est prête à aider pour que tout se passe au mieux et qu'elle puisse se régaler des friandises servies pendant le bal. Malheureusement, elle a lancé le mauvais sort et au lieu de nettoyer l'arbre, elle a fait apparaître Pharaon le Marche-terreur, un monstre féroce qui sème le chaos à Aven. Gardien Éternel, protégez les habitants d'Aven des attaques du Pharaon !
|Nettoyer l'Arbre à Citrouilles

*Rendez-vous à Aven et acceptez la quête de l'Explorateur d'Aven André.

*Cette quête ne peut être faite qu'une fois par jour.

*En terminant la quête, vous obtiendrez 1 Bonbon Citrouille.

*Vous pouvez échanger 5 Bonbons Citrouille contre 1 Boîte à Bonbons d'Halloween auprès de l'Explorateur d'Aven André.

*Vous pouvez échanger 40 Bonbons Citrouille contre 1 Fantôme Potelé auprès de l'Explorateur d'Aven André.|
