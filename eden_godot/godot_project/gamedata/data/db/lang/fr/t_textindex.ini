4544|Utilisez la fonction OK

Cliquez sur OK sur la droite

Attention : Si vous voulez utiliser une pierre de portail, vous devez d'abord en acheter dans la Boutique. |
4545|Sélection d'une Quête

Cliquez sur « Réveil III » et la fenêtre de droite affichera les informations de quête. 

Attention : Cliquez sur Tout Suivre pour activer la liste de suivi de quêtes.|
4546|Utilisez la fonction OK

Cliquez sur OK sur la droite. 

Attention : Si vous voulez utiliser une pierre de portail, vous devez d'abord en acheter dans la Boutique.|
4547|Utilisation des Raccourcis de compétences d'attaque

Faites un clic gauche sur votre ennemi et appuyez sur la touche correspondant à la compétence que vous voulez utiliser. 

Pour effectuer une attaque normale, faites un clic droit sur l'ennemi. |
4548|Glissement des icônes de compétences

Faites un clic gauche sur l'icône de la compétence dans la fenêtre des compétences, puis faites-la glisser vers sa destination. |
4549|Paramétrer les raccourcis pour les compétences

Faites glisser l'icône d'une compétence vers un emplacement vide de la barre des raccourcis en bas de votre écran. Appuyer sur la touche de ce raccourci activera dorénavant cette compétence. 

Attention : Cliquez sur le + sur la droite de la barre des touches pour afficher une nouvelle barre de raccourcis. Vous pouvez utiliser jusqu'à trois barres de raccourcis. |
4550|Amélioration des Compétences Générales 

Quand un personnage monte en niveau, vous pouvez améliorer ses compétences générales. 

Attention : Améliorer les compétences générales demande une monnaie spéciale. |
4551|Amélioration des Compétences de Classe

Quand la classe d'un personnage monte en niveau, vous pouvez améliorer ses compétences de classe. 

Attention : Améliorer les compétences de classe coûte des PC. |
4552|Glissement des Certificats de Classe 

Faites un clic gauche sur le Certificat de Classe, puis faites-le glisser vers sa destination. 

Attention : Différents Certificats offrent différentes capacités. |
4553|Équipement des Certificats de Classe 

Faites glisser un certificat vers un emplacement vide pour l'équiper. Si le certificat et l'emplacement sont de la même couleur, alors vous pouvez obtenir des bonus supplémentaires. |
4554|Sélectionner une classe

Faites un clic gauche sur une classe pour lire sa description. |
4555|Changer de classe

Cliquez sur Changer pour changer de classe. 

Attention : Après avoir changé de classe, vous ne pouvez pas en rechanger pendant les 20 prochaines secondes. |
4556|Sacs d'Extension 

Faites glisser les Extensions de Sac à dos vers l'emplacement du sac d'extension pour augmenter l'espace dans votre sas à dos. 

Attention : Si vous placez un objet dans un espace de sac à dos que vous offre l'extension, vous ne pourrez pas retirer l'extension avant d'avoir vidé l'espace supplémentaire. |
4557|Quêtes guidées 

Quand un joueur atteint le niveau demandé, le jeu lui présentera automatiquement une quête spéciale pour le guider dans la nouvelle zone. On appelle ça des quêtes guidées. 

À noter :  Cliquez sur le Journal des Quêtes pour voir la liste des quêtes dans la fenêtre principale.  |
4558|Ouvrir la Carte 

Cliquez sur l'icône en forme de globe terrestre en haut à droite de la mini-carte (Touche : , ) pour ouvrir la carte. |
4559|Voyager vers Colline Tranquille 

Les endroits marqués par une icône en forme de montgolfière indiquent un portail vers un autre endroit. Cliquez sur le portail pour être téléporté vers Colline Tranquille. |
4560|Voyager vers Colline Tranquille 

Finissez les quêtes principales, puis allez voir l'Intendant Marco (176, 372) et demandez-lui comment se rendre à Colline Tranquille. |
4561|Voyager vers Colline Tranquille

Finissez les quêtes principales, puis allez voir l'Oracle Magicienne Athéna Marie (260, 210) et demandez-lui comment se rendre à Colline Tranquille. |
4562|Voyager vers Colline Tranquille 

Finissez les quêtes principales, puis allez voir l'Oracle Magicienne Athéna Marie (113, 295) et demandez-lui comment se rendre à Colline Tranquille. |
4563|Utiliser le Trajet Auto

Sur la carte, sélectionnez le PNJ que vous voulez trouver puis cliquez sur Trajet Auto. Votre personnage se rendra automatiquement chez ce PNJ. 

À noter :  Vous pouvez également cliquer n'importe où sur la carte pour vous rendre à cet endroit. |
4564|Parchemins d'Amélioration 

Placez un Parchemin d'Amélioration pour arme ou armure dans l'emplacement pour parchemin de la fenêtre d'amélioration. Le parchemin disparaîtra après usage. 

À noter :  Faire un clic droit sur le Parchemin d'Amélioration dans votre Sac à dos le placera automatiquement dans la Fenêtre d'Amélioration. |
4565|Améliorer l'Équipement 

Placez l'objet à améliorer dans l'emplacement libre de la fenêtre d'amélioration. 

À noter :  Des niveaux d'équipement différents demandent des niveaux de Parchemins d'Amélioration différents. |
4566|Commencer l'Amélioration 

Cliquez sur Commencer pour démarrer l'amélioration. 

À noter :  L'amélioration dépassant le taux de réussite a des risques de détruire l'objet. |
