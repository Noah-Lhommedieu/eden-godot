1009|Nv. 1 Votre première Quête I|Monts Calcaires|Allez voir Madame Cynthia, le PNJ avec un point d'interrogation au-dessus de la tête, près du point de résurrection. Faites un clic droit pour commencer la conversation. |
1010|Nv. 1 Votre première Quête II|Monts Calcaires|Allez parler avec Andrew, le Chef du Village, il se trouve près de Madame Cynthia. Soumettez la quête à Laz, le Contremaître de la Mine. |
1011|Nv. 1 Votre première Quête III|Monts Calcaires|Des Champignoïdes à Chapeau rouge sont apparus à l'entrée du Village Andrew. Vous pouvez vous rendre là-bas en traversant le pont à l'ouest du Village Andrew. |
1012|Nv. 2 Votre première Quête IV|Monts Calcaires|Un Champignoïde des Grottes erre dans les Monts Calcaires du Village Andrew. Dirigez-vous au nord-est du Village Andrew. |
1013|Nv. 2 Votre première Quête V|Monts Calcaires|Obtenez un Éclat de Cristal Bleu en détruisant <Démon du Chaos> Jahan (33, 79). |
1014|Nv. 2 Indices du Cristal I|Monts Calcaires|Alec, le marchand Zumi, se trouve à l'extérieur du Village Andrew. Vous le trouverez sur la plaine à l'ouest du village. Appuyez sur <,> pour faire apparaître la carte. Rendez-vous au point d'interrogation pour soumettre une quête. |
1015|Nv. 3 Indices du Cristal II|Monts Calcaires|Un vilain Yak à Cornes Aiguisées a volé l'Outil d'Évaluation de Gemme d'Alec, mais le Zumi n'est pas sûr de savoir quel est le yak voleur. Battez autant de Yaks à Cornes Aiguisées que possible jusqu'à ce que vous trouviez l'Outil d'Évaluation de Gemme. |
1016|Nv. 3 Indices du Cristal III|Monts Calcaires|Amenez le rapport d'Alec au Maire du Village d'Andrew. |
1017|Nv. 3 Tricot d'Amour|Monts Calcaires||
1018|Nv. 3 Crise au Village d'Andrew|Monts Calcaires||
1019|Nv. 4 Oracle Magicienne I|Monts Calcaires|Interrogez Alec sur l'analyse du cristal. Vous devez être minimum niveau 5 pour avoir cette conversation. |
1020|Nv. 5 Oracle Magicienne II|Monts Calcaires|Dirigez-vous vers le sud-ouest pour entrer dans le Cottage de la Roue à Aubes. Récupérez du Mucus Magique sur une Angelée Cachée et offrez-le à Athéna Marie, l'Oracle Magicienne. Qui refuserait du mucus ? |
1021|Nv. 6 Oracle Magicienne III|Monts Calcaires|Obtenez un objet de quête sur le Germe Fétide. La Germe Fétide se trouve au sud-ouest du Cottage de la Roue à Aubes. Vous la verrez à la surface de la Forêt Cérilia. Vous y trouverez également des Champignoïdes des Hautes Rocheuses. |
1022|Nv. 6 Oracle Magicienne IV|Monts Calcaires|Trouvez le Golem de Calcaire au sud-ouest du Cottage de la Roue à Aubes. |
1023|Nv. 6 Oracle Magicienne V|Monts Calcaires|Rendez visite à un Anura d'un pays lointain pour en apprendre plus sur la légende du Gardien Éternel. |
1024|Nv. 6 Mains Magiques (répét.)|Monts Calcaires|Récoltez du Mucus Magique sur une Angelée Cachée et battez le Germe Fétide au sud-est du Cottage de la Roue à Aubes. Otto veut offrir du mucus à Athéna Marie, quelle délicate attention ! |
1025|Nv. 6 Escorte (répét.)|Monts Calcaires|Les Golems de Calcaire et les les Champignoïdes des Hautes Rocheuses arrivent de tous les coins ! Otto veut que vous battiez les bêtes au sud de la forêt. |
1026|Nv. 7 Détournement (répét.)|Monts Calcaires|Le Chasseur Torch vous demande d'obtenir de la Gemme Brute sur le Calcaire Forgé. Vous en trouverez près de la Carrière Angor. Cette Gemme Brute pourrait changer la façon dont les villageois perçoivent la chasse. |
1027|Nv. 7 Vêtements Chauds (répét.)|Monts Calcaires|Le Chasseur Torch veut que vous vous rendiez à la Carrière Angor pour y récupérer de la Peau de Bison et de la Crinière de Bison sur les Bisons à Grandes Cornes. Si vous voulez faire une bonne brigandine, ces matériaux sont cruciaux. |
1028|Nv. 8 Carrière Angor I|DNJ 3 Joueurs : Carrière Angor|La production de la Carrière Angor a été interrompue quand des monstres ont envahi la zone. Pour remettre la production en marche, vous devez vaincre ces infâmes créatures. Vous pouvez finir la quête uniquement en choisissant le DNJ 1 Joueur. |
1029|Nv. 8 Carrière Angor II|DNJ 3 Joueurs : Carrière Angor|Kev, le Contremaître de la Mine, a parlé de vos actes héroïques au reste du village, vous avez réussi à sauver la Carrière Angor des griffes du démon. Veuillez d'abord informer Laz, le Contremaître de la Mine, puis allez ensuite parler avec le maire. |
1030|Nv. 8 Clochemer I|Colline Tranquille|La population des Angelées a explosé à Clochemer. Bamen vous implore de vous débarrasser d'une partie de ces horribles créatures et il aimerait aussi que vous rameniez des Crabes Ermites Étoilés pour que les villageois puissent les vendre. |
1031|Nv. 8 Clochemer II|Colline Tranquille|Bamen veut vous présenter au Chef de Police Rolf. Vous pourrez le trouver à l'entrée de la ville. |
1032|Nv. 9 Clochemer III|Colline Tranquille|Le Chef de Police Rolf veut tester vos compétences. Il vous demande de vous rendre au nord de Clochemer, d'y battre les Aigles et de détruire des œufs. |
1033|Nv. 9 Clochemer IV|Colline Tranquille|Une nuée de Crabes Ermites Rocrouge s'est réunie sur la Côte Étoilée. Rolf vous demande de battre les Crabes Ermites, de récupérer des Perles de Sel sur les Angelées de la Baie et d'amener tout ça à Spence, le maire de Clochemer. |
1034|Nv. 10 Clochemer V|Colline Tranquille|Les Crabes Ermites de la Côte Étoilée sont chaque jour de plus en plus agressifs. On pense que Woyzeck, le Roi des Crabes Fous, est responsable de leur attitude. Vous pouvez trouver le Roi des Crabes sur la Côte Étoilée (400, 192). |
1035|Nv. 8 Astuces de Combat (répét.)|Colline Tranquille|Day, l'Épéiste Grenouille, vous voit comme son élève. Il veut vous apprendre toutes les techniques de combat qu'il connaît. Il vous faudra vous entraîner sur les Angelées Noctiluca pour prouver votre valeur, alors exterminez-les et ramenez leurs corps détachés pour montrer ce que vous avez accompli. |
1036|Nv. 8 Astuces de Combat II (répét.)|Colline Tranquille|Day, l'Épéiste Grenouille, vous voit comme son élève. Il veut vous apprendre toutes les techniques de combat qu'il connaît. Il vous faudra vous entraîner sur les Crabes Ermites Étoilés pour prouver votre valeur, alors exterminez-les et ramenez leurs corps détachés pour montrer ce que vous avez accompli. |
1037|Nv. 9 Robe de Soirée (répét.)|Colline Tranquille|La Danseuse Obelle a besoin de plumes pour son nouveau costume. Elle s'intéresse à celles du Vieil Aigle qui sont magnifiques. Vous devez vous rendre dans les collines au nord de la Carrière Angor et briser les œufs sur le sol pour attirer le Vieil Aigle. Soyez prudent ! Cet aigle déteste vraiment les œufs brouillés. |
1038|Nv. 9 Chagrin de Fille (répét.)|Colline Tranquille|Obelle a besoin d'une plume du Volatile de Minuit pour décorer son chapeau de danse. Pourquoi a-t-elle besoin d'un chapeau juste pour danser ? Hum, c'est une question à laquelle on préfère ne pas répondre. Pour attirer le Volatile de Minuit, vous devez utiliser le Sifflement d'Imitation à l'endroit désigné. Elle a aussi besoin que quelqu'un tue les aigles près de la colline. |
1039|Nv. 10 Patrouille (répét.)|Colline Tranquille|L'Agent de Police Bamen vous demande de regarder de plus près le problème de surpopulation des Angelées de la Baie à la Carrière Angor. |
1040|Nv. 10 Magnifique Cadeau (répét.)|Colline Tranquille|La Carrière Angor est un monument de Clochemer. Cependant, la récente surpopulation des Angelées a mis un mauvais coup au tourisme à Clochemer. |
1041|Nv. 11 Rapaces Voleurs (répét.)|Colline Tranquille|Des Rapaces Ara n'ont de cesse d'attaquer les laitiers ! Apparemment, ils adorent le lait. Le maire souhaite que vous vous rendiez au nord du Ranch Camina et chassiez les Rapaces Ara. |
1042|Nv. 11 Vengeance (répét.)|Colline Tranquille|Naut vous a donné un morceau de Mouton Cru pour attirer le Sanglier Dentdacier hors de la Colline Tranquille. Il vous a également demandé de faire subir aux Sangliers Peau-de-fer de la colline la frustration des livreurs. |
1043|Nv. 11 Le Gang des Aigles I |Colline Tranquille|Abel espère que vous pourrez aider à patrouiller à l'est et au nord de la Caravane Pillée. Abel aimerait également que vous alliez avec le Mercenaire Julian et que vous lui fassiez un résumé de la situation. |
1044|Nv. 12 Le Gang des Aigles II |Colline Tranquille|Abel a découvert qu'il y avait des espions à Clochemer. Il vous demande de vous rendre au sud du Camp Ravagé pour trouver des traces de l'espionnage mené par le Boucher du Gang des Aigles. Faites votre rapport au Mercenaire Julian. |
1045|Nv. 12 Le Gang des Aigles III |Colline Tranquille|Abel peut trouver qui a écrit le Plan Secret du Méchant en analysant l'écriture. Pour obtenir son aide, vous devez réunir 3 morceaux de Sanglier Frais. Amenez la viande à Eyern et il préparera de la Viande de Sanglier Grillée. Abel vous dira tout ce que voulez savoir si vous lui donnez de quoi se remplir la panse. |
1046|Nv. 13 Le Gang des Aigles IV|Colline Tranquille|Après avoir étudié l'écriture du Plan Secret du Méchant, Naut en conclut que c'est Rolf qui en est l'auteur. |
1047|Nv. 13 Le Gang des Aigles V|Colline Tranquille|Abel espère que vous pouvez travailler discrètement, il ne faut pas que l'espion ait vent de votre enquête. Il vous demande de retrouver l'Épée Antique de Slomer, le Voleur Violent, et de l'amener au propriétaire du Ranch Camina. |
1048|Nv. 12 Une Femme Inquiète (répét.)|Colline Tranquille|Utia sait qu'elle ne peut pas empêcher Brock de combattre les voleurs du Camp Ravagé. Utia vous demande d'aider à affaiblir les forces du Camp Ravagé. |
1049|Nv. 12 Voleur Affamé (répét.)|Colline Tranquille|Ces abrutis d'Épéistes Gang des Aigles sont assez bêtes pour voler des alpagas pour leur propre consommation. Allez au Camp Ravagé et passez-leur l'envie de jamais manger de l'alpaga à nouveau. |
1050|Nv. 13 Détruire les Provisions (répét.)|Colline Tranquille|Introduisez-vous dans le Camp Ravagé et détruisez leur Coffret d'Énergie pour affaiblir leurs forces. |
1051|Nv. 13 Enquête et Collecte (répét.)|Colline Tranquille|Julian espère obtenir les derniers renseignements sur les voleurs. Veuillez récupérer le Plan de Bataille des Assassins du Gang des Aigles et fouillez leur campement. |
1052|Nv. 13 Fort Verdure I|DNJ 3 Joueurs : Fort Verdure|Brock va lancer une fausse rumeur en annonçant une prochaine attaque. Vous devez en profiter pour piéger le Camp Ravagé. |
1053|Nv. 14 Fort Verdure II|DNJ 3 Joueurs : Fort Verdure|Battez Boswell, le Chef de Camp du Gang des Aigles. Vous obtiendrez de bonnes infos de lui. |
1054|Nv. 14 Fort Verdure III|DNJ 3 Joueurs : Fort Verdure|Pénétrez dans Fort Verdure, et débarrassez-vous des misérables voleurs. Vous pouvez finir la quête uniquement en choisissant le DNJ 1 Joueur.|
1055|Nv. 14 Secret du Village I|Forêt Arc-en-ciel|Dans les bois au nord d'Opéra, un Lutin de la Forêt a détruit toutes les graines pas encore mûres. Le maire espère que vous pourrez donner au vilain Lutin de la Forêt une leçon qu'il n'oubliera pas de si tôt. Il aimerait également que vous rameniez des fruits mûrs. |
1056|Nv. 14 Secret du Village II|Forêt Arc-en-ciel|Otto ne peut pas le faire lui-même. Il vous demande d'amener des Baies Lunaires à Blok et à Bern. Vous les trouverez près de l'entrée nord de la vallée. |
1057|Nv. 15 Secret du Village III|Forêt Arc-en-ciel|Pour repousser les espions et contrecarrer leurs plans, vous devez obtenir les matériaux nécessaires sur les Farfadets Feuillus et les Lys Lumineux. Apportez-les à Del. |
1058|Nv. 15 Secret du Village IV|Forêt Arc-en-ciel|Del veut que vous utilisiez le temps de préparation du médicament pour attaquer le Géant Sylvestre et l'Aîné Sylvestre. Il aimerait également que vous appliquiez la Potion de Restaur. des Plantes (303, 135) pour guérir l'arbre. |
1059|Nv. 15 Secret du Village V|Forêt Arc-en-ciel|La Potion de Détection est prête. Appliquez la Potion de Détection au sud-ouest de la forêt (350, 120) et Lucavio, l'Éclaireur Caché, apparaîtra. |
1060|Nv. 14 Les Échecs du Chasseur (répét.)|Forêt Arc-en-ciel|Le Chasseur Blok n'a pas les capacités de gagner assez d'argent pour couvrir son train de vie. Il vous demande de vous rendre dans la forêt au nord d'Opéra et de voler les monstres. Il pourra vendre tout ce que vous attrapez. C'est pas comme si ces monstres avaient vraiment besoin de ces trucs de valeur de toute façon. |
1061|Nv. 15 Chasseur Timoré (répét.)|Forêt Arc-en-ciel|Le Chasseur Blok veut récupérer de l'eau du lac au nord-ouest du village. Cependant, il a peur des Gangsters du Marais Noir, vous allez sûrement devoir le relayer. Il aimerait également que vous rameniez des pétales de Lys Lumineux. |
1062|Nv. 15 Fabrique de Médicaments (répét.)|Forêt Arc-en-ciel|Des herbes poussent sur la peau des Aînés Sylvestres. Récupérez-en ! |
1063|Nv. 15 Retour du Printemps (répét.)|Forêt Arc-en-ciel|Les Géants Sylvestres se reproduisent bien trop vite, ils aspirent tous les nutriments du sol. Veuillez vous rendre au sud-ouest de la forêt et chassez-les, sinon la terre sera infertile dans quelques jours ! |
1064|Nv. 16 Prismata I|Forêt Arc-en-ciel|Smack a découvert que le Cristal Arc-en-Ciel est essentiel pour le bien être de la forêt. Veuillez en informer Otto et Sib.  Vous les trouverez au sud d'Opéra. Ensuite, allez voir Bern pour en savoir plus à ce sujet. |
1065|Nv. 16 Prismata II|Forêt Arc-en-ciel|Bern est tombé sur une humaine à Prairiebellule. Il y a des bestioles pas claires qui rôdent par là-bas et il a peur qu'elle soit en danger. Veuillez vous occuper de ces créatures et trouvez l'aventurière humaine. |
1066|Nv. 16 Prismata III|Forêt Arc-en-ciel|Beck travaille sans relâche sur ses recherches. Elle souhaite que vous lui rameniez de l'eau de Prismata. Au passage, rapportez-lui aussi de la viande de crabe à prendre sur les Crabes Rosiers et les Crabes Mousseux Pourpres ; elle raffole des pâtés de crabe. |
1067|Nv. 17 Prismata IV|Forêt Arc-en-ciel|Beck et Lautner ont été séparés. Beck espère que vous pouvez vous rendre à Prismata pour partir à la recherche de Lautner. Vous devez également vaincre les tortues et détruire leurs œufs pour empêcher une surpopulation. |
1068|Nv. 17 Prismata V|Forêt Arc-en-ciel|Lautner a découvert que les Entraîneurs du Marais Noir prévoient de contrôler les tortues à des fins machiavéliques. Allez à (103, 402) pour les battre et déjouez le sinistre plan du Marais Noir. |
1069|Nv. 16 Avec Soin (répét.)|Forêt Arc-en-ciel|Beck a besoin de temps pour finir ses recherches sur les Bêtes-lys. Elle veut étudier le Rhizome de Bête-lys et les Pétales Parfaits des Lys Odorants et des Lys Attirants. Vous pouvez obtenir un Pétale Inconnu en battant le Bête-lys. Faites un clic droit dessus pour voir s'il s'agit d'un Pétale Parfait. |
1070|Nv. 16 Surpopulation (répét.)|Forêt Arc-en-ciel|Les Crabes Rosiers et les Crabes Mousseux Pourpres ont envahi la rive ouest de Prismata. Beck veut que vous fassiez baisser leur nombre avant qu'ils ne déséquilibrent l'écosystème de la région. Vous devez battre le Crabe Ermite Mousseux afin de régler le problème. Utilisez des Phéromones de Crabes pour faire sortir le Crabe Ermite Mousseux de sa cachette. |
1071|Nv. 16 À la Recherche d'Anciennes Reliques (répét.)|Forêt Arc-en-ciel|Les Vieux Golems se cachent dans les monticules. Lautner veut étudier ces mystérieuses créatures. Veuillez vous rendre au nord-ouest pour fouiller les monticules. |
1072|Nv. 16 Protection des Reliques (répét.)|Forêt Arc-en-ciel|Les tortues vivent au nord-ouest de Prismata. Elles y ont détruit nombre d'anciennes reliques. Veuillez diminuer leur nombre avant qu'elles ne causent plus de dégâts. |
1073|Nv. 18 Le Marais Noir I|Forêt Arc-en-ciel|Le Cristal Arc-en-ciel, héritage de la famille de Sib, a perdu son éclat. D'après une ancienne légende, si vous l'amenez à la cascade du Marais Bicide, il devrait rebriller. |
1074|Nv. 18 Le Marais Noir II|Forêt Arc-en-ciel|Del veut battre Juan, le Chef du Marais Noir, mais il ne peut pas le faire seul. Sib vous demande de contacter Lixy qui doit avoir des infos pertinentes sur le Marais Noir. |
1075|Nv. 18 Le Marais Noir III|Forêt Arc-en-ciel|Lixy a remarqué qu'une émeute avait éclaté au Marais Noir, le campement est plongé dans le chaos. C'est le moment parfait pour infiltrer le camp et découvrir la cause de la rébellion. |
1076|Nv. 18 Le Marais Noir IV|Forêt Arc-en-ciel|Grislangue, furieux après Juan le Chef du Marais Noir, a quitté la zone. Il veut que vous battiez Dunbar, l'Assistant de Juan, (292, 532) et rameniez son bracelet. |
1077|Nv. 18 Le Marais Noir V|Forêt Arc-en-ciel|Juan, le Chef du Marais Noir, veut s'emparer du pouvoir du Cristal Arc-en-ciel. Veuillez en parler à Sib et apportez-lui un Éclat du Pilier de Cristal. Grislangue espère rejoindre les forces d'Opéra. |
1078|Nv. 18 Frappe Préventive (répét.)|Forêt Arc-en-ciel|Otto a comploté un combat contre le Marais Noir. Suivez ses plans et rendez-vous au Marais Bicide pour y tuer quelques Gangsters du Gang des Aigles et faites sonner le Clairon. Quand le son du Clairon retentira, le Chef du Marais Noir courra vers vous. |
1079|Nv. 18 Embuscade (répét.)|Forêt Arc-en-ciel|Otto veut tirer avantage du fait que le Marais Noir ne s'attend pas à une attaque d'Opéra. Il vous demande d'aller au plus profond du Marais Bicide, de tuer le Démoniste du Marais Noir et de détruire l'équipement du camp. |
1080|Nv. 18 Exploration du Marais Bicide (répét.)|Forêt Arc-en-ciel|Si vous voulez plus de renseignements sur les activités du Marais Noir, vous devez vous rendre au cœur du camp ennemi. Pendant que vous y êtes, pourquoi ne pas dégommer quelques Soldats du Marais Noir ? |
1081|Nv. 18 Pagaille chez les Ennemis (répét.)|Forêt Arc-en-ciel|Lixy veut utiliser la Pierre de Rune d'Invocation pour perturber les forces ennemies. Utilisez-la au camp du Marais Noir et ramenez les cendres. |
1082|Nv. 18 Canal Tassos I|DNJ 3 Joueurs : Canal Tassos|L'Éclat du Pilier de Cristal se combine avec le Cristal Arc-en-ciel de Sib pour former une Clé Arc-en-ciel. D'après la légende, elle donne accès au Canal Tassos. Amenez-la à Del. |
1083|Nv. 18 Canal Tassos II|DNJ 3 Joueurs : Canal Tassos|Del souhaite que vous informiez Grislangue que l'Opéra l'accepte. Une fois que vous avez prévenu Grislangue, dirigez-vous vers le Canal Tassos au nord-est de Prismata pour rencontrer Del. Vous pouvez finir la quête uniquement en choisissant le DNJ 1 Joueur. |
1084|Nv. 19 Canal Tassos III|DNJ 3 Joueurs : Canal Tassos|Del est grièvement blessé suite à une embuscade et vous êtes le seul encore capable de vaincre <Chef du Marais Noir> Juan. Vous pouvez finir la quête uniquement en choisissant le DNJ 1 Joueur.|
