8120|Règles sur l'Avenue des étoiles

Règles de base

 1.  Costume stellaire : Ce costume est disponible pendant la durée de l'Event. Tant que vous portez 
          un costume de la liste, vos 
          stats de combat augmenteront en conséquence.
 2. Annonce pour la phase suivante : Annonce des costumes disponibles pendant la prochaine phase de l'Event.
 
Notes

 1.  Quand vous portez un costume qui remplit les conditions de l'Event, 
     un volet bleu est ajouté à l'icône Costume et 
     la police des bonus de stats de combat devient voilette dans la section Avenue des étoiles.
 2.  Vous devez porter un seul costume 
     du même type pour 
     obtenir tous les bonus de stats correspondants.
 3.  Dès que vous enlevez un Costume stellaire ou le changez, 
     les bonus de stats de combat perdent en efficacité.
 4.  Faites bien attention à la durée de l'Event. 
     Le contenu du Costume stellaire changera une fois l'Event terminé.
 5.  Si vous équipez 2 costumes ou plus du même type,
     les bonus de stats de combat de ce type de costume seront retirées 
     lorsque vous retirez l'un des costumes. Vous pouvez alors équiper 
     un autre costume de ce type pour obtenir les bonus de stats correspondants.|
