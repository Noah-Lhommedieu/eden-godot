2311|Combinaisons de Certificats
Chaque Classe dispose de Certificats spécifiques. Dans cette rubrique, vous pouvez consulter la liste des Certificats que vous avez acquis et les combiner selon vos envies.

Certificats de Classe : progressez dans votre Classe pour obtenir des Certificats. Leurs fonctions sont variées et vous pouvez vous équiper des Certificats acquis même si vous changez de classe.

Limite d'équipement : affiche le nombre de Certificats dont vous pouvez vous équiper simultanément. Un nouvel emplacement est débloqué tous les 10 niveaux.

Combiner les Certificats : référez-vous à la gemme scintillante au centre pour connaître les bonus conférés par chaque combinaison.|
2312|Points de Classe :
Vous gagnez 1 Point de Connaissance pour chaque niveau acquis dans votre Classe. Le total de points s'affiche au centre de l'interface.

Talents de Classe :
1. Améliorez vos talents avec des Points de Classe.
Talents Nv. 1-5 : 1 point par niveau.
Talents Nv. 6-15 : 2 points par niveau.
Talents Nv. 16-20 : 3 points par niveau.
2. Pour améliorer certains talents, vous devrez remplir certaines conditions.
3. Pour utiliser un Talent de Classe, vous devez choisir la classe correspondante. Vous ne perdrez pas de talent si vous changez de classe, mais il n'aura aucun effet tant que vous n'aurez pas adopté la classe correspondante.
4. La répartition des Points de Classe n'est effective qu'après avoir cliqué sur Confirmer. Vous pouvez ainsi essayer plusieurs configurations.
5. Faites un clic gauche pour attribuer un point et un clic droit pour le récupérer.
6. Cliquez sur Par Défaut pour récupérer les points que vous avez attribués.|
