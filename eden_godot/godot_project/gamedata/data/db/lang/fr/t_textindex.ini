5240|Familier : Infos et Compétences
1. ATQ/ATQ MAG : inflige des dégâts causés par le familier.
2. PRÉC : réduit les chances du familier de frapper lors de l'attaque.
3. CRIT/CRIT MAG : réduit les chances du familier d'infliger un Coup Critique Physique ou Magique.
4. VIT ATQ : réduit la vitesse d'attaque du familier.
Remarque : les compétences du familier varient en fonction du niveau du gardien mais le niveau du familier reste le même.

Interface utilisateur
1. Repos : empêche le familier de se battre ou de prier.
2. Combat : invoque le familier au combat ou pour ramasser des trésors.
3. Prier : demande au familier de prier.
4. Délier : délie et transforme le familier en objet, tout en conservant ses compétences. Vous avez besoin d'une Gemme Déliante pour Familier.
5. Renommer : renomme le familier. Vous devez donner un nom à votre familier.
6. Avancé : sélectionnez 2 familiers à faire fusionner. Le nouveau familier 
récupère l'apparence et les stats mais les compétences sont attribuées au hasard.
7. Nourrir : recharge l'énergie du familier. Vous avez besoin de Nourriture de Familier.|
