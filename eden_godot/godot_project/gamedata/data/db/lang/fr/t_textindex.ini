5471|Règles de l'amélioration
(1) Seuls les Familiers de N40 ou plus peuvent être améliorés.
(2) Seuls deux Familiers de même qualité et de même nombre d'étoiles peuvent être utilisés.

Détails des Familiers améliorés
(1) La qualité du Familier reste inchangée.
(2) Le Familier redevient de niveau 1.
(3) Les Familiers qui n'ont pas encore été améliorés ont 0 étoile. 1 étoile est ajoutée pour chaque amélioration, jusqu'à 4 étoiles maximum. Le niveau d'étoiles se trouve dans l'interface Infos du Familier.
(4) Un Familier possède 4 statistiques de combat : ATQ/MAG, PRÉC, CRIT/CRIT MAG et VIT ATQ. La courbe de progression d'un Familier détermine les stats gagnées pour chaque niveau. L'amélioration du Familier augmente sa courbe de progression.
(5) Les compétences sont choisies aléatoirement.|
