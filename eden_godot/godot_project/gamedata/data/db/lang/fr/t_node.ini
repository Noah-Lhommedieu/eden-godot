404|Prison du Fantôme Enflammé||||||||||||
406|Temple Antique du Chaos|Le décor de ce bâtiment historique échappe à toute règle architecturale tant différentes structures
sont réunies à l'intérieur de ce site. De façon incroyable,
il existe dans ces ruines un système mécanique
et automatisé.

Des documents prouvent que ce temple servait à un ancien clan de lieu de rituel. Seuls ceux capables de relever
les défis pouvaient faire partie du clan. Une guerre décima la totalité du clan.
Ils ne purent échapper à un destin tragique, mais réussirent cependant à
enfermer leurs ennemis à l'intérieur du temple.

Depuis, le puissant démon qui y est enfermé continue d'émettre un aura violente,
qui corrompt tout imprudent qui serait à la recherche de trésors et les force à se battre.
Ce temple sacré transpire le chaos.|||||||||||
501|Forêt d'Eden|La croyance veut que cette verte vallée soit bénie et protégée par un pouvoir sacré. Le climat 
tempéré permet aux fleurs et aux champignons de se développer, fleurissant toute l'année.

Une immense cascade orne le côté ouest de la vallée, formant un magnifique bassin. Lors des beaux jours, un arc-en-ciel 
apparaît dans la brume. C'est un endroit tellement tranquille qu'il aide les gens à oublier leurs soucis et à purifier leurs âmes.|Mine|Potager|Source d'Énergie||||||||
502|Mont Eden|La croyance veut que ces terres montagneuses soient bénies et protégées par un pouvoir sacré. Le climat a sculpté 
les rochers de ces falaises abruptes ; des formes uniques y apparaissent.

Bien que le temps soit sec tout au long de l'année, des plantes résistantes ont pu pousser ici, parfois même avec 
des fleurs colorées. Les gens se sentent toujours ressourcés ici, libres de toute inquiétude et retrouvent le goût de vivre.|Mine|Potager|Source d'Énergie||||||||
599|Villa Personnelle|Mettez vos pantoufles et détendez-vous dans un fauteuil au coin du feu !
Ou alors, mettez vos chaussures de bal, allumez les chandelles,
et faites la fête avec tous vos amis !

Ici c'est chez vous, donc sentez-vous comme à la maison
et venez vous réfugiez ici dans les coups durs !

À condition bien sûr de payer le loyer.|||||||||||
601|Base des Vilrequins Héroïque|La Base des Vilrequins est une crique naturelle de la Baie Bélouga. 
Les pirates ont investi beaucoup de temps et d'argent à perfectionner ce refuge.

Elle a été démolie durant une terrible bataille contre les Gardiens d'Eternal il y a des années. Le Chef des Pirates était furieux quand il a découvert sa base réduite en cendre. 
Il a tout de suite commencé à planifier la destruction des Gardiens d'Eternal 
et des habitants du Port Bélouga pour se venger.||||||||||La Revanche de Taen !|
602|Salle Ulta Héroïque|La salle Ulta est un important palais de la Vallée des Rois, gardée par des Torturras. 
Le Gang Carmela a entendu dire qu'une épée sacrée y était cachée, mais ils n'ont pas réussi 
à la voler grâce aux héroïques efforts des Gardiens d'Eternal.

Cependant, le gang n'a pas l'intention de baisser les bras si facilement. Ils n'en ont plus 
seulement après l'épée, mais aussi après les gardiens sacrés qui protègent la salle, et qu'ils 
espèrent contrôler grâce à un charme maléfique.||||||||||Gardien de la Loi|
603|Carrière Angor Héroïque|Construite autour de la première veine de minerai trouvée dans les Monts Calcaires, 
cette mine est la plus vieille de l'histoire locale. Elle a été le terrain de jeu et éventuellement 
le lieu de travail de centaines de villageois d'Andrew.

Cependant, les créatures qui vivaient près de la mine sont devenues agressives. Les mineurs 
se sont défendus, mais les créatures devinrent de plus en plus monstrueuses. Ainsi, les hommes 
en perdirent le contrôle. La mine est maintenant complètement envahie et inutilisable.||||||||||Désastre en Montagne (DJN 5 joueurs)|
604|Fort Verdure Héroïque|Un vieux fort se dresse au fin fond de la Colline Tranquille. Ce fort, oublié, avait été 
construit par les premiers immigrants pour se défendre contre les attaques extérieures. 
Avec l'expansion de la Colline Tranquille, la menace a disparu et le fort est tombé à l'abandon.

Un jour, un membre du Gang des Aigles a trouvé le fort abandonné. Le gang a alors réaménagé 
le bâtiment et accroché une bannière représentant un aigle, affirmant ainsi qu'ils prenaient 
possession des lieux.||||||||||Encore le Gang des Aigles ! (DJN 5 joueurs)|
605|Coeur Baltaroï Héroïque|Faite de solides briques, la capitale des Tuskars se situe près du cratère du volcan ; 
parfois, la lave bouillonnante se répand dans les rues.

Des statues de valeureux soldats Tuskars sont réparties dans toute la cité et leurs actes 
héroïques sont gravés dans la pierre. Les drapeaux accrochés symbolisent l'unité Tuskar. 
Cependant, des fanatiques religieux ont capturé la ville et manigancent : ils veulent faire rentrer le volcan en éruption.||||||||||Dignité et Honneur ! (DJN 8 joueurs)|
606|Crocvenin Héroïque|Le Fort du Gang Œil de Loup s'enorgueillit de plusieurs murs aussi solides que des 
montagnes. Au début, le gang se composait de jeunes hommes passionnés déterminés 
à aider les pauvres. Le temps a passé et le groupe s'est agrandi.

Même les plus nobles intentions peuvent se dégrader avec le temps. De nos jours, 
le Gang Œil de Loup a oublié ses buts initiaux. Ils lancent des raids et pillent, gangrénant cette tranquille prairie.||||||||||Une Vérité Souterraine (DJN 8 joueurs)|
607|Canal Tassos Héroïque|Un vieux tunnel traverse la Forêt Arc-en-ciel. Ses origines sont un mystère. Cependant, 
ses nombreuses entrées et sorties en font plus un labyrinthe qu'un passage.

Le tunnel a été condamné à cause des dangers que représente son exploration. On dit aussi 
qu'une force incroyable, assez puissante pour transformer toute la faune et la flore de la forêt, 
y est dissimulée. Le Gang du Marais Noir s'est juré d'obtenir cette force, par n'importe quel moyen.||||||||||Témoin d'une Ambition (DJN 5 joueurs)|
608|Carrière de Schiste Héroïque|La Caverne de Schiste, en ruine depuis des siècles, est cachée sous un vaste désert et 
renferme d'antiques technologies. Les scientifiques l'ont cherchée pendant des années, 
sans succès, jusqu'à ce qu'un événement géologique ouvre une fissure y menant.

Dans la civilisation légendaire, les scientifiques ont découvert des machines qui fonctionnent 
de manière automatique et un garde devenu fou. Un scientifique nommé Nikola est parti mener 
son enquête, mais il est tombé dans un grand danger...||||||||||Le Secret (DJN 5 joueurs)|
609|Épreuve : Écarlate|Le fort a été construit sous la supervision du Chef Dentsanglante,
Ken. C'est principalement une prison pour les esclaves. 

Les ogres adorent la guerre, ils font tout pour saccager la Forêt de Delphes.

Même si les Enfants d'Eternal les ont stoppés, le fort a été reconstruit. Après 
avoir subi trop d'invasions, le Maire Omer a décidé de résister 
à l'Empire Heldentod.
|||||||||||
610|Épreuve : Siècle|Cette forteresse se dresse au sommet du Pic de Noireflamme dans l'Empire Heldentod. 
Les soldats d'élite vaincus par les Enfants d'Eternal sont soudainement
 revenus à la vie, ainsi que leur commandant. Maintenant, le Général Néondo a pour but
 de conquérir le Pic de Noireflamme et au-delà !

Afin de stopper la menace de cette armée de l'ombre, les Enfants d'Eternal se sont réunis 
pour bannir ces morts-vivants à jamais.
|||||||||||
611|Épreuve : Manoir|Situé sous le Fort du Lion, le Manoir est la prison haute-sécurité des Hautes-terres. 
Après que les Enfants d'Eternal et les Chevaliers de la Rose ont mis fin à la mutinerie, 
les choses avaient l'air d'avoir repris leur cours normal...

Mais un gardien débutant a fait une erreur qui a permis à un prisonnier violent de s'échapper. En utilisant le pouvoir 
du Vieux Tyrol, il a libéré ses co-détenus et une nouvelle émeute a balayé la prison !
|||||||||||
612|Épreuve : Éroda|Caverne la plus profonde des Monts Arides, le sol d'Éroda est jonché 
d'ossements. Les animaux fuient cet endroit où l'air est rance. Des entailles
 recouvrent les murs.

Après que les Enfants d'Eternal ont vaincu le dragon, des rapports sont apparus sur un dragon
 s'élevant dans le ciel nocturne et sur des réunions du Gang de la Griffe Dorée dans la grotte. 
Le maire appelle à l'aide, qui viendra à son secours ?
|||||||||||
613|Épreuve : Morticora|Près de la Baie Bélouga, les bois se sont tellement densifiés que la canopée bloque le soleil. 

Les lutins ont lancé une attaque surprise sur la ville, kidnappant le maire et les villageois 
pour un sacrifice lors d'un rite occulte. 

Pour gagner la confiance de Sara et des rescapés de la ville, Ulicel a mené la troupe de rescousse. Mais il ne savait pas
 qu'on ne s'aventure pas comme ça dans Morticora...|||||||||||
614|Épreuve : Palais des Malices|Cet ancien palais est presque entièrement enfoncé dans le sol
et est recouvert de couches de lichen et de vignes. Il est presque impossible de trouver
 une entrée.

Un puissant mage y vivait autrefois. Il avait une telle soif de savoir, on dit
que ça l'a tué. Il paraît que son fantôme erre encore, sa recherche sans fin emplissant
le palais d'un désespoir si puissant que ça rendrait fou
les faibles d'esprit.||||||||||Dignité et Honneur ! (DJN 8 joueurs)|
615|Épreuve : Fléau|Des milliers d'horribles insectes se cachent dans les Terres des Dunes Éternelles, prêts à tout dévorer sur leur passage.
Ils viennent d'une petite grotte qui est connectée à une autre
dimension.

Le Prince du Fléau a ouvert un portail interdimensionnel et contrôle les insectes
à l'aide de ses pouvoirs magiques. Ainsi manipulé, ces monstres sont sur la route
de la destruction.||||||||||Une Vérité Souterraine (DJN 8 joueurs)|
616|Épreuve : Racine Branda|La Racine Branda est située sous un vieil arbre près d'un marécage primitif. Les 
feuilles, les racines et branches de l'arbre imposant procurent nourriture et abris
aux créatures locales.

La Racine Branda elle-même est devenue un élément essentiel de l'écologie locale,
elle absorbe l'eau magique et devient magique à son tour. Des gardes ont
voué leur vie à la protéger du mal depuis des générations.||||||||||Témoin d'une Ambition (DJN 5 joueurs)|
617|Épreuve : Rêve du Maire|Ce monde matérialise les cauchemars du Maire Kandar. Bien que ça ait l'air
 doux et inoffensif de l'extérieur, le mal s'y propage, incarné
par tous les monstres qui s'y baladent.

Cette aura menaçante attend le bon moment pour tout engloutir, piégeant
l'âme de Kandar dans le rêve, afin que jamais il ne se réveille.||||||||||Le Secret (DJN 5 joueurs)|
619|Expédition Anti Dragon - Autel Volcanique |Cette montagne était autrefois couverte d'une végétation luxuriante, l'air parfumé par les fleurs qui y poussaient. Cependant, quelqu'un y a mené un rituel maléfique et de la lave venue d'une autre dimension s'y est déversée, détruisant les plantes et recouvrant tout le terrain de cendres volcaniques. 

Seul un dragon peut survivre dans un endroit si aride et craquelé. Ses rugissements résonnent dans tout Eden. 

Après avoir perdu contact avec l'Équipe d'Expédition, les Gardiens Éternels se sont portés volontaires pour voyager vers ce pays, espérant sauver l'équipe des griffes du cruel dragon. ||||||||||Champ de Lave (DJN 25 joueurs)|
620|||||||||||||
621|||||||||||||
622|||||||||||||
623|||||||||||||
624|Épreuve : Frontière de Basel|L'Empire Heldentod a lancé une attaque à grande échelle contre la Fédération de Valence. 
Les soldats de la Fédération se sont battus avec bravoure, mais ils ont dû se retirer dans le château 
à la frontière. Les villages alentour ont été réduits en cendre.

Des cadavres jonchaient le sol sous les nuages de cendre. Bien que les troupes de Valence gardent 
toujours le fort, leurs réserves de nourriture s'amenuisent. Ce n'est qu'une question de temps avant qu'ils 
se rendent ou soient vaincus.|||||||||||
625|Épreuve : Arsenal Fédéral|Le Général d'Heldentod a donné l'ordre à l'Élite d'Heldentod de s'emparer de l'Arsenal qui appartenait à Valence. Bien que l'Arsenal soit solidement gardé, à cause de la peur de Valence, ils ne peuvent pas le récupérer. 

Mais il y a tout de même eu de bonnes nouvelles : une équipe de Gardiens Éternels a lancé une embuscade à l'Arsenal et a vaincu les troupes Heldentod. 

Comprenant qu'elles ne peuvent rester, les troupes Heldentod ont décidé d'installer d'horribles pièges qui pourraient blesser Valence et les Gardiens Éternels. ||||||||||Arsenal de Valence (DJN 8 joueurs)|
626|Épreuve : Sturmfrau |Dans une forêt, un terrible changement est survenu. Les arbres ont commencé à bouger et à absorber une grande quantité d'énergie venue du sol. 

Une étrange énergie s'est également répandue dans l'air et a forcé des créatures sensibles à quitter leur foyer. En plus, des vers mutants qui adorent l'énergie et l'Armée Heldentod qui veut la contrôler ont envahi l'endroit. 

Les esprits attirés par l'énergie sont venus à Sturmfrau, situé 
au centre des bois, qui est le cœur du torrent d'énergie. C'était censé être un arbre gardien. C'est maintenant l'habitat de vers mutants et le foyer d'une mystérieuse énergie. ||||||||||La Mère de Toutes les Tempêtes (DJN 8 joueurs)|
627|Épreuve : Abysse Glacée de Skleros |Sur une plaine glacée battue par des vents polaires tout au long de l'année, une forteresse abandonnée a été enterrée sous des couches et des couches de glace au fil du temps. Mais des étrangers l'ont trouvée. 

Les monstres les plus maléfiques rôdent dans ses profondeurs. Leur méchanceté et leurs ressentiments ne cessent de grandir, et ce depuis la nuit des temps. Ils détruisent tout esprit sur leur chemin pour remplir le vide de leur âme. 

Mais dans la forteresse maléfique, la voix d'une famille royale appelle à la rescousse. Vous ne pouvez vous empêcher de vous demander qui est coincé à l'intérieur. ||||||||||Fort Militaire Perdu (DJN 10 joueurs)|
628|Épreuve: Base des Vilrequins S|La Base des Vilrequins se situe dans une crique naturelle de la Baie Bélouga. Les pirates 
ont passé beaucoup de temps et dépensé beaucoup d'argent pour perfectionner ce refuge. 

Lors d'une féroce bataille contre les Gardiens Éternels il y a quelques années, la base 
a été détruite. Le chef des pirates, furieux de voir sa base détruite, 
a décidé de se venger et de détruire les Gardiens Éternels et les habitants du Port Bélouga. ||||||||||La Revanche de Taen ! <DJN 8 joueurs> |
629|Épreuve: Salle Ulta S|La Salle Ulta, gardée par les Torturras, se dresse fièrement dans la Vallée des Rois. 
Le Gang Carmela avait prévu de voler une épée sacrée qui s'y cache, 
mais les Gardiens Éternels les ont repoussés avec héroïsme. 

N'étant pas prêts à abandonner si facilement, le Gang redouble d'efforts pour s'emparer de l'épée. 
D'après la rumeur, ils comptent lancer un sort maléfique sur les gardes sacrés. ||||||||||Gardien de la Loi <DJN 8 joueurs>|
630|Épreuve : Angor S|C'est la première veine de minerai trouvée dans les Monts Calcaires. Les monstres occupaient la mine autrefois, 
mais les Gardiens Éternels ont rétabli l'ordre normal des choses. 

Les mineurs continuèrent de travailler jusqu'à ce qu'un tremblement de terre ne 
réveille un insecte géant. Le brouillard toxique qu'il dégage a rendu les monstres encore plus agressifs, 
forçant les villageois à fuir la mine une nouvelle fois. ||||||||||Désastre en Montagne (DJN 5 joueurs)|
631|Épreuve : Fort Verdure S |Un fort oublié qui se dresse dans la nature de la Colline Tranquille. Après qu'un membre du
Gang des Aigles l'eut redécouvert, le reste de la troupe l'a restauré et se l'est approprié. 

Quand leur chef a reçu de faux renseignements et envoyé en mission une grande unité d'élite, 
les Gardiens Éternels ont attaqué le fort. Le chef est maintenant sur 
le point de lancer une attaque pour se venger. Clochemer court un grand danger ! ||||||||||Encore le Gang des Aigles ! (DJN 5 joueurs)|
632|Épreuve : Cœur Baltaroï S|Faite de solides briques, la capitale des Tuskar est située près du cratère 
du volcan, parfois la lave bouillonnante se répand dans les rues et les 
pavés sont recouvert de magma. 

Des statues de valeureux soldats Tuskars sont éparpillées dans toute la cité. Récemment, 
des fanatiques religieux et des monstres ont envahi la ville, conspirant 
ensemble pour faire entrer le volcan en éruption. ||||||||||Dignité et Honneur ! (DJN 8 joueurs)|
633|Épreuve: Crocvenin S|Le Gang Œil de Loup était autrefois composé de jeunes hommes engagés déterminés à aider les pauvres, 
mais avec le temps, le groupe s'est agrandi. Leur fort est protégé par des murs solides comme le roc. 

Mais même la plus noble des intentions peut être corrompue au fil du temps. De nos jours, le Gang Œil de Loup a 
oublié ses buts premiers. Ses membres pillent et saccagent, comme une tornade sur une prairie paisible.||||||||||Une Vérité Souterraine (DJN 8 joueurs)|
634|Épreuve: Canal Tassos S|Personne ne connaît les origines du vieux tunnel sous la Forêt Arc-en-Ciel. Cependant,
avec toutes ses entrées et sorties, tout le monde sait que c'est plus un labyrinthe
qu'un tunnel.

C'est dangereux et il a été classé zone interdite. On dit qu'un pouvoir
incroyable est caché en son cœur. Le Gang du Marais Noir est fortement intéressé par ce
pouvoir et s'est juré de l'obtenir à n'importe quel prix.||||||||||Témoin d'une Ambition (DJN 5 joueurs)|
635|Épreuve: Caverne de Schiste S|Ruines antiques cachées sous un vaste désert, la Caverne de Schiste est un entrepôt de 
technologie antique. Les scientifiques ont mené des recherches pendant des années, sans succès jusqu'à ce qu'un événement 
géologique ouvre une abîme y menant.

Dans les restes de la civilisation légendaire, les scientifiques ont découvert des machines en mode automatique
 et un gardien devenu fou. Un scientifique nommé Nikola est parti enquêter 
et est maintenant en danger. ||||||||||Le Secret (DJN 5 joueurs)|
636|Épreuve: Écarlate S|Le fort a été construit sous la supervision du Chef Dentsanglante,
Ken. C'est principalement une prison pour les esclaves. 

Les ogres adorent la guerre, ils font tout pour saccager la Forêt de Delphes.

Bien que les Gardiens Éternels aient mis un frein à leurs plans diaboliques, le fort a été reconstruit. Après 
avoir subi trop d'invasions, le Maire Omer a décidé de résister 
contre l'Empire Heldentod. ||||||||||Le Cri du Chef Dentsanglante (DJN 8 joueurs)|
637|Épreuve: Siècle S|Cette forteresse se dresse au sommet du Pic de Noireflamme dans l'Empire Heldentod. 
Les soldats élites vaincus autrefois par le Gardien Éternel sont soudain 
revenus à la vie, ainsi que leur commandant. Maintenant, le Général Néondo a pour but
de conquérir le Pic de Noireflamme et au-delà !

Afin de stopper la menace de cette armée de l'ombre, les Gardiens Éternels se sont réunis 
pour bannir ces morts-vivants à jamais.
||||||||||Les Portes de R'lyeh (DJN 8 joueurs)|
638|Épreuve: Manoir S|Situé sous le Fort du Lion, le Manoir est la prison haute-sécurité des Hautes-terres. 
Après que les Gardiens Éternels et les Chevaliers de la Rose eurent mis fin à la mutinerie, 
les choses avaient l'air d'avoir repris leur cours normal...

Mais un gardien débutant a fait une erreur qui a permis à un prisonnier violent de s'échapper. En utilisant le pouvoir 
du Vieux Tyrol, il a libéré ses co-détenus et une nouvelle émeute a balayé la prison !
||||||||||Prison des Ombres (DJN 8 joueurs)|
639|Épreuve: Éroda S|Caverne la plus profonde des Monts Arides, le sol d'Éroda est jonché 
d'ossements. Les animaux fuient cet endroit où l'air est rance. Des entailles
recouvrent les murs.

Peu après que le Gardien Éternel eut vaincu le dragon, des rapports ont mentionné un dragon 
s'élevant dans le ciel nocturne et des réunions du Gang de la Griffe Dorée dans la grotte. 
Le maire appelle à l'aide, qui viendra à son secours ?
||||||||||Tanière de Crocguivre (DJN 5 joueurs)|
640|Épreuve: Morticora S|Près de la Baie Bélouga, les bois se sont tellement densifiés que la canopée bloque le soleil. 

Les lutins ont lancé une attaque surprise sur la ville, kidnappant le maire et les villageois 
pour un sacrifice lors d'un rite occulte. 

Pour gagner la confiance de Sara et des rescapés de la ville, Ulicel a mené la troupe de rescousse. Mais il ne savait pas
qu'on ne s'aventure pas comme ça dans Morticora...||||||||||Autel du Dragon (DJN 5 joueurs)|
641|Épreuve : Antre des Échos|Une couche de neige cristalline recouvre la Forêt Givrée tout au long de l'année. Seuls les monstres les plus violents et vicieux peuvent survivre ici. 

La plupart vivent dans l'Antre des Échos, une grotte faite de piliers de cristal et d'une étincelante cascade figée sous une épaisse couche de glace.
La grotte résonne des grondements des tempêtes et vents violents. 

On pourrait mourir, juste en attendant 
un moment de silence dans l'antre.||||||||||Tanière de la Bête (DJN 8 joueurs)|
642|Épreuve : Prison Ossuaire|Heldentod s'est récemment emparé de cette région. C'était autrefois une prison valencienne mais elle abrite maintenant un ancien prisonnier qui travaille pour Heldentod.

L'Empire a installé un labo dans une pièce au plus profond 
du bâtiment et y a développé une arme de destruction massive. Cette arme pourrait une causer une catastrophe pour les riverains et les troupes de Valence. 

Heldentod  a capturé quelqu'un, l'a enfermé dans la pièce et prévoit de faire des expériences sur lui.||||||||||Labo du Prisonnier Fou (DJN 10 joueurs)|
643|Épreuve : Cratère des Géants|Ce cratère, au nord-est de la Forêt Ensorcelée, procure de l'énergie pour toute la forêt.
 C'est le berceau de toute l'alchimie de la forêt et c'est là que se trouve le QG du Clan des Sorcières.

L'équipement d'alchimie et les données de recherche sont stockés dans le cratère. Malheureusement, le Gang de la Main Noire a de terribles plans pour voler 
le secret du contrôle de l'énergie de la forêt.||||||||||Cœur d'Énergie Mystérieuse (DJN 8 joueurs)|
644|Épreuve : Vieux Siècle|C'était une importante forteresse de l'Empire Heldentod. Elle a été détruite et est devenue le repaire d'étranges monstres. 

Après que les guerriers eurent tué tous les monstres, personne n'a plus jamais voulu remettre les pieds dans les profondeurs de Siècle. Au fin fond de Siècle, c'est un endroit qui n'appartient plus au monde réel. 

Des murs brisés flottent dans les airs et la foudre s'abat sans cesse. Le Mal s'y est fait sa place, plus maléfique que jamais. Des démons venus tout droit des Enfers ont fait irruption. Ça ressemble à la fin du monde. ||||||||||Forteresse Démoniaque (DJN 10 joueurs)|
645|Épreuve : Cratère des Géants|Après la victoire du Gardien Éternel sur Antor et Gaddis, 
les Esprits Saints et la Prophète des Sables Bérina ont de nouveau enfermé Gaddis, le Monstre Sacré. 
Le calme est revenu à Guillotine, enfin débarrassée des Movèzerbe. 

Cependant, le chaos interdimensionnel a créé une fissure sur le sceau enfermant le Monstre Sacré. 
De nombreux Évangélions Déchus ont émergé des profondeurs de Guillotine : 
ils ont l'intention de semer le chaos dans la Vallée de la Mort. 

D'étranges événements perturbent également cette région d'ordinaire si paisible. 
Les Esprits Saints se sont ralliés à la cause, 
mais ils viennent eux-mêmes de la Fissure Dimensionnelle. 
Tous ces signes montrent à quel point l'époque dans laquelle nous vivons est étrange et dangereuse. |0|0|0|0|0|0|0|0|0|Cour Sacrée (DJN 10 joueurs)|
646|Épreuve : Abysse de Siècle|C'était une importante forteresse de l'Empire Heldentod. Elle a été détruite et 
est devenue le repaire d'étranges monstres. 

Après que les guerriers eurent tué tous les monstres, personne n'a plus jamais voulu remettre les pieds dans les profondeurs de Siècle. Au fin fond de Siècle, c'est un endroit qui n'appartient plus au monde réel.

Des murs brisés flottent dans les airs et la foudre s'abat sans cesse. Le Mal s'y est fait sa place, plus maléfique que jamais. Des démons venus tout droit des Enfers ont fait irruption. Ça ressemble à la fin du monde. |0|0|0|0|0|0|0|0|0|Forteresse Vigilante (DJN 10 joueurs)|
647| Épreuve : Temple Spirenfer|Le Temple Spirenfer se dresse au centre du Royaume Dévasté. Son entrée, à l'allure autrefois splendide, est aujourd'hui en ruines et dégage
une aura de danger avec ces vignes rouges 
qui s'enroulent autour des piliers. 

L'intérieur du temple, ancien et mystérieux, présente des autels et des statues usées par le temps qui occupent l'espace donnent aux lieux un air macabre.
Ils sont animés par une magie sombre,  
témoignent de sa gloire d'antan 
et se chargent également de leur faire payer le prix de leur audace.

Bien qu'il ait été abandonné depuis longtemps, 
la peur que le temple inspire aux visiteurs n'a jamais diminué. Il y a de nombreuses légendes au sujet de cet endroit, 
mais quelles que soient les questions posées, le temple ne répond jamais. |0|0|0|0|0|0|0|0|0|Temple Antique (DJN 10 joueurs)|
648|Épreuve : Temple de la Rose|Afin de contrer l'invasion des troupes de Braider, la plupart des soldats d'Heldentod ont été envoyés sur la frontière pour la défendre. 
Le reste des forces de Braider 
a secouru les quatre envoyés du Duc qui avaient été fait prisonniers. 

Dame Kelly, qui les avait capturés, les a menés près du Temple de la Rose, 
mais, frappée par d'étranges visions, elle n'a pu continuer. 

Selon des rumeurs, le Premier Ministre d'Heldentod aurait une salle secrète dans les profondeurs de la bibliothèque.
Cette salle renfermerait un terrible secret, mais personne n'a jamais réussi à la trouver. 
Dame Kelly a le sentiment que ces étranges visions 
ont un lien avec cette salle secrète. |0|0|0|0|0|0|0|0|0|Dernière Forteresse des Rebelles (DJN 10 joueurs)|
649|Épreuve des Héros du Chemin d'Occultus|Cette grotte est cachée à l'intérieur d'une crevasse de la Vallée de Vulcain.
La falaise est baignée de lumière, mais il est difficile de repérer l'entrée de la grotte
car des plantes grimpantes en masquent l'entrée.

À l'intérieur de l'Occultus, la plupart des étagères le long des murs se sont écroulées et de précieux manuscrits
sont désormais recouverts de boue malodorante. Les écritures, désormais indéchiffrables, décrivent en détail les
racines du Mal.

Eric, l'Empereur d'Heldentod projetait de détruire le Labo Vingot, contrôlé par l'armée rebelle.
Les rebelles, avertis des plans de l'Empereur, assemblèrent une armée et tendirent une embuscade sur le Chemin d'Occultus
et prirent les envahisseurs en tenaille. Ils purent ainsi continuer leurs recherches dans le Laboratoire.
Au même moment, un autre groupe de chercheurs cherchèrent à éliminer les Chevaliers Templiers qui exploraient le temple...|||||||||||
650|Épreuve des Héros de la Colline Tranquille|Clochemer, sur la Colline Tranquille se trouve au bord de la Côte Étoilée. Sa position géographique privilégiée
en fait un port de pêche de premier ordre ainsi qu'un lieu de passage obligé pour les bateaux de commerce.
Tout cela profite grandement à l'économie locale.

Les bateaux remplis de vivres et de biens vont et viennent sans cesse tous les jours et les
habitants peuvent acheter des denrées exotiques et les marchés locaux regorgent de produits rares
qui font le bonheur des amateurs de en quête de nouvelles saveurs.

Clochemer et Aven étant voisines sur la côte, leurs populations se sont mélangées au fil du temps.
. Stratégiquement bien placée, le Prince du Fléau tenta de la conquérir
pour en faire ensuite une ligne de front en vue d'envahir Aven.|||||||||||
651|Trésor : Cœur Baltaroï|Faite de solides briques, la capitale des Tuskar est située près du cratère du volcan ; 
parfois la lave bouillonnante se répand dans les rues.

Des statues de valeureux soldats Tuskars sont réparties dans toute la cité et
leurs actes héroïques sont gravés dans la pierre. Les drapeaux accrochés symbolisent l'unité Tuskar. 
Cependant, des fanatiques religieux ont capturé la ville et manigancent : ils veulent faire rentrer le volcan en éruption.||||||||||Dignité et Honneur ! (DJN 8 joueurs)|
652|Trésor : Crocvenin|Le Gang Œil de Loup était autrefois composé de jeunes hommes engagés déterminés à aider les pauvres, 
mais avec le temps, le groupe s'est agrandi. Leur fort est protégé par des murs solides comme le roc. 

Mais même la plus noble des intentions peut être corrompue au fil du temps. De nos jours, le Gang Œil de Loup a
 oublié ses buts premiers. Ses membres pillent et saccagent, comme une tornade sur une prairie paisible.||||||||||Une Vérité Souterraine (DJN 8 joueurs)|
653|Trésor : Canal Tassos|Personne ne connaît les origines du vieux tunnel sous la Forêt Arc-en-Ciel. Cependant,
avec toutes ses entrées et sorties, tout le monde sait que c'est plus un labyrinthe
qu'un tunnel.

C'est dangereux et il a été classé zone interdite. On dit qu'un pouvoir
incroyable est caché en son cœur. Le Gang du Marais Noir est fortement intéressé par ce
pouvoir et s'est juré de l'obtenir à n'importe quel prix.||||||||||Témoin d'une Ambition (DJN 5 joueurs)|
654|Trésor : Caverne de Schiste|Ruines antiques cachées sous un vaste désert, la Caverne de Schiste est un entrepôt de
 technologie antique. Les scientifiques ont mené des recherches pendant des années, sans succès jusqu'à ce qu'un événement 
géologique ouvre une abîme y menant.

Dans les restes de la civilisation légendaire, les scientifiques ont découvert des machines en mode automatique 
et un gardien devenu fou. Un scientifique nommé Nikola a enquêté mais il est tombé dans un grand danger...||||||||||Le Secret (DJN 5 joueurs)|
