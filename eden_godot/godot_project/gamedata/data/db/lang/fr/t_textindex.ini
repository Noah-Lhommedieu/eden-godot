7172|Détails sur les Épou(x/ses)
À la fin de la Cérémonie, votre relation passera de Couple à Épou(x/se).
Vous pouvez consulter les informations de votre époux(x/se) ou laisser un message ici.

Informations sur le Mariage : affiche la date de votre anniversaire de mariage, depuis combien de temps dure votre relation
et le nombre de Pièces d'Amour gagnées cette semaine.

Pièces d'Amour : elles sont acquises automatiquement chaque semaine, 
mais aussi lorsque vous gagnez des Points de succès. 
Un couple gagne une Pièce d'Amour par tranche de 20 points de succès.
Vous pouvez utiliser des Pièces d'Amour pour acheter des objets au Magasin d'Amour.

Modifier Message : le message reste affiché sur votre panneau d'affichage de couple.
Le texte peut faire jusqu'à 79 caractères.

Compétences des Mariés : vous pouvez faire glisser les icônes de compétences dans la Barre de raccourcis. 
La plupart des Compétences des Mariés coûtent des Cœurs Aimants. 
Tous deux peuvent être achetés dans le Magasin d'Amour.

Divorce : pour demander un divorce, trouvez l'Avocat de Divorce Arnold.
Vous avez le choix entre le Divorce par Consentement Mutuel
et le Divorce Unilatéral.

Remarque : une fois le divorce prononcé, le Tableau des Épou(x/ses) sera indisponible.
Les Compétences des Mariés seront désactivées jusqu'à ce que vous ayez trouvé une nouvelle âme sœur.
Toutes vos Pièces d'Amour disparaîtront.|
