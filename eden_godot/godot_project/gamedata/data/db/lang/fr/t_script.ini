101|Monts Calcaires|Sec. 1 : Réveil|Vous dormiez paisiblement, au cœur d'un grand Cristal Bleu des mines d'Andrew lorsqu'on vous a trouvé. Cette rencontre a surpris tout le monde ! 
 
À votre réveil, vous vous trouviez dans un charmant village. Cela dit, vous aviez perdu la mémoire. Vous avez essayé de parler avec les villageois autant que possible, dans l'espoir de vous souvenir de votre passé.|Vous avez aidé les villageois à vaincre les Champignoïdes. Au cours de la bataille, vous avez trouvé un Cristal Bleu. Laz, le Contremaître de la Mine, a suggéré que vous retourniez à la mine où vous vous trouviez et d'apporter le Cristal Bleu.

Cependant, une créature démoniaque vous attendait dans la mine. Après une bataille acharnée, vous l'avez tuée. Malheureusement, vous n'avez récupéré aucun souvenir de votre passé. Mais ce n'était qu'un début. |
102|Monts Calcaires|Sec. 2 : Indices du Cristal|Airy le Mineur pensait que les démons que vous aviez tués dans la mine avaient été invoqués dans le seul but de vous tuer. Il fronça les sourcils, inquiet, et suggéra que vous donniez les Éclats de Cristal Bleu à Alec, le Marchand Zumi. Ce dernier pourrait découvrir quelque chose en identifiant les Éclats de Cristal. 
 
Cependant, Alec avait ses propres problèmes...|Un Yak à Longues Cornes a volé à Alec le Marchand l'outil servant à l'identification des cristaux. Vous l'avez aidé à le récupérer.
 
Déterminer la composition du cristal allait prendre du temps, donc Alec le Marchand a demandé à ce que vous fassiez un rapport en attendant. En chemin, vous avez appris qu'il se tramait quelque chose dans une vieille mine au Sud.|
103|Monts Calcaires|Sec. 3: Oracle Magicienne|Vous avez enfin obtenu les résultats des analyses d'Alec sur les Éclats de Cristal Bleu mais rien de particulier n'en est sorti. Alec vous a appris que des instruments communs ne pourraient évaluer la composition magique du Cristal Bleu.


Il fallait aller demander l'aide de l'Oracle Magicienne Athéna Marie, qui vivait près du moulin. Cela dit, vous saviez qu'elle pouvait sembler froide et indifférente. 
|Votre arrivée prit un certain temps. Bizarrement, l'Oracle Magicienne Athéna Marie vous attendait. Elle laissa entendre que vous pouviez faire partie des Gardiens d'Eternal.
 
Les Gardiens d'Eternal étaient des enfants des Dieux, nés dans des Cristaux Bleus, et ayant pour tâche de bâtir un paradis légendaire. Malheureusement, c'est là tout ce que savaient les villageois. Vous avez dû vous diriger vers une autre ville pour obtenir davantage d'informations.|
104|Monts Calcaires|Sec. 4 : Carrière Angor|Le Roi des Champignoïdes de la Mine et les Golems de Calcaire occupaient la Carrière Angor, engendrant une surpopulation de champignons toxiques dans les Monts Calcaires.

La carrière était en ruines si bien que le Contremaître de la Mine Kev ordonna l'arrêt de l'exploitation. Avant de se résoudre à demander l'aide de l'extérieur de la ville, il espérait que vous puissiez obtenir quelques informations sur ce qu'il se passait dans la mine.
|Vous avez vaincu les monstres de la carrière, résolvant ainsi le problème des Monts Calcaires. Fous de joie, les villageois étaient convaincus que vous aviez des compétences légendaires. 
 
Il était temps d'entamer un nouveau voyage. Il vous fallait recouvrer la mémoire et accomplir votre destin. C'est ainsi que votre quête vous mena jusqu'à Clochemer, sur la Colline Tranquille. Vous aviez le sentiment qu'une pièce du puzzle se trouvait là-bas ! 
|
105|Colline Tranquille|Sec. 1 : Clochemer|Vous avez rencontré un Agent de Police sympathique connu sous le nom de Bamen. Il parlait sans cesse de la ville. Contre toute attente, nombre de problèmes couvait sous l'apparente quiétude de la ville, et il allait falloir les résoudre.


Vous pouvez choisir d'aider la police en éliminant l'Angelée ou de vous faire la main sur des quêtes de patrouille. Ces quêtes vous aideront à en apprendre plus sur les habitants et vous permettront d'obtenir des informations. 
|L'Agent de Police Bamen vous a présenté le Chef de Police Rolf. Il se montra distant envers vous. Bien que vous l'ayez aidé à accomplir quelques quêtes, il continua à se montrer froid avec vous. 
 
Vous avez rencontré le Maire de Clochemer, Spence, au cours d'une quête. Il vous a dit qu'il savait que vous accomplissiez le devoir de la police. Spence se demandait ce que faisait le Capitaine de Police toute la journée. Il était sûr qu'il ne travaillait pas !
|
106|Colline Tranquille|Sec. 2 : Gang des Aigles|Les Voleurs du Gang des Aigles gangrénaient la ville. Ils étaient si agressifs que même les Agents de Police en avaient peur !

Le Marchand Abel, victime des voleurs, pensait que quelqu'un tirait les ficelles du Gang des Aigles. Il demanda à ce que vous meniez l'enquête. Votre quête débuta au moment où vous avez obtenu une lettre secrète des voleurs.
|À l'ouverture de la lettre, quelle ne fut pas votre surprise quand vous avez reconnu l'écriture du Chef de Police Rolf ! 
 
Le Marchand Abel espérait que vous ne fassiez rien qui les effraierait avant d'avoir de solides preuves. Vous avez combattu les voleurs et découvert une Épée Antique appartenant à l'ami d'Abel, le Propriétaire du Ranch, Brock.
|
107|Colline Tranquille|Sec. 3 : Fort Verdure|Pour vaincre les Voleurs du Gang des Aigles, le Propriétaire du Ranch, Brock, décida de reprendre son épée. Il demanda à ce que vous l'aidiez à combattre les voleurs.

Vous êtes ainsi partis dans deux directions. Brock put attirer l'attention des voleurs tandis que vous détruisiez leur camp de base, Fort Verdure.
|Le combat était intense, mais vous avez fini par atteindre Fort Verdure et vaincre Ketak, le Chef du Gang des Aigles. La bande infâme ne se releva pas après ce coup fatal. 
 
La montre du Chef de Camp du Gang des Aigles, Boswell, lui a été donnée en cadeau par le Chef de Police Rolf, reliant ainsi le chef corrompu aux criminels. La paix revint alors dans le village et les habitants se montrèrent reconnaissants envers vous.
|
108|Forêt Arc-en-Ciel|Sec. 1 : Secret du Village|Les Anuras vivaient paisiblement dans la petite ville d'Opéra, dans la Forêt Arc-en-Ciel.

Vous avez lié amitié avec les Anuras, mais progressivement, vous avez remarqué que le Gang du Marais Noir leur posait de gros problèmes.
|Le village combattait le Gang du Marais Noir. Des années plus tôt, le Guerrier du Village Del prit sous son aile un garçon du nom de Juan, qui comptait dérober les secrets du village. Il était désormais le Chef du Gang du Marais Noir, et il préparait une invasion. Il avait envoyé un espion pour dérober d'autres secrets.
 
Pour éviter que d'autres secrets ne soient dévoilés à des personnes extérieures, vous avez tué l'espion.
|
109|Forêt Arc-en-Ciel|Sec. 2 : Prismata|Les événements étranges survenus à Prismata ont fait naître une grande anxiété dans toute la forêt. Vous avez interrogé les villageois pour obtenir des informations. 
 
Le Sorcier Smack a dit que le phénomène était lié à l'énergie paranormale de la Gemme Arc-en-ciel. Vous n'avez pas compris ce que cela signifiait, mais vous avez pensé que la gemme magique avait quelque chose à voir avec le Cristal Bleu dans lequel vous avez vu le jour.
|Dans la forêt, vous avez porté secours à quelques explorateurs attaqués par le Gang du Marais Noir. Dernièrement, les animaux vivants à Prismata sont devenus plus agressifs. Après enquête, vous avez découvert que le Gang du Marais Noir préparait une attaque du village à la tête de l'Armée Tortue. 
 
Avant de pouvoir mener ce plan à bien, vous avez pu retrouver et tuer l'Entraîneur Cluney, mettant ainsi fin à l'assaut.
|
110|Forêt Arc-en-Ciel|Sec. 3 : Marais Noir|Sib, la Jeune Grenouille, a révélé la mission de la ville : Opéra devait protéger la Forêt Arc-en-Ciel. Vous avez alors pensé que le bout de cristal protégé pendant des générations par la famille Anrian était lié à la Gemme Arc-en-ciel.

Pendant ce temps, quelque chose se tramait dans le Marais Bicide. Vous avez saisi l'opportunité de vous infiltrer et d'examiner Lixy, le guerrier blessé.
|Grislangue, le Traître Marais Noir, a causé des problèmes en s'échappant du groupe. Après que vous l'avez aidé à vaincre le Lieutenant du Marais Noir, il a dévoilé les plans de Juan. 
 
Juan comptait découvrir l'emplacement de la Gemme Arc-en-ciel à l'aide du Porte-prisme. S'il obtenait la Gemme Arc-en-ciel, il deviendrait invincible. Pour l'arrêter, Grislangue a fui le camp avec l'objet et a demandé à ce que vous le rapportiez au village.
|
111|Forêt Arc-en-Ciel|Sec. 4 : Canal Tassos|Grâce aux archives volées à Opéra, le Chef du Marais Noir Juan a trouvé le Porte-prisme. Il l'a ensuite combiné au Bâton de Cristal de la famille Anrian pour former une clé indiquant l'emplacement exact de la Gemme Arc-en-ciel.

Le Guerrier du Village Del s'est rendu seul à l'Ancien Aqueduc pour arrêter Juan. La Jeune Grenouille Sib s'inquiétait pour lui et a demandé à ce que vous l'aidiez.
|Les membres du Gang ont attaqué le Guerrier du Village, Del, et ont volé la Clé Arc-en-ciel. Vous étiez le dernier espoir. 
 
Vous avez réussi à arrêter Juan sur le Canal Tassos et à reprendre la clé. Elle avait perdu ses pouvoirs et était redevenue un simple Bâton de Cristal. La Gemme Arc-en-ciel avait récupéré son énergie. Vous avez sauvé la forêt, mais la Gemme Arc-en-ciel n'avait aucun lien avec le Cristal Bleu. Il allait falloir chercher davantage.
|
112|Monts Arides|Sec. 1 : Monts Arides|Le Maire de Goss, Pierce, venait de Zumi. Quelques jours plus tôt, dans un puits, des villageois ont trouvé une vieille noix. Pensant qu'il s'agissait d'un signe indiquant la présence d'anciennes ruines sous leurs pieds, les villageois ont commencé à explorer les sous-sols.

Des monstres ont attaqué l'équipe d'exploration, blessant nombre d'entre eux. Au même moment, les gardes du village rencontraient également des problèmes.|Après avoir vaincu un groupe de pumas et récupéré des matériaux servant à fabriquer une armure, vous avez pu gagner la confiance des villageois. 
 
La Géologue Cendre a étudié les pierres obtenues sur les Démons de Pierre de Goss. Elle pensait que ces pierres possédaient une énergie magnétique créée par une ancienne civilisation. Elle a demandé à ce que vous les apportiez à l'étrange Inventeur Nikola, son ex-petit ami, pour analyses.
|
113|Monts Arides|Sec. 2 : Civilisation Perdue|Pour analyser précisément la pierre, l'Inventeur Nikola a demandé à ce que vous récupériez quelques matériaux améliorant les performances de l'Analyseur de Cœur.

Il semblait particulièrement excité de participer à cette découverte. Il s'agissait d'un lien rarissime vers les anciennes civilisations du monde.
|Il a fallu du temps pour récupérer la cargaison des marchands auprès des monstres. Il a également fallu récupérer des matériaux servant à l'élaboration d'huile. Avec votre aide, l'Inventeur Nikola a pu terminer l'analyse des données. Il espérait reconquérir le cœur de Cendre après l'avoir aidée. 
 
Vous avez annoncé la bonne nouvelle à Cendre et au Maire Pierce, mais Cendre était triste que son travail ait accaparé toutes les facettes de la vie de Nikola. 
|
114|Monts Arides|Sec 3: Caverne de Schiste|Bien que le Maire Pierce se soit beaucoup disputé avec Nikola, il s'est inquiété pour ce dernier lorsqu'il a appris qu'il se rendait à la Caverne de Schiste pour des recherches. 

Il a demandé à ce que vous protégiez Nikola, bien qu'une part de lui espérait secrètement que quelque chose de regrettable lui arrive.
|D'énormes robots peuplaient la Caverne de Schiste. Après les avoir vaincus, vous avez rejoint l'Inventeur Nikola qui venait de terminer son robot, à l'aide d'une ancienne formule. 
 
Nikola montra son robot au Maire Pierce, qui réagit furieusement à la vue de la création. Il accusa la Géologue Cendre d'avoir poussé Nikola à gaspiller son temps et ses ressources. Une nouvelle rivalité était née...
|
115|Monts Arides|Sec. 4 : Repaire du Dragon|La Griffe Dorée troublait également Cenana. Ils comptaient trouver un trésor caché près de la ville, ce qui provoquait des vagues de panique parmi les villageois. 

Le Forgeron Ursun Bryson voulait créer des armes et des armures pour son frère, qui voulait combattre la Griffe Dorée, et fit appel à vos services.
|Ce que vous avez fait pour le Forgeron Ursun Bryson a directement touché le Capitaine de Garnison Sékateur. Après enquête, vous avez découvert le trésor que cherchait la Griffe Dorée. Un dragon endormi le gardait. Aller chercher le trésor risquerait de réveiller le dragon, et donc de mettre le village en péril. 
 
Sékateur décida de les vaincre lui-même mais d'abord, il voulait que vous vous rendiez dans l'antre et interrogiez le Chef de la Griffe Dorée, Salvio.
|
116|Monts Arides|Sec. 5 : Éroda|Le Capitaine de Garnison Sékateur s'apprêtait à défier la Griffe Dorée. Avant cela, il a demandé à ce que vous alliez chercher l'aide du Chasseur de Monstres Evans. Ce dernier avait déjà eu affaire à un dragon auparavant.

Cela dit, l'affrontement n'a pas été aussi aisé que ce que Sékateur pensait...
|Le Chasseur de Monstres Evans pensait que la bataille aurait éveillé le dragon maléfique. Et il avait raison. La bête endormie s'éveilla dans un hurlement à glacer le sang. 
 
Le Capitaine de Garnison Sékateur s'était échappé pour regagner le village, vous laissant affronter le dragon par vos propres moyens. Mais après un combat acharné, la bête finit par succomber.
|
117|Baie Bélouga|Sec. 1 : Affaires Portuaires|Avant l'arrivée des pirates, Port Bélouga était un lieu prospère. Cependant, il était de moins en moins aisé d'y faire des affaires.

Ce qui inquiétait davantage l'Architecte Angul, ce n'était pas les pirates, mais les Angelées, dont les sécrétions visqueuses attaquaient les défenses. Il a donc demandé à ce que vous chassiez ces Angelées.|Une fois les Angelées chassées et les problèmes de larcins résolus, vos soucis étaient encore loin d'être réglés. Vous avez été témoin d'une attaque de pirates sur le navire du Marchand Ursun Webber. Les pirates représentaient encore une réelle menace. 
 
Vous avez eu pour tâche d'éliminer le Chef du Gang de l'Aigle qui menait ses troupes vers la ville. Une fois cette tâche menée facilement à bien, le Maire du Port Bélouga Dominic fit encore appel à vous. |
118|Baie Bélouga|Sec. 2 : Amour Fatal|Les pirates étaient un problème pour le Maire du Port Bélouga Dominic, mais quelque chose d'autre pesait sur sa conscience.



Le Sniper de Garnison Nelle a raconté l'histoire d'une fille qui avait sauvé un homme des eaux et qui en était tombée amoureuse. Vous avez rendu visite au Maire du Port Bélouga dans l'espoir qu'il vous en dise un peu plus.
|La fille de l'histoire n'était autre que la fille du Maire Dominic, et l'homme en question était Ulicel, un pirate. Elle a perdu connaissance après avoir bu une de ses potions. Ulicel s'est transformé en Ogre et a fui. Dans une tanière du Bois aux Écailles, vous avez retrouvé des empreintes d'Ogres. 
 
Avant que la garde n'entame une chasse à l'Ogre, vous avez fait la connaissance de Lady Barb, qui voulait gagner l'amour du Maire Dominic.
|
119|Baie Bélouga|Sec. 3 : Morticora|En cherchant l'Espion Pirate Ulicel, la garde trouva par hasard des Lutins vivant à Morticora. Ces derniers avaient été provoqués par les Pirates et s'apprêtaient à attaquer Port Bélouga.



Il fallait les arrêter ! Alors que le garde combattait les Pirates, le Capitaine de Garnison Strall attendait de vous que vous vous rendiez dans l'Antre du Squelette pour y trouver Ulicel.
|Vous avez tué les Lutins et vaincu l'Ogre Sauvage Ulicel. Vous avez récupéré les plans de défense de la ville mais le Maire Dominic n'était toujours pas à l'aise. Il voulait réveiller sa fille sans qu'elle apprenne la mort d'Ulicel.
 
L'Architecte Angul a découvert que quelqu'un avait reproduit les plans de défense de la ville, et cette copie risquait de tomber entre les mains des Pirates !
|
120|Baie Bélouga|Sec. 4 : Bataille de Pirates|Vous avez fait vos preuves en menant cette quête à bien. Le Capitaine de Garnison Strall aimerait vous donner quelques tâches plus importantes. Il a suggéré que vous alliez voir l'Éclaireur de Garnison Rothy et le Pirate Arvil, près de la Base des Vilrequins.

Il avoua que la confiance n'était pas son fort. En territoire aussi hostile, il fallait faire ses preuves.
|L'Éclaireur de Garnison Rothy et le Pirate Arvil vous ont fait confiance et ont partagé leurs informations. Alors que les Chefs Vilrequins se réunissaient, vous avez détruit leur stock de poudre et vaincu les pirates. 
 
Ça a ensuite été au tour du Chef Vilrequin Gilbert, ce qui vous a permis de récupérer la copie des plans. Mais l'heure n'était pas à la fête. Il allait bientôt falloir combattre les Vilrequins.
|
121|Baie Bélouga|Sec. 5 : Base des Vilrequins|L'Éclaireur de Garnison Rothy était impatient d'avoir la note. Il la lut sans tarder mais à peine terminée, elle fut réduite en cendres ! Il était temps d'attaquer les pirates à grand renfort des habitants de la ville.

Pendant ce temps, quelqu'un avait vu le secret de l'Espion Pirate Arvil sans l'avoir rendu public. Une façon bien à soi d'attendre le bon moment...
|C'est l'Espion Pirate Ulicel, qui avait percé l'identité secrète d'Arvil, mais il ne la communiqua à personne afin de la garder en sécurité. Après que vous l'ayez vaincu, l'Espion Ulicel se dirigea directement vers Arvil pour l'aider. 
 
La garde débusqua l'élite des pirates de son camp de base alors que vous et une poignée de courageux jeunes hommes lanciez l'attaque pour tuer les trois Chefs Vilrequins.|
122|Bourbes|Sec. 1 : Ville du Marais|Des explorateurs avaient été attirés par les endroits où les catastrophes s'étaient produites. D'aucuns disaient qu'une villa magique se cachait sous le vieux marais.

Mais personne ne l'avait trouvée. La plupart des aventuriers s'étaient écroulés à cause du poison libéré par les champignons du marais. Ils avaient donc dû interrompre leurs recherches pour trouver un antidote.
|Avec votre aide, les chercheurs ont pu commencer à travailler sur un antidote. Les analyses et préparations complexes ont pris du temps et ont retardé l'exploration. 
 
Ceci avait inquiété le mécène. Les gens du camp disparaissaient. À ce moment, vous avez apporté un Rhizome Magique Géant. Votre contribution fit le plus grand bien au moral de l'expédition.
|
123|Bourbes|Sec. 2 : Source d'Eau Magique|Avec votre aide, la Chercheuse Mérida fit un bond en avant dans ses recherches et fit une découverte sur la qualité de l'eau du marais.

La Chercheuse Mérida pensait que tous les problèmes étaient dus à la source de l'eau, située au pied d'un arbre géant, au sud. Elle a demandé à ce que vous alliez enquêter.
|Suivant les instructions de la Chercheuse Mérida, vous avez atteint la Racine Branda, un arbre géant situé au sud. La Grenouille des Bourbes Éléa a affirmé que l'arbre poussait près d'une source magique. 
 
Après quelques recherches, vous avez découvert que la source de magie maléfique était le Démon Ultime Maziz. Après un combat acharné, il succomba. Éléa vous fit ensuite cadeau d'un vieux sceau qui symbolise le protecteur de la Racine Branda.
|
124|Bourbes|Sec. 3 : Racine Branda|Une fois l'ancien démon mort, tout être vivant dans le marais se mit à paniquer. Étonnamment, les branches et les feuilles de la Racine Branda commencèrent à tomber.

Le protecteur de la Racine Branda en saurait peut-être plus à ce sujet. Vous avez donc décidé d'aller le voir.
|D'après la Grenouille des Bourbes, le démon tué ne serait qu'une ombre. Le véritable mal s'est échappé dans les profondeurs de la Racine Branda. 
 
Le démon absorbait l'énergie magique de la Racine Branda. Il était bien au-delà de ce que le plus grand mage pourrait affronter. Le seul moyen de le vaincre restait de s'insinuer dans la Racine Branda et de le tuer avant qu'il n'ait complètement récupéré.
|
125|Bourbes|Sec. 4 : Indices|Vous avez rencontré le Pharmacien Dead, qui a déclaré que l'atmosphère des terres du nord-ouest était chargée de particules magiques non toxiques.

Des plantes rares y poussaient grâce aux particules magiques. Le Pharmacien Dead a demandé à ce que vous récupériez un peu de mousse sur des carapaces de Tortues-dragons Aquatiques, dans la zone magique. En échange, il était prêt à échanger quelques informations utiles.
|Une fois la quête du Pharmacien Dead accomplie, il vous raconta une histoire de fantômes. Par curiosité, vous avez suivi le conte et avez atteint un vieux monument. 
 
Vous y avez rencontré une Âme Oubliée. Elle a demandé à ce que vous tuiez le Roi du Mauvais Œil Gino, qui avait survécu à l'explosion. Sur sa dépouille, vous avez pu récupérer une clé que vous avez rapportée à la Chercheuse Mérida. Cette dernière découvrit par accident que la clé pouvait être combinée au vieux sceau.
|
126|Bourbes|Sec. 5 : Ruines des Malices|Là où tous avaient cru atteindre une impasse, vous avez sorti une clé pour ouvrir une porte vers les Ruines du Palais des Malices.

L'expédition trouva un vieux bâton biscornu. La Chercheuse Mérida pensait que cela pourrait aider à combiner la clé au vieux sceau. Elle vous a donc demandé de récupérer le bâton auprès de l'Amateur d'Antiquités, Bes.
|La Chercheuse Mérida vous a parlé de l'explosion. Un mage a lancé un sort qui a mal tourné, provoquant l'explosion. Malheureusement, les Ruines des Malices avaient emprisonné l'âme du mage.
 
Les Ruines du Palais des Malices apparurent juste après avoir inséré la clé dans le Monument, délivrant enfin l'âme du mage. Vous avez ainsi pu rapporter le Sceptre Doré à l'Amateur d'Antiquités et obtenir le titre de Maître Explorateur !
|
127|Vallée des Rois|Sec. 1 : Vallée|Jardin avait une mission divine : garder et défendre la Salle Ulta. Ils ont servi de défenseurs pendant des générations. 

Cela dit, les Créatures des Ruines voisines, nées pour protéger la Salle Ulta, sont devenues folles et ont attaqué les voyageurs. Le Gladiateur timide Derek avait pour tâche d'enquêter sur les Créatures des Ruines, à la demande de l'Aîné du Village. L'idée d'une telle mission le faisait trembler.
|Vous avez aidé le Gladiateur Derek à accomplir sa quête. Vous avez également rencontré deux Aînés du Village et d'autres gladiateurs.  
 
 
L'Aîné du Village Jott, qui n'aimait pas les étrangers, avait fini par vous faire confiance. Il a demandé à ce que vous participiez à l'examen des combattants. Vous avez pu obtenir le Plan de Bataille Carmela. Vous avez également vaincu les frères Zumis, qui comptaient creuser un tunnel vers la Salle Ulta. Vous avez ainsi obtenu le titre de Combattant.
|
128|Vallée des Rois|Sec. 2 : Poison Inconnu|Vous avez parlé à l'Alchimiste Jenna, au village, et elle a dit que le sud-ouest souffrait d'attaques d'essaims d'Insectes Venimeux. Elle demanda donc à ce que vous alliez dans leur grotte et les exterminiez.

L'Alchimiste Jenna espérait sincèrement qu'une fois les insectes morts, vous pourriez lui rapporter un peu de leur substance chitineuse, un ingrédient idéal pour l'alchimie.
|L'Alchimiste Jenna pensait que les insectes devaient avoir une reine, cachée quelque part. Il fallait la tuer avant que de nouveaux essaims d'Insectes Venimeux ne se forment. 
 
L'Aînée du Village Angi et l'Herboriste Phil ont collaboré pour tenter de tuer la reine. À l'aide d'un piège ingénieux, vous avez réussi à la tuer. Angi appuya votre candidature au titre de Gardien du Village, chose que l'Aîné du Village Jott approuva.
|
129|Vallée des Rois|Sec. 3 : Pourriture|Tout le monde pensait que le problème des insectes était résolu, mais l'Aînée du Village Angi a découvert que même si la reine était morte, la population d'insectes continuait de croître.

La situation était hors de contrôle. Elle espérait que vous feriez un rapport au Doyen du Village, Gray, et que vous lui demanderiez de l'aide.
|Le Doyen du Village pensait que le mal n'était pas naturel. Vous avez suivi ses instructions pour atteindre la Gemme Halo et pénétrer au plus profond de Pourriture. 
 
La source du mal apparut, et un combat s'ensuivit. Grâce à votre victoire, les insectes n'étaient désormais plus un problème. 
|
130|Vallée des Rois|Sec 4: Coquillages Ensorcelés|Le Guerrier Erth planifiait un assaut sur le Gang Carmela, mais sa blessure à la poitrine l'affaiblissait. Il ne pouvait pas mener son plan à bien.

Le Guerrier Erth a trouvé la coquille du Chef Carmela, Tortue Mordante Gamera. Cette coquille était plus résistante que les autres. Les guerriers du village n'avaient rien pu fabriquer d'aussi résistant. Il a demandé à ce que vous lui apportiez quelques carapaces pour les étudier.
|Vous avez infiltré le Camp Carmela et avez rapporté les armures des guerriers d'élite. L'Aînée du Village Angi a découvert de sombres inscriptions sur les carapaces. 
 
Les Aînés voulaient tuer le Vice-officier Carmela Gador, qui avait lancé des sorts interdits. Vous avez réussi sans trop d'efforts. Avec la recommandation des deux Aînés, vous avez pu obtenir le titre de Protecteur du Village.|
131|Vallée des Rois|Sec. 5 : Salle Ulta|Les anciens esprits ont fait trembler la Terre pour avertir le Doyen du Village Gray que les Carmelas avaient achevé le tunnel vers la Salle Ulta dans le but de prendre les armes. Les Esprits de la Terre allaient détruire la montagne si personne ne les arrêtait.

Le Doyen du Village a décrit la situation à l'Église et a demandé à ce que vous travailliez avec le Guerrier Erth pour arrêter Carmela et apaiser les Esprits de la Terre.
|Vous avez tué le Superviseur Carmela Kenny, mais le Guerrier Erth et son escouade sont tombés dans une embuscade. Il a perdu tous ses guerriers et a été grièvement blessé. 
 
Les Carmelas ont saisi cette opportunité pour absorber l'énergie des Épées Sacrées. Le Guerrier Erth a fait appel à l'âme de l'Ancien Dragon Géant, le Dragon Roi Georges, pour combattre le Chef Carmela Tortue Mordante Gamera. Vous l'avez rejoint et en êtes venus à bout.
|
132|Volcan Avila|Sec. 1 : Écologie Volcanique|Vous avez atteint le Volcan Avila, mais l'accueil des habitants de Loto a été plutôt froid.

Plus tard, La Mairesse Henny vous a fait arrêter et a demandé à ce que vous prouviez votre valeur en tuant les Vorts, à l'extérieur du village.
|Loto disposait d'un peu de nourriture et de médicaments. Vous avez récupéré un peu de Viande de Tortue et de Fruits Épineux pour la Mairesse Henny. En cherchant des denrées, vous avez trouvé le collier et l'anneau perdus du Maire de Loto. 
 
Vous avez accepté la tâche du Héros Tuskar Vort et avez pénétré dans la forêt pour tuer le Roi de la Forêt Épineuse Lalo. Vos faits vous ont valu le respect des villageois de Loto.
|
133|Volcan Avila|Sec. 2 : Flammes d'Ebaster|D'aucuns disaient que les armes conventionnelles étaient inefficaces contre Ebaster. De plus, les flammes entourant Ebaster étaient particulièrement dangereuses.

Par conséquent, le Forgeron Bach a demandé à ce que vous trouviez du Charbon Géothermique pour accroître la chaleur de la fournaise. Ainsi, Bach a été capable de forger un équipement apte à rivaliser avec les flammes d'Ebaster. Les villageois plaçaient tous leurs espoirs en Vort.
|La quête du Forgeron Bach a guidé vos pas vers le Chercheur en Géothermie Kelt, à qui vous avez apporté du Charbon Géothermique pour qu'il le traite. Ce dernier a demandé à ce que vous lui apportiez quelques matériaux pour qu'il entame ses recherches.
 
De retour auprès de Bach, vous lui avez dit que la Carapace de Tortue de Lave ferait un bouclier idéal pour résister au feu. Pour venir à bout des flammes d'Ebaster, il vous faudrait un bouclier de carapace du Roi Tortue Rampant.
|
134|Volcan Avila|Sec. 3 : Abîme de Baram|Même si tout se passait bien, l'Assistante du Chercheur en Géothermie, Iéna, était nerveuse. Elle a raconté que dans les profondeurs de l'Abîme de Baram se trouvait un cristal dont émanait assez d'énergie magique pour créer un volcan.

Le rapport de l'Assistante du Chercheur Kelt indiquait que la puissance du cristal se déchaînait. Iéna a décidé de faire appel au Sorcier Raist. 
|Avant que la puissance du Cristal Enflammé ne disparaisse à jamais, il vous fallait placer les trois totems du Sorcier Raist en trois différents endroits. 
 
Iéna a demandé à ce que vous rapportiez le cristal au Héros Tuskar Vort, afin de l'aider à combattre Ebaster. Dès qu'il toucha le cristal, une explosion d'énergie afflua de tout son être.
|
135|Volcan Avila|Sec. 4 : Arrêter les Fanatiques|La paix ne dura pas longtemps. Les Fanatiques fomentaient un plan machiavélique. Le Lutin Prisonnier Chemm offrit un sourire sinistre et lourd de sens. Quelle que soit la façon dont le Héros Tuskar Vort menait son interrogatoire, le Lutin refusait de parler.

Une idée vint à l'esprit du Héros Tuskar Vort. Il avait apporté la tête d'un autre Lutin dans le but d'effrayer Chemm. Ce dernier eut si peur qu'il révéla à Vort de précieuses informations...
|Le plan avait fonctionné. Le Lutin Prisonnier avait enfin révélé à Vort son plan pour détruire Baltaroï. Le Héros Tuskar Vort a demandé à ce que vous désamorciez les explosifs placés au Rasys. 
 
Parmi les Fanatiques, vous avez trouvé le Croyant Fanatique Belar qui tentait de s'échapper. Il a avoué que des prêtres avaient entamé l'invocation d'Ebaster. Même si vous tuiez les prêtres, rien n'empêcherait l'arrivée d'Ebaster.
|
136|Volcan Avila|Sec. 5 : Cœur Baltaroï|Ebaster avait rendu la bataille impossible pour le Héros Tuskar Vort. Les flammes l'entourant le rendaient invincible. Personne ne pouvait rien contre lui.

Alors que tous combattaient Ebaster, le Héros Tuskar Vort se faufila dans la prison. Il savait que Chemm mourait de faim. Il avait donc décidé de se servir de la nourriture comme d'un appât.
|Le Lutin Prisonnier Chemm mordit à l'appât et révéla au Héros Tuskar Vort comment tuer Ebaster. Il fallait tuer les prêtres d'Ebaster, puis obtenir et ingérer une potion de protection contre le feu. Pour cela, il fallait aller voir le Sorcier Fanatique Alonzo.  
 
Mais la potion de protection était un leurre. Elle avait affaibli le Héros Tuskar Vort, l'empêchant de combattre. Vous avez dû prendre sa place et combattre Ebaster. Après un rude combat, la bête succomba.
|
137|Plaines Dorées|Sec. 1 : Ville de Prospérité|Le Riche Marchand Samrod, d'Orville, a suggéré que vous fassiez partie des mercenaires. Ce n'était pas aussi compliqué qu'il y paraissait.

Samrod a reçu une commande de matériel médical des Épineurs, à l'extérieur d'Orville. La quête semblait simple. Peut-être était-ce un test. 
|Vous avez apporté les matériaux nécessaires au Riche Marchand. Samrod, impressionné, a recommandé votre postulat auprès des officiers du gouvernement. 
 
Pendant ce temps, le Riche Marchand Samrod pensait que le désastre des insectes au sud pouvait s'étendre à Orville. Il a demandé à ce que vous tuiez le roi des insectes pour éviter toute catastrophe.
|
138|Plaines Dorées|Sec. 2 : Sommeil du Maire|Le Riche Marchand Samrod s'inquiétait pour son vieil ami, le maire. Ce dernier dormait depuis des jours et avait laissé des montagnes de paperasse en suspens.

Le Riche Marchand Samrod a demandé à ce que vous parliez à la Secrétaire du Maire Kitia et déterminiez un moyen de réveiller le Maire d'Orville Kandar.
|La Secrétaire du Maire Kitia a demandé à ce que vous parliez de la situation à l'Alchimiste Oracle Émi. Elle n'était disposée à vous aider que si vous retrouviez le collier perdu de la Femme du Propriétaire du Ranch Ryen. 
 
Vous avez trouvé le collier et l'avez rapporté à Ryen. Il a expliqué qu'une malédiction avait provoqué le sommeil du maire. Émi vous a fait don d'un Orbe Magique que vous avez utilisé pour vaincre le fantôme qui avait piégé le maire dans ses rêves.
|
139|Plaines Dorées|Sec. 3 : Rêve du Maire|Tout le monde pensait que le Maire d'Orville Kandar allait se réveiller une fois le fantôme vaincu.

Mais le maire ne s'est pas réveillé. Sa secrétaire a alors demandé à ce que vous demandiez à l'Alchimiste Oracle Émi s'il existait un moyen de le réveiller.
|Émi vous a fait don d'un Collier Magique. Vous avez suivi ses instructions et l'avez mis autour du cou du maire. Une puissance magique vous envoya instantanément dans le rêve du maire. 
 
Dans son rêve, vous avez rencontré le maire. Il vous a appris qu'un fantôme était à l'origine du problème. Vous avez vaincu le fantôme et avez rejoint le monde réel. Le maire finit par se réveiller.
|
140|Plaines Dorées|Sec. 4 : Gang Œil de Loup|La rumeur disait que la police d'Orville était impuissante. Ils erraient dans la ville à longueur de journée sans jamais aider personne.

Le Chef de Police Rolf portait le fardeau du dédain des habitants. Il espérait qu'un jour, la police pourrait regagner la confiance de la population. Il vous a ainsi demandé d'affaiblir le Gang Œil de Loup.
|Le Capitaine de Police a dit que le Propriétaire du Ranch Ryen pourrait savoir quelque chose sur les Bandits de l'Œil de Loup. Avant de vous aider, Ryen voulait que vous envoyiez une lettre secrète à son vieil ami, le Guerrier Ursun Banestu.  
 
Une fois la lettre remise à Banestu, ce dernier vous a confié un message pour Ryen. Ce dernier s'est mis en colère en apprenant les résultats de l'enquête. Il a décidé de donner une bonne leçon à lŒil de Loup.                                                                                                                                                                                                                                                     
.
|
141|Plaines Dorées|Sec. 5 : Montée Sana|Vous avez aidé les citoyens d'Orville à tuer nombre de membres de l'Œil de Loup. Mais vous n'avez fait qu'énerver le Conseiller Œil de Loup Chino. Il a décidé de lancer un assaut à grande échelle pour se venger d'Orville.

Le Guerrier Ursun Banestu était une honnête créature. Il a copié le plan de bataille et l'a remis en secret au Propriétaire du Ranch Ryen, qui l'a porté au grand jour. 
|Le canon longue distance du Gang Œil de Loup pouvait détruire la ville entière. Mais seul le Conseiller No.1 Hans savait l'utiliser. Vous l'avez attaqué. Lorsque le Conseiller Œil de Loup Chino a su que l'attaque au canon avait échoué, il a ordonné aux Maîtres de Bêtes d'attaquer la ville. 
 
Chino ne s'attendait pas à ce que son armée d'élite succombe face à vous. Lorsqu'il a appris la mort de ses hommes, il a fait retirer ses troupes immédiatement.
|
142|Terres des Dunes Éternelles|Sec. 1 : Rocher|Vous avez rencontré le Mineur Mack en chemin. Il a dit que dans les sables vivaient des voleurs qui attaquaient les voyageurs.

Ils se faufilaient même dans la ville pour voler les habitants. Mack a demandé à ce que vous vainquiez les voleurs.
|Vous avez apporté le Minerai de Cristal au Mineur Mack. Il a demandé à ce que vous l'apportiez à la Marchande Mineuse Pub. Une fois le minerai entre les mains, Pub a signé le contrat avec la Mairesse de Rocher, Terra, et le Contremaître de la Mine, Brent. 
 
Terra a expliqué que des Monstres de Pierre étaient apparus dans le village depuis que Brent avait déterré le Cristal Rouge. Les monstres attaquaient régulièrement. Terra a demandé à ce que vous tuiez le Chef.
|
143|Terres des Dunes Éternelles|Sec. 2 : Bêtes et Vers|Les problèmes de Veraldar inquiétaient grandement l'Aîné du Village Roland. Roland a tout raconté. Il semblait que le problème venait de la découverte du Cristal Rouge, quelques jours plus tôt.

Pour protéger le village des Hommes-loups Ailés, l'Aîné a demandé à ce que vous les chassiez et donniez du temps aux villageois.
|Le Biologiste Clif a analysé la dent du Chef des Hommes-loups Ailés et a découvert que ces derniers vivaient sur des Larves à Pince du Désert. Ces insectes contiennent une toxine capable de rendre fou n'importe quel être vivant. 
 
La Grande Magicienne Fournisseuse pensait que le Prince du Fléau avait libéré le Fléau. Si personne n'arrêtait l'enfant, le chaos s'installerait chez tous les êtres vivants.
|
144|Terres des Dunes Éternelles|Sec. 3 : Fléau|La Grande Magicienne Render comptait arrêter les insectes en comblant l'ouverture du Fléau. Cela dit, elle n'était pas assez forte pour le vaincre seule.

Elle s'est soudain souvenue que le totem de l'Aîné Roland pouvait combler la faille et sceller le Fléau.
|Malheureusement, les Voleurs du Désert avaient dérobé le Totem du Dieu du Sable. Pendant ce temps, le Capitaine de la Guilde de Rocher Darr s'est fait capturer en espionnant le camp. 
 
Vous avez infiltré le camp des Voleurs du Désert et récupéré le Totem du Dieu du Sable. La Grande Magicienne Fournisseuse a redonné au totem sa puissance magique. Vous l'avez apporté au Fléau. Après la mort de la reine des insectes, vous avez pu boucher le Fléau grâce au totem empli d'énergie.
|
145|Terres des Dunes Éternelles|Sec. 4 : Prisonnier|Au rassemblement du village, le Chef et les Aînés ont insisté sur le fait qu'ils n'enverraient pas les gardes en croisade contre les Bandits du Désert. 

L'Aîné du Village Roland a dit que le Capitaine de Guilde Darr était marié à Tarasha. Les Bandits du Désert l'ont capturé au cours d'une mission avec le Soldat de Garnison Cerris. Cependant, Cerris n'en a pas fait mention à son retour au village.
|Vous avez atteint le camp des voleurs et avez retrouvé Darr. Des enchantements vous empêchaient de le libérer. Darr a dit que le Chef des Voleurs du Désert et le Prince du Fléau comptaient pénétrer dans le Dianack. 
 
Au Dianack, l'Esprit Antique de la Terre a dit que le Prince du Fléau contrôlait la plupart des Âmes Amurs. Vous avez aidé l'Esprit Antique de la Terre à récupérer la Pierre d'Esprit Amur.
|
146|Terres des Dunes Éternelles|Sec. 5 : Dianack|L'Esprit Antique de la Terre sentait que la Grande Magicienne Fournisseuse disposait des pouvoirs magiques incroyables. Il a donc demandé à ce que vous apportiez à cette dernière la Pierre d'Esprit Amur.

L'Esprit Antique de la Terre pensait que les pouvoirs de la Grande Magicienne Fournisseuse pouvaient arrêter les Âmes Amurs enragées et aider à rétablir la paix.
|Vous avez apporté la Pierre d'Esprit Amur à la Grande Magicienne Fournisseuse. Elle fronça les sourcils et vous dit que le Prince du Fléau comptait prendre le contrôle des Âmes Amurs et former une terrible armée. 
 
Vous avez pénétré dans la Chambre de Baïra, mal à l'aise, où le Roi Amur, clairement sous l'emprise d'une force extérieure, vous a attaqué. Finalement, vous avez réussi à vaincre les Âmes Amurs et apporter la Pierre d'Esprit Amur à la Grande Magicienne Fournisseuse.
|
147|Forêt de Delphes|Sec. 1 : Dangers de la Forêt|En entrant dans la Forêt de Delphes, le Capitaine de Garnison Vien a préféré vous mettre en garde contre les dangers qui la peuplent. Il a suggéré que vous partiez sur-le-champ.

Le Capitaine de Garnison Vien a dit qu'une attaque contre la forêt se préparait. L'Empire avait fait appel aux Ogres de Ketak pour scier les arbres et chasser les villageois de la forêt.
|Vous avez éloigné les bêtes pour le Capitaine de Garnison Vien. Le village était hors de danger à présent. Mais beaucoup de villageois était tombés inconscients à cause des particules toxiques libérées par les bêtes.
 
Vous avez tué toutes les bêtes restantes et aidé l'Adolescente Alyssa à récupérer quelques matériaux pour créer un Antidote. En même temps, vous avez vaincu la Bête de la Peste Colbert qui avait installé une base pour ses particules toxiques dans le Geyser Étalia.
|
148|Forêt de Delphes|Sec. 2 : Espoir de Père|Le Nouveau Maire Omer, qui avait repris la tâche de son père qui consistait à protéger le village, était énervé par ce que les Ogres de Ketak avaient fait aux villageois. En représailles, il avait décidé d'empoisonner les Ogres.

Dans le village, l'Expert en Arts Martiaux Cal savait comment créer du poison. Le Nouveau Maire Omer s'est précipité pour lancer son attaque contre les Ogres de Ketak, impatient.
|Le Nouveau Maire Omer a demandé à ce que vous récupériez les matériaux nécessaires à la création d'un poison et les donniez à l'Expert en Arts Martiaux Cal. 
 
Cal se sentait coupable pour les plans du maire. Il a demandé à ce que vous fassiez entendre raison à Omer concernant son ignoble projet. Les Ogres ne méritaient pas d'être empoisonnés. Une fois raisonné, le Maire Omer a décidé de combattre les Ogres de façon plus noble.
|
149|Forêt de Delphes|Sec. 3 : Crypticône|Les Hommes-taureaux Géothermiques se sont réunis autour du Crypticône, qui renfermait une immense hache. La hache possédait une incroyable puissance qui pouvait décider de l'issue de la bataille. La hache n'avait pas de maître. Elle pouvait fonctionner aussi bien dans les mains des Ogres que dans celles des Hommes-taureaux Géothermiques.

Les vieilles blessures de l'Expert en Arts Martiaux Cal s'étaient réveillées, et les gardes manquaient d'armures. Le Capitaine de Garnison Vien a alors demandé votre aide.
|Vous avez vaincu les Hommes-taureaux Géothermiques qui ont blessé Cal et vous avez réuni les matériaux nécessaires à la forge d'armes et d'armures à partir du Crypticône. 
 
Finalement, vous avez pu atteindre les profondeurs du repaire et rapporter la hache légendaire. La remettre aux mains du Nouveau Maire Omer a permis d'éviter nombre de dangers futurs.
|
150|Forêt de Delphes|Sec. 4 : Protection du Temple|Une immense émeraude, appelée le Cœur de la Forêt, se trouvait dans le Temple de Delphes. Elle nourrissait les plantes alentour. Mais le Savant Fou Pross était obsédé par celle-ci et voulait absolument la trouver.

Le Noble Guerrier Stalis a admis ne pas pouvoir arrêter Pross seul. Il a donc demandé à ce que vous réunissiez des preuves contre le Savant Fou Pross. Stalis pensait que le temple allait bientôt être la cible d'attaques.
|Vous avez apporté le message du Noble Guerrier Stalis au Capitaine de Garnison Vien et donné les Ambres du Temple obtenus sur les ennemis. Il a demandé à ce que vous alliez voir l'Éclaireur Blanc Vernon, qui pourrait vous donner des informations. 
 
Avec l'aide de Vernon, vous avez rapporté la carte d'un campement vitale, ainsi qu'un rapport d'excavation. Le Nouveau Maire Omer a tout étudié en détail et a mis au point un plan pour arrêter Pross.
|
151|Forêt de Delphes|Sec. 5 : Temple de Delphes|Avant que le Noble Guerrier Stalis ne trouve un moyen d'entrer, le Savant Fou Pross s'était infiltré dans le Temple de Delphes. Le Mineur Cleese, qui venait d'échapper au Savant Fou Pross, a mentionné le fait que Pross comptait utiliser la Gemme Verte pour créer une armée de golems.

En même temps, la Statue Scellée s'est réveillée. Le traître, le Superviseur Violent Percy Gray, a mené ses hommes pour chercher quelque chose dans le temple.
|Vous avez pénétré avec précaution dans le Temple de Delphes. En chemin, vous avez vaincu la Bête Furieuse Luthor et le Superviseur Violent Percy Gray. Enfin, vous avez pu rejoindre Pross. 
 
Il était entouré de morts-vivants. Il semblait que le Savant Pross avait achevé ses recherches juste à temps. Vous avez tué le Savant Fou, enterrant ainsi avec le vieux temple ce secret.
|
152|Forêt de Delphes|Sec. 6 : Écarlate|Des armées s'étaient rassemblées comme une seule autour du Village de Delphes pour combattre au nom de la liberté de la Forêt de Delphes. Delphes a sonné la corne de défense pour lancer la contre-attaque contre ses envahisseurs.

Au début de la bataille, l'Armée de l'Union a pris l'avantage sur les Ogres de Ketak, qui ont battu en retraite vers leur forteresse. Mais l'Union ne savait pas exactement comment attaquer ladite forteresse.
|L'Armée de l'Union a approché Écarlate de divers endroits. Votre groupe a détruit le Baril de Poudre et vaincu l'Officier Interne Dentsanglante Tuka Tufa, le ministre des affaires internes, ainsi que le Combattant Dentsanglante, Scion. 
 
Le Chef Dentsanglante Garrot a perdu le combat et a laissé la forteresse et les quelques soldats qui la peuplaient. Il a promis de revenir un jour.
|
153|Pic de Noireflamme|Sec. 1 : Forge|La guerre approchait, et les monstres proches du champ de bataille devenaient plus vivaces. La guerre avait plongé Lenclume dans le chaos. À votre arrivée dans la ville, le Maire de Lenclume Baros vous a fait part de ses requêtes.

Après avoir découvert la ville, vous avez montré que vous pouviez faire preuve de votre force en tuant les Chouettes Sauvages autour de Lenclume. Il fallait que les villageois vous acceptent avant de pouvoir en savoir plus sur la ville. |Une fois les Chouettes chassées, le Maire Baros vous a fait recommander auprès du Clerc de Fernoir Hernando. Vous avez aidé ce dernier à tuer les membres du Culte de Mara, qui avaient empêché les mineurs à travailler. 
 
Cependant, Hernando vous a dit que la véritable menace venait d'un homme nommé Jacques Balafre. Quand vous l'avez vu tuer un livreur de Lenclume, vous n'avez pas pu vous empêcher de vous opposer à lui. Il n'allait plus être un problème.
|
154|Pic de Noireflamme|Sec. 2 : Minéral Unique|Le Clerc de Fernoir Hernando avait beaucoup de tâches à accomplir. L'Union de Fernoir, un symbole de force de la ville, risquait gros si ces tâches n'étaient pas accomplies à temps.



À cause du regain d'activité maléfique dans la mine, le village était à court de matériaux nécessaires pour forger les objets commandés. Personne n'osait y pénétrer. Hernando espérait que vous rapportiez du Minerai de Stragga.
|Vous avez réussi à rapporter du Minerai de Stragga. D'autres matériaux étaient requis. Vous avez donc été en chercher dans la mine et avez rapporté des cristaux de cobalt noir et d'autres objets. La Forgeronne Poivre a raffiné l'Alliage de Stragga brut.
 
Poivre a dit que le modèle brut nécessitait des Serres et des Cornes d'Acier. Vous l'avez apporté au Forgeron Piédestal pour poursuivre le traitement et avez récupéré des matériaux pour lui. Enfin, l'Alliage parfait de Stragga était terminé.
|
155|Pic de Noireflamme|Sec. 3 : Veine Tordue|Le Clerc de Fernoir Hernando était mécontent d'avoir perdu la mine. Il était impatient de la récupérer des mains du Magnat du Crime, Stirling.

Il a demandé à ce que vous tuiez Stirling. Mais ce dernier était entouré de puissants adeptes. Hernando a donc suggéré que vous formiez un groupe pour vous aider à vaincre Stirling et ses adeptes.
|Une fois le Magnat du Crime Stirling et ses adeptes morts, vous avez pu apporter au maire son marteau favori. Vous l'avez obtenu des brutes de la mine. Vous avez également pu récupérer du Minerai d'Ardoise Arc-en-ciel pour le Chevalier de la Rose Chaum. 
 
Les mineurs ont repris le travail le sourire aux lèvres. Tout le monde à Lenclume allait regagner sa vitalité sous peu.
|
156|Pic de Noireflamme|Sec. 4 : Possessions|La Forgeronne Poivre n'avait pas le temps d'effectuer sa livraison. Elle a demandé à ce que vous l'aidiez à livrer ses marchandises à un camp temporaire de l'Empire, au nord.

La nouvelle d'un camp temporaire de chevaliers proche de la forteresse de l'Empire a été surprenante. L'hypothèse qu'ils soient en danger a fait son chemin dans votre esprit.
|D'après le Capitaine Chevalier Umen, son armée défendait Siècle lorsqu'un démon a possédé le chef du fort. La magie maléfique a affecté nombre de soldats, les rendant violents et cruels. 
 
La Capitaine Umen a demandé à ce que vous tuiez le Chevalier Démoniaque Clovis. Vous l'avez fait et vous avez libéré les soldats possédés par le démon. Mais la situation ne pouvait être réellement résolue qu'en vainquant le général ensorcelé.
|
157|Pic de Noireflamme|Sec. 5 : Culte de Mara|Les Chevaliers de la Rose ont envoyé Chaum pour obtenir des informations sur le Roi Sorcier Wushu. Il a découvert que Wushu était derrière beaucoup d'enlèvements et d'attaques. Pour ramener la paix sur le Pic de Noireflamme, Wushu devait mourir.

En même temps, la Ménagère Lins, qui recherchait son fils, et le Capitaine Chevalier Umen ont tenté en vain de retourner au fort. Ils espéraient que vous les aidiez.
|Des choses dégoûtantes peuplaient l'Autel du Culte de Mara. Vous avez aidé Umen à faire un peu de ménage. En chemin, vous avez trouvé le squelette de Calvin et le collier en dent de loup. Cela a renforcé votre détermination de tuer le Roi Sorcier Wushu. 
 
Vous avez atteint les profondeurs de l'Autel, trouvé et tué Wushu. À votre retour au camp, vous avez annoncé à la Ménagère Lins que son fils était mort, ce qui la fit fondre en larmes. 
|
158|Pic de Noireflamme|Sec. 6 : Siècle|L'Armée Heldentod a tenu sa position devant le fort et reçu des fournitures de Lenclume. Il était bientôt temps de reprendre le fort. Le Capitaine Chevalier Umen a ordonné aux soldats de s'apprêter à lancer l'attaque.

Cela dit, les monstres compliquaient les choses. Une attaque frontale affaiblirait considérablement l'armée. Le Capitaine Chevalier Umen a mis au point un plan dont vous seriez le facteur clé.
|Une fois le Mangeur d'Âmes Kemrock mort, le frère possédé du Jeune Chevalier Minerve, l'Argent Sanglant Loki, s'en est pris à vous. Pour réaliser le souhait de Minerve, vous avez vaincu Loki et libéré son âme du démon. 
 
Soudain, un grand nombre de soldats démoniaques sont apparus pour vous arrêter, et le Général Démoniaque Néondo est venu vous affronter. Après un long et éprouvant combat, Néondo a été détruit.
|
159|Marais Décrépits|Sec. 1 : Menace sur le Marais|Vous avez atteint le marais mais le Maire de Bonmalmo Aguero a dit qu'il n'était pas sûr. Les gens avaient besoin d'aide.

Aguero a dit que les Épineurs, qui vivaient en paix avec les villageois, sont soudain devenus cruels et sauvages. Il vous fallait arrêter leurs attaques avant même de pouvoir déterminer la cause de ces changements.
|Le chef du village a dit que l'Alchimiste Tono connaissait un moyen pour évaluer la qualité de l'eau. Vous avez apporté quelques échantillons et des matériaux à Tono. Après analyse des objets, il a pu découvrir la magie du Roi Sorcier Wushu. 
 
Pour s'assurer que le poison de Wushu était bien la cause, il a demandé à ce que vous apportiez le cœur de Mousse pour la Sorcière Lutélian. Cette dernière a déterminé que la tribu Osrage était derrière la contamination.
|
160|Marais Décrépits|Sec. 2 : Eau Pure|Le Chevalier de la Rose Shyos, qui ne croyait ni aux fantômes ni aux esprits maléfiques, a analysé les informations apportées par les Chevaliers de la Rose. Il pensait que la Tortue-dragon Âgée du Marais Maudit appartenait aux Mercenaires Impériaux.

Le Chevalier de la Rose Shyos a insisté sur le fait que les pouvoirs surnaturels n'existaient pas. Cela lui a fermé les portes du village. Il espérait que vous l'aidiez à obtenir le rapport de la Sorcière Lutélian.
|La Sorcière Lutélian a suggéré que vous enquêtiez près des Chutes des Âmes en Peine, où vous avez trouvé le badge d'un défenseur des routes. Cela était bien la preuve que les Mercenaires Impériaux étaient entrés dans les Chutes des Âmes en Peine. 
 
Pour aider la Sorcière Lutélian à purifier l'eau, vous avez apporté une pompe et une amulette au Chevalier de la Rose, de la part de la Marchande Trisbane. La Sorcière Lutélian espérait que Shyos puisse apporter quelques échantillons de l'eau maudite de Wushu et d'eau purifiée.
|
161|Marais Décrépits|Sec. 3 : Âmes en Peine|Shyos n'admettait pas l'existence du Vaudou. Il a mentionné que les Mercenaires Impériaux s'étaient infiltrés dans les Chutes des Âmes en Peine et comptaient empoisonner la dernière source d'eau pure. Il espérait que vous les arrêtiez.

Coline a reçu la pompe de Shyos et il fallait que quelqu'un accomplisse la tâche que Nunulak lui a confiée. L'Alchimiste Gero semblait intéressé par les matériaux alchimiques rares des Chutes des Âmes en Peine.|Vous avez trouvé le passage secret derrière les Chutes des Âmes en Peine. Il facilitait l'accès à la source, au sommet de la colline. Les Mercenaires Impériaux étaient sur le point d'empoisonner l'eau à votre arrivée. 
 
Vous les avez tués avant qu'ils n'appellent des renforts, mettant un terme à leur terrible plan. Vous avez placé l'échantillon d'eau dans la pompe et récolté un peu de la boue, puis vous avez repris la direction du village. 
|
162|Marais Décrépits|Sec. 4 : Roi de la Terre|Le Maire de Bonmalmo s'est précipité vers vous pour vous arrêter et vous dire que d'après la prophétie, la colère du Roi de la Terre, Galt, avait créé un Vortek dans les marais.

Aguero a affirmé qu'un groupe d'explorateurs était venu enquêter sur la cause de ce phénomène. Le maire vous a demandé de vous renseigner sur les résultats de cette enquête. Il espérait que la prophétie était erronée.
|Vous avez consulté un parchemin obtenu sur l'un des Mercenaires Impériaux. Vous avez appris que la Tribu Osrage comptait empoisonner les villageois et contrôler Galt comme une marionnette. 
 
La Sorcière Lutélian a découvert que l'énergie obscure lancée dans le Vortek venait des Totems Démoniaques de la tribu. Il fallait vous rendre dans la Tribu Osrage, détruire les totems et assassiner la Sorcière Chantnoire, Ace.
|
163|Marais Décrépits|Sec. 5 : Chambre de Galt|La Sorcière Lutélian pensait que Galt, le Roi de la Terre, avait été affecté par l'énergie obscure. Sa rage allait devenir incontrôlable. Elle espérait que vous vous rendiez dans la Chambre de Galt pour arrêter ce désastre.

L'Aventurier Fou Cygne s'inquiétait pour le chef d'équipe de l'aventure et a demandé à ce que vous le trouviez. En même temps, le Garde de la Statue Veistad espérait que vous puissiez récupérer les Totems Démoniaques de la Tribu Osrage.
|Vous avez atteint la Chambre du Roi de la Terre, Galt. Il n'était plus le gentil vieillard qu'il avait été. C'était une bête féroce. 
 
Le combat s'éternisa mais vous avez pu apaiser le Roi de la Terre enragé. Et vous avez pu tuer la Sorcière Chantnoire.
|
164|Hautes-terres|Sec. 1 : Hautes-terres|Alors que vous vous interrogiez sur la présence d'une ferme au milieu d'un champ de bataille, le bienveillant Propriétaire du Ranch Nick vous fit signe. Apparemment, les Hautes-terres étaient en mauvaise posture.

Les Taureaux en armure qui avaient détruit les clôtures de la ferme posaient de gros problèmes à Nick. Vous pourriez en apprendre davantage sur les Hautes-terres en aidant le Propriétaire du Ranch.
|Après avoir repoussé les Taureaux en armure et récupéré les matériaux nécessaires à la construction des clôtures, vous avez discuté avec l'Employé du Ranch, Jeasant. Celui-ci vous a fait part d'un autre problème : l'eau, dont la qualité était médiocre. 
 
La Femme du Propriétaire du Ranch, Tante Solsa, a trouvé de la poudre magique maléfique dans un échantillon d'eau. Elle a demandé à ce que vous alliez à Drema et tuiez le Roi des Hommes-loups Ailés, Dacen, qui est à l'origine de la pollution. Elle vous également demandé de rapporter les matériaux nécessaires à la création d'un sérum anti-sort.
|
165|Hautes-terres|Sec. 2 : Général Lion Bélier|Après avoir travaillé quelque temps à la ferme, vous avez eu l'approbation du Propriétaire du Ranch Nick. Il a écrit une lettre de recommandation à l'attention de son vieil ami, le Général Lion Bélier Bras de fer.

Le Propriétaire du Ranch Nick voulait surprendre le général. Il a demandé à ce que vous éliminiez les Heldentods à l'extérieur du fort. Cela aiderait le Général Bélier et montrerait que Nick avait l'œil pour repérer les jeunes talents.
|Le Général Lion Bélier Bras de fer a été impressionné par la lettre de recommandation de Nick et ravi de voir la façon dont vous avez chassé les Griffons. Bélier vous a alors ordonné le tuer le Maître des Bêtes, ce qui a été relativement facile pour vous. 
 
Le manque de fournitures et une mutinerie sous-jacente inquiétaient le Général Bélier. Vous l'avez aidé à récupérer les biens de l'armée des mains des rebelles et tuer le Maître de poste traître.
|
166|Hautes-terres|Sec. 3 : Arsenal Fédéral|Le dernier rapport au Général Bélier a montré que le Général Kasi le Cruel s'était infiltré dans l'Arsenal de la Fédération avec son armée. Kasi le Cruel voulait découvrir l'arme secrète de l'Union. 

Le Général d'Armée Jecca a reçu un rapport d'un agent infiltré. Il y est dit que le Maître de poste traître avait donné la clé vers l'arme secrète à un officier de l'Empire sur le point d'envoyer la clé à son général. 
|Vous avez pénétré dans une zone très peuplée puis dans l'Arsenal. Vous avez rencontré un groupe de soldats d'élite de l'Empire mais avez pu les vaincre et récupérer la clé sur l'officier de l'Empire. 
 
Enfin, vous avez rencontré le Général Kasi le Cruel dans l'Arsenal et l'avez tué après une rude bataille. À votre retour au Fort du Lion, le Général Lion Bélier vous a donné les plus grands honneurs au nom des soldats de l'Union.
|
167|Hautes-terres|Sec. 4 : Manoir|Des problèmes sont survenus à Manoir, dans le Fort du Lion. Le geôlier, corrompu par l'Empire Heldentod, a ouvert toutes les cellules, provoquant une émeute !

Les gardes de la prison ont essayé de rétablir l'ordre autant que possible mais beaucoup de prisonniers se sont évadés. Le fort était en proie au chaos. Pour éviter toute attaque de l'armée de l'Empire, le Général Lion Bélier Bras de fer a envoyé l'ordre d'arrêter tous les prisonniers en fuite.
|Les Chevaliers de la Rose ont envoyé Antia pour aider à endiguer l'émeute. Cela dit, elle ne pouvait y arriver seule ; elle avait besoin de votre aide.
 
La plupart des prisonniers se sont facilement fait avoir. Mais certains criminels notoires se sont montrés plus coriaces. Avec l'approbation du juge, vous les avez tués pour mettre fin à l'émeute. 
|
168|Hautes-terres|Sec. 5 : Magie Perdue|La perte du gros de l'armée a enragé l'Empire Heldentod. Ce dernier a réuni un groupe de forces d'élite et lancé une attaque sur la forteresse de la Frontière de Basel. Le Général Lion Bélier Bras de fer était pressé de vous voir.

Il espérait que vous parliez de la situation à la Femme du Propriétaire du Ranch, Tante Solsa. Il pensait que cette dernière pourrait aider à préparer l'Armée de l'Union. Ils ne devaient pas perdre.
|La Frontière de Basel était une frontière naturelle. La seule façon de s'y rendre était par voie magique, mais cela demandait du temps et de la préparation. Tante Solsa a demandé l'aide de l'Oracle Fée Taileste et de l'Archéologue Polos. 
 
Pour vous préparer, vous avez détruit une faille temporelle au milieu des Ruines Tyroliennes et récupéré l'os d'une Bête Chronique. Après cela, Tante Solsa a commencé le sort de réseau magique.
|
169|Hautes-terres|Sec. 6 : Frontière de Basel|Le Commandant Heldentod Ellison Pied d'acier s'est énervé en apprenant que l'Armée Chantnoire avait vaincu ses troupes. Il a ordonné à ses soldats de lancer un assaut sur la Frontière de Basel. L'Armée de l'Union avait des difficultés à combattre les troupes adverses. 

L'Armée de l'Empire avait conquis les forteresses les unes à la suite des autres et s'apprêtait à entrer par la grande porte du fort. Vous étiez le seul espoir de ses occupants. |Avec quelques soldats, vous avez traversé le portail de téléportation de Tante Solsa pour aller sur le champ de bataille. Vous avez pris part à la mêlée mais les attaques de l'Empire étaient violentes. 

Par chance, le Général Bélier est intervenu dans le combat contre le Commandant Heldentod Ellison Pied d'acier. Après un rude combat, vous l'avez tué. Mais la guerre n'était pas terminée. Le Général Bélier espérait sincèrement en finir avec une solution diplomatique.
|
171|Monts Calcaires|Livre : Du Rêve à la Réalité|C'est une phrase de la préface qui vous a fait acheter le livre. Ça disait : "Chacun a un rêve, mais tout le monde ne peut pas passer du rêve à la réalité."

Bien qu'il ne s'agisse que d'un livre ordinaire sur la pensée positive, vous l'avez perçu comme un moyen d'en apprendre beaucoup sur le monde.
|Vous avez terminé le livre que vous lisiez et visité certains des endroits dont il parlait. Ça a été une grande surprise de vous apercevoir que le jeune homme mentionné dans le livre était le Chef du Village Andrew.
 
Avec ses encouragements, vous avez commencé à comprendre l'importance du livre. Vous avez également pu y glaner quelques informations sur le nouveau monde.
|
172|Colline Tranquille|Livre : Port|L'Artiste Casio était impatient car son voyage avait pris du retard. Il marchait sur la plage, en quête d'inspiration, mais il était tellement perdu dans ses pensées qu'il s'était éloigné de la foule.

En pénétrant dans une zone peu protégée de la plage, Casio se fit piquer par un animal marin sauvage. Il s'allongea sur la plage, paralysé. Au moment où il allait abandonner tout espoir, il vit une fille courir dans sa direction.
|La jeune fille s'occupa de Casio, et quand l'heure du départ arriva, il se rendit compte que l'amour était la chose la plus importante au monde. Sans cela, toute la beauté du monde, même le plus magnifique lever de soleil, était insipide.

À la fin de l'histoire, Casio épousa la fille. Le livre s'est bien vendu et il a participé à la popularité de Clochemer. Depuis, les couples viennent y admirer de magnifiques levers de soleil.
|
173|Colline Tranquille|Livre : Soulèvement des Aigles|Le Gang des Aigles s'est formé sur la Colline Tranquille. Un jour, un talentueux jeune Tuskar, Porcinet, décida de passer le test pour devenir membre.

L'Aîné du Village l'estimait beaucoup. Jaloux, les autres jeunes Tuskars  décidèrent alors de s'en débarrasser, mais ce combat changea la vie de Porcinet et porta atteinte au Gang des Aigles. Le livre parle de son ascension au pouvoir.
|Porcinet était tombé dans une embuscade, durant laquelle les membres du gang lui arrachèrent une défense. Tout le monde se moquait de lui parce qu'il était défiguré. 
 
Mais après des années de dur labeur, Porcinet avait montré sa valeur. Menant son groupe vers la victoire à chaque occasion, il gagna rapidement le respect des gens et il repoussa le Gang des Aigles hors de la frontière.
|
174|Forêt Arc-en-Ciel|Livre : Amour Fraternel|Dans le paisible Village Coassant vivaient deux frères Anuras, Hillo et Vix. Leur lien fraternel était très fort.

Un jour, les deux frères parlèrent des filles dont ils étaient amoureux. Au fil de leurs descriptions, ils se rendirent compte que la fille de leurs rêves était la même. Les deux frères s'en prirent l'un à l'autre, troublant la quiétude des villageois.
|Hillo et Vix se battaient pour leur amour, Irina. Un jour, Vix vit Irina avec son frère. Dévasté, il décida de fuir le village et il arriva par hasard au Camp des Géants Sylvestres. 
 
Par chance, Hillo sauva Vix du danger et ils finirent par se réconcilier. Avec la bénédiction de Vix, Hillo et Irina se marièrent, et Vix quitta le village, en quête de son véritable amour.
|
175|Forêt Arc-en-Ciel|Livre : Guide du Ranger|Noé, le Ranger le plus célèbre du monde, a écrit un livre expliquant les qualités nécessaires pour devenir Ranger, entre autres.

Le livre ne parlait pas que de l'entraînement pour devenir Ranger. Il donnait également des indices sur la survie en milieu sauvage. Dans ce livre, Noé parlait de l'esprit noble des Rangers. C'était une vraie nécessité pour tous les Rangers.
|Un entraînement en suivant le livre vous permettrait de devenir Ranger, une attribution tout ce qu'il y a de plus noble.
 
Cependant, il n'était pas aisé de reproduire les hauts faits de Noé. Vous avez appris par cœur chaque mot du livre.
|
176|Monts Arides|Livre : Homme aux Clés|Dans la Vallée des Rois, vivait un jeune homme nommé Carl. Il rêvait de devenir un grand inventeur mais un terrible accident a modifié à jamais le cours de son existence.  

Carl a découvert qu'il était possible d'utiliser une clé comme arme mortelle. Dès lors, ses objectifs ont changé et il n'a plus cessé de s'entraîner avec la clé. Il ne s'attendait pas à ce que cela lui cause autant de problèmes.
|Une fois ses attaques maîtrisées, il est devenu la crainte de tout le village. De héros, il était devenu une menace.
 
Carl a donc dû quitter le village contre son gré. Des années plus tard, le nom de l'Homme aux Clés était connu par monts et par vaux. Carl combattait désormais les forces du mal, armé de sa clé. Il espérait regagner le respect des villageois et rentrer chez lui un jour.
|
177|Monts Arides|Livre : Griffe Dorée|Le terrible Gang de la Griffe Dorée causait des problèmes dans les Monts Arides. La Griffe Dorée avait fait son chemin dans les montagnes, profanant les temples qu'ils rencontraient. Du coup, l'Église désirait détruire le gang.

Le livre raconte les folies commises par la Griffe Dorée. Il a été écrit par un Ranger téméraire. Le livre explique comment éviter de se faire enlever ou voler, ou comment chasser les animaux des montagnes.
|Après avoir lu le livre, vous avez pénétré dans le Camp Zéléna et utilisé vos nouvelles connaissances pour vaincre tous les membres du gang. 
 
Le livre mettait en garde les lecteurs contre la tromperie et l'escroquerie. Il encourageait les guerriers à combattre la Griffe Dorée.
|
178|Baie Bélouga|Livre : Baie Bélouga|Les Maîtres Aventuriers Rann et Œto, deux explorateurs amateurs de reliques anciennes se sont rendus à la Baie Bélouga pour étudier les ruines.

Mais une Angelée toxique a piqué Œto, qu'il a fallu envoyer à l'hôpital après avoir quitté le port. Cela a retardé l'exploration. Cependant, rien ne pouvait les arrêter: l'exploration a repris à l'instant même où Œto était guéri !
|Vous avez suivi les traces d'Œto et de Rann, et avez entamé votre exploration. À votre arrivée dans les Bois aux Écailles, un groupe de Lutins vous a offert un accueil des plus particuliers. Suivant les conseils d'Œto et de Rann, vous avez fui la zone rapidement. 
 
Grâce à ce livre, vous avez pu trouver les Reliques d'Azul et admirer l'ancienne Croyance d'Azul. Il a également montré qu'Œto et Rann avaient déjà vu les Reliques d'Azul.
|
179|Baie Bélouga|Livre : Prisonnier des Pirates|Le livre relatait l'histoire du Capitaine de Garnison Strall, trahi par ses partenaires et attaqué par des pirates au cours d'une mission. Il n'était pas encore Capitaine de Garnison à l'époque.

Bien que Strall ait été un bon combattant, il ne faisait pas le poids face à tout un groupe de pirates. Ils l'ont capturé et l'ont jeté dans la prison du camp. Strall comptait s'échapper de ce lieu de torture et se venger de ses ravisseurs. 
|Avec ce livre, vous avez pu traverser le camp des Vilrequins. Personne, à l'exception du Capitaine de Garnison Strall, n'avait pu s'échapper. 
 
Vous avez traversé la prison où Strall a été retenu ainsi que les principaux campements des pirates. Après lecture du livre, vous avez eu la sensation que les pirates n'oseraient pas envahir le port tant que Strall s'y trouvait.
|
180|Bourbes|Livre : Rêve de Crapounet|Jeune Grenouille s'endormit tandis que son père lui racontait une histoire. Dans son rêve, il se rendait à l'endroit indiqué dans l'histoire pour chercher un trésor. Il souhaitait le trouver et devenir riche. 
 
En chemin, Jeune Grenouille trouva des champignons. Il s'apprêtait à les manger lorsqu'ils prirent vie et l'encerclèrent. Jeune Grenouille était paralysé de peur. Il se réveilla en sueur et jura de ne plus se montrer cupide.
|Vous avez suivi les traces de Jeune Grenouille grâce à ce livre. En chemin, vous avez trouvé beaucoup de choses étranges. Pourrait-il réellement y avoir un trésor sous terre ? 
 
À l'endroit où le livre indiquait l'emplacement du trésor, vous avez trouvé des marques de pelles. Quelqu'un d'autre a dû faire le voyage pour trouver le trésor après avoir lu l'histoire.
|
181|Bourbes|Livre : Plaintes Bourbeuses|Une grosse explosion a surpris Adida. Il a arrêté de travailler et s'est dirigé vers la source de l'explosion. 
 
Adida a vu un jeune mage à côté d'un grand marais. Le Mage l'a conduit vers le nord-est, où se trouvait un Cristal Magique qui murmurait. Le cristal a dit à Adida de le ramener chez lui. Une fois cela fait, il a explosé, tuant Adida et le jeune mage. Le livre relatait tous les détails de cette tragédie.
|Vous avez visité le site de la tragédie mentionnée dans le livre. Les monstres et les Anuras rencontrés étaient les mêmes que ceux décrits dans l'ouvrage. Il semblait que la situation dans le marais ne s'était pas arrangée. 
 
Enfin, vous avez ouvert le livre et une question s'est posée à vous : Qui était ce jeune mage ? Il possède certainement bien des secrets dissimulés.
|
182|Vallée des Rois|Livre : Amours Troublées|À Jardin, un jeune garde patrouillait. Il avait accepté ce travail pour impressionner une fille. Soudain, il l'entendit crier à l'aide et il se précipita vers elle. 
 
Étonnamment, une statue de pierre géante est apparue. Il leva son arme et fit face à son funeste destin. Il mourut au pied de la statue sans avoir pu sauver la fille. En lâchant son dernier souffle, il regarda la fille dans les yeux en souriant, comme elle.
|Vous avez lu le livre et éprouvé de l'empathie pour le guerrier de l'histoire. Concilier famille et vie de guerrier peut se révéler impossible. 
 
Plus tard, vous avez suivi le chemin du guerrier dans le livre et avez rejoint le marais au sud-ouest. Cela dit, vous n'arriviez pas à déterminer si l'histoire était vraie ou non.
|
183|Vallée des Rois|Livre : Devenir Gardien|Pendant des années, Jardin était régi par un système de classes traditionnel.
Pour persuader les villageois de rejoindre le groupe de gardes, le Chef du Village a écrit ce livre et encouragé chacun à occuper un rôle dans le village.
Cependant, la première épreuve pour devenir Gardien consistait à tuer un Griffon, un monstre féroce. À l'avenir, un guerrier allait devoir affronter des épreuves bien plus terribles.
|Pour vous mettre à l'épreuve, vous avez étudié le livre et commencé l'entraînement. 
 
Bien que vous puissiez vaincre toutes sortes d'ennemis, l'ouvrage affirmait que le combat ne représentait qu'une partie de l'épreuve. La chose la plus importante à ne pas oublier, c'est que vous êtes votre pire ennemi.
|
184|Volcan Avila|Livre : Dent Noire|Le Groupe de la Dent Noire allait éclater lorsqu'il reçut une demande d'un village sans le sou. Même si la récompense était maigre, le Capitaine Gtheia décida d'offrir son aide.

Lorsque le Groupe de la Dent Noire atteignit sa destination, il rencontra des dragons sauvages encerclant le village. Après un rude combat, le groupe du Capitaine Gtheia vainquit les terribles créatures, apportant la paix au village.|À votre arrivée à Loto, vous avez découvert que la ville était devenue riche et prospère. 
 
Avant votre départ, les noms de villageois vous ont évoqué quelque chose. Vous les avez certainement vus ou lus dans le livre. Il semblerait que d'anciens mercenaires vivent encore à Loto. 
|
185|Volcan Avila|Livre : Silence brisé|Un étrange bruit a perturbé la tranquillité nocturne de Baltaroï. Les citoyens sont sortis dans la nuit, engloutis dans la brume du soir, et peu ont pu voir ce qui se passait. 
 
À travers le brouillard, on pouvait distinguer les Disciples Fanatiques, au Sud. Au Nord, l'Armée Tuskar approchait. Les Disciples Fanatiques ont lancé une première vague d'assaut sur les Guerriers Tuskars à Baltaroï. C'était le début de la fin.|Alors que vous vous teniez face à la porte brisée de Baltaroï, la bataille s'est matérialisée dans votre esprit. Les braves soldats dégainaient leurs armes et se préparaient à combattre. C'était comme si vous y étiez. 
 
Vous vous teniez près des Ruines du Palais et contempliez le courage des soldats. Bien qu'ils aient tous péri lors de la seconde vague d'assaut, leur esprit perdurait.
|
186|Plaines Dorées|Livre : Orville|Bien des personnes sont venues à Orville avec des rêves de richesse plein la tête. On disait que cette ville était tout en or. 
 
Le livre offrait quelques informations sur la vie et le commerce à Orville. La première page indiquait clairement qu'en réalité, la ville était loin d'être faite d'or. Quelle déception...
|Certes le livre contenait des secrets pour gagner de l'argent, mais il vous a fallu du temps pour gagner votre première pièce d'or. Ce livre convenait davantage aux aventuriers qui séjournaient à Orville sur de courtes périodes. 
 
Vous avez pris place dans un champ pour réfléchir à la vie. La vôtre était destinée à prendre des risques et à braver les dangers. Bien que la tentation de rester à Orville fût grande, compte tenu de sa qualité de vie, vous deviez partir.
|
