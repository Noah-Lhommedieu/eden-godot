1911|Niv. 69 La Délégation de Zephyrinus|Quête de la classe Sage|L'Oracle Athéna Marie veut en savoir plus sur la situation du Pape Zephyrinus à Aven.|
1912|Nv. 69 - La Requête du Marcheur des Ombres I|Quête de la classe Sage|Le Pape Zephyrinus vous emmène à Aven voir les Marcheurs des Ombres, un groupe de gens qui suivent la lettre de leur ancien Roi Sage. Les Sang Noir menacent leur existence. |
1913|Nv. 69 - La Requête du Marcheur des Ombres II|Quête de la classe Sage|Aidez les Marcheurs des Ombres à vaincre les espions Sang Noir à Aven sur la place nord (322, 510), au port (227, 150) et au Hall Central (300, 437).|
1914|Nv. 69 - La Requête du Marcheur des Ombres III|Quête de la classe Sage|Le Maître des Ombres Hillem vous a demandé de trouver le Gardien des Ombres Lebrun, un membre des Marcheurs des Ombres qui a récemment réussi à faire fonctionner une machine à voyager dans le temps. Peut-être que Lebrun peut vous renvoyer dans le passé pour que vous puissiez voir ce qu'il s'est vraiment passé entre les Marcheurs des Ombres et les Sang Noir.|
1915|Nv. 69 - La Requête du Marcheur des Ombres IV|Quête de la classe Sage|Retrouvez Lebrun près de la machine à voyager dans le temps près de la Rune des Ombres (75, 449) et demandez-lui de vous envoyer dans le passé. |
1916|Nv. 69 - La Requête du Marcheur des Ombres V |Quête de la classe Sage|Transformez-vous en Roi Sage pour revivre le moment où le Roi a protégé Mose et a créé le Brise-Terre. Vous assisterez à la victoire du Roi contre les mutants et <Lame Sang Noir> Finn. |
1917|Nv. 69 - La Vérité I|Quête de la classe Sage|Vous remettez l'Orbe Sacrée brisée à Lebrun après être revenu dans le présent. Il réalise soudain que la vision qu'ont les Marcheurs des Ombres du passé ne doit pas être exacte. Après avoir appris ce qu'il s'est passé, Hillem vous demande de passer les épreuves pour devenir un Sage. |
1918|Nv. 69 - La Vérité II|Quête de la classe Sage|Utilisez le Vieil Ermite Belema pour prouver votre identité aux Marcheurs des Ombres à Orville (578, 360). Puis partez affronter <Lame Sang Noir> Finn. |
1919|Nv. 69 - La Vérité III|Quête de la classe Sage|Refusant de vous en dire plus, Belema veut que vous ameniez le Pendentif de Jade Sanglant au Bibliothécaire Conan et que vous l'utilisiez pour recréer ce qu'il s'est passé. |
1920|Nv. 69 - La Vérité IV|Quête de la classe Sage|Utilisez le Pendentif de Jade Sanglant pour vous téléporter vers le passé où vous serez transformé en Roi Sage et revivrez le chagrin qu'il a ressenti lorsqu'il a utilisé Aura : Singularité pour exterminer les Sang Noir démonisés. |
1921|Nv. 69 - La Vérité V|Quête de la classe Sage|Transformez-vous en Roi Sage et utilisez le Marteau d'Inspiration pour vaincre les terribles Sang Noir. |
1922|Nv. 69 - Épreuve du Sage I|Quête de la classe Sage|Après avoir découvert de nouvelles informations à propos de la rivalité entre les Marcheurs des Ombres et les Sang Noir, Hillem reconnaît que vous êtes qualifié pour l'épreuve finale. Il vous demande d'obtenir plus d'informations à propos de cette épreuve auprès d'Helena. |
1923|Nv. 69 - Épreuve du Sage II|Quête de la classe Sage|Après avoir reçu les instructions d'Helena, votre épreuve finale pour devenir Sage va commencer : vous allez être téléporté vers le lieu de l'épreuve. |
1924|Nv. 69 - Épreuve du Sage III|Quête de la classe Sage|Utilisez la Relique du Roi Sage pour vous téléporter vers le lieu de l'épreuve et y vaincre l'Elfe Sacré à l'aide d'Aura : Dépendance du Marteau. En faisant cela, vous réussirez le premier test. |
1925|Nv. 69 - Épreuve du Sage IV|Quête de la classe Sage|Utilisez Protection du Sage pour mettre fin à la vie maudite et misérable de <Démon Sang Noir> Mose Saignant.|
1926|Nv. 69 - Épreuve du Sage IV|Quête de la classe Sage|Utilisez Aura : Bouclier Protecteur pour contrer les attaques de <Démon du Purgatoire> Finn et résoudre le différent entre les Marcheurs des Ombres et les Sang Noir. Ceci mettra fin à votre épreuve finale. |
