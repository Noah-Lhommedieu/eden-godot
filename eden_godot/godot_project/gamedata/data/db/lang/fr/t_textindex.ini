4775|Interface Équipe d'Arène

Vous pouvez voir ici des informations sur les deux équipes. 

Victoires : quand une équipe remporte un tour, 
une gemme rouge s'allume. La première équipe qui allume 2 gemmes rouges l'emporte. 

Informations sur les équipes : vous pouvez voir ici les informations 
sur les deux équipes : leurs noms, leurs scores hebdomadaires 
et les membres. Les scores seront modifiés après 
la bataille en cours. Un chiffre rouge indique que des 
points viennent d'être gagnés, alors qu'un chiffre bleu 
indique une perte de points. 

Résurrection : si les deux équipes sont incapables de déterminer le gagnant, un membre de chaque équipe sera alors ressuscité au bout de 60 secondes. 

Lieu de résurrection : une fois le compte-à-rebours terminé, les membres des deux équipes seront téléportés au point de résurrection. 

En cas d'égalité, l'équipe ayant le plus de membres remporte la manche. Si les deux équipes ont le même nombre de membres, le gagnant est tiré au sort.|
