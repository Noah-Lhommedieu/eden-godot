7064|(Fantôme) Dascha Adwin : Rappelez-vous, vous travaillez pour moi à présent ! Pas seulement comme Officier Interne, mais aussi comme assassin ! |
7065|Liarro : Kzéna, arrêtez-les ! Il me faut plus de temps ! |
