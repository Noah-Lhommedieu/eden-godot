8357|Astuces :
1. Quand une équipe est formée, seul le meneur peut cliquer pour accéder au donjon.
2. Vous entrerez automatiquement dès que tous les membres sont prêts.
3. Le nombre de membres est comptabilisé à la première entrée. Toute sortie ou entrée ultérieure ne compte pas.
4.  Vous avez pour mission de vaincre le Noyau des Merveilles.
5.  Votre performance sera évaluée en fonction du nombre de défis relevés. Le rang obtenu détermine le nombre de récompenses.
6.  Vous serez classé en fonction du nombre d'espèces de monstres tués, du nombre de morts dans l'équipe, du temps de jeu et du total de victimes.
7. Échelle de classement (du plus élevé au plus faible) : S+, S, A+, A, B+, B, C+ et C.
8. Notez que l'évaluation de votre performance aura lieu 3 heures après votre entrée dans le donjon, que vous ayez terminé ou non.|
8358|Classement de l'Illusion Destructrice et récompenses :
1. Vous serez classé en fonction du nombre d'espèces de monstres tués, du nombre de morts dans l'équipe, du temps de jeu et du total de victimes.
2. Classement (du plus élevé au plus faible) : S+, S, A+, A, B+, B, C+ et C.
3. Nombre de récompenses par rang :
 *S+ : 3
 *S : 2
 *A+ : 2
 *A : 1
 *B+ : 1
 *B ou moins : aucune récompense. Tâchez de faire mieux la prochaine fois.
4.  Si vous ne choisissez pas vos récompenses dans les 5 minutes après l'annonce des résultats, le système le fera pour vous.
5.  Les récompenses seront envoyées sur votre messagerie.|
