6900|Dascha Adwin : Mais qui voilà ? Le Gardien Éternel ! Je savais que vous finiriez par vous montrer. 
Vous avez envie de mourir ? |
6901|Dascha Adwin : Vous auriez pu m'arrêter si vous étiez arrivé juste un poil plus tôt. 
Mais maintenant, vous ne pouvez plus rien. |
6902|Dascha Adwin : L'énergie ici est pure et forte. Bien que remonter le temps va nécessiter 
beaucoup d'énergie, j'en ai assez tout de même pour vous tuer. |
6903|Dascha Adwin : Depuis le début, votre stupide sens de la justice vous égare 
et vous met sur mon chemin. Gardien Éternel, votre aventure touche à sa fin. Je me demande comment 
je vais disposer de vous avant de vous saigner à blanc. |
6904|Dascha Adwin : Je crois que j'ai une idée ! Vous et votre bande de bien-pensants ont éliminé tant de 
mes guerriers sur votre chemin, je crois que ce n'est que justice que de les voir 
vous terrasser une bonne fois pour toute. Ce n'est peut-être pas très juste, mais la revanche est un plat qui se mange froid. |
6905|Dascha Adwin : Tuez cet impudent ! Si vous n'arrivez même pas à vous débarrasser de lui, vous ne servez à rien ! |
6906|Dascha Adwin : Mourez ! Je n'ai pas toute la journée ! J'ai encore un massacre, puis après j'ai piscine ! |
6907|Dascha Adwin : Ha ! Encore un rebut.|
6908|Après vous être débarrassé des servants du Prince du Fléau, vous fixez Dascha Adwin, 
qui vous rend votre regard. Il ne compte pas abandonner. |
6909|Dascha Adwin : Vous pensez vraiment sortir de là vivant ? Tout ce que vous avez fait est de vous débarrasser de 
la piétaille. Ce n'est que le début. |
6910|Dascha Adwin : Allez au diable !|
6911|Dascha Adwin libère une incroyable vague d'énergie destructrice sur vous. 
Vous résistez de toutes vos forces. Le Pouvoir éternel en vous 
s'est transformé en puissant bouclier. |
6912|Dascha Adwin : Abandonnez ! Vous ne faites pas le poids face au Pouvoir du Monde Céleste que j'ai absorbé à Iyernafalo !|
6913|Dascha Adwin : J'ai peine à croire qu'un être aussi faible ait pu contrecarrer tant de nos plans. 
Vous n'êtes rien ! Je pourrais vous écraser comme une brindille. |
6914|Les Ténèbres vous étouffent. Vous avez du mal à respirer à cause de la pression. 
Vous frissonnez, votre esprit cherche un moyen de s'échapper de cette emprise 
mais une étrange sensation d'impuissance s'insinue en vous. |
6915|Dascha Adwin s'approche lentement de vous, un effroyable rictus sur son visage. 
« Enfin ! J'ai vaincu le Gardien Éternel ! Bientôt, vous amis connaîtront 
le même sort. Le temps de la Destruction est de nouveau venu ! » |
6916|Dascha Adwin : N'espérez pas une mort rapide, Gardien Éternel. Vous allez d'abord souffrir mille maux. Vous allez être 
embroché sur un gril tournant lentement sur les flammes de l'enfer et des cloques se formeront sur votre peau. Vous vous repentirez 
pour ce que vous avez fait, mais cela n'abrégera pas vos souffrances pour autant. |
6917|Dascha Adwin : Adieu, Gardien Éternel. Je ne peux pas dire que cela me désole de ne plus vous revoir. |
6918|« Non ! crie soudain Lucien, Je ne vous laisserai pas faire ! » 
Un rayon de lumière noire poignarde Dascha Adwin. |
6919|Dascha Adwin : Non !!! Ce n'est pas possible, pas vous ! Allez au Diable !|
6920|Lucien : Vous d'abord.|
6921|Dascha Adwin : J'ai vaincu le Gardien Éternel ! Vous ne pouvez pas m'arrêter !|
6922|Lucien se tourne vers vous et esquisse un sourire. 
« Adieu, Gardien Éternel. » |
6923|« Non !!! » hurle Dascha Adwin. Le rugissement du Prince du Fléau résonne dans le vide, mais malgré ses efforts, 
il est avalé avec Lucien dans un trou noir apparu au centre de la pièce. |
6924|Vous vous tenez là, tremblant. Tout votre corps vous fait souffrir suite au combat mais votre esprit en entier pense à 
ce qu'il vient de se passer. Alors que vous regardez les portes de l'Enfer qui ont avalées à la fois votre allié 
et votre ennemi, vous apercevez l'épée de Lucien, enveloppé de brouillard gris. |
