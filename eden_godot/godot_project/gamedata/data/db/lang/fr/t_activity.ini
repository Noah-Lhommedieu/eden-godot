247|Fête de la bière I|La Fête de la bière va bientôt commencer ! Comme toujours avant le début du festival, les brasseries ont beaucoup à faire avec toutes ces commandes et cette bière à mettre en fût et en bouteille... Autant dire que tout ce travail, ce n'est pas une sinécure !

 Il y a peu de temps, une brasserie de renom a fait une annonce très importante : la <Fille du Brasseur> Hibala va bientôt prendre la relève de son père, le <Riche Brasseur> Himilu. Depuis, la jeune fille est très nerveuse.

 Elle a compris les rudiments de la gestion d'une entreprise et du brassage mais il reste encore beaucoup à faire. En plus, le <Le boubloneur> Kriekegaard a puisé dans les stocks de bière lors de son passage à Aven, causant de nombreuses plaintes de la part des clients. Elle aurait vraiment besoin de l'aide des Gardiens Éternels pour s'en sortir !|Fête de la bière I

