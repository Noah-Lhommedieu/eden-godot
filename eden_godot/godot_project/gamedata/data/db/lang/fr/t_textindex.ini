7154|Instructions Boîte Mystique

?Présentation Rapide

 1. Zone de placement du matériau : en effectuant la fusion, clic droit
       sur un objet de votre Sac à dos pour l'ajouter ou l'enlever.
 2. Aperçu Formule : affiche toutes les formules. Lorsque les matériaux sont
       dans la zone de placement, l'aperçu sera automatiquement
       trié pour afficher uniquement les formules possibles. Le produit ne
       pourra pas être amélioré, serti
        ou enchanté.
 3. Objet Spécial : ajoutez un objet de la série Lumière Divine pour augmenter les chances de réussite.
 4. Contenu Formule : choisissez une formule de la liste
       pour afficher son contenu.
       Si elle contient plus de 8 matériaux principaux ou types de produits,
       cliquez sur le bouton Voir tout
       pour voir tous les objets.
 5. Réactiver : quand un des matériaux listés peut être utilisé plusieurs fois,
       vous pouvez utiliser la fonction Réactiver
       pour l'ajouter automatiquement.

?Présentation des fonctions

 1. Amélioration Fusion : fusionnez plusieurs objets pour faire des objets plus puissants.
 2. Ré-identification permet de voir les nouvelles capacités d'un objet.
 3. Transformation Costume : permet de transformer un objet en un autre.
 4. Démontage : démonte un objet en divers matériaux.
 5. Formule Mystérieuse : une formule qui apparaît seulement dans certaines conditions.|
