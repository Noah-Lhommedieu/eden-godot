*Sur le Champ de Bataille T.4, l'ennemi est partout. Vous pouvez former des groupes, mais
 cela ne vous empêche pas de vous en prendre à votre propre équipe.

*Remportez 5 combats et obtenez 1 Point de Prestige.

*Les joueurs seront classés selon le nombre de combats gagnés et de Points de Prestige remportés. Les prix
 seront attribués selon le nombre de combats gagnés, de Points de Prestige remportés et selon le niveau du personnage.

*Le Boss devient plus fort à chaque niveau mais laissera de meilleurs objets.|
