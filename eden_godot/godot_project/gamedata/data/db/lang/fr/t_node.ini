par là ressent cette énergie résonner en lui. Ce pouvoir 
permet au Gardien Éternel de se concentrer uniquement sur l'entraînement. Les facteurs extérieurs ne 
le distrayant pas. ||||||||||Terres Secrètes Sacrées |
42|Bill's Training Facility|Parkour expert Bill's training course features specialized rough terrain and complex obstacles. A great deal of work went into creating this place.

Years ago, Master Bill met
a girl with impressive skills; this young lady's swift and agile moves made him consider taking on a pupil. She told him her name was Yuanron, and after Master Bill exhibited his superlative parkour techniques, Yuanron declared her willingness to study alongside him.

Yuanron's talents grew each day; she eagerly soaked up the Master's knowledge. Bill created this facility to help her continue to hone her skills.||||||||||This specialized venue was built entirely from heavy, durable metal.|
43|Braider Army Base|After the Nation of Knights, Braider, seceded from the Valencia Union and declared war on the Toroto Empire,
a troop of heavily armed soldiers immediately
gathered under the rule of King Molman.

Prince Columbia and
Princess Paisha led these brutal forces through the Union Pathway along the Eloise Plains. The troops hoped to break through the Lion's Fort and make their way toward the Toroto Empire.

Before the king ordered the strike, the Braider army temporarily set up near the outpost. The generals and commanders discussed tactics within a large tent. One can still see high level military officers milling about at all hours of the day.||||||||||Braider Military Council Tent|
44|Tente 2||||||||||||
45|Tunnel de l'Union de Valence|Dans les Hautes-terres se dresse le Fort du Lion, avant-poste fortifié occupé par 
l'Union de Valence. De sinistres soldats y montent la garde en permanence. 

Derrière l'imposant portail de métal, un tunnel sinueux et oppressant s'enfonce 
sous la montagne. Des épines couvrent les parois de ce passage étroit, rendant la traversée 
difficile (et douloureuse). 

Il assure la connexion entre les Plaines d'Elos et les Hautes-terres. Aussi, toute armée souhaitant 
envahir les terres de l'Union de Valence doit l'emprunter. Bien que la force de l'Empire Heldentod 
soit reconnue de tous, son armée n'a jamais 
réussi à traverser le tunnel. ||||||||||Il est essentiellement emprunté par l'Union de Valence et le Royaume de Braider pour mobiliser des troupes.|
46|Profondeurs du Mont Gowen|Au cœur des Plaines d'Elos sillonne une route militaire 
pavée de marbre qui tranche avec 
les magnifiques paysages naturels qui s'étendent à perte de vue. 

La Chaîne du Mont Gowen entoure les Plaines d'Elos ; aussi le Royaume 
de Braider y a placé des postes de contrôle à des endroits stratégiques pour piéger tout adversaire qui tenterait 
une traversée. 

Cette chaîne de montagnes abrite également des grottes et cavités naturelles. 
Nombre d'aventuriers ont tenté d'explorer ces nombreuses cavernes, 
mais personne n'a encore réussi cet exploit. ||||||||||Grotte des Rebelles|
47|Faubourg Populaire de la Marina d'Edouard|Les rues sinueuses de la Marina d'Edouard peuvent être divisées en trois zones : 
Le Faubourg Populaire, où vivent les petites gens ; les Quartiers de la Haute Société, 
où résident les bourgeois et citoyens de haut rang ; et enfin le Domaine de la Noblesse, où 
logent les membres de la famille royale et les politiciens. 

Des motivations d'ordre pratique ont façonné le Faubourg Populaire. Les habitations de petite taille 
sont collées les unes aux autres et les étals des marchands occupent 
le moindre espace disponible, rendant l'endroit extrêmement dense. 

Toutefois, depuis que les habitants ont fui les lieux, le quartier 
a des allures de ville fantôme que seuls quelques chats de gouttière viennent animer de temps à autre. La Princesse Païsha 
compte utiliser ce quartier pour organiser des réunions clandestines afin de débusquer 
le Sorcier Barbare. ||||||||||Base Secrète de Païsha|
48|Domaine de la Noblesse de la Marina d'Edouard|Les rues sinueuses de la Marina d'Edouard peuvent être divisées en trois zones : 
Le Faubourg Populaire, où vivent les petites gens ; les Quartiers de la Haute Société, 
où résident les bourgeois et citoyens de haut rang ; et enfin le Domaine de la Noblesse, où 
logent les membres de la famille royale et les politiciens. 

Le Domaine de la Noblesse abrite les manoirs de politiciens influents. Tous possèdent 
jardins, pavillons, fontaines et même 
éléphants domestiques ! Posséder l'un de ces animaux est un symbole 
de réussite sociale. 

La plupart des habitants des Quartiers de la Haute Société ont fui il y a déjà un moment. Le Prince Colombin 
a élu domicile dans l'un des manoirs alors qu'il tente de débusquer le Sorcier Barbare. ||||||||||Base Secrète de Colombin|
49|Congrès de Braider|Les rues sinueuses de la Marina d'Edouard peuvent être divisées en trois zones : 
Le Faubourg Populaire, où vivent les petites gens ; les Quartiers de la Haute Société, 
où résident les bourgeois et citoyens de haut rang ; et enfin le Domaine de la Noblesse, où 
logent les membres de la famille royale et les politiciens. 

Autrefois rattaché au corps exécutif de Braider, le Congrès 
se situe sur les hauteurs de la Marina d'Edouard. Néanmoins, depuis l'évacuation du palais, 
la gouvernance n'est plus assurée et l'ombre de l'anarchie 
se fait de plus en plus menaçante. ||||||||||Conseil d'État|
50|Tour Kahlo|Les armoiries du Royaume Durango habillent les murs 
de la Chambre du Congrès du Palais Magique aux côtés de fresques 
 qui représentent d'envoûtants paysages du Continent du Centre. 

Un atrium abrite également un jardin luxuriant et offre une vue imprenable sur la ville et l'horizon. 
Nuit et jour, il est bercé par la lumière orange d'un Cristal magique. Cette pierre semble 
irradier davantage encore quand les ténèbres s'installent. 

La Chambre du Congrès du Royaume Durango est une structure recouverte 
par un dôme de verre. Pendant la nuit, la lumière de la lune et des étoiles inonde la pièce et lui donne 
des reflets éthérés. Bien que le temps ait laissé sa marque, il est encore 
possible d'imaginer la beauté des lieux pendant l'âge d'or du royaume. ||||||||||Chambre du Congrès du Palais Magique|
51|Dôme Céleste|Le magnifique Arbre de Vie se trouve sous le Dôme Céleste depuis une éternité.
De l'eau de source traverse ses puissantes racines, purifiant la Terre.
C'est la source de vie d'innombrables espèces vivant sous le dôme.

De nombreuses plantes extraordinaires poussent dans la Forêt Mashfu, au sud-est.
La forêt baigne dans une lumière bleue éthérée émise par des fleurs stupéfiantes,
conférant au décor un aspect irréel.

Ce paysage fantastique attire de nombreux voyageurs
au camp Juya au sud-ouest. De là, ils peuvent admirer la magnificence de l'Arbre de Vie et les merveilles de
la Forêt Mashfu.|Tribu Orphidée|Terre sacrée de Kamodo (DJN)|Camp Juya|Forêt Mashfu|Quartier de la Vieille statue|Jardins||||Le lieu de naissance de l'Arbre de Vie|
52|Hauteurs Feudegivre|Les Hauteurs Feudegivre sont sont si extraordinaires qu'elles en sont presque irréelles.
Les terres du Nord sont entourées de volcans alors que le Sud endurent des hivers rigoureux.
Il peut y faire un froid de canard comme y régner une chaleur étouffante.

Des fumerolles géantes constellent le paysage volcanique et des éruptions apparaissent régulièrement des crevasses et des cheminées.
Il y règne une atmosphère brûlante
dans laquelle nulle plante ne peut survivre.

Le paysage polaire est recouvert de neiges éternelles.
C'est comme si un secret millénaire était enfoui sous cette étendue infinie de neige
.|Flammeville|Village Gardar|Temple aquatique|Autel du Dieu du feu|Vallée gelée|||||Royaume de l'aberration|
53|Meeryasha|Meeryasha est une cité antique régie par l'Alchimie
mais, pour une raison inconnue, elle a été oubliée et nul ne connaît son existence.
Il doit probablement y avoir quelque trésor enterré.

La cité est entourée de murailles qui la protègent des invasions de démons.
Au centre se trouve le bâtiment du gouvernement de Grey Lynn.
Cette cité resplendissante garde un caractère mystérieux.

Meeryasha trône au milieu d'une nature préservée, un océan de verdure à perte de vue
et le village Mercura, dans la partie nord-est, est telle
Shangri-La, la cité de légende.|Grey Lynn (DJN)|Labo Antigravité (DJN)|Village Mercura|Eaux peu profondes|Crevasse de sable|Bataille Spatiotemporelle||||Cité d'Alchimie perdue|
54|Jungle Mayland|La Jungle Mayland est un paradis pour toutes les créatures sauvages qui y vivent. 
De l'eau de source pure coule depuis la Vallée Batelo et irrigue toute la jungle. 
Les animaux y puisent tout ce dont ils ont besoin pour se développer et se renforcer. 

De nombreux arbres près de la plage au nord-est ont été coupés par les troupes d'Heldentod et 
l'Union de Valence. L'armée a également aménagé un espace 
et construit un campement. 

Le Mur de Pathos au sud-ouest de la Jungle Mayland a 
été endommagé par une explosion mais reste suffisamment solide. On raconte qu'une mystérieuse force garde ce mur.|Campement d'Heldentod |Campement de Valence |Mur de Pathos|Puits explosif|Forêt Tropicale|Vallée Batelo (DJN)||||Une forêt primaire contenant des ressources en abondance.|
55|Bassin Shaxia|Ce bassin porte le nom de la seule tribu qui y réside. 
De nombreux animaux et plantes sauvages peuplent ce bassin. Depuis des temps reculés, la tribu qui y vit 
n'a eu que peu de contacts avec le monde extérieur. Ce peuple a adopté un système tribal très rigoureux. 

Le côté ouest du bassin est surélevé par rapport au côté ouest. C'est pourquoi 
les montagnes à l'ouest comportent de somptueuses cascades qui 
déversent l'eau dans les lacs à l'ouest. Le Lac Égéen est un des plus connus car son eau a une couleur bien particulière. 

Allolans, au sud-est du Bassin Shaxia, est son point culminant. 
Un temple y a été construit pour faire des offrandes et des sacrifices aux dieux. Les membres de la tribu de Shaxia habitent 
autour du temple, selon leur rang social. Ceux des classes inférieures résident dans la partie basse de la zone.|Faubourg Populaire|Terrain d'Entraînement|Lac Égéen|Quartier des Aînés|Ferme|Allolans (DJN)||||Tribu isolée|
93|Errea|Errea appartient au monde parallèle d'Aven. Les deux cités 
possèdent les mêmes bâtiments. Cependant, la nuit ne tombe jamais sur Errea. 
 

De nombreux vagabonds traînent dans les rues, ne sachant pas 
comment ils sont arrivés là, ni comment en partir. 
Depuis que le Gardien Éternel est entré dans la ville, le temps 
et l'espace ont commencé à changer.|Hôtel de Ville|Tribunal|Salle des chevaliers du Temple|Pavillon Industriel||||||Un monde parallèle dans la Faille temporelle.|
94|Aven rêvée|Aven, cité magnifique située au milieu d'un lac, est totalement dévoyée 
à la religion. La ville est constituée de bâtiments blancs d'immenses cristaux bleus. 
Les habitants d'Aven sont en paix avec le monde. 

L'unique bibliothèque de l'Église se trouve à Aven. On peut trouver dans cette bibliothèque de nombreux ouvrages 
tels que des bibliographies, différents auteurs, nouvelles, etc. 
Personne ne peut prétendre avoir lu tous les livres qui s'y trouvent. 

La religion joue un rôle important à Aven. La forte influence de la religion
a épargné à la ville de nombreuses querelles et en a fait 
la seule ville neutre du monde. Le souverain actuel d'Aven est Rossie XII, 
pape de la Curie Métérole.|Hôtel de Ville|Tribunal|Salle des chevaliers du Temple|Pavillon Industriel||||||Un monde parallèle dans la Faille temporelle.|
95|Vieil Entrepôt|||||||||||Un entrepôt à l'écart.|
96|Île aux Cerisiers|L'Île de Sakura est un endroit prisé par les touristes.
Elle regorge de cerisiers, offrant un paysage enchanteur lorsqu'ils fleurissent.
Le Festival de la Déesse aux fleurs qui y a lieu tous les ans est très réputé.

Pendant ce festival, la nature est à l'honneur et l'île est très animée.
Le point culminant de ce festival est sa parade. Les touristes comme les habitants adorent
la parade, les festivités et les installations.

Détendez-vous au milieu des cerisiers, sentez la caresse du vent et des
pétales de cerisier qui parfument l'air et appréciez l'atmosphère unique qui y règne.
Votre cœur et votre corps seront apaisés.||||||||||Flower God Festival|
97|Île du Mariage|Cette île naturelle située dans une mer d'un bleu d'azur est magnifique en toute saison.
Une légère brise souffle sur une plage de sable blanc et les coquillages exotiques parachèvent le décor romantique.
Contrairement à l'agitation de la ville, cet endroit ne résonne que des sons de la nature.

Le chemin du bonheur bordé de cyprès conduit les jeunes mariés vers un bel avenir.
La lumière des bougies éclaire les branches des cocotiers, symbolisant une force vitale unique.
Les nappes roses démontrent un grand souci du détail.

Une lumière douce et les vitraux font ressortir la douce chaleur ainsi que l'atmosphère solennel de la chapelle.
C'est l'endroit le plus romantique que l'on puisse imaginer pour célébrer une union.
Des ballons en forme de cœur flottant dans les airs
symbolisent l'amour des jeunes mariés.|Aéronef|Côte des Vœux du Mariage|Chapelle|Réception de mariage||||||Île de rêve pour se marier|
98|Arena Dungeon Place Holder||||||||||||
99|Création de Personnage||S'inscrire||||||||||
100|Mine Andrew|Cette modeste mine est celle qui est la plus proche du Village Andrew. Récemment, de 
surprenants cristaux bleus d'une grande pureté y ont été trouvés. Ils ont rendu le village 
célèbre du jour au lendemain, ou presque.



Maintes légendes courent à propos ces cristaux. On dit que le Contremaître de la Mine, Laz,
a découvert un magnifique Cristal Bleu qui renfermait un enfant en son sein ! 
On dit que cet enfant peut changer le cours de l'Histoire...
||||||||||Le Chercheur du Cristal Bleu|
101|Carrière Angor|Construite autour de la première veine de minerai trouvée dans les Monts Calcaires, 
cette mine est la plus vieille de l'histoire locale. Elle a été le terrain de jeu et éventuellement 
le lieu de travail de centaines de villageois d'Andrew.

Cependant, les créatures qui vivaient près de la mine sont devenues agressives. Les mineurs se sont 
défendus, mais les créatures devinrent de plus en plus monstrueuses. Ainsi, les hommes en perdirent le contrôle. 
La mine est maintenant complètement envahie et inutilisable.||||||||||Profondeurs Obscures|
102|Fort Verdure|Un vieux fort se dresse au fin fond de la Colline Tranquille. Ce fort, oublié, avait été construit 
par les premiers immigrants pour se défendre contre les attaques extérieures. Avec l'expansion 
de la Colline Tranquille, la menace a disparu et le fort est tombé à l'abandon.

Un jour, un membre du Gang des Aigles a trouvé le fort abandonné. Le gang a alors réaménagé 
le bâtiment et accroché une bannière représentant un aigle, affirmant ainsi qu'ils prenaient possession des lieux.||||||||||Une Forteresse Défaite|
103|Canal Tassos|Un vieux tunnel traverse la Forêt Arc-en-ciel. Ses origines sont un mystère. Cependant, 
ses nombreuses entrées et sorties en font plus un labyrinthe qu'un passage.

Le tunnel a été condamné à cause des dangers que représente exploration. On dit aussi 
qu'une force incroyable, assez puissante pour transformer toute la faune et la flore de la forêt, 
y est dissimulée. Le Gang du Marais Noir s'est juré d'obtenir cette force, par n'importe quel moyen.||||||||||Naissance d'une Légende|
104|Caverne de Schiste|La Caverne de Schiste, en ruine depuis des siècles, est cachée sous un vaste désert et renferme 
d'antiques technologies. Les scientifiques l'ont cherchée pendant des années, sans succès, jusqu'à 
ce qu'un événement géologique ouvre une fissure y menant.

Au cœur de cette civilisation légendaire, les scientifiques ont découvert des machines qui fonctionnent 
de manière automatique et un garde devenu fou. Un scientifique nommé Nikola est parti mener son enquête, 
mais il est tombé dans un grand danger...||||||||||Reliques d'une Race Antique|
105|Éroda|Éroda, la plus profonde caverne des Monts Arides, est jonchée de fragments d'os. Les animaux 
fuient cet endroit, l'air sent l'humidité et le rance. Des griffes ont laissé des traces sur les murs.

Les Cenanas croient qu'il s'agit de la tombe d'un dragon responsable d'un cataclysme il y a des 
siècles de cela. Le Gang de la Griffe Dorée, lui, croit que la caverne renferme des trésors et ils 
montent une expédition pour les trouver.||||||||||L'Antre du Dragon|
106|Morticora|Près de la Baie Bélouga, les bois sont si épais que les frondaisons bloquent le soleil. L'humidité 
et la brume constantes en font un parfait habitat pour les moules et les champignons.

Les voyageurs sont souvent assaillis par des esprits malins dans les bois. Les spectres se délectent 
de ce climat froid et humide et ils ont apprivoisé de nombreuses créatures vénéneuses. Ce mal 
grandissant menace désormais les habitants du Port Bélouga.||||||||||Base Arboricole|
107|Racine Branda|La Racine Branda se trouve sous un vieil arbre près d'un marais primordial. Les feuilles, branches 
et racines de cet arbre imposant fournissent toute la nourriture et la protection nécessaires aux créatures pour survivre.

La Racine Branda elle-même est devenue une part importante de l'écologie locale après avoir 
absorbé de l'eau magique et être devenue magique elle-même. Des gardes ont prêté serment à vie 
de la protéger contre le mal pendant des générations.||||||||||Un Vieux Tronc Noueux|
108|Palais des Malices|Cet ancien palais a presque entièrement sombré dans le sol et est maintenant recouvert de couches 
de lichen et de lianes. Il est presque impossible d'en trouver l'entrée.

Un puissant mage y vivait autrefois. Il a étudié avec tant d'ardeur qu'il en serait mort. On dit que 
son fantôme est toujours là. Ses recherches ne connaissent pas de fin et le mage emplit le palais 
d'un désespoir si puissant qu'il peut rendre fou les faibles d'esprit.||||||||||Consumé par l'Ambition|
109|Pourriture|Berceau d'insectes monstrueux, la Pourriture a également empoisonné les eaux de la Vallée des Rois. 
La puanteur de la pollution emplit l'air. Les plantes ont absorbé l'eau toxique et sont devenues elles-mêmes 
vénéneuses, mettant encore plus en danger l'écologie locale.

Des oeufs en forme de pustules s'alignent à l'entrée de la ruche, maintenus par un mucus gluant. 
Les pupes se nourrissent frénétiquement lorsqu'elles éclosent, ne laissant pas grand-chose aux autres créatures.
||||||||||Une Antre Méphitique|
110|Abîme de Baram|Le Volcan Avila a creusé une gorge profonde dans une imposante falaise. De là irradient chaleur et 
pouvoir. Les Tuskars croient que la brèche mène au Cristal Enflammé qui garde le volcan.

Une rivière de lave coule à travers la gorge, entre d'immenses cristaux étincelants. La loi de la jungle 
prévaut ; seuls les animaux les plus forts y survivent...||||||||||Un Formidable Vide|
111|Coeur Baltaroï|Faite de solides briques, la capitale des Tuskars se situe près du cratère du volcan ; parfois, la lave 
bouillonnante se répand dans les rues.

Des statues de valeureux soldats Tuskars sont réparties dans toute la cité et leurs actes héroïques sont 
gravés dans la pierre. Les drapeaux accrochés symbolisent l'unité Tuskar. Cependant, des fanatiques religieux 
ont capturé la ville et manigancent : ils veulent faire rentrer le volcan en éruption.||||||||||La Capitale Occupée|
112|Rêve du Maire|Ce monde matérialise les cauchemars du Maire Réginald. Bien qu'il ait l'air doux et bénin à la surface, 
en dessous, le mal grouille, incarné par les innombrables monstres qui y rôdent.

Cette aura malveillante attend le bon moment pour tout engloutir et a déjà piégé l'âme de Reginald 
dans son propre rêve, afin qu'il ne se réveille jamais.||||||||||Dans l'Abîme|
113|Fléau|Des milliers de monstrueux insectes se cachent dans les Terres des Dunes Éternelles, prêts à tout dévorer. Ils proviennent 
d'une petite grotte qui est, on ne sait comment, reliée à une autre dimension.

Le Prince du Fléau a ouvert un portail interdimensionnel et contrôle les insectes grâce à sa puissante magie. 
Ainsi manipulés, les monstres sèment la destruction.||||||||||Le Portail Dimensionnel|
114|Chambre de Baïra|Le roi qui dirigeait autrefois le Royaume d'Amur fut enterré dans un glorieux mausolée dans le désert. 
Dans ses salles remplies de trésors, des totems proclament l'amour que son peuple lui vouait.

Ses restes étaient gardés depuis des siècles, jusqu'à ce que le Prince du Fléau corrompe les terres. 
Il a transformé les âmes pures du peuple de Dianack en une armée de goules à sa botte et a réveillé le roi mort, 
espérant ainsi conquérir le monde.||||||||||Tombe de l'Ancien Roi|
115|Crypticône|Les Ogres se réunissent au Geyser Étalia ; de celui-ci émanent des odeurs de soufre et de pourriture. 
De nombreuses bêtes venimeuses y pullulent et les sources chaudes maintiennent la température de la tanière, 
une atmosphère brûlante et humide.

Les Ogres sont une race étonnamment religieuse qui croit que le rouge est une couleur sacrée ; ils jettent du 
minerai de fer dans les sources chaudes avec force prières pour se porter chance. Quand le minerai colore l'eau 
en rouge, ils célèbrent l'évènement comme un miracle.||||||||||Le Contremaître Brisé|
116|Temple de Delphes|Cet ancien sanctuaire était le foyer des Pixies de la Forêt Putride. Avec le temps, il s'est enfoncé sous la forêt 
tropicale, enfermant les monstres à l'intérieur. Un projet de construction militaire impérial l'a ramené au grand 
jour et a réveillé les Pixies, qui luttent désormais pour s'échapper.

En explorant le sanctuaire afin d'en dévoiler ses secrets, les scientifiques l'ont abîmé par inadvertance. Il tombe 
en ruine et a peut-être perdu son pouvoir initial.||||||||||Cœur en Exil|
117|Veine Tordue|Cette mine profonde se trouve dans une zone volcanique. L'air y est chaud et saturé de gaz toxiques. 
La lave bouillonne partout, éclairant les tunnels d'une lueur pourpre.

Le Minerai Arc-en-ciel, un minéral rare que l'on ne trouve qu'ici, est extrêmement dur et brille comme un prisme. 
Il a une très grande valeur, ce qui a conduit le Magnat du Crime Stirling à s'emparer de la mine. 
Il projette d'en tirer beaucoup de profits.||||||||||Cendre et Paille|
118|Autel du Culte de Mara|Situé au fin fond du temple du Culte de Mara, cet autel est un site cérémonial crucial. Des totems en os rappellent 
que cette secte croit au pouvoir des sacrifices d'êtres vivants. Bien que pour eux les animaux soient acceptables, 
ils préfèrent immoler des humains.

Les villageois du Pic de Noireflamme détestent les fidèles du culte, mais ils sont trop effrayés pour les affronter. 
L'Autel sacré du Culte de Mara est l'endroit le plus lourdement gardé de toute la base.||||||||||Le Plaisir de Tuer|
119|Chutes des Âmes en Peine|Les Chutes des Âmes en Peine sont sacrées pour les Bonmalmors car c'est la dernière source d'eau pure des Marais Décrépits. L'eau de source tombe en cascadant joliment.

Des fleurs et plantes inhabituelles poussent en haut de la montagne ; toutes sont utiles à la médecine et à l'alchimie. Leur prix est élevé, car elles sont difficiles à cueillir et que le chemin vers le pic est ardu et grouille de monstres.||||||||||Terres de Pureté|
120|Vortek|Un tourbillon géant a surgi au centre du Marais de Galt. Les locaux pensent que le marais a été empoisonné, ce qui a rendu furieux Galt, le Dieu du Marais, et qu'alors il a créé le tourbillon.

Les gens croient que le vortex du tourbillon mène au palais de Galt, mais que le tourbillon en bloque l'accès. Un groupe d'inventeurs espère utiliser le sous-marin qu'ils ont construit pour en savoir plus.||||||||||Le Tourbillon Furieux|
121|Arsenal Fédéral|L'Arsenal se trouve près du Fort du Lion et c'est de là que proviennent toutes les armes utilisées par les soldats des environs. Ses murs hexagonaux sont solides et elle est gardée jour et nuit par des soldats.
Le seul moyen d'entrer ou de sortir des installations souterraines est une petite poterne. Tout le système hydraulique et électrique est géré de manière indépendante à la surface. La fédération utilise également cet endroit pour développer et améliorer ses armes.||||||||||Arsenal de Valence|
122|Sturmfrau|Une énergie instable flotte dans l'air du Clan des Sorcières.
Sturmfrau, localisé au centre des bois est le cœur du torrent d'énergie.||||||||||Arsenal de Valence (DJN 5 joueurs)|
123|Abysse Glacée de Skleros|Cette forteresse se dresse dans une solitude imposante, ses murs de glace craquelés 
témoignent d'un passé difficile.

Dans cette forteresse, se trouve un chemin menant à l'Abysse Glacée de Skleros, un étonnant monde 
souterrain de cryolite, un endroit oublié de beaucoup.  On craint que le pouvoir maléfique qui y est enfermé 
ne s'échappe un jour pour mettre notre monde à feu et à sang.

||||||||||Fort Militaire Perdu|
124|Cratère des Géants|Ce cratère, au nord-est de la Forêt Ensorcelée, procure de l'énergie 
pour toute la forêt. C'est le berceau de toute l'alchimie de la forêt 
et c'est là que se trouve le QG du Clan des Sorcières.

L'équipement d'alchimie et les données de recherche sont stockés dans le cratère.

Malheureusement, le Gang de la Main Noire a de terribles plans pour voler 
le secret du contrôle de l'énergie de la forêt.||||||||||Cœur d'Énergie Mystérieuse|
125|Antre des Échos|Une couche de neige cristalline recouvre la Forêt Givrée tout au long de l'année. Seuls les monstres
 les plus violents et vicieux peuvent survivre ici. La plupart vivent dans l'Antre des Échos, une grotte faite 
de piliers de cristal et d'une étincelante cascade figée sous une épaisse couche de glace.

La grotte résonne des grondements des tempêtes et vents violents. On pourrait 
mourir, juste en attendant un moment de silence dans l'antre.||||||||||Tanière de la Bête|
126|Sanctuaire du Mal à l'État Pur |||||||||||N/A|
127|Grotte de la Marée des Ombres |Au cœur de la Chaîne du Mont Gowen se niche une caverne froide et humide 
enchevêtrée de ronces. Le sol de la grotte est recouvert d'un tapis 
d'herbe et de végétaux variés assez drus pour servir de cachette aux forces rebelles. 

Un petit avant-poste garde l'entrée des lieux. En s'enfonçant un peu plus en avant dans le camp, 
il est possible de découvrir des habitations spacieuses. Bien qu'elles semblent relativement confortables, 
les os blanchis qui jonchent le sol donnent 
froid dans le dos. 

Plus loin encore, les hommes ont aménagé un accès menant 
dans les profondeurs de la grotte. Cependant, aucune activité humaine n'est à signaler au-delà, et 
seuls les rugissements de quelques créatures des ténèbres rompent parfois le silence. 
||||||||||Grotte des Rebelles (DJN Multijoueur) (Recommandé pour les groupes de 3-5 joueurs)|
129|Lieu du rituel (niv. 80 - Vérité et Illusion IV)|||||||||||Le lieu où se déroulent les rituels de prière.|
130|Orphidée|||||||||||Un pays chargé d'énergie spirituelle.|
