1|Rallumer la Lumière |L'île des Poussins est tombée sous le coup d'une horrible malédiction. Les Poussins sont devenus fous ! Ils sont partis vers le Continent du Centre et attaquent tout le monde. 

Les Poussins qui n'ont pas été touchés sont venus à Aven implorer votre aide. Ils vous supplient de ramener les Poussins à la raison et de contrer cette malédiction. 


|<Rallumer la Lumière> 
Pendant cet Event, à chaque fois que vous tuez un monstre de Nv. 14 ou plus dans la Forêt Arc-en-Ciel, il y a des chances qu'un Poussin Coloré apparaisse. 

Si vous le tuez, vous pouvez recevoir un Pouvoir Obscur ou un Coffre Maléfique. 

Acceptez la quête de l'Aîné Poussin et battez trois boss dans le donjon. Récoltez 50 Pouvoirs Obscurs pour terminer la quête. (Des joueurs de différents niveaux recevront différentes quêtes.) 

Récoltez 10 Pouvoirs Obscurs pour recevoir un buff bonus de la part du Roi Poussin, Scyther. 
Bénédiction de la Plume : EXP +20 % pendant 30 minutes. 
Bénédiction Aviaire : PC +10 % pendant 30 minutes. |
2|Cerveau Ramolli 
|L'île des Poussins est tombée sous le coup d'une horrible malédiction. Les Poussins sont devenus fous ! Ils sont partis vers le Continent du Centre et attaquent tout le monde.

Même le Roi Poussin Scyther a perdu la tête et sème la panique à Aven. L'Aîné Poussin Gagan vous implore de tout remettre en ordre. |<Cerveau Ramolli>

Le Roi Poussin Scyther apparaîtra toutes les trois heures au nord-est d'Aven. Obtenir <Coffre Maléfique>. |
3|Obtenir une Perle Purifiée |L'île des Poussins est tombée sous le coup d'une horrible malédiction. Les Poussins sont devenus fous ! Ils sont partis vers le Continent du Centre et attaquent tout le monde.

La rumeur dit que pour fabriquer une Perle Purifiée, il faut récolter de l'Énergie Purifiée. Ça semble être le seul moyen de libérer Scyther de la malédiction. L'Aîné Gagan compte sur vous ! |<Obtenir une Perle Purifiée> 

Échangez 3 Énergies Purifiées contre une Perle Purifiée à l'Aîné Poussin à Aven. 

Échangez 7 Perles Purifiées contre des Cornes de Dragon Blanc Délicates à l'Aîné Poussin. 

Vous trouverez de l'Énergie Purifiée dans les Coffres Maléfiques. |
4|Bonne Année ! |La Sorcière Gâteau ne sait plus où donner de la tête, elle voudrait que vous m'aidiez à rendre visite à quelques amis à Aven. |<Bonne Année ! >

Quête de la Sorcière Gâteau d'Aven. Allez voir le PNJ et battez 10 Gâteaux Magiques pour terminer la quête. 

Votre récompense, des Feux d'Artifice du Nouvel An d'Aven, ne peut être échangée et ne sera pas débitée. 

Lancez les feux d'artifice aux endroits désignés. 

Allez voir la Sorcière Gâteau pour participer à l'Event ! Cet Event sera réinitialisé tous les soirs à minuit. |
5|Messagère du Nouvel An |Dernière ligne droite avant la Nouvelle Année ! Malheureusement, le Marchand de Montures Ziglar a accidentellement renversé de la potion magique sur des gâteaux, les rendant vivants ! C'est la panique, ils détruisent tout sur leur passage ! 
 
La Sorcière Gâteau a demandé aux joueurs de l'aide pour battre les Gâteaux Magiques et ramener la paix sur Ezur. 
|<Info Event> 
Pendant cet Event, à chaque fois que vous tuez un monstre de Nv. 15 ou plus dans la Forêt Arc-en-Ciel, il y a des chances qu'un Gâteau Magique apparaisse. 

Après avoir vaincu le Gâteau Magique, vous pouvez recevoir un Pain de Riz Gluant Appétissant ou une Boîte de Gâteaux de Riz. 

Acceptez la quête de la Sorcière Gâteau et vainquez les boss de Vilrequin, des Ruines du Palais des Malices et de la Salle Ulta pour récolter 50 Pains de Riz Gluant Appétissant et terminer la quête. 

En récompense, la Sorcière Gâteau vous remettra un Certificat de Messager du Nouvel An. |
6|Attaque Pâtissière|Dernière ligne droite avant la Nouvelle Année ! Malheureusement, le Marchand de Montures Ziglar a accidentellement renversé de la potion magique sur des gâteaux, les rendant vivants ! C'est la panique, ils détruisent tout sur leur passage !

Aven est attaquée par des Gâteaux Magiques géants ! La Sorcière Gâteau a besoin de votre aide pour sauver la ville. |<Attaque Pâtissière>

<Croustillant dans le Lait> Riz Sismique apparaîtra toutes les trois heures au nord-est d'Aven. 

Boss passif. PV élevés et ATQ basse. 

Après avoir vaincu le monstre, vous recevrez une Boîte de Gâteaux de Riz. 

|
7|Pluie de Roses |Pour répandre l'amour dans le monde entier, je peux vous aider à fabriquer un objet spécial : un Bouquet de Roses. Si vous avez 10 Roses du Grand Amour, vous pouvez alors avouer votre amour à l'élu(e) de votre cœur. 

Pour éprouver votre patience et votre détermination, je vais vous donner 1 Rose du Grand Amour par jour. Au bout de 10 jours, vous aurez 10 roses et je saurai si votre cœur est pur et bon. |<Pluie de Roses>

Vous pouvez obtenir des Pétales de Rose sur les Épineurs Litigieux. 

Vous les trouverez dans les Monts Calcaires, à Colline Tranquille et dans la Vallée Feregal. 

Vous pouvez échanger 3 Pétales de Rose contre 1 Rose du Grand Amour. 

Vous ne pouvez faire cet échange qu'une fois par jour. 

Avec 10 Roses du Grand Amour, vous pouvez faire un bouquet. |
8|Monstre aux Yeux Verts |Le démon de la jalousie a envoyé ses serviteurs détruire l'amour dans le monde entier. Ces horribles démons peuvent se transformer en humains et s'en prendre aux amoureux. En tant que Gardien Éternel, vous êtes le seul à pouvoir arrêter ces abominables créatures. |<Monstre aux Yeux Verts>
Les monstres commenceront par prendre forme humaine et à rôder dans Aven. Une fois vaincu, le démon reprendra sa vraie forme et il vous faudra le battre à nouveau pour terminer la quête. 

Récoltez 20 Pétales de Rose et donnez-les à Erenkos Passio. Il vous donnera un pouvoir qui vous permettra de vaincre le monstre. 

<Orgueil> Vinski apparaîtra toutes les 6 heures à Aven (450, 525). 

<Bias> Kani apparaîtra toutes les 4 heures à Aven (450, 525). 

|
9|Attaque Sylvestre |Les villageois font la fête et sont moins vigilants, du coup un disciple du Prince du Fléau, un Arbre des Âmes Démoniaque, en a profité pour contrôler Grand-père Gel à coup de magie noire. 

Les Arbres des Âmes Démoniaques saccagent la ville et se sont emparés de la Graine de l'Arbre du Solstice de Grand-père Gel ! |<Attaque Sylvestre> 

Pendant l'Event, le Roi de l'Arbre des Âmes Démoniaque Sacrenfer apparaîtra toutes les trois heures.

Vous recevrez une belle récompense pour avoir vaincu le boss, elle vous sera envoyée par message. 

|
10|Arrêter l'Arbre des Âmes |Le Sapin de Noël devrait être là bientôt ! C'est aussi bientôt l'heure que le Père Noël donne sa bénédiction de Noël à la Graine de l'Arbre du Solstice, mais il y a quelque chose qui cloche cette année. 

Il y a quelques jours, le Roi de l'Arbre des Âmes Démoniaque est apparu en ville et a volé la Graine de l'Arbre du Solstice. Gardiens Éternels, aidez le Père Noël à le vaincre ! 
|<Arrêter l'Arbre des Âmes>

Pendant l'Event, des Arbres des Âmes Démoniaque peuvent apparaître quand vous tuez les monstres des Monts Calcaires et de la Colline Tranquille. 

Tuez l'Arbre des Âmes Démoniaque pour obtenir le Nœud de l'Arbre du Solstice. |
11|Moisson de Graines de l'Arbre du Solstice|Le Sapin de Noël devrait être là bientôt ! C'est aussi bientôt l'heure que le Père Noël donne sa bénédiction de Noël à la Graine de l'Arbre du Solstice, mais il y a quelque chose qui cloche cette année.

Il y a quelques jours, le Roi de l'Arbre des Âmes Démoniaque est apparu en ville et a volé la Graine de l'Arbre du Solstice. Gardiens Éternels, aidez le Père Noël à la ramener ! |Moisson de Graines de l'Arbre du Solstice

