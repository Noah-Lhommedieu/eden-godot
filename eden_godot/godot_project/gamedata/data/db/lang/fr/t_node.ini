198|Test Cottage : Océan |Votre résidence personnelle. Vous pouvez choisir comment 
la meubler. Vous pouvez partager cette base secrète 
avec votre moitié et vos amis. Vous pouvez également l'ouvrir aux autres. 

Il y a de nombreux moyens pour récupérer du mobilier. Vous pouvez par exemple 
organiser un banquet et inviter des gens. Un banquet de qualité peut, 
si c'est un succès, augmenter temporairement vos stats de combat 
et celles des participants. 

Si le maître des lieux sait recevoir et fait preuve d'hospitalité, une belle cabane 
récompensera son propriétaire. 

Il faut par contre absolument penser à payer son loyer 
dans les temps !||||||||||N/A|
199|Test Cottage : Chaleur |Votre résidence personnelle. Vous pouvez choisir comment 
la meubler. Vous pouvez partager cette base secrète 
avec votre moitié et vos amis. Vous pouvez également l'ouvrir aux autres. 

Il y a de nombreux moyens pour récupérer du mobilier. Vous pouvez par exemple 
organiser un banquet et inviter des gens. Un banquet de qualité peut, 
si c'est un succès, augmenter temporairement vos stats de combat 
et celles des participants. 

Si le maître des lieux sait recevoir et fait preuve d'hospitalité, une belle cabane 
récompensera son propriétaire. 

Il faut par contre absolument penser à payer son loyer 
dans les temps !||||||||||N/A|
201|Base des Vilrequins|La Base des Vilrequins est une crique naturelle de la Baie Bélouga. Les pirates ont investi beaucoup de temps et d'argent à perfectionner ce refuge.

Elle a été démolie durant une terrible bataille contre les Gardiens d'Eternal il y a des années. Le Chef des Pirates était furieux quand il a découvert sa base réduite en cendre. Il a tout de suite commencé à planifier la destruction des Gardiens d'Eternal et des habitants du Port Bélouga pour se venger.||||||||||Le Trésor Caché|
202|Salle Ulta|La Salle Ulta est un important palais de la Vallée des Rois, gardée par des Torturras. 
Le Gang Carmela a entendu dire qu'une épée sacrée y était cachée, mais ils n'ont pas réussi 
à la voler grâce aux héroïques efforts des Gardiens d'Eternal.

Cependant, le gang n'a pas l'intention de baisser les bras si facilement. Ils n'en ont plus seulement 
après l'épée, mais aussi après les gardiens sacrés qui protègent la salle, et qu'ils espèrent contrôler grâce à un charme maléfique.||||||||||La Lame Endormie|
203|Crocvenin|Le Fort du Gang Œil de Loup s'enorgueillit de plusieurs murs aussi solides que des montagnes.
 Au début, le gang se composait de jeunes hommes passionnés déterminés à aider les pauvres. 
Le temps a passé et le groupe s'est agrandi.

Même les plus nobles intentions peuvent se dégrader avec le temps. De nos jours, le Gang Œil de Loup 
a oublié ses buts initiaux. Ils lancent des raids et pillent, gangrénant cette tranquille prairie.||||||||||Vif Esprit|
204|Écarlate|Le fort a été construit sous la supervision du chef de la fière Tribu Dentsanglante, Ken. 
Il sert à emprisonner des esclaves et à construire. La dent géante à l'entrée est l'emblème de la tribu.

Le fort est empli de relents de sang et de mort et résonne des cris des esclaves. Les Ogres ne se fatiguent 
jamais de la guerre. En vue de préparer leur expansion, ils font tout pour faire de la Forêt de Delphes un enfer.||||||||||Avant-poste des Envahisseurs|
205|Siècle|Cette place forte s'élève au sommet du Pic de Noireflamme dans l'Empire Heldentod. La 
forteresse servait autrefois à loger des soldats d'élite commandés par le Général Néondo. 
Cependant, elle est tombée dans les mains du Culte de Mara après la découverte d'un totem maudit.

Aujourd'hui, la forteresse sert à la création de zombies. Les soldats sans âme qui en sortent s'attaquent 
à quiconque ose approcher, ce qui rend malaisées les investigations pour savoir ce qu'il s'y trame.||||||||||Forteresse du Chagrin|
206|Manoir|Situé sous le Fort du Lion, le Manoir est la prison des Hautes-terres. Valence y enferme 
les prisonniers de guerre et les criminels. Afin d'empêcher toute évasion, ses couloirs sont de vrais labyrinthes.

Bien qu'aucun prisonnier ne se soit jamais échappé, les prisonniers se mutinèrent pendant l'invasion de l'Empire 
Heldentod et tuèrent bon nombre de matons.||||||||||Une Folle Nuit d'Hiver|
207|Frontière de Basel|L'Empire Heldentod a commencé à faire des raids dans le territoire de l'Union de Valence. Au début, 
les soldats de l'Union parvenaient à les repousser, mais l'intensité et la fréquence des attaques 
les forcèrent à se retrancher dans un château à la frontière. 

La plupart des maisons environnantes fut détruite par les envahisseurs venus de l'Empire Heldentod. 
De nombreux civils furent tués et la politique de la terre brûlée fut appliquée. 
Les fumées noires qui s'élevaient renforçaient l'atmosphère apocalyptique. 

Bien que les défenseurs de Valence réussissent pour l'instant à garder la place forte, 
les provisions s'amenuisent. Si des renforts arrivent de leur côté, l'Empire Heldentod capturera le château : 
ce n'est qu'une question de temps.||||||||||Front de Guerre (DJN multijoueur) (3 à 5 joueurs)|
208|Prison Ossuaire |Heldentod s'est récemment emparé de cette région. C'était autrefois une prison valencienne mais elle abrite maintenant un ancien prisonnier qui travaille pour Heldentod. 

L'Empire a installé un labo dans une pièce au plus profond du bâtiment et y a développé une arme de destruction massive. Cette arme pourrait une causer une catastrophe pour les riverains et les troupes de Valence. 

Heldentod a capturé quelqu'un, l'a enfermé dans la pièce et prévoit de faire des expériences sur lui.
||||||||||Labo du Prisonnier (DJN Multijoueur) (Recommandé pour les groupes de 3-5 joueurs)|
209|Guillotine|C'est l'endroit sacré où vivent les Drakai dans la Vallée de la Mort, ils y mènent leurs cérémonies sacrées. 

Cet endroit sert aussi à punir les criminels, c'est pour ça qu'on l'appelle Guillotine. 

Après que l'Esprit Mauvais eut envahi cette zone, tous les pouvoirs magiques se sont éteints. On y trouve maintenant des esprits maléfiques et des monstres. Ils utilisent des Statues de la Destruction pour détruire l'atmosphère sacrée du site saint. 
||||||||||Cour Sacrée <Défi Mode Donjon> (Recommandé pour les groupes de 3-5 joueurs)|
210| Temple Spirenfer|Au milieu du Royaume Dévasté se dresse le Temple Spirenfer. Il était autrefois majestueux, mais il a perdu de sa gloire. Les colonnes sur les côtés sont enserrées par d'horribles vignes grimpantes qui semblent prêtes à avaler tout visiteur. 

Même si les ruines sont sinistres, il est évident que le temple était autrefois glorieux et vivant. Malheureusement, tout ce qu'il reste, ce sont de la poussière et des débris. 

Cette région a beau être presque totalement détruite et abandonnée, elle inspire la peur à quiconque s'en approche. 
||||||||||Temple Antique <Défi Mode Donjon> (Recommandé pour les groupes de 3-5 joueurs) |
211|Temple de la Rose|Le Premier Ministre d'Heldentod vit dans ce luxueux Temple de la Rose. 

Les murs sont incrustés de pierres précieuses, des fourrures recouvrent le sol et des richesses s'entassent dans tous les coins. D'ailleurs, les gens disent qu'il y a plus de trésors dans ces murs que de livres dans la Bibliothèque de la Curie. Nombreux sont les voleurs qui ont essayé de s'emparer de ces merveilles, mais le temple est hautement sécurisé et la plupart de ceux qui s'y sont risqué ont fini au cachot. 

Une rumeur raconte que le Premier Ministre possède une chambre secrète dans les profondeurs du temple. Personne ne sait si c'est vraiment vrai. 
||||||||||Résidence du Premier Ministre <Défi Mode Donjon> (Recommandé pour les groupes de 3-5 joueurs) |
212|Labo Vingot |La Tour Ferropierre se dresse dans les montagnes entourant la Vallée de Vulcain. 
Elle a été construite en alternant des couches de pierre et de fer. De son sommet, on peut tout voir dans la région. C'est un site très stratégique. 

Dans la tour se trouvent des centaines de cellules obscures, chacune attendant froidement d'accueillir un prisonnier. 
Une horrible odeur d'urine, de sueur et de désespoir remplit l'air, 
une seule bouffée peut faire vomir même le plus solide des estomacs. 
Le sol est recouvert d'énormes armes, de magma solidifié et de matériaux magiques. 

Tout ce qui se trouve ici est top secret. 
Même les chercheurs ne connaissent pas vraiment le véritable but de la tour. ||||||||||Labo de l'Armée Rebelle <Combat> |
213|Cap Hurlant|Vous trouverez cette route cachée près de la Falaise des Grands Vents. Chaque tronçon est plus dangereux que le précédent. 

La route est difficile à localiser, la plupart de la végétation de la région est flétrie, personne n'a envie de vivre dans le coin. 

Mais grâce à son emplacement, cette route est l'endroit parfait pour stationner les soldats en défense contre les attaques extérieures. 
||||||||||Forteresse Vigilante <Défi Mode Donjon> (Recommandé pour les groupes de 3-5 joueurs)|
214|Abysse de Siècle|C'était une importante forteresse de l'Empire Heldentod. Elle a été détruite et est devenue le repaire d'étranges monstres. 

Après que les guerriers eurent tué tous les monstres, personne n'a plus jamais voulu remettre les pieds dans les profondeurs de Siècle. Au fin fond de Siècle, c'est un endroit qui n'appartient plus au monde réel. Des murs brisés flottent dans les airs et la foudre s'abat sans cesse. 

Le Mal s'y est fait sa place, plus maléfique que jamais. Des démons venus tout droit des Enfers ont fait irruption. Ça ressemble à la fin du monde. ||||||||||Forteresse Démoniaque <Défi Mode Donjon> (Recommandé pour les groupes de 3-5 joueurs)|
215|Grotte Non Répertoriée|Un paradis caché dans la Vallée Brûlante. D'immenses vignes grimpantes forment un passage vers une magnifique grotte ornée de stalactites de pierres précieuses. Le soleil se reflète sur sa surface, lui donnant une étrange lueur arctique. C'est un endroit à absolument voir au moins d'une fois dans sa vie. 

Dans ce paradis, se trouve une chambre secrète qui renferme d'anciens manuscrits. Cette langue ancienne est très difficile à comprendre, mais les chercheurs savent que ces manuscrits renferment d'horribles vérités. 

Derrière une haute porte dorée se trouve une pièce vide entièrement peinte en blanc. Les lumières qui éclairent cet endroit lui donnent une atmosphère étrange et oppressante. 
||||||||||Région Désertique <Défi Mode Donjon> (Recommandé pour les groupes de 3-5 joueurs) |
216|Dimension Dévastée |Le Prince du Fléau a créé cette dimension, un espace purement maléfique, où l'odeur de la mort flotte dans l'air. Au-delà d'une haute muraille, se trouve un labyrinthe sans sortie et au passage souterrain plus que complexe. 

Ce royaume damné donne le jour aux abominations de la nature les plus étranges. 
Ils s'affrontent pour leur survie et les plus faibles sont dévorés. Leurs cris de douleur résonnent constamment à travers toute la dimension. 

Le Prince du Fléau est le roi dans cet endroit infernal. Il réside dans les ailes les plus reculées du palais. Si vous parvenez à naviguer au travers des passages et labyrinthes sans fins, vous pouvez le trouver. ||||||||||Dimension Démoniaque <Combat> |
217|Cratère Météoritique <Mode Multijoueur>|Un cratère immense défigure le paysage 
après qu'une météorite est entrée en collision avec la Terre. Le sol y est noirci et 
encore chaud. En son centre, une cavité invite ceux qui l'osent 
à partir à l'aventure. 

En-deçà gît une caverne lugubre. Des stalactites 
sont accrochées à la voûte de la grotte, 
tandis que des stalagmites entourent un gouffre sans fond. 

Les parois rocheuses sont quant à elles recouvertes de mousse à cause de l'humidité. Des milliers de chauves-souris 
ont élu domicile dans la Cavité aux Stalactites. La Chute de Cielmont 
constitue l'unique source de lumière de la caverne. ||||||||||Cavité Souterraine (DJN Multijoueur) (Recommandé pour les groupes de 3-5 joueurs)|
218|Tour Kahlo <Mode Multijoueur>|Les armoiries du Royaume Durango habillent les murs de la 
Chambre du Congrès du Palais Magique aux côtés de fresques 
qui représentent d'envoûtants paysages du Continent du Centre. 

Un atrium abrite également un jardin luxuriant et offre une vue imprenable sur la ville et l'horizon. 
Nuit et jour, il est bercé par la lumière orange d'un Cristal magique. Cette pierre semble 
irradier davantage encore quand les ténèbres s'installent.

La Chambre du Congrès du Royaume Durango est une structure recouverte 
par un dôme de verre. Pendant la nuit, la lumière de la lune et des étoiles inonde la pièce et lui donne 
des reflets éthérés. Bien que le temps ait laissé sa marque, il est encore 
possible d'imaginer la beauté des lieux pendant l'âge d'or du royaume. ||||||||||Palais Royal Durango (DJN Multijoueur) (Recommandé pour les groupes de 3-5 joueurs)|
219|Iyernafalo <Multijoueur>|Iyernafalo, plus communément connu sous le nom de Sanctuaire de Voléclat, 
s'élève au-dessus des brumes et surplombe les nuages. Cet imposant édifice est un chef-d'œuvre d'architecture dont 
les cristaux d'ornement, scintillant au crépuscule, émerveillent ceux qui posent leurs yeux dessus. 

La légende raconte qu'Iyernafalo renfermerait le pouvoir secret 
qui permet au Royaume Durango de flotter dans les airs. Le cristal magique 
incrusté au cœur de la structure brille d'une énergie indescriptible. 

Malheureusement, les forces du Prince du Fléau ont réussi à infiltrer Iyernafalo 
et ont pris le contrôle de ses gardes. Nul ne sait quel sort attend ce sanctuaire majestueux. ||||||||||Cité Céleste Royale (DJN Multijoueur) (Recommandé pour les groupes de 3-5 joueurs)|
220|Terre sacrée de Kamodo (multijoueur)|Le légendaire arbre de vie pousse au centre du Dôme Céleste
et la Tribu Orphidée, qui dépend de cet arbre pour vivre, organise un rituel de prières tous les 60 ans 
pour exprimer sa reconnaissance.

Il semblerait que l'Arbre de Vie réagisse à ces rituels, puisqu'il 
a tracé petit à petit un mystérieux passage menant à un endroit inconnu : 
la Terre sacrée de Kamodo.

L'Arbre de Vie communique avec la tribu
à travers les pensées et grâce à ce guide inattendu,
la tribu prospère.||||||||||La volonté de l'Arbre de Vie <DJN multijoueur> (de 3 à 5 joueurs)|
221|Temple aquatique <multijoueur>|Le Temple aquatique se trouve au milieu d'un lac qui ne gèle jamais, même avec des températures négatives. Tout le monde
pense que c'est une bénédiction du Dieu de la rivière
pour que la rivière puisse couler en tout temps et irriguer les terres.

Pour exprimer leur reconnaissance au Dieu de la rivière et le remercier de ce don,
ils ont construit au sud
le Temple aquatique.

Bâti avec de solides pierres, des statues de dieux ornent le vaste hall et des cascades jaillissent de toute part.
C'est le témoignage du respect et de l'admiration 
qu'ont les indigènes pour le dieu de la rivière.||||||||||Protection de la source des hautes terres <DJN multijoueur> (de 3 à 5 joueurs)|
222|Labo Antigravité <multijoueur>|Le gouvernement de Grey Lynn, pour mettre leur plan à exécution en secret,
a utilisé la tour de garde au nord comme couverture, construisant à son pied un labo secret d'Antigravité
d'où il opère désormais.

Des murs qui menacent de s'écrouler, des livres poussiéreux éparpillés et une entrée délabrée 
donnent l'impression que cet endroit est abandonné mais, caché au plus profond de ces ruines,
se déroulent d'effroyables recherches.

En plus de ces illusions, d'autres précautions ont été prises 
pour empêcher ces recherches d'être découvertes au grand jour : tout intrus est immédiatement capturé
et disparaît à jamais.||||||||||La vérité cachée <DJN multijoueur> (de 3 à 5 joueurs)|
223|Grey Lynn <multijoueur>|La majestueuse façade du bâtiment du gouvernement de Grey Lynn
cache en son sein une sombre vérité.
Peu sont au courant de ce qui se trame vraiment juste sous leur nez.

Un ascenseur s'enfonce dans les entrailles du bâtiment vers une installation souterraine
où le gouvernement effectue des projets classés top secret.
Cependant, l'accès à cet ascenseur est strictement réservé au personnel autorisé.

Pour protéger cet endroit de toute intrusion, il est
étroitement gardé. Le gouvernement a investi énormément d'argent dans des recherches qui pourraient détruire l'humanité...
Les recherches sont entrées dans leur phase finale.||||||||||Commencement et Fin <DJN multijoueur> (de 3 à 5 joueurs)|
224|Bataille Spatiotemporelle|Un mode parallèle et plus vieux que le nôtre d'un siècle. Des scientifiques ont démontré que 
L'Empire du Valtore a investi énormément de ressources dans l'étude de la magie et dans 
les applications militaires de celle-ci. Une guerre a été déclarée entre l'empire et la vieille Union, 

qui a vu de nombreux héros se distinguer. 
Trois nations furent engagées dans cette guerre de longue haleine et tous 
furent épuisés par cette guerre. 

Peu après que la tribu Kzéna s'est alliée avec l'Empire du Valtore, la vieille Union commença à perdre du terrain 
et la plupart des places fortes sur les hautes terres furent prises. Alors que l'Union était sur le point de perdre la guerre, 
un héros apparut.|Camp de l'Ancienne Fédération|Forteresse Valtore|Forteresse de l'Alliance Kzéna|Centre logistique Valtore|Centre de recherche sur l'alchimie|||||Cacophonie interdimensionnelle|
225|Vallée Batelo (Groupe)|La Vallée Batelo n'est accessible que par l'entrée sud-est de la Jungle Mayland. 
À peine entré dans la vallée, le voyageur est plongé dans un monde totalement à part. Dans la vallée, le ciel est sombre et rouge, 
les paysages de cette vallée sont uniques et l'atmosphère mystérieuse. 

Cette vallée est recouverte de prairie. La seule route qui la traverse est bordée 
d'arbres. Alors que le voyageur marchera sur la route, 
sa vue sera limitée par les feuilles et les branches.||||||||||Tanière du Descendant de la Bête divine (DJN multijoueur) (de 3 à 5 joueurs)|
