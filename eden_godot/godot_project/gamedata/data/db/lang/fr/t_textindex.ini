5367|Règles de Bataille de Territoire

Système de Points 
1. Selon leur contribution contre le Cristal d'Arène, les guildes participantes recevront entre 120 et 200 points. Si les ennemis battent le cristal occupé, les guildes occupées perdront leurs points au profit de leurs ennemis. 
2. Quand un joueur bat un joueur d'un camp adverse, ce joueur reçoit un point. 

Comment gagner
 1. À la fin de la bataille, la guilde avec le plus de cristaux gagne. 
2. Si plus d'une guilde a le même nombre de cristaux, la guilde avec le plus de points gagnera. 
3. Si les conditions 1 et 2 sont pareilles, la guilde avec le plus de Tués l'emporte. 
4. Si les conditions 1, 2 et 3 sont pareilles, le système déterminera le vainqueur au hasard.

Règles d'Occupation 
1. Une guilde ne peut envahir que 3 cartes. Si une guilde s'emparait d'une quatrième carte, elle serait alors donnée à la guilde n° 2. |
