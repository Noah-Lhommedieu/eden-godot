263|Défi du Démon Majeur|  De nouveau, les Gardiens Éternels ont repoussé les forces du mal qui menaçaient Aven et sauvé les habitants de la tyrannie des monstres. Mais les Démons n'ont pas dit leur dernier mot. Ils ont libéré un miasme, faisant des ravages dans toute la région.

  Afin d'empêcher que le miasme ne se répande, les prêtres d'Aven ont trouvé un moyen de le condenser et solidifier en Éclats démoniaques. Ils demandent aux Gardiens Éternels d'apporter ces Éclats dans le temple et de les fusionner pour matérialiser le Démon Majeur dans ce plan. Vaincre le Démon Majeur. |Défi du Démon Majeur

* Votre personnage doit être de Niv. 30 ou plus.

*Vous devez posséder la quantité d'Éclats démoniaques requise pour chaque donjon afin de pouvoir invoquer le Démon Majeur.

*Les Éclats démoniaques peuvent être obtenus dans les Events Quotidiens recommandés.

*Chaque Démon Majeur relâchera des Formules, de l'équipement doré, du butin et des récompenses selon le niveau de difficulté.

*Dans le Défi du Démon Majeur, les attaques et dégâts reçus par le Boss et le joueur sont affichés sous forme de pourcentage. L'équipement n'a que peu d'effet.|
264|Cadeaux perdus|Le festival annuel de l'Arbre du Solstice approche à grands pas. Cela ne devrait être que bonheur et rires mais un vent de panique règne sur Aven.
    Shibil, le Capitaine de Garnison, a été très occupé dernièrement à patrouiller dans Aven. Bien que de nombreux mouvements suspects de personnes louches lui aient été rapportés, ses enquêtes n'ont mené à rien.
    Alors que tout le monde se préparait pour le festival de l'Arbre du Solstice, le Père Noël a été trouvé grièvement blessé. Shibil s'est empressé d'aller lui prêter assistance et lui demander ce qu'il s'est passé. Il apparaît que le Père Noël et ses rennes magiques ont été attaqués par des bandits masqués lorsque le traîneau passait la Baie Bélouga. Le Père Noël a été roué de coups et les rennes volés.
    De plus, on raconte que des comploteurs masqués traînent autour d'Aven, préparant quelque plan sournois. Qui se trouvent derrière ces méfaits et quelles sont leurs motivations ? Gardien Éternel ! Aidez le Père Noël à retrouver ses rennes et découvrez la vérité qui se cache derrière cet acte abominable !

|Cadeaux perdus

*Rendez-vous à Aven et acceptez la quête du Père Noël.

*Cette quête ne peut être faite qu'une fois par jour.

*En terminant cette quête, vous obtiendrez 1 Médaille de l'Arbre du Solstice.

*1x Médaille de l'Arbre du Solstice peut être échangée avec l'<Elfe de l'Arbre du Solstice> Minoa contre 5x Vins Légendaires.

*5 Médailles de l'Arbre du Solstice peuvent être échangées avec l'<Elfe de l'Arbre du du Solstice> Minoa contre 1 Boîte Cadeau de l'Arbre du Solstice.

*30 Médailles de l'Arbre du Solstice peuvent être échangées avec l'<Elfe de l'Arbre du Solstice> Minoa contre 1 Arme à 2 mains de Costume de Noël (blanche).




