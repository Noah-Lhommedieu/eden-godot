147|Défis de la Tour des Cieux|Suite à l'invasion du Dragonnet Céleste, Ormormu, la Curie a entrepris des recherches sur le Monde Céleste. 
Le Monde Céleste est un monde illusoire, une sorte de projection du monde réel. Cet univers parallèle représente toutefois un danger pour le monde réel : le Dragonnet Céleste a réussi à s'infiltrer dans notre royaume. La Curie n'a rassemblé que quelques éléments sur ce mystérieux endroit. Elle craint, en effet, que ses pouvoirs soient utilisés à mauvais escient. La Curie doit poursuivre ses recherches. Ses membres espèrent que les Gardiens Éternels pourront résoudre les nombreux mystères qui se cachent derrière ce monde singulier. |Défis de la Tour des Cieux 

Les joueurs peuvent défier l'<Hôte de la Tour des Cieux> Giardo. 

Les joueurs peuvent tenter leur chance en groupe ou individuellement. Le mode Raid est proscrit. 

Vous trouverez un nombre différent de monstres à chaque niveau. Une fois toutes les créatures éliminées, un Lutin Téléporteur apparaîtra. 

Dès que tous les membres acceptent de passer au niveau supérieur, le chef du groupe peut les aider à se téléporter. 

Les monstres de la tour lâchent des trésors. Certains de ces objets s'utilisent dans la tour uniquement. 

Un marchand apparaît tous les 10 niveaux. Les joueurs peuvent lui acheter des objets spéciaux. 

Les puissants boss apparaissent tous les 9 niveaux. Éliminez-les pour récupérer des objets rares et des costumes. 

Des pièges de lave se déclenchent de façon aléatoire. Les joueurs seront alors dans l'incapacité d'utiliser leurs compétences. Ils devront briser l'appareil de contrôle de lave pour accéder au niveau supérieur. 

La progression des joueurs sera sauvegardée tous les 10 niveaux. Les joueurs reprendront la partie au dernier niveau sauvegardé. Par exemple, depuis le niveau 11, 21, etc. 

En cas de perte d'un membre au cours du niveau, tous les membres de l'équipe devront reprendre au niveau précédent. 

Le niveau 50 est le niveau le plus élevé de la Tour des Cieux. |
148|Expédition du Mutant|Le Prince du Fléau s'est caché quelques temps, mais il a refait surface. Il ne veut pas affronter les Gardiens Éternels directement. À la place, il utilise le pouvoir d'un rubis pour perturber l'écosystème. Les animaux et les insectes qui vivent dans la forêt sont devenus violents à cause de l'emprise de la pierre, certains ont même muté physiquement. Les nouvelles bêtes féroces et violentes sèment la pagaille. Les habitants ont besoin de l'aide des Gardiens Éternels. La Curie a monté une expédition pour battre les mutants. Recrutez des Gardiens Éternels et collectez des morceaux de Cristal Rouge afin de trouver des moyens de battre le terrible Prince du Fléau. |Expédition du Mutant

Accessible aux joueurs de Niv. 65 et plus. 

Vous pouvez obtenir la quête une fois par jour auprès de <Expédition du Mutant> Shania. 

6 monstres mutants apparaîtront de manière aléatoire toutes les 3 heures dans ces zones : 
Baie Bélouga, Bourbes, Vallée des Rois, Volcan Avila, Plaines Dorées ou 
Terres des Dunes Éternelles.

Après avoir battu les monstres mutants, les 10 meilleurs joueurs recevront des Éclats de Cristal Rouge comme récompense. Le nombre d'éclats dépendra de la force des bêtes vaincues. 

Collectez 5 Éclats de Cristal Rouge pour finir la quête et recevoir les récompenses. |
149|Aventure fabuleuse |    Les contes de fées de la conteuse n'ont plus de secret pour les habitants d'Eden.

Conte 1 : Il était une fois un héros qui trouva un beau jour une cachette abritant de multiples trésors et découvrit le mot de passe permettant d'y accéder. Notre héros parvint à vaincre les voleurs qui gardaient l'entrée du lieu. Ce faisant, il bouscula une gemme où résidait un lutin, le tirant ainsi de son sommeil...

Conte 2 : Robin entreprit de secourir sa tendre princesse Nica. Pour ce faire, il engagea cinq hommes courageux qui, après moult péripéties, parvinrent à sauver ladite princesse. La reine, animée de haine et d'un désir de vengeance, les surprit alors qu'ils s'apprêtaient à s'enfuir. Ce qu'elle leur réserva fut bien plus effrayant que tout ce qu'ils auraient pu imaginer.|Aventure fabuleuse

