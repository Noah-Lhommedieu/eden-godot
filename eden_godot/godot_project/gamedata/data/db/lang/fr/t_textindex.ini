2597|Infos sur la Transformation
Après avoir retiré le sceau en transformant un Cristal d'Eden, vous pouvez obtenir les objets affichés sur la gauche.
Après transformation, vous pouvez récupérer l'objet obtenu
ou passer à l'étape suivante.

Fonctionnement :
  1. Chaque série de transformations nécessite un cristal.
  2. À chaque étape, vous pouvez choisir de récupérer l'objet obtenu
    ou de poursuivre le processus.
  3. La valeur de la récompense est proportionnelle au niveau de transformation.

Cristaux d'Eden :
  1. Durant la procédure, vous avez une chance d'obtenir
    des Cristaux de Transformation Supérieurs ou d'Élite. La transformation prend fin
    quand vous obtenez un tel cristal.
  2. Les Cristaux de Transformation Supérieurs ou d'Élite
    sont stockés dans les cases de droite.
    Obtenez-en 10 pour passer au processus de transformation avancé.
  3. Vous pouvez stocker jusqu'à 999 Cristaux de Transformation Supérieurs ou d'Élite.
    Passée cette limite,
    vous ne pourrez pas les garder.|
