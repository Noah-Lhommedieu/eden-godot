Mais cette année, y'a quelque chose qui cloche. Les œufs décorés disparaissent à toute vitesse. Les gens paniquent car le criminel coure toujours. Pour aider à la préparation du festival, Patricia est venue chercher de l'aide auprès des Gardiens Éternels. Elle a demandé aux Gardiens Éternels de trouver les œufs manquants pour que le festival puisse continuer. |Chasse aux Œufs de Lapin chez les Oiseaux

