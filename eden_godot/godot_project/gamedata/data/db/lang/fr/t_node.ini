280|Tour des Cieux Hall du Purgatoire|Une petit tour dans le monde extraterrestre. Personne ne sait à qui elle appartient
. Les pièces à chaque étage sont meublées différemment. L'entrée est gardée par 
un Garde Dimensionnel. 

Les pièces sont chaudes et embrumées. 2 énormes statues se trouvent de chaque côté de la zone centrale 
et de la lave s'écoule de leur bouche. Les vieilles pierres au sol 
sont couvertes de cendres à cause de la lave. 

En hauteur, les filins en acier sont rougis par la chaleur et le magma. Des étincelles 
jaillissent de ces filins sans arrêt. L'ambiance est inhospitalière et tout 
semble fait pour décourager les intrépides qui voudraient s'y aventurer.||||||||||Embrasement <Tour des Cieux> (3 à 5 Joueurs)|
281|Tour des Cieux Autel Sinistre|Une petit tour dans le monde extraterrestre. Personne ne sait à qui elle appartient
. Les pièces à chaque étage sont meublées différemment. L'entrée est gardée par 
un Garde Dimensionnel. 

Dans une pièce, des spectres sortent sans arrêt d'une énorme tablette en pierre 
et tournoient dans le ciel. C'est un décor effrayant, 
renforcé par d'étranges flammes vertes. 

Alors que vous jetez un œil dans la pièce, vous apercevez des toiles d'araignée dans chaque coin. On dirait même que ces toiles ne sont pas 
faites par des araignées, mais créées par la peur que celles-ci suscitent. La magie qui se forme au centre de la plateforme, en haut, 
est encore plus terrifiante.||||||||||Autel Sinistre <Tour des Cieux> (3 à 5 Joueurs) |
282|Tour des Cieux Salle Fleurépine|Une petit tour dans le monde extraterrestre. Personne ne sait à qui elle appartient
. Les pièces à chaque étage sont meublées différemment. L'entrée est gardée par 
un Garde Dimensionnel. 

Le soleil brille à travers les vitraux et 
projette de magnifiques ombres sur le tapis rouge. De plus, les tablettes de pierre blanche ajoutent une touche 
mystérieuse et solennelle. 

Au centre de la pièce coulent des cascades dont le son apaise 
le visiteur. En y entrant, vous avez l'impression de vous trouver dans une forêt, 
près d'une chute d'eau.||||||||||Salle Fleurépine <Tour des Cieux> (3 à 5 Joueurs) |
283|Tour des Cieux Zone de la Mélodie Sacrée|Une petit tour dans le monde extraterrestre. Personne ne sait à qui elle appartient
. Les pièces à chaque étage sont meublées différemment. L'entrée est gardée par 
un Garde Dimensionnel. 

D'anciennes ruines recouvertes par la végétation. L'herbe haute semble indiquer que l'endroit 
a été déserté depuis un bon moment déjà. En apercevant les squelettes pendus, vous ne pouvez vous empêcher de vous demander 
s'ils ont péri pour être entrés dans ce lieu. 

Les blocs de pierre flottant au centre de deux formations magiques émettent 
des rayons de lumière et semblent avoir un lien avec la pièce du fond. Les statues sculptées sur le mur de pierre 
semblent réellement effrayées.||||||||||Sanctuaire de Curiosités <Tour des Cieux> (3 à 5 Joueurs) |
284|Laboratoire de Réno|Un laboratoire rempli de plantes vertes. On peut y voir de nombreuses cuves transparentes servant à la culture. 
La lumière diffuse rend cette endroit très mystérieux. 

La majeure partie de la salle des machines est couverte d'immenses murs d'énergie. Dans la salle, des 
instruments scientifiques vous sont totalement inconnus. L'écran translucide affiche des lignes de commande de programmes que vous ne connaissez pas. 
L'énorme orbe d'énergie juste au-dessus de l'écran semble fournir toute l'énergie dont le labo a besoin. Un plan diabolique a l'air d'être 
à l'œuvre dans ce labo automatisé. 

La Guilde des Alchimistes enquête secrètement sur ce laboratoire et compte 
y entrer lorsque le gardien aura disparu et mettre un terme aux recherches qui y sont conduites.||||||||||Labo luxuriant de recherches (de 3 à 5 joueurs)|
301|Bataille de la Forêt|Une ville silencieuse est posée au milieu d'un cirque montagneux et d'arbres géants. 
Leurs feuilles bloquent le soleil et projettent leur ombre. Une magnifique cascade 
coule au nord-ouest de la vallée, irriguant les terres et amenant la vie.

Bien que les montagnes soient des barrières naturelles, elles ne protègent pas 
la ville contre les invasions. Les citadins recrutent les plus forts des soldats pour 
défendre leur terre natale.|Avant-poste |Place du Marché|Camp|Quartier Général|Village Forestier|Caserne||||Guerre en Forêt|
302|Bataille du Désert|Des rochers et des stalagmites érodés par le sable et le vent entourent cette petite ville ; 
un volcan rugit non loin de là. Sur le sol presque stérile ne poussent que quelques arbres, 
mais de riches veines de minerai courent dans le sous-sol.

La plupart des habitants sont des mineurs, et ils utilisent une technologie minière 
avancée, développée de génération en génération. Quand la ville est devenue prospère 
et donc la cible des voleurs, les habitants ont recruté des soldats pour les protéger.|Camp|Caserne|Terre des Mille Épines |Forêt de Longuepierre|Volcan en Éruption|Forteresse des Sables||||Guerre en Montagne|
303|Bataille de l'Océan|Cette agréable ville côtière reste fraîche et agréable tout au long de l'année. 
Ses belles plages et ses immeubles exotiques en ont fait un complexe touristique populaire,
mais aussi un port prospère.

Le commerce avec l'étranger est le fil rouge de l'économie locale et a transformé 
cet ancien village en grande ville. Cependant, elle attire également beaucoup 
trop de pirates. Les résidents ont engagé des soldats pour repousser leurs attaques. |Camp|Caserne|Étoile Océane|Terres Boisées Côtières|Pont Bruchlin|Port Azur|Cabane|Zone Commerciale du Port|Port de l'Océan Azur|Guerre sur la Côte|
