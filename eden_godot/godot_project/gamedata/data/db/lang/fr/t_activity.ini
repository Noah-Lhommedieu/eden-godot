 Un jour, les Poulets du Ranch ont été volés par des brigands qui les ont bourrés de produits chimiques, les transformant en <Dopés aux Hormones> Poulets. Les Poulets, énervés, ont profité de leur nouvelle force pour s'échapper. Ils sèment désormais la panique dans Aven. Les Gardiens Éternels vont devoir calmer les poulets et leur faire comprendre qu'il existe des végétariens sur cette planète.|Envie de lait

