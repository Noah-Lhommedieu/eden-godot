197|Niv. 84. Ingredients manquants|Commissionnaire?: Chef de l'Armee Batali

Contenu de mission?:

La plupart des gens se battent pour leur patrie et je devrais aussi faire mon devoir. J'aimerais pouvoir nourrir nos soldats, mais je manque cruellement d'ingredients pour ca !

J'ai besoin de plus de Viande d'Aigle et d'Ours. Veuillez m'en apporter s'il vous plait.|
198|Niv. 84. Nourriture pour les blesses|Commissionnaire?: Chef de l'Armee Batali

Contenu de mission?:

Le docteur pretend que des ingredients rares permettent de soigner efficacement les blesses. Et il y a beaucoup de blesses malheureusement. Nous devons donc nous procurer beaucoup d'ingredients !

J'ai besoin d'un Poisson Rare et de la Viande d'Oiseau. Veuillez m'en apporter s'il vous plait.|
199|Niv. 84. Des materiaux pour une tunique|Commissionnaire?: Infirmiere Paola

Contenu de mission?:

L'Empire Heldentod et l'Union de Valence se sont allies et Kicco le forgeron interimaire a besoin d'enormement de materiaux pour fabriquer des armures pour nos soldats.

J'ai besoin de plus d'Eperons resistants et de Minerai dore. Veuillez m'en apporter s'il vous plait.|
200|Niv. 84. Fabrication de poudre|Commissionnaire?: Medecin Militaire Jolin

Contenu de mission?:

Nos eclaireurs sont blesses et nous allons rapidement manquer de poudre utilisee pour communiquer. Nous devrions etre en mesure d'en fabriquer si nous disposons des materiaux necessaires.

C'est pourquoi j'ai besoin de plus de Carapaces Osseuses et de Minerai Ecarlate. Veuillez m'en apporter s'il vous plait.|
201|Niv. 84. Ingredients manquants|Commissionnaire?: Medecin Militaire Florence

Contenu de mission?:

Les cuisiniers ont ete envoyes sur le front et je dois m'occuper du ravitaillement pour nos troupes. C'est pourquoi j'ai etudie aupres de certains cuisiniers de l'Union de Valence. Je devrais pouvoir preparer quelque chose d'adequat pour nos troupes.

J'ai besoin de plus de Viande d'Aigle et d'Ours. Veuillez m'en apporter s'il vous plait.|
202|Niv. 84. Nourriture pour les blesses|Commissionnaire?: Medecin Militaire Florence

Contenu de mission?:

Je suis medecin militaire depuis longtemps. Croyez-moi, les Poissons rares se cachant dans le Kylin rocheux peuvent faire des miracles sur les blesses. Les Poissons Rares ainsi que la Viande d'Oiseau peuvent egalement etre delicieux.

J'ai besoin d'un Poisson Rare et de la Viande d'Oiseau. Veuillez m'en apporter s'il vous plait.|
203|Niv. 84. Des materiaux pour une tunique|Commissionnaire?: Forgeron Interim Kicco

Contenu de mission?:

La plupart de nos soldats ont des armures et des epees en mauvais etat. J'aimerais vraiment fabriquer de meilleures armes et armures, mais j'ai besoin d'enormement de materiaux pour cela.

J'ai besoin de plus d'Eperons resistants et de Minerai dore. Veuillez m'en apporter s'il vous plait.|
204|Niv. 84. Fabrication de poudre|Commissionnaire?: Soldat Telecom Lutin

Contenu de mission?:

Les eclaireurs professionnels ont besoin de plus d'equipement de communication pour travailler. J'ai besoin de plus materiaux pour fabriquer de la poudre de communication. Pourriez-vous m'aider ?

J'ai besoin de plus de Carapaces Osseuses et de Minerai Ecarlate. Veuillez m'en apporter s'il vous plait.|
205|Gloire de l'Aiguille d'Argent - Minerai de Jade|Union de mission?: Aiguille d'Argent

Pour forger et enchanter des objets, il nous faut tous types de materiaux afin de donner aux produits leurs attributs uniques. C'est pourquoi nos armures sont de qualite superieure a celles des autres.

La situation sur le continent est toujours instable et nous avons plus que jamais besoin d'armures. Nous manquons de Minerai de Jade. Pourriez-vous nous en apporter ?|
206|Gloire des Pyrovents - Minerai de Jade|Union de mission?: Pyrovent

Pour resister aux attaques des ennemis sans se briser, les metaux de qualite superieure doivent etre a la fois durs et robustes. Pour fabriquer les meilleurs metaux, il nous faut tous types de materiaux afin de pallier le manque de ressources.

La demande en armes est extremement forte en ce moment et nous allons manquer de Minerai de Jade. Pourriez-vous nous en fournir ?|
207|Gloire du CC du Chameau de Cristal - Fourrure de Grizzli|Union de mission?: Chambre Commerce Chameau de Cristal

Pour les marchands en expedition dans des contrees eloignees, les reserves qu'ils transportent leur permettent non seulement de gagner de l'argent, mais elles peuvent egalement faire la difference entre la vie et la mort. C'est pourquoi nous fournissons a tous de l'equipement de premier choix.

Les grizzlis sont particulierement feroces, mais leur fourrure est precieuse. Si vous nous apportez de la Fourrure de Grizzli, nous vous recompenserons genereusement.|
208|Gloire de l'?il d'Ambre - Fourrure de Grizzli|Union de mission?: ?il d'Ambre

Les gemmes sont les choses les plus captivantes au monde. Non seulement chacune possede son propre eclat, mais le traitement permet d'extraire une force unique de chacune d'entre elles. Mais les gemmes ne scintillent pas d'un tel eclat naturellement, c'est le resultat d'innombrables traitements.

Nous avons besoin de differents materiaux pour fabriquer des armures. Nous avons particulierement besoin de Fourrures de Grizzlis. Veuillez-nous en apporter.|
209|Gloire de l'Adepte de l'Esprit des Anciens - Soie d'Or|Union de mission?: Ancien Adepte de l'Esprit des Anciens

Pour rechercher l'energie de la Nature en conversant avec l'Esprit des Anciens et elaborer des plans speciaux, il nous faut de nombreux composants. Nous ne revelons jamais les methodes utilisees pour les creer et les materiaux bruts ne sont pas faciles a recolter?!

Nous manquons de main-d'?uvre et nous apprecierions que vous nous apportiez de la Soie d'Or.|
210|Gloire de la Pierre Sage - Soie d'Or|Union de mission?: Pierre Sage

L'utilisation de l'alchimie pour alterer les proprietes d'objets ne nous pose pas de probleme. Qu'il s'agisse de renforcer les points faibles ou consolider les points forts, nous avons juste besoin de materiaux bruts.

Le fait est que nous sommes cruellement a court de materiaux. Certains, comme la Soie d'Or sont rares et donc difficiles a obtenir.|
211|Gloire des Amoureux de la Nature - Sapin rougeoyant|Union de mission?: Amoureux de la Nature

Nous observons les creatures vivantes et en comprenant leur structure et leur facon de vivre, en etudiant leur vie en harmonie avec la Nature et en utilisant leurs traits inherents, nous fabriquons divers outils.

Nous avons besoin de plus de bois pour nos recherches. Du Sapin rougeoyant semble tout designe.|
212|Gloire de l'Association Arcanum - Morceau d'Arc-en-Ciel|Union de mission?: Association Arcanum

Nous croyons que les rituels sont source de magie. Avec des rituels plus importants, nous pourrions obtenir plus d'energie.

Pour obtenir un resultat pendant le rituel, nous devons donner quelque chose en echange. De plus, le rituel necessite une importante quantite d'energie pour demarrer. Si vous nous apporter des Morceaux d'Arc-en-Ciel, cela nous permettra d'avancer dans nos recherches.|
213|Gloire du Marteau d'Arthur - Feldspath Carmin|Union de mission?: Marteau d'Arthur

Meme avec la technologie et la connaissance les plus poussees, sans successeur, nous sommes aussi fugaces qu'une etoile filante. Ainsi, nous accordons beaucoup d'importance au fait de guider les gens.

Ces empotes ont gache?beaucoup de ressources. Nous apprecierions si vous nous rapportiez du Feldspath Carmin.|
214|Gloire de l'Aiguille d'Argent - Volonte de l'Elfe de la nuit|Les monstres qui ont mute sont fascinants. Lorsqu'ils meurent, les intentions et les pensees qu'ils laissent possedent toutes un effet distinct, et ce pour toutes les industries.

Serait-ce la facon dont ils se rachetent aux yeux du monde?? Mais recuperer de la Volonte de l'Elfe de la nuit est difficile. Seul quelqu'un d'aussi fort que vous peut nous ramener de la Volonte de l'Elfe de la nuit.|
