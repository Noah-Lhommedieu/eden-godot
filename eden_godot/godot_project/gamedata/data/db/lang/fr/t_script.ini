Le prix pour le gagnant serait la réalisation d'un voeu.

Unlézard nommé Pokey a décidé d'y participer. On se moquait souvent de lui parce que ces écailles étaient grises et ternes, tandis que celles des autres étaient superbes et colorées.
Il espérait  que la victoire lui apporterait au moins le respect des autres créatures.|Pkey créa un superbe collier qu'il mit autour de son cou, en prévision du Concours. Malheureusement, une créature rendue jalouse par ce collier se rua sur lui et le détruisit !
Pokey ne put prendre que la deuxième place, derrière un Poussin.

Soudain, alors que le Poussin était tout à sa joie, des créatures vicieuses volèrent ses oeufs ! Dans un moment de grande générosité, Pokey se précipita pour les sauver.

Quand il revint avec les oeufs sains et saufs, le Poussin souhaita pour son voeu de récompense que la beauté extérieur de Pokey soit aussi grande que sa beauté intérieure. 
C'est ainsi que Pokey gagne de superbes écailles multicolores, et que désormais tous ses descendants aient la même ?|
218|Côte de Hurlevent|Sec 1 : Dompter la Tempête |Port Ouragan, sur la Côte de Hurlevent, est le plus gros port commercial du Continent du Sud. Cependant, vous avez appris en parlant avec Havve, le Gestionnaire de la Jetée, que tout n'est pas toujours aussi tranquille qu'une mer d'huile. 

Les Aigles Tempêtevenin attaquent régulièrement les habitants et les touristes. Leur cruauté semble augmenter en même temps que leur population. Vous avez décidé de diminuer les deux. |Impressionné par votre rapidité à faire fuir les rapaces, Kai vous a demandé d'enquêter sur la cause de leur agressivité soudaine. Vous avez découvert que les Âmes de Ryke de Plackton sont derrière tout ça. 

Vous avez demandé conseil à la médium Jasmine, puis avez vaincu Charlotte et récupéré le Charme d'Âme Ressuscitée dont vous avait parlé Jasmine. 

En traduisant les runes du charme, Jasmine a découvert que le sorcier du Sommet du Cyclone y était pour quelque chose. |
219|Côte de Hurlevent|Sec 2 : Lamentation |En battant les Âmes de Ryke, vous avez gagné la confiance du Chef du Port Nelos qui a fini par vous révéler un secret. 

Quand le Tydani s'est écrasé il y a des années, la plupart des indices menaient vers les alchimistes de Samestra. Mais la véritable cause n'a jamais été démontrée. Nelos espérait que vous seriez capable de résoudre ce mystère. |Quand vous avez demandé à Gose, ex membre de l'Institut d'Alchimie, des infos sur le crash, il a accusé Riley le Fou, le Doyen. 

Gose vous a également conseillé de parler avec Vivianne, l'esprit de la fille de Riley, morte en essayant de le stopper. 

Vous avez soulagé sa douleur en vainquant son père et récupérant la Proposition Aérienne, tout en découvrant l'identité du vrai coupable : l'Archimage Akov.|
220|Côte de Hurlevent|Sec 3 : Bataille Acharnée |Grâce aux informations de la Proposition Aérienne et du Charme d'Âme Ressuscitée, le Chef du Port Nelos a compris que l'Archimage Akov s'apprêtait à attaquer Port Ouragan. 

Vous avez suivi Nelos, éliminant les Rampants de Cristal et les Rampants Mutants sur votre passage. Vous avez également aidé Edouard à obtenir les Cristaux Magiques Secrets et du Karma. Ces trésors peuvent affaiblir les pouvoirs des sorciers. |Vous avez utilisé les cristaux magiques pour créer un enchantement. Mais des espions sorciers vous ont attaqué. Après l'attaque, Nelos a officiellement déclaré la guerre aux Démonistes. 

Vous avez ensuite arrêté le rituel d'invocation des Fantômes Calcineurs et vaincu l'Archimage Akov. La paix était revenue au Sommet du Cyclone. |
221|Côte de Hurlevent|Livre : Poussin Arc-en-Ciel|Autrefois, un garçon nommé Singa était responsable de nourrir sa famille en vendant des fruits. 

Un jour, alors qu'il rentrait chez lui, il remarqua des Aigles Tempêtevenin qui faisaient beaucoup de bruit. Il se cacha derrière des buissons et vit que les créatures s'en prenaient à un Poussin Arc-en-Ciel. Les plumes ensanglantées de l'oiseau blessé brillaient comme des gemmes sous le soleil. |Même si Singa n'était pas un combattant, il réussit tant bien que mal à secourir le Poussin. Il le soigna puis le relâcha dans la nature. 

Des années plus tard, Singa vivait à Plackton qui fut frappé d'une sécheresse sévère. Le Poussin Arc-en-Ciel revint et utilisa ses pouvoirs magiques pour sauver les villageois. 

Plus tard, les alchimistes lancèrent une attaque sur le village pour capturer le Poussin et obtenir ses plumes. Mais les villageois ne se laissèrent pas faire. Malheureusement, Singa périt dans le conflit. 

Le Poussin se sacrifia pour rendre la vie à son protecteur. |
222|Côte de Hurlevent|Livre : Cristaux de l'Ombre|Écrit par Kuinuyi, un expert en sorcellerie ancienne, ce livre retrace les enquêtes de l'auteur dans la Forêt de Cristal et sur la légende de Nezo. 

Le premier chapitre est un rapport détaillé de l'enquête sur le Crash du Tydani. Il dresse une liste d'indices et donne des exemples sur comment la Forêt de Cristal affecte les esprits. |D'après la rumeur, le shaman Nezo serait venu sur la Côte de Hurlevent pour approfondir une branche de sorcellerie spécialisée dans le contrôle de l'esprit. Cependant, Kuinuyi a pu trouver le journal de Nezo et a découvert qu'il voulait juste ramener sa femme à la vie, morte d'une horrible maladie. 

Nezo a fini par invoquer des Fantômes Calcineurs, mais le rituel a échoué. Au final, ces rituels ont cristallisé toute la forêt. Nezo a disparu après ça. |
223|Jungle du Dieu Serpent |Sec 1 : Les Secrets du Dieu Serpent |La rivière boueuse qui traverse la Jungle du Dieu Serpent approvisionne en eau une zone marécageuse. On n'y trouve pas que des champignons géants, mais aussi un camp de mercenaires. 

Le mercenaire Gortex vous a dit que la jungle est plus dangereuse en ce moment, depuis qu'une étrange lumière rouge est apparue. Les reptiles sont devenus plus violents et se sont mis à se nourrir des cœurs encore chauds des voyageurs imprudents. |Vous avez aidé Férin, le Chef Mercenaire, à dégager la route de livraison envahie par ces horribles bêtes. Vous avez également aidé le Dr. Ora à arrêter une épidémie. 

Vous avez rencontré le chef de l'Union des Explorateurs, Elias, qui a apprécié votre aide. Il vous a raconté la légende de l'Ancienne Cité de Maziz et vous a expliqué pourquoi l'Union des Explorateurs était venue ici. |
224|Jungle du Dieu Serpent |Sec 2 : Secourir les Sauveteurs |Elias vous a dit que ses collègues, menés par Ferdinand, voulaient cartographier Maziz mais qu'ils ont disparu. L'Union des Explorateurs est venue pour les secourir, mais ils ont été attaqués par les Cannibales. 

Voulant aider, vous avez dit à Férin d'envoyer plus de mercenaires soutenir l'équipe de secours. Vous avez également suggéré à Gortex de patrouiller dans le camp pour assurer une sécurité continue. 

Vous avez réuni des fournitures médicales et êtes parti vers l'Autel des Épines Noires chercher l'équipe de secours. |Vous avez rencontré Enza le Capitaine des Secours à l'Autel des Épines Noires et avez décidé ensemble de vous occuper de la Tribu Cannibale avant toute chose. 

Grâce au plan de Férin, vous avez attaqué la tribu et tué son leader, le Chef Cannibale Ghira. Vous avez alors mis fin à la contre-attaque cannibale, puis vous êtes parti à la recherche des explorateurs. |
225|Jungle du Dieu Serpent |Sec 2 : Les Richesses de Maziz |Avec l'aide d'Enza, vous avez facilement trouvé les explorateurs et avez fourni des rations alimentaires plus que nécessaires. Enza a retenu les Cannibales pendant que vous meniez l'équipe de secours. 

Vous avez atteint votre destination au prix d'une poignée de combats seulement. Le ciel lourd de nuages semblait annoncer une catastrophe imminente. Vous espériez pouvoir finir votre mission de secours avant que quelque chose de terrible n'arrive. |Vous n'avez pas seulement sauvé les explorateurs, vous avez aussi empêché le réveil de Démon Terrible. Vous avez même récupéré la Lettre Ensanglantée de Maziz. La Jungle du Dieu Serpent avait retrouvé son calme. 

De retour au campement, vous avez donné la Lettre Ensanglantée à Elias qui a promis de la remettre à la Curie. Vous pouvez voir la Tour de Maziz se dresser au loin, baignée d'une lueur écarlate. La cité semblait si tranquille. |
226|Jungle du Dieu Serpent |Livre : Le Vaudou pour les Nuls|Bakino est un chercheur vaudou célèbre. Il a acheté un manuel de vaudou à un mystérieux marchand et a commencé à expérimenter les techniques vaudou. 

Il a testé un sort d'invisibilité vaudou en mélangeant de la queue de Lézard Mycolique et des griffes de Dragon Mycolique. |Bakino a aussi essayé un puissant filtre d'amour et un sort de perte poids immédiate. 

Malgré tout ses échecs, il n'a jamais abandonné, il voulait vraiment présenter le pouvoir vaudou au grand public. Il a finalement convaincu des marchands du campement de vendre ses livres aux aventuriers. |
227|Jungle du Dieu Serpent |Livre : La vie à Maziz|L'Empire de Maziz est une ancienne civilisation de la Jungle du Dieu Serpent sur le Continent du Sud. Son histoire a été perdue il y a bien des générations. 

Ce livre établit une corrélation entre la civilisation disparue et les tribus cannibales locales d'aujourd'hui, affirmant que les Cannibales sont les descendants de l'Empire de Maziz. |Ce livre explique en détail les liens qui unissent les deux civilisations. 

Même s'il manque beaucoup d'informations, les archéologues ont réussi à réunir des données historiques. L'auteur conclut également que le Démon Terrible est lié à l'extinction de l'Empire de Maziz. |
228|Crocs Brumeux|Sec 1: Réveil|Il y a 6 mois, vous êtes arrivé dans un mauvais état à Kuala Lursun; un voyageur vous avait trouvé ensanglanté à proximité d'un Cristal Bleu.
Malheureusement, vous ne vous rappeliez de rien.

Vous avez décidé d'en savoir plus sur votre passé, et êtes parti à l'aventure.|Shacul, le Chef de la Tribu, vous a expliqué que vous êtes un Gardien Éternel, un protecteur d'Ezur.

Vous avez passé les tests de Shacul et avez éliminé la menace qui planait sur Kuala Lursun. Joneena vous en est très reconnaissant.

Shacul, impressionné par vos compétences, vous affirme que vous êtes celui qui est annoncé par la Prophétie de Kuala.|
229|Crocs Brumeux|Sec 2: Départ|Vous avez décidé d'en parler à Shacul, le Chef de la Tribu.
Il vous a proposé une série d'épreuves destinées à révéler le plus profond de vous-même.

Quand vous en avez parlé à Kero, celui-ci s'est inquiété pour vous et vous a supplié de ne pas tenter ces épreuves. 
En vain.|Pour assurer Kero, vous lui avez prouvé votre ténacité et votre courage.

Kero accepte enfin de vous laisser partir, mais il souhaite d'abord que vous vous chargiez des Bêtes de Cristal qui se balade dans la Montagne.

Une fois que vous avez accédé à sa requête, vous êtes allé voir Maître Benson pour lui demander de vous faire passer les épreuves.|
230|Crocs Brumeux|Sec 3: Épreuve|Sous le contrôle attentif de Maître Benson, vous avez commencé les épreuves.

Après de nombreux et durs combats, vous avez réussi à vaincre les monstres imposés par Benson. Vous êtes ensuite retourné auprès de lui pour prouver votre succès.

Enchanté par votre performance, Benson vous a donné une autre épreuve.|Sous les conseils de Benson, vous avez passé les tests et vous avez appris ce qu'il fallait pour être courageux, fort et sage.

Après avoir traversé la montagné, vous avez rencontré Athéna Marie, qui vous a guidé vers l'épreuve finale, qui vous permettra de quitter les Crocs Brumeux.

Pour cela, il fallait remonter la Voie de la Persévérance et vaincre l'ennemi ultime des Ursuns.|
231|Crocs Brumeux|Livre : Marca|Marca, un enfant adopté, était rejeté de tous et ne pouvais participer à k'entraînement de Griffre de Bataille.

Marca était sans arrêt embêté par de méchants garçons du village. Pour le protéger, le Chef de la Tribu l'a envoyé chercher des herbes dans les montagnes, loin de ses tourmenteurs.

Marca a donc grandi entouré de Boues de Cristal.|En grandissant parmi les Boues de Cristal, Marca a commencé à imiter leurs mouvements.

Malheureusement, il fut pris au piège et chassé du village sous de fausses accusations. Cependant, des années plus tard, il revint et combattit des artistes venus d'ailleurs.
Sa victoire était incontestable et il fut enfin accepté par les siens.

Sous les conseils du Maître en Griffe de Bataille, Marca devint le plus grand combattant de toute l'histoire des Crocs Brumeux. |
232|Forêt Ensorcelée|Sec 1 : Énergie Perdue|Ce pays merveilleux, regorgeant d'animaux et plantes inconnus, semble phosphorescent. 

Vous vous êtes dirigé vers le Campement Frontalier de Valence où vous avez découvert d'étranges personnes en train de rôder. 

Le Second Officier Fele, en charge de la sécurité du camp, avait besoin d'aide pour écarter les étranges et dangereux vers aux alentours. Vous vous êtes tout de suite porté volontaire. |Pendant que vous aidiez Fele, vous avez aussi donné un coup de main à l'Alchimiste Mangulo qui se cachait dans le campement, et vous avez découvert que le forêt perdait son énergie. 

Avec Mangulo, vous avez ramassé des bâtons dans la forêt et récolté des données de l'arche de cristal. Vous avez également vaincu les dryades ainsi qu'une horrible créature mutante. 

Vous avez convaincu Mangulo de coopérer avec les frontaliers et avez gagné la confiance de Fele. 
|
233|Forêt Ensorcelée|Sec 2 : Le Pouvoir du Cristal |Après avoir reçu les ordres de l'Officier de Valence Mopez, vous avez obtenu une Lettre de Recommandation de Mangulo et avez entamé votre voyage vers la Forêt Ensorcelée. 

Vous avez passé les arches de cristal et une rivière étincelante, avant d'enfin arriver sur ces terres vibrantes d'énergie. Vous avez trouvé l'Aîné Kutin à la Maison des Murmures. 

Avant de rencontrer l'Aîné, vous avez dû affronter un groupe de Bêtes Sacrées. |Après l'avoir rencontré, vous avez décidé d'aider le Clan des Sorcières pour empêcher la prise du Chaudron de Culture par les Ogres. 

Vous avez aidé Kutin à retrouver sa petite fille et son meilleur étudiant. Vous et le garde de Kutin Tiko avez vaincu le Sergent Hache Géante Shandi et obtenu le cristal bleu qui permettra de stabiliser Chaudron de Culture. 

Le pouvoir du cristal a fait prendre conscience à Tiko et Kutin qu'il était temps de se battre. 
|
234|Forêt Ensorcelée|Sec 3 : Chaudron de Culture|Garcia vous a donné le cristal bleu, il chauffe entre vos mains. Garcia espérait que vous pourriez mener l'équipe contre les Ogres du Chaudron de Culture. 

Vous avez également stabilisé le flot d'énergie grâce au cristal bleu, empêchant ainsi des batailles inutiles. Vous vous êtes préparé pour affronter les Ogres de la Main Noire et le Général Yuhidor au Chaudron de Culture. |Durant le combat, vous avez vaincu Yuhidor et détruit la défense des Ogres. Le cristal bleu a stabilisé l'énergie. 

Le contrôle de l'expérience a été perdu mais vous avez tout arrêté avant qu'il y ait trop de dégâts. 

Après être retourné à la Maison des Murmures, vous avez reporté les résultats à Garcia et au Commandant Catex qui a promis de reconstruire son armée et de regagner le Chaudron de Culture. |
235|Forêt Ensorcelée|Sec 4 : À la Rescousse |Le Garde Tiko a remarqué que les Ogres de la Main Noire se comportaient bizarrement et se réunissaient près de Sturmfrau. Il craignait qu'ils n'aient résolu le mystère de l'énergie de la Forêt Ensorcelée. 

Tiko vous a demandé d'enquêter et découvrir ce que projetaient les Ogres de la Main Noire. 

Vous êtes alors parti voir de quoi il retournait. |Près de Sturmfrau, vous avez trouvé Aiko qui s'était échappé du Chaudron de Culture. Elle a expliqué que l'étudiant de Kutin, Olcko, avait été capturé pendant qu'ils s'échappaient. 

À ce moment, il semblait plus urgent d'arrêter les Ogres que de secourir Olcko. Vous avez détruit l'appareil que les Ogres prévoyaient d'utiliser pour contrôler Sturmfrau. 

Vous êtes retourné à la Maison des Murmures et avez demandé des renforts à Garcia et Tiko. |
236|Forêt Ensorcelée|Sec 5 : Sturmfrau|Tiko a expliqué que le chef des ogres emmenait Olcko à Sturmfrau, il prévoyait aussi de s'en prendre à Aiko. Tiko vous a dit de dire à Aiko de quitter Sturmfrau aussi vite que possible. 

Vous avez réussi à passer outre les gardes des Ogres de la Main Noire et avez trouvé Aiko près de Sturmfrau. 

Vous lui avez tout dit à propos d'Olcko et lui avait conseillé de partir, ce qu'elle a tout bonnement refusé. |Vous avez promis à Aiko de secourir Olcko. À Sturmfrau, vous avez vaincu <Conseiller de la Main Noire> Zagdon et avez sauvé Olcko. 

Vous avez aussi tué <Vigoripède> Gimu et <Protecteur Pourri> Rysel et ramené leurs cœurs à Aiko. 

De retour à la Maison des Murmures, Kutin a envoyé des soigneurs s'occuper d'Olcko et récupérer _XXXX_. |
237|Forêt Ensorcelée|Livre : Manuel de l'Épéiste|Ce Manuel de l'Épéiste a été écrit par un étudiant en escrime de Valence, Krouno. Il renferme des informations critiques sur les méthodes de combat à l'épée de Valence. 

Le premier chapitre parle de l'importance des pas, les mouvements de jambe sont très importants. Le livre suggère au lecteur de commencer à s'entraîner sur des Fouettards, des Cyclonicores et des Claretseins pour améliorer ses compétences. |Krouno explique clairement que de bons mouvements de jambe et une adroite combinaison d'attaque et de défense sont la clé de l'escrime valencien. 

Dans les chapitres suivants, le livre révèle trois positions de combat secrètes : _XXX_, _XXX_, et _XXX_. Elles ont été créées par _XXX_. 

À la fin du livre, l'auteur encourage le lecteur à ne pas seulement apprendre l'art du combat à l'épée mais aussi de comprendre ce qui se cache derrière. |
238|Forêt Ensorcelée|Livre : Je veux du rock|Yuzgrut Mucusmonger était un Ogre de la Main Noire lambda. Sa mère était une célèbre Combattante de la Main Noire. Quand Yuzgrut avait trois ans, il perdit un bras dans un terrible accident et est tombé dans une profonde dépression. Ses parents s'inquiétaient pour son état mental. 

Un jour, le père de Yuzgrut lui donna une guitare, lui ouvrant ainsi les portes de la musique. Quand il prit la guitare en main, la légende était née. |Yuzgrut devint célèbre alors qu'il était encore très jeune, sa passion pour la musique ne faisait qu'augmenter avec le temps. 

Sa performance au festival de musique _XXXX_ impressionna tout le monde. Sa vie privée était controversée, mais le public des quatre coins du monde vouait un culte à sa musique. 

Au final, Yuzgrut a joué sa musique pour des foules de fans jusqu'à sa mort. |
239|Crête Diamantée|Sec 1 : Le Dilemme de Kaia |En suivant les instructions d'Athéna Marie, vous êtes allé à la Crête Diamantée. Après avoir passé un lac magnifique, vous êtes arrivé à la Tribu du Portail.  

Vous avez été choqué par l'attitude du Guerrier Kaia Ibema envers les étrangers, même expliquer vos intentions ne semblait pas calmer ses ardeurs. 

Ibema vous a demandé de sortir et de récupérer _XXX_ de _XX_. Vous avez ainsi pu commencer votre aventure. |Après avoir parlé aux autres membres de la Tribu du Portail, vous avez compris que la dépression de la chef actuelle a fait passer tout le reste au seconde plan. 

D'étranges changements environnementaux se déroulaient à la Crête Diamantée. Avec l'aide d'Ibema, vous avez remonté le moral de la Chef de la Tribu Suzna et arrêté les changements survenant au Mont Miracle. 

Suzna a promis de se reconcentrer sur la recherche de la raison des changements à la Crête Diamantée. |
240|Crête Diamantée|Sec 2 : Lac Enchanté |Après avoir résolu le problème du Mont Miracle, les membres de la Tribu du Portail ont commencé à enquêter sur les changements de la Crête Diamantée. Ibema vous a demandé de vous rendre à l'Autel de la Nouvelle Lune au Lac de Cristal. 

Ibema vous a expliqué que l'Autel de la Nouvelle Lune était un lieu très saint, et que les humains ne sont normalement pas autorisés à s'y rendre. Suzna vous a alors donné une autorisation spéciale. 

Elle vous a demandé de trouver et d'aider la Prêtresse Kaia Niahosa. |Niahosa, la prêtresse de la Tribu du Portail, vous a parlé de la mission prévue pour réparer l'enchantement qui sous trouve sous le Lac de Cristal. Elle craint d'ailleurs que les récents changements environnementaux aient d'obscures origines. 

Vous avez ensuite créé un enchantement en suivant les instructions de Niahosa et créé un nouveau contrat. 

L'enchantement a finalement été construit sous le lac et vous avez gagné la confiance de la Tribu du Portail. |
241|Crête Diamantée|Sec 3 : Les Plans de Baalu |Suzna vous a dit que d'après l'équipe d'enquête, les changements environnementaux de la Crête Diamantée étaient liés au groupe Baalu au sud du Lac de Cristal. 

Cependant, elle n'avait pas assez de preuves pour établir la culpabilité du Groupe Baalu. Elle espérait que vous pourriez aller au Campement Baalu et rassembler plus d'indices. |Vous êtes arrivé au Campement Baalu au sud du Lac de Cristal et avez rencontré un mystérieux jeune homme appelé Artifa qui semblait connaître Suzna. 

Avec l'aide d'Artifa, vous avez découvert les plans du Groupe Baalu et prouvé la théorie de Suzna. Vous et Artifa avez fait échouer ces plans et sauvé la Crête Diamantée. 

Suzna et le nouveau chef de tribu ont applaudi vos efforts. |
242|Crête Diamantée|Livre : L'histoire de 2 Frères|Autrefois, deux frères vivaient paisiblement près du Lac de Cristal de la Crête Diamantée. 

Un jour, leur mère tomba malade et personne ne pouvait la guérir. En suivant les conseils de l'aîné du village, ils décidèrent de chercher de l'aide auprès d'un ermite dans la forêt. 

Ils traversèrent la palmeraie, et Arthur frappa à la porte de l'ermite. C'est à ce moment que la vraie destinée des frères commença. |Les frères passèrent les tests de l'ermite et arrivèrent au Mont Miracle pour trouver le cristal légendaire. 

C'est là qu'Arthur affronta Ragonus. Soudain, un épais brouillard se leva sur la région et Arthur tua son frère par accident avant de s'évanouir. Quand il se réveilla, ils étaient au milieu d'une prairie et il trouva enfin le cristal. 

Au final, Arthur sacrifia sa vie pour sauver son frère et sa mère avec le cristal. |
243|Crête Diamantée|Livre : Rédemption|Après qu'Althelus ait quitté la Tribu du Portail, il ne put se pardonner ce qu'il avait fait. Pour expier ses crimes, il décida de rencontrer un assassin, Ghenf, pour lui demander de l'aide. 

Althelus se promenait sur la Crête Diamantée quand une meute de loups attira son attention près du Lac de Cristal. Il s'est rendu compte que des voyageurs étaient piégés à proximité. 

Il a sorti son poignard et s'est caché dans les buissons, prêt à affronter les loups pour sauver les voyageurs. |Il a trouvé la paix en voyageant avec les autres. Malheureusement, une tragédie les frappa après qu'il eut sauvé un mystérieux voyageur qui s'avérait être un cruel voleur. 

Althelus était si remonté qu'il se promit de tuer le voleur. Sa colère obscurcit son jugement et il fut capturé par un groupe de voleurs. 

Au final, Althelus s'échappa et vainquit les voleurs, gagnant ainsi une réputation de héros. |
244|Pic du Maëlstrom |Sec 1 : Village Attaqué|Après un long voyage vous êtes arrivé au Pic du Maëlstrom à l'ouest du Continent du Centre. Vous avez fini par arriver à Nolenville, un village recouvert d'une épaisse couche de neige. 

Vous avez rencontré une grand-mère Anuran qui vous a raconté les problèmes que connaît Nolenville. Les villageois se disputaient à propos d'une relocalisation éventuelle. 

Grand-mère Sonja vous a demandé de l'aide pour convaincre tout le monde de déménager pour des raisons de sécurité. Vous avez accepté la quête. |À Nolenville, vous avez rencontré un jeune homme, Chrido, qui a aidé à révéler le secret du Chevalier du Temple Kwen, il se faisait passer pour un marchand. 

Grâce à vos efforts, Kwen a enfin trouvé un compromis avec les villageois et a accepté d'affronter les Ogres. Vous avez également aidé Kwen à trouver une tablette contenant des informations sur une arme antique. 

Kwen a accepté de demander à ses compagnons d'analyser la tablette. |
245|Pic du Maëlstrom |Sec 2 : Disparition |Kwen vous a donné la tablette et vous a redirigé vers la Forêt Givrée pour trouver son amie, Bess le Médecin Légiste, qui pouvait analyser la tablette. 

Kwen vous a également dit que les Chevaliers du Temple étaient venus au Pic du Maëlstrom pour trouver le Chevalier de la Rose qui avait quitté Nolenville. Ils devaient s'assurer de sa sécurité car il était le détenteur d'un secret important. 

En suivant les instructions de Kwen, vous êtes parti vers l'ouest de Nolenville pour rencontrer le chevalier. |Vous avez trouvé Bess dans la Forêt Givrée et lui avez donné la tablette, la recherche du Chevalier de la Rose Montagu pouvait commencer. 

Ça n'a pas été facile de fouiller la Forêt Givrée. Grâce au _XXX_, vous avez finalement réussi à localiser Montagu dans l'Antre des Échos. 

Des fantômes gardaient l'entrée, vous avez donc utilisé le _XX_ que Wagner vous avait donné pour les vaincre et sauver Montagu. |
246|Pic du Maëlstrom |Sec 3 : Antre des Échos|Hazel, Chevalier du Temple, était inquiète à propos du Chevalier de la Rose Montagu à l'Antre des Échos. Elle voulait que vous lui portiez secours. 

Elle vous a aussi dit qu'elle ne faisait pas confiance à l'Écuyer Warner. C'est pourquoi elle était à la recherche d'un talentueux aventurier comme vous pour aider les Chevaliers du Temple. 

Il y avait quelque chose chez Hazel qui vous donnait envie de lui faire confiance instantanément. Vous êtes très vite parti sauver Montagu. |Vous avez trouvé le Chevalier de la Rose Montagu dans l'Antre des Échos. Il vous a dit qu'il avait accidentellement réveillé une bête terrible. 

Pour empêcher la bête de mettre le Pic du Maëlstrom à feu et à sang, vous avez dû vous en mêler. Après un dur combat, vous aviez tué un nombre impressionnant de monstres, dont Gazina, sauvant ainsi le Pic du Maëlstrom. 

Vous avez apporté le message de Montagu à Hazel et Claire. |
247|Pic du Maëlstrom|Sec 4 : Chevalier Enchaîné|Hazel des Chevaliers du Temple a pris _XXXX_ en charge. Elle vous a demandé de vaincre _XXXX_ sur la Route des Glaces avant qu'ils n'attaquent le camp. 

Elle craignait que la garnison du camp ne soit pas assez forte pour faire face aux attaques des _XXXX_. C'est pourquoi elle vous a demandé de lui faire gagner du temps pour qu'elle puisse traduire la tablette. 

Vous vous êtes préparé pour une bataille sur la Route des Glaces. |Après avoir aidé Hazel à éliminer les troupes de _XXXXX_, vous êtes allé au Campement en Ruines et vous avez sauvé le Chevalier du Temple Alec des griffes de ogres. 

Avec votre aide, Alec a pu échapper au sort de _XXXXX_. Vous avez également volé la carte de l'entrée des souterrains de la Forteresse Dulong. Alec vous a demandé de tuer les Louvetiers Hamanzi avant de lancer le raid. 

Vous avez empêché le <Sergent Hamanzi> Cékuto de s'échapper, puis avez fait votre rapport à Hazel en lui donnant la carte. |
248|Pic du Maëlstrom|Sec 5 : Forteresse Dulong |Hazel vous a dit que même si vous aviez réussi à voler la carte de l'entrée de la Forteresse Dulong aux _XXXXX_, vous ne pouviez pas encore les arrêter. Les ogres ont déjà trouvé un moyen de rentrer dans l'Abysse Glacée de Skleros. 

Elle vous a aussi dit que le chef des _XXXXX_ menait une troupe d'ogres vers l'Abysse et qu'ils s'apprêtaient à utiliser une arme antique. 

Vous êtes parti vers le Campement en Ruines et avez retrouvé Alec. |Après être entrés dans l'Abysse Glacée de Skleros, il vous a expliqué la situation : l'arme antique devait être arrêtée. 

Avec l'aide d'Alec, vous avez vaincu le Chevalier Néfaste Liyamu, et vous avez absorbé la force de Valentino pour empêcher la réactivation de l'arme. 

Vous avez réussi à stopper l'arme et avez tué un dragon des glaces. Vous avez annoncé la nouvelle à Hazel. |
249|Pic du Maëlstrom|Livre : Ingrédient Secret|Lignoc, un chef célèbre, n'était jamais satisfait de ses réalisations culinaires. Il voyagea vers le Pic du Maëlstrom pour entamer une aventure qu'il pensait pouvoir le rendre célèbre à tout jamais. 

Lignoc avait entendu dire que les _XX_ toxiques du Lac Balaya étaient une denrée fantastique bien que dangereuse, il s'était donc mis en tête d'en attraper un. |Lignoc prépara divinement bien le _XX_ toxique. Il réussit également à cuisiner un Quartzolusk. Les chasseurs Nolan lui apprirent comment faire ressortir les vraies saveurs des aliments. 

Après avoir cuisiné ces plats exquis, Lignoc sentait qu'il manquait encore quelque chose. Ce n'est qu'après avoir rencontré une sublime chasseresse à Nolenville qu'il réalisa un dessert qui ferait pleurer le plus valeureux des hommes. 

Car oui, l'ingrédient secret était l'amour ! |
250|Pic du Maëlstrom|Livre : Roleny l'Épée|Au Pic du Maëlstrom, il y a une histoire à propos d'une épée qui a mené le peuple Nolan vers la liberté, l'épée du Chevalier Nolan Roleny. 

Pendant le premier combat contre les ogres, la Princesse Nolan Ariel aida son peuple à s'enfuir. Un groupe de braves guerriers, connus sous les nom des 13 de Nolan, aidèrent le chef Chevalier Finya à éliminer les ennemis. 

Parmi ces chevaliers, se trouvait le plus brave, Roleny, le propriétaire de l'épée célèbre. |Roleny aida la Princesse Nolan sans relâche contre les ogres. Il tomba amoureux d'elle, mais elle lui préféra le chef des chevaliers. 

Ravalant son amour et sa fierté, Roleny se concentra sur les batailles et développa une belle amitié avec la princesse. Comme cadeau, elle grava un iris sur son épée. 

Bien que Roleny fut tué au combat, son nom reste gravé dans l'Histoire. |
251|Hautes-terres|Livre : Amis et Ennemis|Rachy était un soldat de l'Avant-poste Œil de Faucon. Son ami Andele et lui étaient aussi proches que des frères. Tous deux étaient d'excellents éclaireurs. Même si la mission était difficile, ils trouvaient toujours un moyen de revenir avec des informations capitales.

Un jour, pendant une patrouille, ils trouvèrent des traces de soldats Heldentod. En suivant ces traces, ils découvrirent un camp militaire. Mais alors qu'ils commençaient à revenir sur leurs pas pour livrer à leur camp cette information de première importance, ils furent découverts par un combattant Heldentod.|Ils réussirent à se débarrasser de ce soldat mais quand Andele voulut l'achever, Rachy s'y opposa. Andele ne le supporta pas mais son irritation envers Rachy s'apaisa avec la renommée dont il bénéficia d'être revenu avec une information si cruciale.

Personne ne suspecta que cet incident marquait le début d'une trahison. Le courageux Andele complotait en fait avec l'Empire Heldentod qui allait peu de temps après s'emparer de l'Avant-poste Œil de Faucon.

Rachy, emprisonné et condamné à mourir de faim, fut libéré par le même soldat qu'il avait sauvé de la rage meurtrière d'Andele. Il comprit alors une chose : les ennemis d'un jour peuvent se retrouver les amis de demain... et vice versa. Rien n'est immuable.|
252|Légende de Sage.|Section 1 : La requête du Marcheur des Ombres|Les Marcheurs des Ombres, un groupe d'érudits dont le but est de protéger les savoirs anciens, se sont rassemblés récemment à Aven. Ils sont les garants d'une foi profonde et les détenteurs de la puissance de la lumière sacrée. 

Ils se montrèrent au grand jour car ils étaient confrontés à un problème qu'ils ne pouvaient résoudre. Zephyrinus demanda au Gardien Éternel de trouver Hillem, le Gardien des Ombres qui avait besoin d'aide. |Après avoir appris ce qui est arrivé aux Marcheurs des Ombres, le Gardien Éternel réalisa que leurs ennemis, les Sang Noir, avaient volé leur précieuse Orbe Sacrée. Les Sang Noir prévoyaient d'utiliser l'orbe pour retourner dans le temps et tuer le fondateur des Marcheurs des Ombres, le Roi Sage Gaimaizz. 

Le Gardien Éternel, prévenu de ce plan machiavélique, voyagea dans le passé pour stopper Finn, Lame Sang Noir. Cependant, l'Orbe Sacrée fut détruite dans la bataille. 

Une fois dans le passé, le Gardien Éternel remarqua des divergences entre la vérité et l'histoire racontée par les Marcheurs des Ombres. |
253|Légende de Sage.|Section 2 : La Vérité|Une fois le danger écarté pour les Marcheurs des Ombres, Hillem se rappela des mots de son défunt roi. Gaimaizz avait prédit l'arrivée d'un prophète qui résoudrait le conflit entre les Marcheurs des Ombres et les Sang Noir. Il pensait que le Gardien Éternel pourrait être ce sage. C'est pourquoi il l'encouragea à passer l'épreuve du sage.

Il expliqua que le sage est un gardien qui porte une armure recouverte d'inscriptions sacrées et un Marteau de Lumière Sacrée. Il guida le Gardien Éternel vers l'épreuve.|Celui-ci apprit de plus en plus de choses sur le conflit entre les deux tribus et réalisa qu'il y avait un grand malentendu.

Le Roi Sage massacra tous les Sang Noir parce qu'ils étaient sur le point de se diaboliser. Le chef des Sang Noir, ami du Roi Sage, ne voulait pas voir son peuple souffrir mais ne pouvait se résoudre à les anéantir lui-même.

Pendant l'épreuve, le Gardien Éternel fut témoin de la détermination du Roi Sage et de sa décision.|
254|Légende de Sage.|Section 3 : L'épreuve du Sage|Hillem expliqua qu'il était temps de passer la dernière étape de l'épreuve. Le Gardien Éternel aurait à faire face au Roi Sage pour prouver qu'il était qualifié pour ce titre.

Avant de téléporter le Gardien Éternel sur le lieu de l'épreuve, Helena mentionna que son amie, Finn, était venue lui dire adieu. Finn croyait que la Malédiction des Sang Noir frapperait bientôt son âme. Helena espérait que le Gardien Éternel pourrait sauver Finn d'une terrible malédiction. |Le Gardien Éternel passa l'épreuve finale et prit conscience que le Bien peut triompher du Mal grâce à la détermination et au courage. 

Avec l'aide du Roi Sage et de Helena, le Gardien Éternel guérit Finn, purgeant la malédiction des Sang Noir pour de bon.   

Hillem reconnut le Gardien Éternel comme étant le Sage et le Sauveur. Toutefois, les Marcheurs des Ombres réalisèrent que les crises ne faisaient que commencer et décidèrent d'abandonner leur mode de vie solitaire pour venir en aide à ceux dans le besoin.|
255|Vallée de la Mort|Section 1 : Crise des Sables |Les Drakai qui résident dans la Vallée de la Mort craignaient que quelque chose soit arrivé à leur shaman préféré. Lorsqu'ils attirèrent les esprits pour les aider, leur demande ne reçut pas de réponse. Où était passé l'Esprit Saint ?

Athéna Marie parla au Gardien Éternel de la disparition de l'Esprit Saint. La Curie ne prenait pas la chose à la légère, ils envoyèrent les Marcheurs des Ombres pour résoudre ce problème. Athéna Marie demanda au Gardien Éternel de collecter des informations auprès du Guerrier Divin, le Capitaine Onissem. |Le Gardien Éternel découvrit que les Drakai de la Vallée de la Mort s'étaient divisés en deux groupes ennemis : la bienveillante Tribu des Sables, dirigée par le Chef Toecker et la malveillante Tribu Movèzerbe, menée par le frère de Toecker, <Chef de Movèzerbe> Giggs. La Tribu Movèzerbe planifiait de contrôler l'Esprit Saint.

Toecker ne voulait pas attaquer son propre frère. Alors que les Marcheurs des Ombres et le Gardien Éternel cherchaient à libérer l'Esprit Saint, l'Esprit du Marais Noir, Kal, entra dans une colère noire. Le Gardien Éternel supprima Kal, mais malheureusement, la situation ne faisait qu'empirer.|
256|Vallée de la Mort|Section 2 : La Revanche sur Œil Furieux|Après avoir vu la douleur de Kal, Toecker réalisa que la Tribu Movèzerbe avait déjà causé de grandes souffrances à l'Esprit Saint. Il décida qu'il ne pouvait plus laisser son frère faire davantage de dégâts. Il demanda au Gardien Éternel de trouver le Gardien des Ombres Saul' Itaire et de l'aider à attaquer le camp Œil Furieux. 

L'équipe de Saul' Itaire était composée de shamans de la Tribu des Sables et de Marcheurs des Ombres. Le groupe disposait de nombreuses informations sur le camp, il était donc facile de l'attaquer.|Avec l'aide du Guerrier de Movèzerbe Ornen, sauvé par Saul' Itaire et conscient d'avoir fait fausse route, les Marcheurs des Ombres trouvèrent un moyen pour libérer Shawnba à l'aide d'un Totem Branche Démoniaque. Le Gardien Éternel allait leurrer les Drakai et les attirer hors du camp pendant que Risshin s'occuperait de sauver Shawnba.

Malheureusement, le plan de Risshin échoua. Giggs, le Chef de Movèzerbe, se saisit du totem et l'utilisa pour extraire le pouvoir de Shawnba. Risshin demanda au Gardien Éternel d'éliminer Giggs, et après un terrible combat, le Gardien parvint à occire Giggs.|
257|Vallée de la Mort|Section 3 : La Prison Ossuaire|Pendant l'embuscade des Movèzerbe au camp Œil Furieux, le Grand Shaman Stedloh était absent. Ingengtai, le Capitaine Chevalier, annonça au Gardien Éternel qu'il savait où se trouvait Stedloh. Il pensait que l'Empire Heldentod avait kidnappé le shaman pour l'emmener au labo. Là, ils comptaient mener des expériences sur lui et extraire son pouvoir.

Ingengtai téléporta le Gardien Éternel au labo au sein de l'Empire Heldentod pour y chercher le shaman. |Le Gardien Éternel tua les kidnappeurs de Stedloh et sauva le shaman, qui annonça que son pouvoir avait été extrait à des fins militaires. Stedloh demanda au Gardien Éternel de pourfendre l'Expérience 627 et l'Arme Expérimentale qui avaient absorbé son pouvoir. 

Après que le Gardien Éternel eut éliminé ces abominations, Stedloh regagna ses pouvoirs et retourna à la Vallée de la Mort. Il demanda au Gardien Éternel d'encourager la Tribu des Sables à avoir la foi, ils pouvaient encore sauver l'Esprit Saint.|
258|Vallée de la Mort|Section 4 : Retour du Sacré|L'opération arriva à sa fin et le Gardien Éternel tua Giggs, le Chef de Movèzerbe, puis libéra Shawnba. Pendant ce temps, l'équipe à la recherche la force qui corrompait le pouvoir de la Tribu des Sables fit d'étranges découvertes.

Cette équipe de recherche, menée par le Promeneur des Âmes, Skol, et Oldettia le Maître des Ombres, trouva une étrange source d'énergie au sein de Chagrin. Saul' Itaire, le Gardien des Ombres, demanda au Gardien Éternel de se rendre à Chagrin pour collecter des informations.|Oldettia dit au Gardien que le Roi Anéanti Antor était derrière les récents événements. Il voulait extraire le pouvoir de l'Esprit Saint et l'utiliser pour réveiller les esprits maléfiques dans la Vallée de la Mort.

Pour arrêter la cérémonie sinistre d'Antor, le Gardien Éternel terrassa le démon invoqué par Antor et la Statue Ange de l'Abysse, Moa, 
à Chagrin. Le Gardien Éternel affronta aussi Quyion, l'Esprit Esclave, et fut forcé de l'anéantir.

Le Gardien Éternel annonça à Oldettia la mort tragique de Quyion. Sous le choc, Oldettia pria le Gardien de punir Antor.|
259|Vallée de la Mort|Section 5 : Guillotine|Oldettia et Skol pensaient qu'une puissante force allait bientôt se réveiller à Guillotine. Oldettia demanda alors au Gardien Éternel d'aller à Guillotine pour y trouver le Prophète des Sables, Bérina, qui avait disparu pendant la recherche d'Antor . 

Le Gardien localisa Bérina. Elle expliqua que le pouvoir appartenait à Gaddis, le Monstre Sacré. La bête usait autrefois de sa force pour le bien, mais après que certaines personnes l'eurent corrompue, elle commença à vouloir détruire la race humaine. Les Esprits Saints entreprirent de la sceller pour éviter la catastrophe.

Bérina avertit le Gardien Éternel qu'il fallait se préparer à un combat épique contre Gaddis.|En allant interrompre le rituel d'Antor, le Gardien Éternel tua le gardien de cérémonie, Dylon, ainsi que Moa, la Statue Ange de l'Abysse qui servaient de gardes. Le Gardien Éternel élimina ensuite Antor lui-même.

La cérémonie ne fut pas interrompue pour autant, le sceau du Roi des Esprits Saints avait déjà été brisé. Une partie de l'âme du Roi s'était évaporée dans le monde et il fallait la réunir à nouveau pour sceller le Roi.

Le Gardien Éternel eut raison de l'âme du Roi et la ramena. Bérina demanda au Gardien d'apporter l'âme d'Oldettia. Elle promit que les Marcheurs des Ombres resteraient dans la Vallée de la Mort pour aider la Tribu des Sables à reconstruire leurs maisons. |
260|Vallée de la Mort|Livre : Horreurs de la Vallée|Le renommé auteur de récit d'épouvante Klislo a écrit cette compilation d'histoires horrifiques impliquant la Vallée de la Mort.

Le premier chapitre de ce livre parle d'un fantôme de la Vallée de la Mort qui avait pris la forme d'un villageois. Le second chapitre raconte une histoire d'une cloche mystérieuse et d'un héros nommé Carrington. Le dernier chapitre conte le récit d'un homme appelé Alistair qui traversait la Forêt des Tristes Pierres.

Toutes ces histoires sont basées sur des faits réels, bien que Klislo les déformât quelque peu. Les récits sont à la fois saisissants et effrayants.|Vous avez lu les histoires d'épouvante populaires de la Vallée de la Mort et vous en avez eu froid dans le dos. Cependant, vous saviez que vous étiez plus fort que ces villageois qui ont vécu ces terribles histoires.   

Néanmoins, vous avez vaillamment rendu hommage aux courageuses personnes qui vivaient dans les conditions difficiles de la Vallée de la Mort.|
261|Vallée de la Mort|Livre : Le Roi de la Peste Noire|Cette histoire relate les hauts faits du Roi de la Peste Noire, un héros de la Vallée de la Mort. Jord, le protagoniste de l'histoire, a été divinisé pour avoir été le sauveur des Drakai. En ce temps, la Vallée de la Mort était divisée en plusieurs tribus Drakai en guerre.

La plupart des Drakai ne prêtèrent pas attention à la prophétie. Jord a toutefois laissé tout le monde sans voix devant ses exploits guerriers. Ces actes héroïques seraient bientôt connus à travers tout le pays.|Jord devint le chef de la tribu et conquit les autres tribus. Il était considéré comme le plus grand Drakai de son époque.

Une mystérieuse peste apparue soudain et frappa la tribu de Jord. Il réalisa que la Peste Bestiale décimait les siens et allait bientôt menacer toute la vallée. 

Jord décida alors de se sacrifier pour sauver son peuple. Il était, comme la prophétie l'avait annoncé, le sauveur des Drakai. Il est toujours célèbre pour ses prouesses au combat et son grand cœur.|
262|Plaine Fleurie|Section 1 : Bataille de l'Ipomée Blanche|La Plaine Fleurie est un endroit magnifique situé à l'est du Continent du Centre. De jolies fleurs blanches qui tapissent les champs et deux villes très agréables vous attendent. Vous êtes arrivé à Fira en traversant la rivière en montgolfière.

Brunhilda, la Lady Lunaire, vous a parlé de la situation difficile à laquelle doit faire face Fira. Pour aider la femme et la ville qu'elle aime tendrement, vous avez décidé d'aller aux Marches Lunaires pour voir si vous pouviez alléger la situation. |Après avoir chassé les Vautours à Grandes Griffes et les Vautours à Plumes qui encerclaient les Marches Lunaires, vous avez expliqué le pourquoi de votre visite au Doyen du Hall Lunaire, Jant. Il vous a accueilli chaleureusement.

Vous avez ensuite visité le coin avec les villageois pour comprendre un peu les effets de la croissance de Pétaletordu sur la Plaine Fleurie. Avec l'aide des habitants, vous avez trouvé la source des problèmes aux Marches Lunaires et avez vaincu Irise, l'Iris fuyante.

Jant vous a remercié et s'est engagé à mettre un terme à l'expansion de la Forêt Pétaletordu.|
263|Plaine Fleurie|Section 2 : Brumes mystérieuses|Le Chef pâtissier Gââtoh vous a expliqué que vous pouviez trouver toutes les informations nécessaires sur les étranges évènements à Oiran, une ville au nord de la Plaine Fleurie.

En suivant le conseil de Gââtoh, vous vous êtes dirigé au nord pour livrer une lettre à Kimgild, le maire d'Oiran. Sur le chemin, vous avez traversé les Marches Lunaires et avez remarqué que tout était rentré dans l'ordre.

Un peu plus tard, dans la Forêt des Songes, vous avez tué le Monstre Gemme Élémentaire et le Monstre Cristal Élémentaire, ce qui rend les routes entre Oiran et Fira un peu plus sûres.|Vous avez rencontré le maire Kimgild, à Oiran. Elle a voulu vous aider mais a d'abord souhaité que vous vous occupiez de quelques petits problèmes auxquels la ville était confrontée.

Vous avez aussi aidé le Chevalier Raven, Lyran le Poète Nomade et Dulco la Vendeuse de Bonbons à résoudre des problèmes. Vous avez finalement réussi à vous débarrasser de l'homme à l'origine de ces problèmes. Vous avez remarqué que ces problèmes étaient liés aux étranges phénomènes de la Plaine Fleurie. 

Raven a finalement découvert l'origine des mutations infectieuses dans la Plaine Fleurie, elle vous a demandé de vous tenir prêt.|
264|Plaine Fleurie|Section 3 : Le camp Pétaletordu contre-attaque|Pour continuer à enquêter sur les étranges phénomènes de la Plaine Fleurie, le Gardien Éternel a suivi les directives de Raven et a quitté Oiran pour rencontrer un vieil ami de Raven, un magicien nommé Zakos.  

Raven aurait voulu arrêter ces mutations par elle-même, mais devait protéger Oiran. Elle a donc demandé au Gardien de mener l'enquête en son nom.

À en juger par les égouts, la Plaine Fleurie n'en avait plus pour très longtemps. Il fallait agir vite.|Le Gardien a rencontré Zakos, le vieil ami de Raven. Les deux ont discuté pour savoir comment s'occuper du monstre dans le Camp Pétaletordu.

Après avoir écrasé un monstre créé de toute pièce, le Gardien Éternel réalisa que les phénomènes anormaux de la Plaine Fleurie étaient l'oeuvre d'un scientifique fou appelé Mustachio.

Pour finir, le Gardien a réussi à le vaincre et à sauver la Plaine Fleurie du désastre. |
265|Plaine Fleurie|Livre : Les Muses de l'Adoration|Ce livre est en fait le journal intime d'un poète célèbre, Tercet. Tercet parle dans ce journal de sa fille adorée, Adelle. Quel dommage qu'il ait arrêté d'écrire de la poésie après la mort de sa femme.

Il abandonna l'écriture pour prendre soin de sa fille. Il avait pour elle beaucoup d'affection. Ce journal a été écrit après qu'Adelle se soit mariée avec l'homme qu'elle aimait. |Tercet retourna dans la Plaine Fleurie. Il voulait retrouver une certaine quiétude en passant du temps dans les champs fleuris d'autrefois. Il apprécia de voir le petit Pioupiou courir le long de la rivière et la douce lueur des Marches Lunaires pendant la nuit.  

Finalement, Tercet passa du temps avec Pioupiou. Il posa son stylo et s'endormit contre Pioupiou dans la Forêt des Songes. |
266|Plaine Fleurie|Livre : Dernières Nouvelles d'Oiran|Les Dernières Nouvelles d'Oiran est un journal lu par tout le monde pour avoir les dernières nouvelles de la Plaine Fleurie.

Lire ce journal vous donnera un bon aperçu de la vie à Oiran. Vous aurez connaissance des étranges événements récents et des nouvelles les plus fraîches. Le premier article traite d'une inquiétante maladie appelée le Syndrome Foldingo. |Après avoir lu les Dernières Nouvelles d'Oiran, vous avez réalisé que vous deviez vous méfier de la Dryade Maléfique et de la Dryade Bénie. Vous avez aussi appris aussi que les Fantômes du Crépuscule et les Goules d'Égout avaient tendance à kidnapper les gens.  

Vous avez également lu d'intrigantes histoires sur les Statues Spectrales et sur les Soldats de la Grosse Plume ainsi que sur la menace des Âmes de l'Arbre Perplexe et des âmes de l'Arbre Énigmatique. Vous n'arrivez pas à croire qu'on puisse avoir autant d'informations utiles de la part d'un journal.|
267|Falaise des Grands Vents|Section 1 : Tactiques d'une petite ville|À la Falaise des Grands Vents se trouve un grand phare, près de la jetée. Non loin du phare s'étend la ville de Kalouma, sur cette ville prospère planait une grande menace.

L'armée de monstres du Prince du Fléau était apparue et s'était emparée du Temple de la Rose, un lieu sacré pour les Chevaliers de la Rose de la Falaise des Grands Vents. Utilisant ce lieu comme base avancée dans l'ouest, l'armée du Prince du Fléau et les pirates à l'est avaient encerclé Kalouma.   

Athéna Marie espérait que le Gardien Éternel puisse rapidement arrêter le Prince du Fléau et son armée qui occupaient Falaise des Grands Vents. |Le Gardien Éternel alla trouver le Chevalier de la Rose Hyluce qui avait mordu la poussière en protégeant le Temple de la Rose. Hyluce mentionna le fait que les gens de Kalouma avaient refusé l'aide des Chevaliers de la Rose car ils ne leur faisaient pas confiance.

Avec l'aide d'Hyluce et du Gardien Éternel, Kalouma contra finalement l'invasion de l'armée du Prince du Fléau. Dans le même temps, le Capitaine en Chef Untolye saccagea le camp des pirates qui étaient trop concentrés sur l'attaque de la ville.

Après avoir vu ce que les Chevaliers de la Rose avaient fait pour la ville, les habitants de Kalouma s'excusèrent pour leur mauvais jugement et accueillirent les Chevaliers de la Rose à bras ouverts.|
268|Falaise des Grands Vents|Section 2 : Vengeance absolue|Avec l'aide des Gardiens Éternels et des Chevaliers de la Rose, les forces encerclant Kalouma s'étaient retirées. Le timing était parfaitement choisi pour se débarrasser des pirates.

Le Capitaine en Chef Untolye proposa d'aider le Gardien Éternel à tendre une embuscade aux pirates, il les détestait vraiment. Il demanda aussi au Gardien d'apporter le Graphique Météorologique de la Falaise des Grands Vents à la personne en charge des opérations, le Maître des Ombres Acksay.

Après avoir attentivement étudié le graphique, ce dernier ébaucha un plan efficace pour prendre les pirates en embuscade.|Grâce au coup de main du Gardien Éternel, l'équipe reprit le phare aux pirates.

Aguash, le Maître des Ombres, recommanda au Gardien Éternel de tendre un piège à Tinri, le Capitaine du Mât Noir, en dressant la bannière des pires ennemis des pirates. Supprimer le capitaine des pirates mit définitivement fin au règne de terreur des pirates.

Après la victoire du Gardien Éternel, Acksay annonça que le temps était venu d'expulser une bonne fois pour toute le Prince du Fléau de la Falaise des Grands Vents.|
269|Falaise des Grands Vents|Chap 3 : Cap Hurlant|Après avoir découvert le bastion des pirates du Mât Noir au Cap Hurlant, la ville de Kalouma envoya des troupes spéciales pour les anéantir.

À peine arrivé au Cap Hurlant, le Gardien Éternel remarqua que le capitaine des troupes, Kelch, était couvert de boue, le regard désespéré.

Il lui expliqua que son bateau avait littéralement explosé sous la force terrible des vagues, et que la troupe entière avait perdu connaissance. De plus, leur équipement avait sombré dans l'océan. Tout dépendait du Gardien à partir de maintenant.|Kelch et le Gardien Éternel brisèrent les connections entre les pirates survivants et le Prince du Fléau. Ils détruisirent aussi les armes des pirates.

Le Gardien Éternel retourna à Kalouma et rapporta au maire Honurn la victoire sur le chef des pirates. Sans oublier de faire l'éloge de Kelch, comme ce dernier lui a demandé.

Honurn était soulagé des nouvelles. Mais elle se sentait aussi préoccupée par les relations entre sa petite-fille, Pia, et le Chevalier de la Rose Hyluce.|
270|Falaise des Grands Vents|Section 4 : Rose sanglante|Après la déroute des pirates, Hyluce commença à monter une autre armée pour s'occuper des troupes du Prince du Fléau et les dégager de la Falaise des Grands Vents.

Hyluce demanda au Gardien de dénicher un guerrier anonyme portant une armure noire. Celui-ci bloquait le seul passage entre Kalouma et l'armée du Prince du Fléau au nord, mais personne ne connaissait ses réelles intentions.

Le Gardien Éternel s'arrêta devant le chevalier, qui se tenait parfaitement immobile, et se demanda s'il s'agissait d'une statue. Soudain, une voix rauque résonna dans la tête du Gardien Éternel. |Après s'être entretenu avec le chevalier, le Gardien comprit ses intentions : il avait promis de protéger Kalouma du Prince du Fléau.

Cependant, le chevalier ne se souvenait de rien d'autre hormis cette promesse. Il détestait Kalouma, et pourtant il s'engageait à protéger la ville en risquant sa vie. Ce conflit rongeait le chevalier.

À la demande du chevalier, le Gardien Éternel alla trouver le Chevalier de la Rose Feymbur et l'aida à retourner au Temple de la Rose. Le Gardien Éternel apprit que le Prince du Fléau voulait mettre la main sur le Sceau Galactique dans le Temple de la Rose et s'en servir pour invoquer un démon.  |
271|Falaise des Grands Vents|Section 5 : Profondeurs de Siècle|Le Chevalier de la Rose Feymbur informa le Gardien Éternel que le Prince du Fléau avait choisi d'invoquer cet ancien démon à la forteresse de Siècle.

Feymbur téléporta le Gardien jusqu'à Simeh, le chevalier qui avait trouvé les premières traces du Prince du Fléau. Simeh était un expert pour rechercher des vagues spirituelles. Il essayait de trouver un moyen d'interrompre le rituel d'invocation.|Peu après que le Gardien Éternel eut tué le Monstre Maléfique Newgage, invoqué par le Prince du Fléau, Simeh trouva le défunt Chevalier de la Rose Roberto, un chevalier qui se sacrifia pour que les autres puissent s'enfuir du Temple de la Rose.

Le Prince du Fléau avait torturé Roberto et l'avait réduit en esclavage. Le Chevalier de la Rose Simeh ne put supporter cette tragédie et s'effondra. 

Le Gardien Éternel mit fin aux souffrances du Chevalier de la Rose Roberto puis terrassa Fanning, le Prince du Fléau, ainsi que Farfa, l'Archidémon de l'Abysse, une créature venue d'un autre monde après une invocation. Le Gardien Éternel mit finalement un terme aux plans machiavéliques du Prince du Fléau.|
272|Falaise des Grands Vents|Livre : Manuel de la Sarbacane|Ce manuel donne toutes les instructions pour fabriquer une sarbacane. Il décrit en détail comment se procurer et utiliser des matériaux locaux comme les plumes d'Oiseaux de la Lueur de la Falaise des Grands Vents.

Ce mode d'emploi explique aussi les mécanismes de la sarbacane et décrit plusieurs techniques d'utilisation. Ce livre est indispensable si vous voulez survivre dans le monde sauvage.|Après avoir lu ce manuel, vous vous empresserez de fabriquer la vôtre. Malheureusement, vous ne pouvez pas simplement acheter les outils nécessaires au bricorama du coin.

Vous avez ramassé une douzaine de morceaux de bambous mais êtes incapable de récupérer le venin des Raies Démoniaques Abyssales. Vous avez refusé d'abandonner car vous savez qu'en persévérant un peu, vous allez y arriver.|
273|Falaise des Grands Vents|Livre : Les Aventures d'Elis|Elis de Kalouma a écrit ce livre. L'action se passe avant que le Prince du Fléau et son armée n'occupent le Temple de la Rose. La Falaise des Grands Vents n'avait jamais connu de menace aussi terrifiante.

Alors qu'Elis se baladait dans le village, il surprit des adultes en train de parler des exploits des Chevalier de la Rose. Après en avoir entendu davantage sur les Chevaliers de la Rose, Elis ne put s'empêcher de les idolâtrer. Il espérait un jour devenir Chevalier de la Rose.

Elis relate les fantastiques aventures qu'il aurait s'il était Chevalier de la Rose.|Sa mère ne le voyait pas du même œil, mais Elis décida quand même d'aller visiter le Temple de la Rose. Malheureusement, il arriva après la fermeture, il décida donc de passer la nuit dans le coin. 

Elis trouva un arbre pour s'y reposer. Soudain, il aperçut son idole, le Chevalier de la Rose Maliu, sortir du Temple de la Rose en tenant Riolla par la main. Il ne put résister à la tentation de les suivre. 

Elis espérait ne pas se faire remarquer alors qu'il espionnait leur rencart romantique, mais les chevaliers le grillèrent en beauté. Il partit en courant afin d'éviter une correction et rentra chez lui.|
274|Légende du Chevalier Dragon |Section 1 : Légende du Chevalier Dragon |Zephyrinus vous a appris qu'une invitée d'un autre pays était venue chercher l'aide de la Curie. La Curie a assigné deux Chevaliers Templiers pour l'aider, mais d'après leur rapport, ce ne fut pas un succès. 

Zephyrinus vous a demandé d'aider la Curie. Il voulait que vous obteniez d'abord une Promesse du Chevalier Templier auprès d'Amos avant de vous rendre aux Plaines Dorées pour y trouver Siborg. Ce dernier devant vous mettre au courant de l'avancée de la mission secrète. |Quand vous êtes arrivé aux Plaines Dorées, Siborg vous a dit que Marl était blessé et inconscient. Et encore pire : Kimmy avait disparu. Vous l'avez cherchée à Opéra dans la Forêt Arc-en-Ciel. En vous servant des infos des autochtones, vous avez réalisé que la disparition de Kimmy n'était sûrement pas une coïncidence. 

Afin d'empêcher que l'ombre n'attaque à nouveau Kimmy, vous avez décidé d'aller la chercher au Canal Tassos. Quand vous l'avez trouvée, elle vous a pris pour un ennemi et vous a attaqué. Vous avez cependant réussi à dissoudre le malentendu. 

Après avoir collecté l'énergie du Cristal Arc-en-ciel, Kimmy vous a demandé de livrer une partie d'un important document à Siborg. Kimmy avait passé un marché avec la Curie, vous saviez qu'elle n'aimait pas leurs plans clandestins. |
275|Légende du Chevalier Dragon|Section 2 : Tablette de Pierre Mystérieuse |Il savait que vous n'aviez que peu de temps, mais Siborg a insisté pour que vous ne laissiez pas Kimmy toute seule. Il vous a demandé d'embarquer sur une montgolfière direction l'Abîme de Baram pour y retrouver Kimmy après avoir livré le document. Le Pilote Serar vous a emmené à destination. |Vu que les gros cristaux attirent les monstres, Kimmy a eu du mal à lancer des sorts pour entrer dans l'Abîme de Baram. Ça vous a pris du temps de collecter les Cristaux Enflammés. 

Kimmy a étudié le dernier emplacement sur la tablette, pas sûre de savoir quoi y incruster. Elle vous a demandé d'aller voir le Bibliothécaire Conan qui pourrait traduire l'ancien manuscrit et peut-être découvrir des indices. Conan vous a révélé que le manuscrit concernait la légende des Gardiens Éternels. 

Il vous a arrangé un rendez-vous avec le Médecin Légiste à la Mine du Village Andrew. Le légiste vous a expliqué que le cristal bleu était le dernier objet pour réveiller l'ancien dragon. |
276|Légende du Chevalier Dragon|Section 3 : Destin de Cristal |Bess a mentionné que les Gardiens Éternels ont été trouvés dans les cristaux bleus de la Mine du Village Andrew. Elle vous a donné une pelle, espérant que vous pourriez déterrer de brillants cristaux bleus pouvant réveiller l'ancien dragon. |Une fois les cristaux collectés, le Prince du Fléau vous a pris en embuscade. Le combat a été difficile, mais vous avez réussi à le vaincre. Bess, qui a assisté au combat, a eu peur que vous ou Kimmy ne deveniez des cibles. Elle vous a demandé d'apporter le cristal à Conan. 

En examinant le cristal, Conan vous a expliqué que des gens ont essayé de contrôler l'ancien dragon avec des sorts, mais personne n'a jamais réussi. Cependant, le cristal bleu est la véritable clé pour réveiller le dragon. Et en tant que Gardien Éternel, vous étiez la personne idéale pour cette mission. 

Soudain, vous avez vu quelque chose dans le cristal. Kimmy disait à l'ancien dragon qu'elle voulait être son sacrifice. Paniqué, vous avez dû prendre une décision rapide. |
277|Légende du Chevalier Dragon|Section 4 : Réveil de l'Âme du Dragon |Quand vous êtes arrivé aux Plaines Dorées, Siborg avait l'air préoccupé. Kimmy était là plus tôt, elle vous a laissé une tablette. Siborg n'était pas très à l'aise de devoir vous donner un objet aussi important. 

Vous avez tout de suite su qu'incruster le cristal bleu dans la tablette vous téléporterait vers Kimmy. Siborg, vraiment très inquiet pour Kimmy, vous a demandé d'agir aussi vite que possible. |Vous êtes arrivé auprès de Torreyace et avez réussi ses tests. Mais il était déjà trop tard, Kimmy était devenue son sacrifice. Vous avez vu Kimmy devenir de plus en plus faible sous vos yeux. 

Vous avez rapporté la mauvaise nouvelle et le document de Kimmy à Siborg. Siborg, le cœur brisé, vous a demandé d'apporter le document à Amos et Zephyrinus. 

Un peu plus tard, Amos a annoncé qu'Aven était en alerte rouge. Vous avez également appris de Zephyrinus que Kimmy était la princesse de l'Empire Heldentod. Tout cela prit alors un nouveau sens : elle voulait que vous sauviez son peuple et était prête à mourir pour cette cause. |
278|Vallée de Vulcain|Sec. 1 : Malheur soudain |La voix familière d'Athéna Marie vous a appris que de grands changements étaient en cours dans la Vallée de Vulcain. Vous avez suivi ses instructions et avez filé du Pic de Noireflamme vers la Vallée de Vulcain pour rencontrer Rora, la Corsaire vétéran. 

Elle vous a expliqué que la vallée était autrefois calme et paisible. La plupart des créatures y vivant étaient dures et cruelles, mais la plupart ne quittaient jamais leur habitat naturel, tous vivaient en harmonie dans la Vallée de Vulcain. Mais un jour, tout a changé, les créatures sont devenues violentes et agressives. Les vies des résidents de la Vallée de Vulcain étaient en danger. |Après avoir entendu tout ça, vous avez décidé d'aider Rora et les chercheurs. Vous avez d'abord dû vous débarrasser des crabes géants autour de la Cabane et récupérer du sang de dragon pour fabriquer un sérum spécial. 

Vous avez aussi aidé Sally à récupérer du matériel d'équipement dans leur campement dévasté. Cet instrument allait permettre de continuer des recherches médicales très importantes. Vous avez également repoussé de terribles monstres, sauvant ainsi de nombreuses vies. |
279|Vallée de Vulcain|Sec. 2 : Secours et renversement |La Cabane du Chasseur n'était plus en danger, mais le Chef d'équipe Arthur et le Corsaire Vétéran Obspho n'étaient pas encore rentrés de leur expédition à la recherche des autres membres de l'équipe. Matisse était vraiment inquiet de la tournure que prenaient les événements. 

Après avoir revu leur plan de départ avec Rora, vous avez décidé de partir à leur recherche. |Vous avez bien étudié les paramètres de recherches et analysé les directions qu'ils auraient bien pu prendre. Vous avez fini par tomber sur Arthur et Obspho, ils étaient tous les deux blessés. 

Vous leur avez dit que tout le monde était sain et sauf à la cabane. Ils vous ont alors informé avoir posé des pièges pour attraper le monstre géant qui sévissait dans les environs. Le monstre a réussi à détruire les pièges et s'est enfui vers les profondeurs du Coteau Cryptique. |
280|Vallée de Vulcain|Sec. 3 : Grotte Non Répertoriée |Apparemment, Arthur et Obspho avaient prévu de surveiller l'entrée de la grotte où ils avaient posé le piège jusqu'à ce que la bête se montre. Vous avez vu des traces des chercheurs perdus, Claire et Eddy, à proximité. Ils voulaient absolument résoudre le mystère et vaincre le monstre. 

Vous n'aviez donc d'autre option que de vous rendre au Coteau Cryptique et de sauver le couple avant que la bête ne les trouve. |À l'entrée de la grotte, vous avez trouvé Claire qui était en larmes, effondrée et inconsolable. Elle vous a expliqué qu'un sceau avait été sévèrement endommagé. Son mari, Eddy, est parti réparer le sceau mais elle craignait pour sa sécurité. Elle vous a demandé de suivre sa trace et le trouver. 

Malheureusement, vous êtes arrivé trop tard, vous êtes tombé sur le corps du chercheur, dévoré par le monstre. Vous avez décidé d'affronter Ulysse, le violent Démon Spirenfer vénéré par les ogres, afin d'empêcher une nouvelle tragédie. Vous l'avez vaincu puis êtes retourné voir Arthur pour lui expliquer ce qu'il s'est passé. |
281|Vallée de Vulcain|Sec. 4 : Mutinerie |Dépité, Arthur vous a donné une lettre secrète en espérant que vous puissiez la donner à Chay à la  Tour de Guet Gustgate. Il aurait voulu la remettre lui-même, mais il était trop faible pour accomplir une telle mission. 

Vous avez été étonné de voir la marque de l'Empire Heldentod sur l'enveloppe, mais vous avez décidé de suivre les instructions d'Arthur et de livrer la lettre. |Chay a parcouru la lettre d'Arthur, les sourcils froncés. Il restait distant et méfiant envers vous à cause de « l'incident » avec son mentor, mais il savait qu'il devrait laisser le passé de côté car il avait besoin de votre aide. 

Il vous a expliqué que de nombreux monstres sont soudainement apparus dans l'Empire Heldentod. L'armée rebelle a mené beaucoup de recherches sur ses bêtes, il vous a donc demandé d'infiltrer leur camp afin de réunir le plus d'informations possibles. Les preuves montraient que les ennemis étaient plus ou moins derrière tout ça : est-ce qu'ils contrôlaient les bêtes d'une façon ou d'une autre ? |
282||Sec. 5 :  Mode Guerre Mondiale|Le Marcheur des Ombres Oldettia et le Promeneur des Âmes Skol ressentirent au même moment le réveil d'une puissante force dans Guillotine. Oldettia demanda au Gardien Éternel d'entrer dans Guillotine à la recherche de la Prophète Bérina, qui s'y était perdue en suivant Antor.

Lorsque le Gardien Éternel trouva Bérina, elle lui expliqua que la source de cette étrange puissance était en fait le roi Gaddis, le jadis bienveillant Esprit Sacré. Il y a fort longtemps, le roi s'était servi du pouvoir de la lumière pour aider ses fidèles. Cependant, les sombres cœurs de son peuple étaient insensibles à ce pouvoir. Finalement, il se retourna contre eux et entreprit la destruction de ce qu'il avait jugé être une race répugnante et sans espoir de rédemption. Ce génocide ne se termina que lorsque les autres Esprits Sacrés s'unirent pour sceller ce pouvoir.

Bérina expliqua que le Gardien Éternel allait bientôt devoir affronter cet ennemi et qu'il devait se préparer au combat le plus difficile de toute sa vie.|En allant interrompre le rituel d'Antor, le Gardien Éternel tua le gardien de cérémonie, Dylon, ainsi que Moa, la Statue Ange de l'Abysse, qui servaient de gardes. Au terme de cette bataille sanglante, l'énergie de l'esprit fut absorbée et il se transforma en le Roi Anéanti Antor.

Ces batailles ont ralenti le Gardien Éternel et il ne put arrêter à temps le rituel d'Antor. Le sceau qui retenait le Roi Esprit Sacré était fortement endommagé et une partie de la manifestation du Roi Esprit Sacré parvint à se glisser à travers une fissure dans le sceau. Le Gardien Éternel apprit de Bérina que tous les Esprits Sacrés libérés s'étaient réunis au même endroit. Ils voulaient sceller à nouveau le maléfique Roi Esprit Sacré, mais le Gardien Éternel allait pendant ce temps devoir vaincre son incarnation physique.

Au terme d'une bataille ardue, le Gardien Éternel est finalement parvenu au bout du Roi Esprit Sacré. Bérina fit le vœu d'aider les Esprits Sacrés à sceller le Roi de nouveau. Elle demanda au Gardien Éternel de ramener l'incarnation du Roi Esprit Sacré à Oldettia. Oldettia se confondit en remerciements et révéla que les Marcheurs des Ombres allaient rester dans la Vallée de la Mort pour aider la Tribu des Sables des Drakai à reconstruire leur patrie.|
283|Vallée de Vulcain|Livre : Écosystème de la Vallée de Vulcain |Les notes de l'écologiste Danu concernaient principalement ses voyages, mais il y avait également des références à des études écologiques. 

Il est venu à la Vallée de Vulcain pour ses célèbres sources volcaniques et pour y observer les créatures rares qui y vivent ainsi que pour sa belle nature ravagée. |« La première nuit où il est arrivé dans la Vallée de Vulcain, Danu et un chasseur local sont allés chercher des crabes. Les autochtones mangent la viande de crabe et utilisent leurs carapaces résistantes pour construire des maisons. » 

« Grand-mère lui a expliqué que des organismes étranges habitent le forêt, la légende raconte que ces créatures ressemblant à des plantes protègent la forêt et sont armées de pétales aiguisés ainsi que de puissants tentacules pouvant étouffer même les hommes les plus résistants. » 

« Danu arriva enfin au Bourbier Circulaire. Là, il observa les tamanoirs se recouvrir de boue pour se camoufler avant d'attaquer les fourmis. Il a également vu quelque chose ressemblant à des hommes entièrement recouverts de boue. » 
|
284|Vallée de Vulcain|Livre : Bataille du Dragon - Chapitre final|Ce livre relate l'histoire du prince aîné, un homme qui est devenu roi et qui a mené une armée contre le deuxième prince auto-proclamé, son frère jaloux. Moi, Général Barton, déclare que chacun des mots de ce livre est vrai. 

Après des années de poursuite, nous sommes arrivés au Canyon Sinistre de la Vallée de Vulcain. Nous avons vu le campement de l'ennemi, mais on a dû se battre contre des tritons avant d'arriver à destination. |Après un rude combat, nous avons réussi à vaincre les tritons et sommes arrivés aux sources chaudes. Cette nuit-là, nous avons monté un camp et nous sommes reposés. Mais le feu a attiré des lézards à collerette et des pangolins qui nous ont sauvagement attaqué. En repensant aux conseils de Grand-mère, je les ai fait fuir à l'aide du feu. 

On a enfin pu envahir le campement principal du deuxième prince. Tout semblait être contre nous, mais nous n'avions pas fait tout ce chemin pour reculer. Le combat fut long et difficile, notre ennemi était têtu. 

Mais toute bataille a une fin. Le Roi et le deuxième prince se rencontrèrent pour discuter et le Roi, le cœur lourd, tua son frère. Je n'oublierai jamais cette tragique bataille. |
285|Plaines du Levant|Sec. 1 : Révolte ! |En parcourant les Plaines du Levant en aéronef, vous avez regardé en bas pour voir de grands champs et d'énormes portes menant à un fort. Après avoir atterri, vous avez demandé à un soldat quelle était la situation au fort, mais il était réticent à trop vous en dire. 

Alors que vous alliez partir, frustré de ne pas recevoir de réponse de la part du soldat, il vous rappela. Il avait besoin de votre aide. Apparemment, un Fruticosa ravageait le pays et l'armée n'en venait pas à bout. Vous deviez donc tuer le monstre. |Après avoir résolu les problèmes du soldat, il vous a remis une lettre en vous disant d'attendre une femme à la porte. Vous êtes allé à la porte et là, on vous a appelé « André ». Vous étiez perturbé mais vous avez joué le jeu. 

Vous avez suivi une femme, Dame Kelly, dans le château. Elle vous a expliqué que l'Empire Heldentod faisait face à une révolte interne et à une invasion. Le Prince du Fléau devait être éliminé et la rébellion menaçait le semblant de paix. Kelly vous a demandé de l'aide, quelque chose dans sa demande désespérée vous a convaincu de le faire. 

Dame Kelly vous a demandé de vous rendre dans une ferme où sont rassemblés des villageois en colère. Là, vous avez repéré l'Assassin Kasam et l'avez éliminé. Kelly était ravie d'apprendre votre succès mais n'était pas encore apaisée. Apparemment, elle avait des preuves que la révolte était soutenue par des gens haut-placés. Face à une telle trahison, elle avait besoin de votre aide plus que jamais. |
286|Plaines du Levant|Sec. 2 : Mercenaires |Quelqu'un vous observait, Dame Kelly devait continuer son petit jeu et vous glisser discrètement un message. 

Une fois qu'elle fut partie, vous avez ouvert la note. Sa voix résonnait dans vos oreilles alors que vous lisiez, elle voulait que vous détruisiez les terribles Dragons Écaillés et Toxiques. |Après avoir détruit les dragons, vous avez regardé la note de Dame Kelly et avez découvert que l'armée rebelle était derrière tout ça. Vous avez suivi les instructions et vous êtes dirigé vers le camp Tectonia. Vous y avez trouvé Akafon mais il ne correspondait pas vraiment à la description de Kelly. 

Après lui avoir parlé, vous vous êtes rendu compte qu'il était un maître de l'infiltration et s'était déguisé pour tromper les rebelles. Pas berné, vous avez détruit l'armée rebelle et les mercenaires dans les Mines d'Heldentod. Vous vous êtes ensuite rendu au fond de la mine pour éliminer Bartléby. 

En arrivant au campement de la deuxième armée de Tectonia, la lettre à la main, vous avez trouvé le confident de Dame Kelly, l'Agent des Affaires Militaires Kuddy. Vous lui avez donné des preuves sur Bartléby et il vous a dit qu'il ferait son rapport à Kelly. |
287|Plaines du Levant|Sec. 3 : La vérité sur la révolte |Après avoir reçu l'information, Kuddy semblait mal à l'aise. Il a expliqué qu'un chariot de provisions de l'Empire Heldentod a été attaqué par des Gros Grizzlys, beaucoup de ses soldats ont été blessés et toutes les rations ont été volées. 

L'armée n'avait pas les ressources nécessaires pour envoyer un autre chariot, les troupes risquaient de souffrir de malnutrition et de manquer de matériel. Kuddy vous a demandé de massacrer les Gros Grizzlys et de retrouver les provisions. Il vous a aussi demandé de ramener de la viande d'ours. |Après avoir résolu le problème des rations, Kuddy a reçu une lettre par pigeon voyageur indiquant que le Cristal Bleu que l'Empire voulait envoyer sur la ligne de front avait été volé par l'armée rebelle. L'information était fiable car elle venait de la Princesse Kimmy et avait été obtenue à grand coût. Le Cristal Bleu, expliqua-t-il, était le seul moyen de battre le Prince du Fléau. 

Afin de protéger l'esprit de Kimmy, vous vous êtes associé avec Kuddy et vous êtes dirigé vers la Colline du Nid de Dragons où se cachait les mercenaires. Vous avez fait de votre mieux pour vaincre les ennemis. 

Après avoir décodé la lettre de Dame Kelly, Kuddy vous a expliqué qu'elle savait quels officiels étaient impliqués dans la révolte. Vous deviez alors vous occuper du Mercenaire Benton. Au deuxième camp, vous avez dû vous occuper d'un autre traître : Dascha Adwin, le duc du Temple de la Rose. |
288|Plaines du Levant|Sec. 4 : Temple de la Rose |Grâce à vos valeureux efforts, Kuddy et ses hommes ont pu reprendre le Cristal Bleu aux mercenaires et ont éliminé une partie de leurs forces. 

Alors qu'il était en train de finir son rapport pour Dame Kelly, Kuddy a appris par les éclaireurs que les mercenaires étaient en train de se regrouper, prêts à lancer une nouvelle attaque. Furieux, il a décidé de leur donner une bonne raclée, encore une fois. Il vous a donné la lettre en vous demandant de la remettre à Kelly. |Après avoir lu le rapport de Kuddy, Dame Kelly vous a demandé de juger la sévérité de l'incident. Elle s'est rendue au fort et a rapporté les nouvelles à l'Empereur Eric. 

Dame Kelly a montré les preuves des officiels mutins à l'Empereur et lui a parlé des mercenaires ainsi que du Cristal Bleu volé. L'Empereur Eric était furieux d'apprendre cette trahison. Il a tout de même pu contenir sa rage le temps de vous remercier pour votre dur labeur. 

À la demande de Dame Kelly, vous avez tenté de supprimer les officiels responsables de la révolte au Temple de la Rose. Après une dure bataille, vous avez vaincu les ennemis et avez fait votre rapport à Kuddy. |
289|Plaines du Levant|Livre : La Fille des Arbres |Ce livre raconte l'histoire d'une adolescente, Euptellea. La jeune femme s'occupait de sa mère malade et ramassait des herbes dans la forêt pour gagner de l'argent. 

Un jour, dans la forêt, elle a trouvé de la fatoua, une herbe très spéciale qui se vend à prix d'or. Euptellea s'est précipitée dessus, ignorant que cette plante attire souvent les terribles fruticosas. 

Soudain, elle s'est retrouvée entourée de ces bêtes. Immobilisée par la peur, elle pensa à sa pauvre mère, qui s'occuperait d'elle si elle venait à mourir ? |Par chance, les princes d'Heldentod, Tiento et Fede, vinrent à son secours et les trois se lièrent d'amitié. Les princes accompagnaient souvent Euptellea lors de ses excursions forestières. 

Le Prince Tiento trouvait que la jeune fille se mettait en danger à chaque fois qu'elle s'aventurait dans la forêt à la recherche d'herbes, il lui amena donc un coffre rempli d'or. Il espérait qu'elle n'aurait donc plus jamais à ramasser de l'herbe. Cependant, le même jour, le Prince Fede se présenta à la porte d'Euptellea. Les deux frères commencèrent à se disputer à propos de l'affection de leur amie. 

Dans leur querelle, ils mirent par accident le feu à la maison d'Euptellea qui tomba gravement malade à cause de la fumée inhalée. Il n'y avait rien que les princes pouvaient faire. Ils réalisèrent à quel point ils avaient été idiots. Malheureusement, apprendre cette leçon ne sauva pas la vie d'Euptellea. |
290|Plaines du Levant|Livre : Lovix le Chevalier du Chaos|Ce livre détaille les aventures de Lovix, le Chevalier du Chaos, à Heldentod. Lovix était un héros brave et altruiste admiré pour sa droiture et son talent. 

Il fut le premier volontaire pour aider lorsque des marchands furent attaqués par un dragon. Il a sauvé de nombreuses vies ce jour là, le chef des marchands, très reconnaissant, lui proposa de devenir le garde de la caravane, mais il refusa et continua son chemin. |La Princesse Nathalie de l'Empire Heldentod aimait l'aventure et était très espiègle. Un jour, elle s'est retrouvée encerclée par de terrifiants Gros Grizzlys. Lovix la sauva d'une mort certaine, mais ce ne fut pas vraiment le coup de foudre. Ils se chamaillèrent sur le chemin vers le château. 

Des rumeurs commencèrent à circuler comme quoi les mercenaires conspiraient contre Lovix à cause de sa relation avec la princesse. Un chevalier prévoyait même de le défier au combat pour l'honneur de Nathalie. 

Exaspéré par le flux sans fin de challengers et en manque d'aventure, Lovix quitta la ville. Peu de temps après, la princesse disparut. Personne ne les a plus revu depuis lors. |
291|Royaume Dévasté|Sec. 1 : Les malheurs de Kasi |En arrivant, vous avez été choqué par ce que vous avez vu. L'air était imprégné d'une odeur de chair pourrie, à vous glacer le sang. 

Vous avez fait le tour de la Station de l'Avant-garde et avez trouvé Kasi. Il a tout de suite été sur la défensive en vous voyant, mais vous lui avez expliqué la raison de votre visite et il a baissé sa garde. 

Il vous a expliqué que des monstres encerclaient le campement, rendant la vie dure aux survivants. Il vous a supplié de l'aider et vous avez accepté. |Après avoir éliminé les Démons Épineux et les Viles Démons, vous êtes retourné voir Kasi qui vous a expliqué que les Manticores et les Grizzlys Sinistres du Moulin Carbonisé étaient de dangereux adversaires, ils l'avaient en effet empêché d'envahir le territoire sud-ouest. Vous êtes donc allé là-bas pour exterminer les créatures. 

De retour au campement, Kasi vous a demandé de trouver ce qui était arrivé à la patrouille, notamment à Koumaly. Il vous a expliqué que vous pourriez vous tenir informé auprès de Florence. 

Koumaly ne se portait pas bien et le docteur militaire vous a demandé de récupérer des os et des fluides de Cannipèdes. Ces objets pourraient être transformés en médicament pour le soigner. Koumaly ingéra avec dégoût la potion préparée par le médecin et se mit à récupérer. 

Vous avez appris qu'il y avait un Cannipède rouge luisant dans un cimetière pas loin. On disait que cette bête brillait ainsi en raison d'un Cristal Rouge incrusté en lui. Vous êtes allé au cimetière pour tuer le Cannipède et récupérer le Cristal Rouge. |
292|Royaume Dévasté|Sec. 2 : Village en ruines |Après avoir décrit le lien entre le Cristal Rouge et le Prince du Fléau, Kasi a expliqué les faits avec gravité. Avant que vous arriviez au Royaume Dévasté, il avait envoyé une équipe aux Ruines Nucléaires à la recherche de survivants. Il n'a toujours pas eu de leurs nouvelles, comme si l'armée toute entière avait disparu. 

C'était Sami, l'Agent du Renseignement, qui menait cette troupe, vous saviez qu'elle était très douée et qu'elle n'abandonnerait pas sans se battre. Vous avez eu peur que quelque chose d'horrible soit arrivé à l'armée et avez décidé de partir vers les Ruines Nucléaires à la recherche d'indices. |Vous avez trouvé une Sami exténuée dans le village. Après avoir vaincu des soldats-zombies et les fantômes des villageois, elle vous a expliqué que le Maire possédait un Coffre aux Trésors gardé par des bêtes géantes. 

Après avoir vaincu les Trolls Maléfiques, vous avez trouvé le journal du Maire dans le coffre. Apparemment, le Maire avait amené le sort sur la ville car il voulait s'approprier le pouvoir du Temple Spirenfer. À cause de sa soif de pouvoir, lui et les villageois ont subi d'horribles mutations. Dans les dernières pages du journal, vous avez appris que le Maire était parti au Temple Spirenfer à la recherche de réponses. 

À la demande de Sami, vous vous êtes rendu au Temple Spirenfer à la recherche du Maire. Après avoir vaincu les tentacules à l'entrée, vous avez repéré le Maire muté et l'avez mis KO avant de retourner aux Ruines Nucléaires pour faire votre rapport à Sami. |
293|Royaume Dévasté|Sec. 3 : Temple Spirenfer |Une fois que Sami eut fini de lire le journal, la vérité a enfin éclaté. Le Maire n'était pas à la recherche de pouvoir par pure ambition. En fait, il était désespéré et au bord du gouffre après la mort de sa petite-fille, Reese. Il croyait que les anciens dieux du Temple Spirenfer pouvaient la ramener à la vie. 

Sami vous a demandé de retourner au Temple Spirenfer pour éclaircir les choses. Est-ce que les Esprits et les anciens dieux existent vraiment ? |Vous avez trouvé le fantôme de Reese dans le temple. Elle vous a expliqué que des esprits maléfiques résidaient dans le temple, leur but étant de tromper les humains et de les faire venir au temple pour les tuer. Ces créatures sauvages emprisonnaient également les fantômes pour les sacrifier au Démon Spirenfer. 

Reese vous a dit que le Démon Spirenfer était en fait Heldentod III. À ses côtés, se trouvait son fidèle allié : Kinmo, le Diacre du Péché Originel. Reese vous a demandé d'anéantir Heldentod III, ainsi faisant, les âmes et fantômes emprisonnés seraient libérés. 

Après avoir éliminé le Démon Spirenfer et ses sbires, Reese vous a demandé une dernière faveur. Elle vous a remis un pendentif renfermant une photo d'elle et de son grand-père, le Maire des Ruines Nucléaires. Vous l'avez ramené, ainsi que le journal, à Sami qui a dit qu'elle mènerait à bien la dernière requête de Sami. |
294|Royaume Dévasté|Sec. 4 : À l'aube de la bataille |Sami s'est souvenu de quelque chose d'important qu'elle devait vous dire. Apparemment, alors qu'ils s'échappaient, ils ont entendu une terrible explosion et ont vu une barrière de lumière se répandre au-dessus des terres au nord-ouest des Ruines Nucléaires. 

Sami vous a demandé de vous diriger vers la lumière car elle sentait que vous pourriez y trouver des indices sur le Royaume Dévasté. |En arrivant à la Barrière magique, vous avez rencontré Raymond, un ancien instructeur, qui affirmait que le Prince du Fléau prévoyait d'utiliser la magie du Cristal Rouge pour forcer l'ouverture de la Fissure Dimensionnelle. Raymond, grandement affaibli, a utilisé le reste de ses forces pour créer une barrière de lumière dans l'espoir d'attirer l'attention d'un Gardien Éternel pouvant lui prêter main forte. 

Vous l'avez aidé à démolir le Champosaurus et le Minotaure Rubis et ainsi faisant, vous lui avez permis de bannir l'aura maléfique qui envahissait son corps. Drainé de toute magie, Raymond vous a demandé de vous rendre à l'Escalier de Cristal et de récupérer des cristaux sur les Mâcheurs afin qu'il puisse retrouver ses pouvoirs. 

Enfin, Raymond vous a expliqué qu'un Garde surveillait l'entrée de la dimension. Il vous a donné un Cristal Bleu qui forcerait le Garde à apparaître. Une fois que vous aviez vaincu le Garde, Raymond vous a dit que le combat final contre le Prince du Fléau approchait à grands pas. Il vous a prévenu que vous auriez sûrement besoin de renforts et vous a encouragé à recruter d'autres Gardiens Éternels. |
295||Sec. 5 :  Mode Guerre Mondiale|Feymbur informa le Gardien Éternel que l'endroit où se terrait le Prince du Fléau avait finalement été découvert. Le Prince du Fléau avait dérobé le Dictionnaire Démoniaque et avait décidé que Siècle, une forteresse imprégnée d'une aura maléfique, était l'endroit parfait pour invoquer le Démon Ultime.

Réagissant rapidement à la nouvelle, le Gardien Éternel retrouva le Prince du Fléau non loin de l'endroit indiqué. Chevalier de la Rose Edena, qui maîtrisait l'art de pistage des vagues spirituelles, chercha frénétiquement un moyen d'arrêter le Rituel d'invocation.|Le Gardien Éternel parvint à détruire Newgage, le démon protecteur invoqué par le Prince du Fléau. Pendant ce temps, Edena tenta d'empêcher le Prince du Fléau d'envahir le Temple de la Rose. Roberto se sacrifia bravement pour permettre à ses camarades de s'échapper.

Le Prince du Fléau tortura l'esprit de Roberto, le ramenant d'entre les morts et le réduisant en esclavage. Edena, dévastée par cette tournure des événements, était sur le point de succomber à la dépression.

Au terme d'une lutte acharnée, le Gardien Éternel mit fin aux souffrances de Roberto puis terrassa Fanning, le Prince du Fléau, ainsi que Farfa, l'Archidémon de l'Abysse, mettant ainsi une fois pour toutes un terme aux machinations sinistres du Prince.|
296|Royaume Dévasté|Livre : Journal d'un Fou |Ce livre détaille l'étrange histoire de Toben, un homme fou. C'est le docteur MonKimmy qui l'a écrite, il a enregistré les évènements du point de vue de Toben, permettant ainsi au lecteur d'avoir un aperçu de l'esprit tordu de Toben. 

Après la mort de sa femme, Toben a commencé à avoir des hallucinations. Il voyait des choses qui avaient vraiment l'air réelles. Incapable de supporter la torture infligée par son psychisme, il a cherché de l'aide auprès du Docteur MonKimmy. Malheureusement, c'était déjà trop tard. |Un jour, Toben a vu l'image d'un fantôme tourmenter celui de sa femme. Furieux, il s'est emparé d'une hache et a achevé le fantôme. Ce n'est qu'après s'être calmé qu'il s'est rendu compte qu'il avait en fait massacré un des ses amis. Paniqué, il s'est enfui. 

Ses pensées ont commencé à se distordre et il a commencé à penser devoir retourner en ville pour sauver les habitants. Une fois arrivé, il a vu des Manticores envahir les rues, dévorant tout sur leur passage. Il massacra les bêtes avec sa hache pour découvrir plus tard qu'il avait tué des hommes innocents. 

En sanglots, il tituba jusqu'à la tombe de sa femme. Il se retrouva affamé et repéra de la nourriture à quelques pas de là. Il se mit à tout avaler goulûment et se rendit compte trop tard qu'il était en train de manger un Cannipède. La larve en lui avala son âme et il se transforma en Cannipède. Il pouvait enfin être avec sa femme dont le corps avait été dévoré par les insectes. |
297|Royaume Dévasté|Livre : Cahier du Destructeur |Ce journal raconte une histoire violente et sanglante. 

Un historien impérial était impatient de lire cette histoire, il l'a donc fait décoder par des érudits d'Heldentod. Sken Brian reçut l'accord de l'Empereur pour publier ce journal. |L'auteur se sépara de sa famille car ils ne croyaient pas assez durement à sa philosophie. Il éleva de terribles monstres, des Tentacules, près du Temple Spirenfer et les lâcha sur des innocents. 

Il utilisa ensuite sa chair et son sang pour nourrir une armée de Champosaurus. 

Après avoir été invoqué à l'Escalier de Cristal, il a gagné en pouvoir grâce au sang des Mâcheurs et du Cristal Rouge. Il absorba ses grands pouvoirs, ou plutôt essaya. Son journal s'arrête ici, personne ne sait ce qu'il est advenu de lui. |
299|Plaines d'Elos|Sec. 2 : Dangers au Palais|Le Garde Ballou pensait que le Roi de Braider était responsable de cette guerre. Les informations de la Femme de Militaire, Lola, et du Marchand de Cuir, Kant, vous ont également rapproché de la vérité. 

Quelques jours plus tôt, quelqu'un avait enlevé la Reine de Braider. Le ravisseur avait laissé derrière lui une lettre incriminant l'Empire Heldentod. Il n'était donc pas étonnant que le Roi de Braider déclare la guerre dans de telles conditions. Certains détails de la situation ne coïncidaient cependant pas. L'Empire était déjà en pleine guerre contre le Prince du Fléau. Pourquoi se rajouter des ennuis quand la situation était déjà assez compliquée ? Vous avez alors décidé de rendre à nouveau visite au Roi de Braider, déterminé à trouver des réponses. 

Alors que vous êtes entré dans le Camp Braider pour demander audience au Roi, une femme en tenue militaire Heldentod a surgi d'un coup, immobilisant tout ceux qui se trouvaient là. À voir l'expression du visage de Molman, on devinait qu'il la reconnaissait. Il avait accepté de la suivre si elle promettait de ne faire de mal à personne. |Le pouvoir de la mystérieuse femme résonnait en vous et vous pouviez sentir son immense force. Quel genre de pouvoir possédait-elle et d'où venait-il ? Même le pouvoir du plus puissant des mages Heldentod n'égalait pas le sien. Peut-être n'était-elle pas du tout d'Heldentod... Quand le prince et la princesse ont appris ce qu'il s'était passé, ils ont alors été plus déterminés que jamais. Rien ne pourrait arrêter la guerre. 

La Princesse Païsha avait remarqué la similitude entre le pouvoir de la femme et celui de Lucien. Le soupçonnant, les enfants royaux ont envoyé des soldats le capturer pour l'interroger. 

Grâce à l'aide de Ballou, vous avez localisé Lucien en premier, l'informant de la situation du Roi Molman. Étonnament, Lucien a admis qu'il était responsable de ce qu'il s'était passé. Il avait malheureusement perdu le contrôle de la situation... ... situation qui avait tourné au drame. Inquiet, Lucien vous a à nouveau demandé de l'aide. |
300|Plaines d'Elos|Sec. 3 : Météorite Extraterrestre|La clé de ce problème reposait au fond du cratère. Vous et Lucien y êtes entrés séparément, vous frayant tant bien que mal un chemin jusqu'au fond où vous êtes tombé sur une horrible créature. Avant d'avoir eu le temps de délivrer le premier coup, un homme mystérieux est soudain apparu et l'a battue devant vous. 

L'étranger vous a provoqué en duel, vous promettant de tout vous révéler au sujet de la météorite si vous arriviez à le battre. Le combat faisait rage, vous meniez, la victoire était proche, mais au dernier moment, l'homme a relâché un pouvoir pareil à celui de la femme au Camp Braider, tournant ainsi le duel en sa faveur. Votre vie ne tenait alors qu'à un fil. Vous vous débattiez en vain. 

Vous étiez sur le point de perdre mais l'homme mystérieux s'est arrêté lorsque Lucien est apparu derrière lui. |Lucien vous a présenté l'homme mystérieux, son partenaire, le Veilleur Duran. Si Duran vous a attaqué, c'était pour vous aider à comprendre comment se battre contre le Pouvoir du Monde Céleste. Ça aurait été sympa de le savoir ! Quoiqu'il en soit, le meilleur moyen de combattre un tel pouvoir étrange est d'avoir une volonté de fer. 

Après un pareil combat, vous étiez encore méfiant, mais vous saviez que vous aviez de plus grandes priorités, comme celle de retrouver le Roi. C'est ainsi que vous êtes tous les trois partis remplir cette mission, Duran ayant trouvé une piste. Le Roi était emprisonné dans une grotte de la Forêt de Chutenfer ! Afin de trouver cet endroit, Duran vous a donné un appareil pouvant détecter le Pouvoir du Monde Céleste. Cependant, ce ne serait pas bien malin de sous-estimer des ennemis possédant un tel pouvoir. 
|
301|Plaines d'Elos|Sec. 4 : Dans l'impasse|L'appareil de Duran a fini par vous amener au plus profond du Mont Gowen. Comment Lucien avait-il réussi à arriver là avant vous et pourquoi ne vous avait-il pas emmené avec lui ? Quoi qu'il en soit, vous l'avez aidé à battre des monstres jusqu'à ce qu'un Veilleur vous annonce la terrible nouvelle : l'armée était en marche ! En dépit du manque d'organisation des troupes, le prince et la princesse avaient donné l'ordre d'attaquer. 

Lucien, très inquiet, avait immédiatement tenté de trouver une solution. Vous avez réfléchi avec lui, mais il a été le premier à trouver une idée. L'idée était de vous introduire tous les deux dans le Tunnel de l'Union de Valence afin de stopper l'avancée de l'armée. 

L'armée était déjà proche du tunnel quand vous l'avez rattrapée avec Lucien. Vous avez réussi à trouver le prince et la princesse à l'avant. Lucien a essayé une nouvelle fois de les convaincre d'abandonner la guerre. |Plus têtus que jamais, Païsha et Colombin ne voulaient rien entendre. Mort d'inquiétude et désespéré, Lucien a enfin réalisé que les mots ne suffiraient pas. ll a alors utilisé son pouvoir pour immobiliser le prince, la princesse et toute leur armée. Cependant, la royauté ne s'est pas laissée contrôler si facilement. Ayant déjà goûté au pouvoir de Lucien, le prince et la princesse ont réussi à se libérer de son sort. Ils ne voyaient que traîtrise et danger dans ses actions. Lucien, affaibli après avoir maîtrisé une armée entière, n'avait plus l'énergie de se défendre. 

La peine encourue pour trahison envers la couronne était la mort. Vous ne pouviez pas laisser Lucien subir ce terrible sort. Vous vous êtes alors enterposé, juste à temps, pour arrêter le coup fatal. La chance était apparemment de votre côté. Lucien a réussi à rassembler assez de pouvoir pour vous téléporter tous les deux hors du tunnel. Pile au bon moment ! 

Lucien était passé pour traître et avait failli perdre la vie mais un sentiment d'excitation le submergeait. L'armée avait temporairement été arrêtée, la mission avait été accomplie. Il vous a demandé de continuer à chercher le roi pendant qu'il récupérait. 

N'ayant aucune autre affaire pressante, vous êtes retourné au Mont Gowen voir Duran. La condition actuelle de Lucien ne l'inquiétait pas. Ce qui l'inquiétait, par contre, était le changement de plans. Lucien devait sauver le Roi. Son sort reposait maintenant entre vos mains. |
302|Plaines d'Elos|Sec. 5 : Fantômes du Passé|Afin de vous aider à sauver le Roi, Duran vous a suggéré d'entrer dans la grotte avec vous pour éliminer tout ce qui se dresserait sur votre chemin tandis que vous avanceriez à la recherche du monarque. 

Quand vous êtes entré dans la Grotte de la Marée des Ombres, des soldats Heldentod vous ont embusqué, tous maniant le Pouvoir du Monde Céleste. Duran et les autres Veilleurs ont détourné leur attention grâce à leurs attaques, vous laissant le champ libre pour partir à la recherche de Molman. Vous vous êtes enfoncé dans les profondeurs obscures de la grotte et avez fini par trouver et vaincre <Diplo Sismique> Lokéro. Quand la créature s'est effondrée, vous avez été surpris de voir la Reine de Braider Iléna qui vous attendait. Elle vous a pressé de l'accompagner, car le Roi courait un grand danger ! 

La Reine avait raison, la suivre dans la grotte vous a mené au monarque. Vous avez été tellement soulagé que vous n'avez pas vu venir le coup : la « Reine » vous a immobilisé grâce au Pouvoir du Monde Céleste ! Alors que son enveloppe magique s'estompait, vous avez réalisé amèrement que la Reine Iléna n'était autre que l'ancienne maîtresse du Roi, Dinah ! 

La vérité a alors été dévoilée. Elle avait pris l'apparence de la Reine après l'avoir tuée, s'étant promis d'offrir une meilleure vie à son peuple. Elle s'était éprise du Roi et voulait continuer de partager sa vie à ses côtés à la chute du Royaume de Braider. Vous étiez donc un obstacle à son plan machiavélique. Avant qu'elle ne puisse prendre votre vie, Lucien est apparu et a bloqué l'attaque de Dinah, vous libérant de son pouvoir. |Dinah est entrée dans une rage folle, elle ne pouvait croire que son propre fils la trahissait, encore une fois, il brisait ses plans ! Folle de rage, elle a provoqué Lucien en duel et a fini par le maîtriser. C'est à cet instant que vous vous êtes libéré de l'emprise de Dinah, prenant part au combat, la magie éclatant de toutes parts. Incapable de résister aux attaques, Dinah, affaiblie, s'est effondrée de douleur, vaincue. Le pouvoir retenant Lucien et le Roi est tombé en même temps qu'elle. 

Dinah, secouée par sa défaite, a déclaré regretter ses actions avant de commencer à se désintégrer. Son chagrin et ses excuses ont touché le Roi. Il l'a prise dans ses bras, pleurant la perte de la femme auprès de laquelle il avait passé tant d'années. Lucien ne pouvait rien faire d'autre que de rester debout à ses côtés, sans dire un mot, tremblant. 

Au bout d'un moment, Lucien a fini par tout avouer. Les Barbares avaient tout manigancé. Déguisés en citoyens d'Heldentod, ils avaient guidé l'Armée de Braider hors de la Marina d'Edouard. La météorite était en réalité un morceau de l'île flottante dont l'énergie s'était épuisée. Afin de contrer ces attaques et de protéger le Royaume contre les Barbares, Lucien avait fondé l'ordre des Veilleurs. C'est alors qu'il vous a informé d'une nouvelle menace, pire encore : une autre île flottante s'apprêtait à entrer en collision avec la Marina d'Edouard ! Un tel événement ne pouvait entraîner qu'une terrible catastrophe. 

Le Roi a alors décidé d'engager ses troupes contre les Barbares qui se trouvaient sur l'île flottante. Il a ordonné à Lucien et ses Veilleurs de trouver un moyen de s'introduire sur l'île et vous a demandé de l'empêcher de s'écraser sur la Marina d'Edouard. |
303|Plaines d'Elos|Livre : Horreurs Militaires|Toutes les nouvelles recrues du Camp Braider ont été prévenues : ne jamais sortir seul la nuit, que ce soit pour patrouiller ou autre. 

Personne n'a pris l'avertissement au sérieux, jusqu'à ce que des soldats soient blessés... |« Un soldat utilisa son intelligence, son ambition et sa déontologie pour grimper les échelons. Il ne se passa que peu de temps avant qu'il ne commence à travailler directement pour le général. 

Mais sa dernière promotion rendit les autres soldats jaloux. Ils se mirent à le harceler et à répandre des rumeurs disant qu'il avait obtenu sa place de manière frauduleuse. 

Le soldat ignora tout cela au début, mais cela finit par être trop. Il devait répliquer. Mais cette décision fut une grossière erreur... » |
304|Plaines d'Elos|Livre : Dans les Profondeurs de l'Âme|Quelle histoire ! Quelque chose de troublant était arrivé au Marchand Nomade Vidic : une belle femme était obsédée par lui ! En quoi serait-ce un problème, vous demandez-vous ? Hé bien, si vous pouviez voir, entendre et toucher cette fille comme il le pouvait, vous comprendriez ! 

Tout a commencé quand Vidic s'est rendu à la Marina d'Edouard pour les affaires... |« Quelle histoire ! Quelque chose de troublant était arrivé au Marchand Nomade Vidic : une belle femme était obsédée par lui ! En quoi est-ce un problème, me direz-vous ? Hé bien, si vous pouviez voir, entendre et toucher cette fille comme il le pouvait, vous comprendriez !

Tout a commencé quand Vidic s'est rendu à la Marina d'Edouard pour les affaires...

Par un beau matin, Vidic et ses associés se sont rendus à la Marina d'Edouard afin de vendre leur marchandise. Avant de commencer, Vidic a fait le tour du marché et un collier très spécial a attiré son regard... » 
|
305|Marina d'Edouard|Sec. 1 : Pluie de Météorites|L'ordre étant revenu aux Plaines d'Elos, le Roi est rentré à la Marina d'Edouard avec son armée. Vous avez suivi peu après mais vous vous êtes retrouvé au milieu d'une bataille. L'Armée de Braider devait sauver les citoyens des griffes des monstres. 

Le Roi Molman, désespéré, a expliqué que la ville avait été saccagée par des monstres et les portes scellées par un pouvoir inconnu. Le prince, la princesse et Lucien s'étaient faufilés dans la ville via les égouts afin de préparer une route de sortie. Le Roi vous a demandé de les aider. 

Vous avez rejoint le Capitaine de la Garde du Palais Nova à l'entrée des égouts. Il espérait que vous pourriez éliminer les monstres volants qui attaquaient tout le monde. 

Battre ces montres a été un soulagement, mais l'inquiétude de Nova se tournait désormais sur ce qu'il pourrait bien se passer à l'intérieur de la ville. Ne pouvant quitter son poste, il vous a demandé de vous y rendre aussi vite que possible et de partir à la recherche du Commandant de la Garde Polo. 
|En vous rendant en ville via les égouts, vous avez aperçu des monstres attaquer des gardes du palais. Malgré ces attaques, ils ont gardé leurs positions afin de procurer une porte de sortie sécurisée aux citoyens pris au piège. 

Vous avez trouvé rapidement le Commandant Polo qui vous a informé que les citoyens étaient encore coincés dans leurs maisons, terrifiés par les monstres à l'extérieur. Il vous a demandé d'éliminer une partie de ces monstres, afin que les gens pris au piège puissent s'échapper en toute sécurité. 

Après avoir aidé les habitants, Polo vous a communiqué les dernières nouvelles : les monstres semblaient venir du Faubourg Populaire ! Il espérait que vous pourriez trouver l'Invocateur Barbare se cachant derrière les attaques. 

Vous avez trouvé des gardes du palais blessés et le chef des Barbares dans les environs. Toujours là au bon moment, Lucien est arrivé soudainement pour vous aider. Cependant, les gardes ne se sont pas rendus compte qu'ils étaient en train d'être secourus. Au contraire, ils ont blâmé Lucien pour la tragédie s'étant déroulée à la Marina d'Edouard, pensant qu'il faisait partie des Barbares. Lucien, ne voulant pas laisser transparaître ses émotions, est parti plutôt que de confronter ses accusateurs, vous laissant seul avec les gardes. 

Vous êtes retourné voir le Commandant Polo, l'informant que la mission avait été achevée, suggérant qu'il envoie quelqu'un chercher les gardes blessés. Satisfait de votre rapport, Polo s'est exécuté. |
306|Marina d'Edouard|Sec. 2 : Peur sur la Ville|Ah, quel bel échange. Après votre rapport, Polo a fait le sien : il avait trouvé des informations sur la Princesse Païsha et vous a demandé de l'aider à trouver une solution pour le problème des monstres. Vous êtes allé trouver la princesse qui vous a accueilli chaleureusement et s'est excusée pour son attitude auparavant. Vous pouviez cependant sentir qu'elle n'avait pas pardonné à Lucien. 

La Princesse Païsha était en train de préparer une attaque potentielle contre les Barbares qui essayaient d'invoquer l'île. Des forces spéciales se trouvant à deux pas étaient sur le point de partir en mission pour empêcher la catastrophe. Elle vous a demandé de vous joindre à eux. 

Grâce à vous, le rituel d'invocation de l'île flottante a été interrompu, mais cela n'a pas apaisé les inquiétudes de Païsha. Les derniers mots d'un Barbare, « C'est trop tard ! » résonnaient dans son esprit. Qu'est-ce que cela signifiait ? 

Cependant, la situation actuelle a pris le pas sur ses inquiétudes, les Monstrorites de Lave qui rôdaient dans les environs n'étaient pas vraiment les bienvenus. Païsha vous a demandé de les éliminer. 
|Des gardes mourants gisaient sur le chemin après votre combat contre les Monstrorites de Lave, leurs cris d'angoisse résonnant dans l'air, il n'y avait rien que vous puissiez faire pour eux. Cela dit, un garde avait encore assez de force pour vous parler d'un Monstrorite de Lave particulièrement imposant, contrôlé par les Barbares, se dirigeant vers un point plus élevé. Les Barbares mijotaient sûrement quelque chose. 

Le combat contre Gozalaka a demandé beaucoup de force et de talent, mais vous êtes sorti vainqueur de la situation. Vous êtes retourné voir Païsha, lui rapportant ce qu'il s'était passé. Elle vous a parlé du Prince Colombin du Domaine de la Noblesse. C'est alors que Lucien est apparu. 

Têtue comme une mule, Païsha ne voulait croire qu'on puisse faire confiance à Lucien, et ce malgré les garanties du Roi. Frustré, Lucien a disparu après vous avoir annoncé que tous les rituels d'invocation jusqu'à ce moment étaient des canulars, le véritable rituel serait mené au plus haut point de la Marina d'Edouard. 

Les paroles du garde mourant vous sont revenues à l'esprit, cette information était d'une importance capitale ! Cependant, Païsha vous a demandé d'aller d'abord voir le Prince Colombin au Domaine de la Noblesse. |
307|Marina d'Edouard|Sec. 3 : Le Début de la Fin|Alors que vous étiez sur le point de partir, un garde vous a arrêté, signalant ainsi votre présence aux Barbares encerclant la maison. Païsha a insinué que c'était la faute de Lucien. En colère, elle a demandé aux Barbares de se battre. Elle a rapidement réalisé qu'ils n'avaient pas été envoyés par Lucien mais le pourchassaient. 

Vous avez débarrassé la maison des Barbares, mais la princesse avait ses propres démons à combattre. Sa mère avait été tuée par celle de Lucien... Lucien était son demi-frère... Lucien, partiellement Barbare, était un ennemi des Barbares... Quelle situation compliquée ! Grâce à votre aide, Païsha s'est calmée, digérant ces étranges informations. 

Au Domaine de la Noblesse, le Prince Colombin a été surpris de vous voir arriver seul car il s'attendait à voir Païsha. Après avoir écouté votre rapport, le Prince a expliqué qu'ils avaient trouvé l'endroit où se déroulerait le rituel d'invocation : le Congrès de Braider que l'étrange pouvoir des Barbares avait scellé. Seules trois personnes pouvaient résister à un tel pouvoir : vous, la Princesse et lui-même. Comptant bien que Païsha vous rattraperait, vous et Colombin êtes partis vers le Congrès de Braider. |Dégager le chemin vers le Congrès de Braider s'était révélé être un piège mortel pour de nombreux soldats, mais leur mort n'a pas été vaine et vous avez réussi à vous y rendre. La Princesse Païsha vous a retrouvé, vous et le Prince Colombin. Vous êtes alors partis tous les trois vers le hall principal du Congrès. Lucien et ses Veilleurs étaient déjà là, tous étendus sur le sol, aux portes de la Mort. Vous vous êtes précipité vers Lucien et avez été soulagé de voir qu'il était encore en vie. Le pouvoir suintant de ses blessures ne vous était pas inconnu : le pouvoir du cristal rouge. 

Le Prince du Fléau est ensuite sorti de l'ombre, son rire machiavélique résonnant dans les couloirs. 

Son sombre pouvoir destructeur a affaibli votre groupe alors qu'il annonçait son plan d'utiliser l'île pour détruire toute la Marina d'Edouard. Il a ensuite disparu avec Lucien qui se mourrait, laissant dans son sillage un terrible monstre pour vous achever. 

Tout espoir semblait perdu, mais c'était sans compter sur la chaude et familière énergie qui résonnait en vous. Ce pouvoir enfoui s'est réveillé, l'énergie du cristal bleu explosant en vous, repoussant l'énergie obscure qui vous bloquait. Revigoré, vous avez battu le monstre, libérant également le Prince et la Princesse. 

Vous êtes retourné au Domaine de la Noblesse où le Roi Molman attendait, mort d'inquiétude au sujet de Lucien. Il savait cependant que beaucoup d'autres vies étaient en danger. Il a placé tous ses espoirs en vous pour sauver le Royaume de Braider. 
|
308|Marina d'Edouard|Histoire de Guerre : Signes de Contre-attaque|La lettre que le Capitaine Lesko a reçue alors qu'il était en mission à l'étranger a suffi à y mettre un terme. Il est immédiatement retourné à la Marina d'Edouard. 

Ses troupes savaient que la Marina était attaquée. Les soldats se sont tous préparés au combat. Mais ce qu'ils ne savaient pas, c'était qu'ils se dirigeaient vers un véritable enfer. |Grâce à l'aide des humains mutants, le sorcier qui contrôlait les autres a été vaincu, mais seules quelques victimes ont été sauvées. Nous avons décidé d'avancer jusqu'au Domaine de la Noblesse pour secourir les autres citoyens en danger. 

Nos troupes se sont séparées des humains mutants, reconnaissantes de leur aide. Certains d'entre nous ne pouvaient s'empêcher de se demander s'ils ne finiraient pas par se transformer en monstres et se retourner contre les autres citoyens. Il est difficile de faire confiance en temps de guerre. Le Capitaine Lesko m'a donc demandé de former un groupe spécial afin de protéger les gens restés à l'abri tandis que le reste des troupes avançait vers le Domaine de la Noblesse. 

Nous avons obéi sans poser de question, convaincus de notre capacité à accomplir cette mission. Alors que la Marina d'Edouard que j'avais connue et aimée tombait en ruines et se transformait, en proie au chaos ambiant, je ne pouvais m'empêcher de m'inquiéter pour la sécurité du capitaine. |
309|Marina d'Edouard|Journal : Île Flottante|On a reconnu sur ces pages l'écriture particulière de la journaliste Misa. Elle décrit les événements qui se sont déroulés à la Marina d'Edouard après l'invasion des monstres. Piégée avec les autres citoyens, elle a retranscrit son expérience à leurs côtés : leurs peurs, leurs espoirs, leur combat pour survivre. Petit à petit, le nombre de survivants diminuait. Misa s'est demandée si elle n'aurait pas mieux fait de quitter cet endroit quand elle en avait eu l'opportunité. 

La dernière note du journal ne semblait pas avoir été écrite par Misa... |Le plan de secours du Capitaine Lesko a été mis en place trop tard. La journaliste Misa a été brutalement attaquée par les monstres et gravement blessée. 

À la demande de Misa, le Capitaine Lesko a désigné une équipe pour emmener les citoyens survivants en sécurité tandis que les autres avançaient vers le Domaine de la Noblesse. Cependant, des monstres volants ont envahi les cieux, plongeant sur les troupes avec une force mortelle. 

Seuls quelques soldats ont réussi à s'échapper. Le Capitaine Lesko, lui, a péri en se battant pour son pays. Cependant, la dernière note laissée dans son journal contredit cette version des faits. Le Capitaine n'était peut-être pas mort... |
310|Royaume Durango|Sec. 1 : Île Flottante Mystique|Duran, un cheval ailé à ses côtés, regardait la ville en ruines et ne voyait que la destruction, partout. Vous avez rapporté les événements s'étant déroulés au Congrès de Braider et comment Lucien avait été capturé. Duran était soulagé d'apprendre que Lucien n'était pas mort. 

La clé pour empêcher la chute de l'île flottante était la colonne de lumière qui la maintenait en place. Le cheval ailé était là pour vous transporter, vous et Duran, vers l'île où les Veilleurs attendaient déjà. 

Efficaces, ils avaient déjà établi une place forte quand vous êtes arrivés. D'après les rapports de Lucien, l'île regorgeait du Pouvoir du Monde Céleste, rendant fous les autochtones. Les Veilleurs ont fait de leur mieux pour protéger leur camp contre l'influence de l'énergie noire. Ils vous ont remis un appareil spécial pour vous aider à trouver la source de ce pouvoir. 

Vous avez fini par la trouver et avez découvert que c'était le Pouvoir du Monde Céleste qui faisait flotter l'île. Il fallait transmettre cette information à Duran sur le champ. |Duran, reconnaissant que vous rameniez l'équipement, n'a pas pu le recharger. Vous avez alors dû fouiller le camp des Barbares à la recherche d'un autre appareil permettant de communiquer avec les humains et également de recharger le premier appareil. 

Au cours de votre recherche, vous êtes tombé sur un Barbare peu commun qui se tenait debout, sans bouger, et portait des vêtements nobles. Il y avait un message dans une bouteille : « Suivez la formule pour créer une potion, puis donnez-la à boire à la personne immobile à côté. » Intrigué par le message, vous avez décidé que cela valait la peine d'essayer, vous avez alors préparé la potion et l'avez fait boire au Barbare immobile. C'était comme verser de la vie en lui, il a pris vie, ses mouvements raides et sa sensibilité apparente au soleil suggérant qu'il avait été immobile pendant longtemps. 

Tandis que vous avez expliqué la situation, le Barbare est devenu de plus en plus anxieux. Ne pouvant à ce moment que bouger la tête, il vous a suggéré d'utiliser la carte se trouvant dans sa poche afin de retrouver un objet important qu'il avait caché avant d'être immobilisé. 

Un large trou vide a été la chose que vous avez trouvé à l'endroit indiqué sur la carte. Quand vous avez transmis cette nouvelle au Barbare, son visage a trahi sa peur et son désespoir. |
311|Royaume Durango|Sec. 2 : Palais Magique Condamné|Le Barbare, s'avère être Matrox, un Aîné de l'Ancien Royaume. Il vous a demandé de trouver l'équipement pouvant contrôler les portes de la Tour Kahlo, le palais et le Royaume Durango tout entier. 

D'après Matrox, un étranger était venu vingt ans plus tôt, clamant qu'il pouvait ramener l'Ancien Royaume dans le monde réel. Intrigués par cet étrange visiteur et désireux d'explorer d'autres mondes, les Barbares ont suivi les instructions de l'étranger. 

Au fil du temps, l'excitation s'est transformée en méfiance. Pourquoi cela prenait-il autant de temps ? Quand les enquêteurs découvrirent les véritables plans de l'étranger, il était déjà trop tard : les Barbares devenaient fous. Dans la panique, la Reine a ordonné à tous les Barbares encore sains d'esprit de se réfugier au palais, le temps d'éclaircir la situation. Matrox fut chargé de trouver l'équipement pouvant sceller le palais à jamais. Cependant, il lui fallut plus de temps que prévu pour le trouver. Lâchement, la Reine a temporairement condamné le palais, abandonnant Matrox à l'extérieur. Craignant de devenir fou avant qu'il ne puisse rentrer au Palais, Matrox décida de boire une potion de pétrification dans l'espoir que quelqu'un vienne l'aider. |Vous avez alors informé le Barbare que le palais était toujours scellé, mais par un pouvoir destructeur, pas par la Reine. Encore plein d'espoir, Matrox vous a demandé d'amener un de ses bijoux au palais, avec lequel vous deviez pouvoir voir ce qu'il s'est passé à l'intérieur. 

Avec cet étonnant bijou, vous avez vu comment Dascha Adwin avait envahi le palais et comment la Reine a tenté de le battre à l'aide d'étranges incantations. Informé de cette triste nouvelle, Matrox a imaginé un moyen de briser le sceau du palais. À l'aide d'un pendentif comme moyen de communication, il allait pouvoir vous guider étape par étape. 

Quel génie ! Le plan de Matrox a été couronné de succès : grâce à lui, vous avez réussi à briser le sceau du palais. Duran vous a trouvé alors que vous entriez. Il vous a informé que les autres Veilleurs étaient désormais sur l'île et qu'il voulait vous donner un coup de main dans votre mission. Vous l'avez informé de tout ce que vous avez appris au sujet de Matrox, de la Reine et de Dascha Adwin. 
|
312|Royaume Durango|Sec. 3 : Invasion de la Tour Kahlo|Vous vouliez vous rendre au palais sur-le-champ, désirant sauver la Reine le plus vite possible. Duran, voix de la raison, vous a arrêté, vous faisant remarquer les runes sur le mur près de l'entrée. D'après les anciennes écritures, vous deviez prouver votre valeur pour voir la Reine à trois endroits différents sous peine d'être maudit. 

Les épreuves n'étaient pas de tout repos. Mais après avoir combattu des vagues et des vagues de Barbares et de monstres, vous avez fini par prouver votre valeur à la Reine. Duran, par contre, n'a pas eu autant de chance. Il a échoué dans les épreuves et a été transformé en barbare mutant. Vous avez dû continuer sans lui. 

Votre timing laissait par contre à désirer : Dascha Adwin venait de réussir à obtenir de la Reine les informations dont il avait besoin. Cependant, votre arrivée a semblé le surprendre. |Vous avez également été surpris de voir Lucien sous son contrôle ! Animé de mauvaises intentions, Lucien vous a attaqué et vous avez fait de votre mieux pour parer ses attaques tout en évitant de le blesser. Lucien avait de brefs moments de lucidité au cours desquels il vous implorait de l'achever avant qu'il ne commette quelque chose qu'il regretterait. Vous avez refusé car vous ne vouliez pas tuer votre camarade ! Stimulé par toutes ces émotions et renforcé par l'étrange énergie céleste vous entourant, le pouvoir du cristal se réveilla. Vous avez libéré ce pouvoir, brisant le contrôle de Dascha Adwin sur Lucien et les soldats du Royaume Durango. 

Ne s'attendant pas à un tel revers, Dascha Adwin s'est échappé via un portail, menaçant d'exterminer tout le monde quand il aura obtenu le pouvoir d'Iyernafalo. 

La Reine avait beaucoup de choses à rattraper. Vous l'avez informée aussi vite que possible des circonstances de votre arrivée sur l'île flottante. Elle vous a dit que Dascha Adwin se rendait dans la zone sacrée de Durango mais vous a assuré qu'il y rencontrerait une grande résistance. Cela lui laissait le temps de vous y emmener, vous et les survivants de Durango, afin de trouver un remède. 
|
313|Royaume Durango|Sec. 4 : Sanctuaire|La téléportation désoriente toujours, cette fois n'a pas fait exception ! Vous êtes arrivé sur la terre sacrée de la Reine de Durango, refuge des survivants de l'île. Le désespoir pesait sur la région comme une brume invisible.

À la demande de la Reine, vous avez retrouvé la Gemme Parfaite de l'Autel de Prière Sanctifié. La Reine pouvait asseoir son pouvoir en utilisant l'objet pour soigner son peuple. Mais pouvait-elle recharger l'équipement de flottaison ? La Reine, d'abord hésitante, a fini par vous aider en vous remettant un orbe capable de dissiper la magie du Monde Céleste affectant les citoyens du Royaume Durango. S'il pouvait faire ça, il devrait également être en mesure de recharger l'équipement. Cependant, cela comportait un énorme risque : celui de transformer les citoyens de Durango déjà fous en terribles monstres. Malheureusement, c'était la seule option possible. Vous avez alors compris la réticence de la Reine. 

Peut-être était-ce la chance, une bénédiction ou le destin, mais l'orbe a pu guérir complètement les citoyens du Royaume Durango. La Reine était soulagée et ne l'a pas caché. L'espoir s'est répandu dans le royaume comme une traînée de poudre : le Royaume Durango avait à nouveau un futur. |Enfin, l'équipement de flottaison était rechargé ! Cela ne pouvait être annonciateur que de mauvaises nouvelles. Lucien est sorti de son coma et a disparu alors qu'il avait à peine la force de bouger. Aussi têtu que son frère et sa sœur ! Selon la Reine, il n'a pu aller qu'à Iyernafalo. Le meilleur moyen de s'y rendre sans cheval ailé est d'emprunter les Escaliers Lumineux. Vous n'avez pas perdu de temps et vous êtes mis en route. 

Vous avez fini par trouver le cheval ailé de Lucien près des Escaliers Lumineux, mais il n'y avait aucune trace du prince illégitime. Les traces de sang que vous avez vues vous ont inquiété. Pour quelle raison Lucien se laissait-il mourir ? À l'aide du cheval ailé, vous êtes parti à sa recherche et l'avez trouvé gisant au bord de la route, agonisant. Il était entouré de cadavres de monstres. Malgré ses blessures, il avait apparemment encore assez de force pour combattre. |
314|Royaume Durango|Sec. 5 : Pour la Bonne Cause|Luttant pour parler, Lucien vous a informé des vrais plans de Dascha Adwin : il prévoyait d'utiliser le pouvoir du cœur de l'Île Flottante afin de créer une fissure temporelle et de voyager dans le passé. Vous lui avez alors promis que vous ne laisseriez pas ça arriver. Soulagé par votre promesse et vous croyant sur parole, Lucien s'est évanoui, à bout de force. 

En poursuivant Dascha Adwin, vous êtes tombé sur une Statue de la Déesse de la Terre Sacrée. Une épaisse aura maléfique s'en dégageait. Dascha Adwin se trouvait juste derrière. Mais comment franchir cet obstacle ? 

D'un coup, la statue a été coupée en deux, comme frappée par la foudre, la barrière s'effondrant en même temps que la pierre. L'énergie noire vous oppressait, rendant la douleur presque insupportable. 

Le rire mançant et maléfique Dascha Adwin résonnait dans l'air. Le Prince du Fléau avait détruit la statue. Le Prince du Fléau avait accédé au cœur. Dascha Adwin était sur le point de gagner son long combat qui avait fait naître trois pays et avait pris bien des vies. Maîtrisant votre colère, vous avez pris votre arme et traversé la barrière afin de mettre un terme aux complots de ce sorcier maléfique une bonne fois pour toutes. |Dascha Adwin s'était préparé à votre arrivée. Vous avez été presque immédiatement attaqué par ses serviteurs. Ils ne faisaient pas le poids face à votre pouvoir, mais malheureusement, le Pouvoir de Destruction de Dascha Adwin amélioré par le cœur ne vous a laissé aucune chance ensuite. Se délectant de sa victoire, le Prince du Fléau détailla les souffrances qu'il allait vous infliger pour se venger de toutes les fois où vous aviez contrecarré ses plans. 

Le pouvoir de Dascha Adwin était trop fort et vous commenciez à croire qu'il avait raison. Votre fin était sûrement proche. Cependant, Lucien n'avait pas fait tout ce chemin pour se reposer au bord de la route ! Usant de ses dernières forces, il s'est rué sur le Prince du Fléau, prêt à se sacrifier pour vous sauver, vous et le Royaume Durango. Dascha Adwin n'avait pas prévu cette possibilité. Fou de rage et incapable d'accepter la défaite, il hurlait à la mort quand il tomba avec Lucien dans le portail obscur qu'il vous avait destiné. 

Tout ce qu'il restait de Lucien était son arme. La culpabilité s'est emparée de vous, comment, en tant que Gardien Éternel, n'avez-vous pas réussi à sauver Lucien, quelqu'un qui avait tant fait pour vous sans presque rien recevoir en retour ? Vous avez presque été submergé par la frustration, mais tenir l'arme de Lucien vous a ramené à la raison. Cette perte était le prix à payer pour un Gardien Éternel et cela ne devait pas vous écarter de votre objectif final. 

La mort de Dascha Adwin ayant désorienté les monstres du Monde Céleste, les guerriers de la Marina d'Edouard réussirent à les maîtriser. La situation chaotique du début était maintenant sous contrôle. Vous avez remis l'arme de Lucien au Roi Molman et à la Reine de Durango, les informant de ce qu'il s'était passé à Iyernafalo. La guerre contre le Prince du Fléau était peut-être terminée, mais une bataille faisait toujours rage dans votre cœur. Le prix de la victoire, le sacrifice de Lucien, était bien trop élevé. Vous vous êtes promis de devenir plus fort afin qu'une telle chose ne se reproduise plus jamais. |
315|Royaume Durango|Histoire Non-officielle : Royaume Durango|Le Mage Léna, avide de connaissances, s'est embarquée dans un voyage pour apprendre comment protéger les gens à l'aide de la magie. Pendant ses pérégrinations, elle a rencontré d'autres mages qui partageaient ses idéaux et a décidé de voyager avec eux. 

Sa mission s'est cependant avérée plus difficile qu'elle ne l'avait imaginée : en guise de réponses, elle se posait de plus en plus de questions. C'est ainsi qu'elle décida d'élargir ses horizons et de chercher la signification et les origines de la magie. C'est alors qu'elle découvrit une légende. |Officiellement séparé du Continent du Centre, le Royaume Durango comprenait depuis peu de nouvelles îles désertes. 

Quand Léna, chef du Royaume Durango, s'est retirée, elle a transmis le pouvoir au Conseil des Aînés. Loin de la politique, sa fille eut des enfant et devint écrivain. Cependant, bien des années plus tard, le Conseil redonna le Royaume aux héritiers de Léna. |
316|Royaume Durango|Journal : Souvenirs Oubliés|Il était une fois, dans la paisible Forêt de Chutenfer, un homme et une femme qui sont tombés amoureux. Elle venait du Continent du Centre alors qu'il était originaire du Monde Céleste. Ayant des origines différentes puisque venant de mondes n'ayant rien en commun, leurs personnalités se complétaient et ils apprirent lentement à se connaître. 

C'est le début de leur histoire qui est reporté dans ce journal. |Finalement, la distance et la cruauté de la vie ont séparé les deux amants : ils ne se sont jamais revus. La femme ouvrit un atelier à la Marina d'Edouard où elle peignait tous les endroits qu'elle avait visité avec son compagnon. 

L'homme, lui, a complètement disparu. Personne ne savait où il était allé et tout le monde le pensait mort. Cependant, la femme a toujours cru qu'il était encore en vie, attendant le jour où ils pourraient à nouveau être réunis. |
317|Dôme Céleste|Sec 1 :  Préliminaire|Vous avez appris d'Athéna Marie que la Tribu Orphidée qui vit sur le continent sud-est se préparait à un important rituel de prières, mais qu'une étrange présence maléfique émanait depuis peu du Dôme Céleste. Marie s'inquiétait que quelque chose pourrait terriblement mal tourner.

Suivant ses instructions, vous avez entrepris le long voyage à travers la Jungle du Dieu Serpent pour enfin parvenir au mystérieux Dôme Céleste chez la Tribu Orphidée dans le but d'empêcher cette force maléfique d'envahir le pays d'Aven.|Une fois sur place, vous avez aidé Orlam à collecter des Feuilles de lavande et il vous a présenté au reste de la tribu. Vous avez obtenu audience avec le chef de la tribu, Feda, et lui avez expliqué les raisons de votre arrivée.

Le chef Feda, avec un air béat et désinvolte, vous a affirmé que tout était au top de la forme et se déroulait sans aucun problème. Néanmoins, il a quand même accepté de rester à l'affût de toute chose suspecte. Vous avez décidé de rester et de prêter main forte à la tribu pour la préparation du rituel, tout en récoltant des bouts d'information par-ci, par-là.

Vous n'avez pu vous empêcher d'être intrigué par l'accueil glacial et bourru du Prêtre Brio ainsi que par son insistance à vous confier des tâches ingrates et sans intérêt.|
318|Dôme Céleste|Sec 2 :  Vérité et Illusion|Vous avez été impressionné par Anna, une jeune fille réfléchie et attentionnée de la Tribu Orphidée. Après que vous avez collecté une Plume de toucan tacheté pour elle, Anna a tressé les chapelets qui allaient être utilisés pour le rituel.

Elle vous a demandé de les remettre au chef Feda et vous avez accepté d'un hochement de la tête, vous précipitant à sa rencontre.|Le Chef Feda vous a demandé d'emmener les nœuds à Orphidée et de les tremper dans son eau afin de les préparer pour le rituel. À votre arrivée, vous avez été surpris de voir Orlam, gravement blessé. Il a expliqué que tout était la faute du Prêtre Brio !

Il semblait que Brio avait l'intention d'interrompre le rituel. À toute vitesse, vous avez couru jusqu'à Lieu du rituel pour l'empêcher de lancer son sort malfaisant, mais vous n'avez pas tardé à découvrir que tout n'était qu'un mensonge.

Ce n'était pas Brio qui voulait interrompre le rituel — c'était Orlam lui-même ! Une force maléfique avait pris le contrôle d'Orlam et vous avait incité à attaquer Brio en plein rituel. Comme le rituel n'avait pu être mené à terme, Orlam avait réussi à s'introduire dans la volonté de l'Arbre de Vie même — la Terre sacrée de Kamodo.|
319|Dôme Céleste|Sec 3 :  Terre sacrée de Kamodo|Avec l'aide de Brio, vous avez suivi Orlam dans les terres sacrées. Une fois dedans, vous avez découvert le chef Feda, blessé.

Feda avait assisté à votre combat avec Orlam et avait tenté de l'arrêter alors qu'il se dirigeait vers les terres sacrées, mais n'a pas été de taille à affronter Orlam et le pouvoir maléfique qu'il possédait désormais.

Il vous a demandé de vous rendre tout au fond des Terres sacrées de Kamodo et d'arrêter Orlam avant qu'il ne puisse commettre l'impensable. Vous avez pris la route immédiatement pour contrecarrer les plans d'Orlam.|En faisant chemin à travers les terres sacrées, vous avez rencontré une nouvelle fois Brio. Grièvement blessé, il vous a informé que seul son propre sort pouvait arrêter Orlam une bonne fois pour toutes.

Après avoir vaincu les monstres qui harcelaient le pauvre homme, vous l'avez emmené avec vous dans les profondeurs des terres sacrées. Là, au fin fond des terres sacrées, vous avez trouvé Orlam et lui avez ordonné de cesser ses atrocités. Dans la bataille qui s'ensuivit, Brio fit appel à sa magie pour vaincre le fils dément du chef et mettre fin à ses plans.

Après la défaite d'Orlam, l'incarnation même de l'Arbre de Vie apparut devant vous et révéla le nom de celui qui avait ensorcelé Orlam et dérobé l'essence du puissant arbre.|
320|Dôme Céleste|Sec 4 :  Camp brumeux|Même si vous n'avez pu empêcher la force maléfique de s'emparer de l'essence de l'Arbre de Vie, le chef Feda tente quand même de vous rassurer — après tout, si vous n'étiez pas venu en aide à la Tribu Orphidée, ils auraient pu tous être tués.

Il reste beaucoup à faire dans le dôme, et le chef vous a demandé de vous rendre au Camp Juya en réponse à leur demande d'aide.|Une fois sur place, Janice vous explique qu'un inconnu s'était introduit dans le camp, mais, étrangement, n'avait rien dérobé. Au cours de votre enquête sur terrain, vous découvrez des traces de terre rouge suspecte près du camp. Après un peu de travail de détective, vous apprenez qu'on ne trouve ce type de terre que dans un verger connu sous le nom des Jardins. Vous ne pouvez vous empêcher de penser que tout cela doit être d'une manière ou d'une autre lié à l'entité mystérieuse qui avait ensorcelé Orlam.

Janice vous a demandé de réunir les ingrédients pour préparer un antidote, que vous avez ensuite répandu dans toute la forêt une fois qu'il était prêt. Pendant votre travail, vous avez découvert une tablette suspecte qui reposait sur le sol. L'assistant du bosquet, Larry, a suggéré que la tablette devait provenir des Hauteurs Feudegivre.|
321|Dôme Céleste|Manuel du Pionnier Légendaire|Le Manuel du Pionnier était un classique transmis de génération en génération par le peuple du Dôme Céleste. Il parle d'un soldat légendaire, Achille, qui était le premier homme à s'installer au Dôme Céleste.

Achille lutta pour survivre dans le désert aride et impitoyable qui s'étendait autrefois à travers le Dôme.|Il a travaillé dur chaque jour pour subvenir non seulement à ses propres besoins mais aussi à ceux de sa femme enceinte. En fait, il se démena tant qu'un jour son corps a simplement cédé et Achille s'est effondré.

La pioche dont il se servait s'enfonça dans le sol desséché et révéla une réserve inépuisable d'eau fraîche et pure qui s'y cachait. Cette source a transformé ce qui était autrefois les dunes arides du Dôme Céleste en une oasis fertile et verdoyante.|
322|Dôme Céleste|Livret de marche militaire|Le Livret de marche militaire relatait l'histoire d'un soldat d'Heldentod. L'écriture en est brouillonne et la formulation inéloquente et grossière.

Ses entrées décrivent en détail l'arrogance et la férocité des soldats d'Heldentod, ainsi que le revers que leur campagne connut sur le continent du sud-est.|Au cours de son expédition, l'armée d'Heldentod a installé son camp dans les bois du sud pour y passer la nuit. A un moment, on apprit que l'un des soldats était porté disparu. Une équipe de secours fut envoyée, mais non seulement ils ne parvinrent pas à retrouver leur camarade, ils se séparèrent l'un de l'autre et s'égarèrent à leur tour dans la forêt qui ne semblait connaître de limite.

Le jour s'était levé avant que les soldats ne revinrent au camp, visiblement secoués. Les chefs de l'armée se concertèrent en secret pendant des heures, et finalement décidèrent qu'il était dans leur intérêt de se replier. Après tout, même les plus puissantes armées sont à la merci du courroux des forces de la nature.|
323|Hauteurs Feudegivre|Sec 1 :  À la veille de l'éruption|Larry suppose que la tablette que vous avez trouvée provient des Hauteurs Feudegivre, vous décidez donc d'en prendre la direction et de déterminer avec exactitude ce qu'elle faisait dans les Jardins. Après tout, tout ça n'a pu arriver par hasard.|Vous arrivez à la ville de Flammeville et découvrez qu'elle est attaquée par des monstres ! Grâce à votre esprit vif et votre férocité au combat, vous parvenez à repousser les monstres et à gagner la confiance du maire de la ville, Mick. Mick vous explique que le volcan voisin, qu'on pensait être éteint depuis longtemps, est soudainement entré en éruption, et que les monstres qui vivent dans les environs de la ville sont devenus violents sans crier gare.

Cynthia, une villageoise, vous rapporte qu'elle a récemment vu un Homme Mystérieux vêtu d'une cape près de l'autel du volcan. Vous décidez alors de vous rendre à l'autel pour évaluer la situation et confirmer que l'homme en question est en effet celui que vous êtes en train de pourchasser.

À l'autel, vous affrontez l'Homme Mystérieux et réussissez à le battre. Votre récompense ? Une tablette étrange qu'il laisse en quittant les lieux. Curieux, vous ramenez la tablette avec vous et il s'avère qu'il s'agit de la seconde moitié de celle que vous aviez découverte précédemment. Vous montrez la tablette complète au maire Mick, qui vous révèle qu'il s'agit d'un cadeau fait par la ville au Village Gardar dans le cadre d'un traité de paix.|
324|Hauteurs Feudegivre|Sec 2 :  Étrange maladie au Village Gardar|Mick ne pensait pas que le suspect puisse provenir du Village Gardar, mais il savait également qu'il ne pourrait vous empêcher d'enquêter. Il rédige alors une lettre et vous demande de l'apporter au Maire de Gardar.

Après avoir fait vos adieux aux villageois de Flammeville, vous prenez le chemin du Village Gardar avec une tablette dans votre besace.|Une fois arrivé à Gardar, Solveig vous aide à obtenir un entretien avec la maire Fendis. Vous lui donnez la lettre de Mick, mais elle ne semble pas vraiment perplexe. Il semble qu'une étrange maladie a commencé à se répandre à travers le village, et les gens tombaient malades çà et là. Il semble évident qu'il lui serait très difficile de se soucier des problèmes d'un étranger alors que ses propres citoyens souffrent.

Vous aidez alors les résidents du village à trouver de l'eau propre et de la nourriture, mais ce faisant vous découvrez dans l'eau des traces d'une étrange magie. Vous en apportez un échantillon au Guérisseur Camus qui admet qu'il n'avait malheureusement pas pu analyser l'eau lui-même.

Naturellement, vous êtes rongé d'inquiétude. Camus fait travailler son cerveau et finalement se rappelle quelque chose de ses années passées à étudier la magie. Il vous demande de vous rendre dans le champ enneigé à l'extérieur du village afin de récupérer la flamme d'un Cheval Flammebleue. Il explique qu'il pourrait peut-être se servir de cette flamme pour analyser l'eau. Mais lorsque vous parvenez à lui ramener cette flamme, il vous informe que le Temple aquatique a été envahi et que la maire Fendis a désespérément besoin de votre aide.|
325|Hauteurs Feudegivre|Sec 3 :  Temple aquatique|Pendant que vous exploriez les champs enneigés, les gardiens du Temple aquatique ont été attaqués et l'agresseur s'est infiltré dans le temps.

Fendis craint que l'intrus pourrait mettre en colère le Dieu de la rivière qui veille sur le village, mais aucun des villageois n'était un bon combattant. Elle vous demande donc si vous accepteriez de vous rendre dans le temple vous-même et pourchasser le coupable.|Vegry a décrit l'intrus comme un homme très mystérieux et enroulé dans une longue cape. C'est exactement ce que vous pensiez ! Sans nul doute, l'agresseur était bien l'Homme Mystérieux que vous pourchassiez. Vous entrez rapidement dans le Temple aquatique et vous lancez à sa recherche.

Le long chemin ardu vers les profondeurs du temple est rempli de bêtes féroces. Lorsque vous parvenez au hall principal, vous découvrez avec horreur Wachowski, la Bête aquatique invoquée, inconsciente au milieu de la pièce. Vous l'aidez à revenir parmi les vivants, et, pour vous remercier, elle raconte ce qui s'était passé.

Après quoi, elle se sert des restes de sa puissance magique pour créer un antidote qui guérira les villageois, et vous le remet. Cependant, au moment où vous aviez déjà l'antidote dans votre main, l'Homme Mystérieux surgit des ombres où il se cachait et détruit la fiole. Il n'y avait désormais plus d'espoir pour les villageois comateux ! Wachowski déplore d'abord leur sort, mais vous dit ensuite qu'il pourrait encore y avoir un moyen de purifier les eaux de la ville des toxines et vous donne la recette de l'antidote.|
326|Hauteurs Feudegivre|Sec 4 :  Pistage dans la Neige|Vous remettez la recette de l'antidote à la maire Fendis, qui s'exclame avec consternation que les ingrédients ne peuvent être trouvés que sur les bêtes féroces et agressives qui rôdent aux abords du village.

Vous décidez donc de réunir les ingrédients vous-même ! Avant que vous ne partiez, Solveig et la maire vous ont demandé de faire preuve de prudence… et de revenir en vie.|Une fois que tous les ingrédients nécessaires ont été réunis, vous les apportez au Guérisseur Camus pour qu'il en fasse un antidote, puis le versez dans le lac pour délivrer les villageois de leur souffrances. Ensuite, vous revenez au village et apprenez que la maire Fendis a un message urgent pour vous.

On a rapporté à Fendis que des empreintes boueuses suspectes avaient été découvertes dans la neige près de l'entrée de la Vallée gelée. Vous vous précipitez pour les examiner vous-même et constatez immédiatement que la boue est de la même couleur que celle que vous aviez trouvée au Camp Juya.|
327|Hauteurs Feudegivre|Transcription d'un Rituel villageois|Comme ils sont difficiles à atteindre et reçoivent rarement des nouvelles du monde extérieur, de nombreux endroits isolés entretiennent toujours des coutumes et croyances cruelles.

On raconte qu'il y a bien longtemps, dans le sud-est, existait un village qui vénérait le feu et organisait une cérémonie d'immolation tous les ans. Personne d'extérieur au village n'avait jamais assisté à ce rituel, mais les écrits indiquent qu'il s'agissait d'une cérémonie terrible.|Mais un an, une jeune fille très différente fut choisie pour la cérémonie, et lorsque ce jour arriva, elle ne s'était pas débattue ni n'appelait à l'aide. Au lieu de cela, elle attendit simplement que les flammes la consument.

Un déluge soudain éteignait le feu au sommet de l'autel, laissant la jeune fille sur le bûcher totalement indemne. Son corps commença alors à briller d'une lueur éblouissante. Lorsque les spectateurs ouvraient de nouveau les yeux, il ne restait plus sur l'autel que des cendres de bois.|
328|Hauteurs Feudegivre|Légende du Territoire disputé|Dans les temps anciens, les gens ne comprenaient pas vraiment les mécanismes qui régissaient le monde. Ils trouvaient donc des explications étranges à des phénomènes naturels. Mais peut-être ces explications n'étaient-elles pas si éloignées de la réalité. Ces légendes transmises oralement, de génération en génération, pourraient bien contenir une petite part de vérité.

Les paysages étranges des Hauteurs Feudegivre n'ont pas été sculptés par la nature. À l'aube des temps régnait une chaleur épouvantable sur les Hautes-terres. Même s'ils n'avaient pas tout le confort qu'ils auraient pu avoir dans une grande ville, ils étaient tout à fait autonomes. Les gens y vénéraient le Feu, jusqu'à l'arrivée d'un homme...|Ce vieillard aux cheveux blancs écouta les suppliques des villageois et transforma le climat et l'écologie des hauteurs. Au début, les villageois furent très heureux. Cependant, il ne leur fallut pas longtemps pour retrouver les habitudes du passé et recommencer à vénérer le Feu.

Le vieillard, qu'ils avaient jusque là vénéré comme un dieu, devint fou furieux. Il partir du village à la recherche du Porteur de Feu, espérant le chasser.

Le combat entre ces deux forces opposées transforma donc radicalement les Hauteurs Feudegivre.|
329|Meeryasha|Sec 1 :  Énergie Rubis|Vous soupçonniez l'Homme Mystérieux d'avoir fui vers la Vallée gelée. Fendis vous a appris qu'il existe une sorte de faille temporelle au plus profond de la vallée.

Armé de ce savoir, vous entreprenez d'examiner la faille.|Dans la vallée, vous rencontrez une fille étrange nommée Marjorie et apprenez que la Faille temporelle mène à un endroit appelé Meeryasha. Vous avez la conviction que c'est là que s'est réfugié l'Homme Mystérieux, et décidez de l'y accompagner.

Vous avez échangé les rôles avec Marjorie afin de l'aider et avez pu résoudre bon nombre de problèmes. Cependant, au final, vous avez commencé à vous poser de plus en plus de questions sur sa véritable identité.|
330|Meeryasha|Sec 2 :  Labo Antigravité|En se faufilant dans les conduits du Labo Antigravité, Marjorie a pu s'infiltrer dans le bâtiment et en dresser le plan. Elle a décrit une énorme réserve de livres à l'intérieur, dans laquelle se trouvait cachée une salle de référence secrète.

Elle a également dit avoir créé un appareil à interférences pour empêcher les gardes mécaniques de transmettre des informations au centre de contrôle. Vous avez donc pu vous y infiltrer et y circuler librement.|Après avoir parcouru des dizaines de documents dans la salle de référence secrète, Marjorie a finalement découvert les vérités que le gouvernement cherchait à dissimuler. Elle est restée assise, totalement estomaquée, jusqu'à ce que vous la réconfortiez et qu'elle reprenne ses esprits.

Dans un coin reculé du laboratoire, vous êtes tombés sur le Directeur Noah. En vous approchant pour l'interroger, vous l'avez vu regarder Marjorie comme s'il la connaissait.

Mais avant que vous ayez pu obtenir de lui une quelconque information, une onde de choc magique l'a abattu à l'endroit même où il se tenait. Vous avez immédiatement compris qu'il s'agissait là de l'œuvre d'Orlam contrôlé.|
331|Meeryasha|Sec 3 :  Sous le manteau|Marjorie et vous êtes restés choqués par la mort de Noah, le Directeur du Laboratoire. Après de longues réflexions, Marjorie a suggéré d'aller à l'Ordre des Alchimistes de Grey Lynn, afin d'y obtenir l'aide de la Secrétaire Yvonne.|Vous avez décidé de récolter des échantillons de créatures montrant des mutations, afin de les donner à Yvonne. Elle expliqua que le temps était censé être figé à Meeryasha, mais que pour une raison inconnue, récemment il s'était de nouveau mis en marche.

Marjorie n'arrivait pas à croire que la personne qui s'était introduite dans la pièce secrète était son propre fiancé. Elle a semblé accablée par le fait qu'elle ne reverrait jamais Dermot. Après être passé par la Guilde des Alchimistes, vous partez pour la Crevasse de sable où vous déterrez un Cristal Rouge qui possède une énergie similaire à celle du Prince du Fléau.

Armé de ces nouvelles informations, vous avez réexaminé les mutations des animaux sauvages et confirmé qu'elles ont toutes été causées par le gouvernement.|
332|Meeryasha|Sec 4 :  Paré et prêt|Yvonne s'inquiétait à propos de Marjorie. Elle lui a conseillé de rentrer se reposer chez elle. Marjorie avait tenté de protester, mais Yvonne a insisté et a fini par la convaincre.|En arrivant à la maison de Marjorie, vous avez appris qu'elle avait eu un jeune frère, mais avant que vous ayez pu lui demander d'en dire plus, Marjorie a découvert une lettre de Dermot, qui insistait pour qu'elle le rencontre. Elle s'est rendue à l'endroit indiqué, où Dermot l'a enlevée.

Vous êtes allé à Grey Lynn avec Yvonne et les autres afin d'exiger de voir Dermot, mais le Garde de la Porte a refusé de vous laisser passer. Impuissants, vous êtes retournés à la Guilde des Alchimistes. À l'entrée de la guilde, vous êtes tombés sur Marjorie, prise de panique.

Elle vous a informés qu'elle avait découvert de terribles conspirations gouvernementales dans la salle secrète.|
333|Meeryasha|Sec 5 :  Chant de douleur|Marjorie et vous étiez convaincus que la personne qui l'avait enlevée était quelqu'un déguisé comme Dermot. Elle vous a donc demandé de l'aider à pénétrer à Grey Lynn afin de forcer Dermot à tout avouer sur ce que manigance le gouvernement.|Dans la cave, vous êtes tombés sur l'Homme Mystérieux, qui vous a révélé une autre partie de l'histoire. Il s'est avéré qu'il avait utilisé le pouvoir de l'Arbre de Vie et la magie de Wachowski pour ouvrir la Faille temporelle. Vous n'étiez qu'un pion de plus dans son plan.

Lorsque l'Homme Mystérieux a révélé qui il était vraiment, vous avez également appris toute la vérité sur cette affaire. Au début, Dermot utilisait Albéric pour conduire des recherches sur la Modification. C'est cela qui a causé sa transformation en Prince du Fléau. Comme il avait peur qu'Albéric ne revienne se venger, il a donc quitté Meeryasha et utilisé un Cristal Rouge afin d'y stopper l'écoulement du temps et de couper l'endroit du monde extérieur.

Selon le souhait d'Albéric, vous l'avez enterré aux côtés de Marjorie, afin qu'il puisse ne plus jamais la quitter.|
334|Meeryasha|Grain de Sable|D'après des récits anciens, Grey Lynn fut entourée d'un champ magnétique très insolite. C'était comme une force maléfique qui empêchait les gens de réfléchir et les transformait à jamais en personnes avides d'argent et de puissance.

Cependant, Tynost possédait un gène unique qui le rendait insensible aux effets du champ magnétique. Il était la seule personne qui pouvait encore penser de façon rationnelle et logique.

Tynost ne pouvait simplement pas rester les bras ballants en regardant tous ceux autour de lui succomber et il décida de mettre au point une technique alchimique qui neutralisait l'affliction.|Tynost était la seule personne à ne pas être affectée par le champ magnétique et donc il décida de mettre au point une technique alchimique pour le neutraliser.

Cependant, Iliana, une mage d'un pays voisin, ne pensait pas que Tynost pouvait y arriver seul. Elle utilisa donc ses propres pouvoirs pour aider Grey Lynn à sortir de cette crise.

Grâce à l'aide d'Iliana, Tynost découvrit un moyen de modifier l'énergie magique du champ magnétique.|
335|Meeryasha|Traité d'équilibre écologique|Autrefois, lorsque Meeryasha était encore connue sous le nom d'Alchémia, c'était une contrée absolument splendide à perte de vue, habitée de centaines d'espèces d'animaux.

Après sa découverte purement accidentelle, de plus en plus de gens vinrent s'y installer. Leurs colonies ont donné naissance à ce qui est maintenant Grey Lynn.|La population a explosé et le superbe environnement se retrouva surexploité. Le mouvement d'alchimie en plein essor contribua à polluer les environs. Il n'a pas fallu longtemps pour que la contrée se transforme en un endroit effrayant peuplé de créatures menaçantes.

Personne n'avait imaginé que la pollution entraînerait des mutations chez la population locale. Dearby ne voulait pas que les choses empirent. Il promit donc qu'il trouverait un moyen de concilier le meilleur des deux mondes : préserver l'environnement naturel et conserver Alchémia.

Sous la direction de Dearby, tout le monde se mit à l'ouvrage pour sauver l'environnement. Les arbres commencèrent à repousser et le paysage commença à retrouver sa beauté d'antan. Les habitants commencèrent à faire attention à la nature qui les entourait et à faire des efforts pour préserver son équilibre, alors même que Meeryasha ne cessait de se développer.|
298|Plaines d'Elos|Section 1 : Nettoyage|Athéna Marie vous annonce que Braider a soudainement décidé de ne plus faire partie de l'Union de Valence et pour une raison inconnue, marche contre l'Empire Heldentod. Elle pense qu'une guerre entre eux n'amènerait rien de bon. Elle veut donc que vous enquêtiez dans les Plaines d'Elos où est stationnée l'armée de Braider et essayiez d'empêcher la guerre qui menace entre les deux royaumes.

Alors que vous atteignez le Tunnel de l'Union de Valence, vous rencontrez 3 princes de Braider en pleine dispute pour le partage des troupes. Vous apercevez également Lucien, Corsaire des Ombres, qui tente d'empêcher l'avancée des troupes et implore la Princesse Païsha et le Prince Colombin de retirer leur armée. Cependant, aucun des camps n'arrive à convaincre l'autre. Soudain, une détonation sourde se fait entendre à l'arrière des troupes, forçant le Prince et la Princesse à momentanément retirer leurs troupes pour enquêter sur la source de cette déflagration.

En route vers le campement des Plaines d'Elos avec le Prince de Braider, vous découvrez un énorme cratère sur la route. À côté de celui-ci, vous apercevez Lucien. Il vous raconte qu'il se faisait du souci à propos de ce qu'il s'est passé et qu'il avait pu finalement stopper l'avance des troupes. Vos capacités d'analyse et de déduction dont vous avez fait preuve en examinant le Cratère Météoritique ont impressionné Lucien. Il vous confie qu'il est un fils illégitime et vous demande de persuader le Prince et la Princesse de retirer l'armée de Braider.|Vous tentez de persuader le Prince et la Princesse, mais ceux-ci répondent que le Cratère Météoritique est un phénomène naturel et accidentel qui ne peut affecter le déploiement des troupes. Tout ceci a le don de mettre Lucien en colère, qui menace même de les combattre. Il utilise un étrange pouvoir contre eux, mais regrette bien vite son impétuosité. Le Roi de Braider, Molman, ayant assisté à la scène, réprimande Lucien violemment, le dégradant de son rang militaire et le chassant du campement. Il a également vivement reproché au Prince et à la Princesse que le déploiement se soit fait sans son accord.

N'étant pas venu sur ordre du Roi Molman, il est fermement déterminé à attaquer l'Empire Heldentod, mais refuse de vous en dire la raison. Après réflexion, vous décidez de tenter de découvrir pourquoi Braider veut attaquer l'Empire Heldentod en parlant directement aux soldats.|
336|Jungle Mayland|Section 1 : Revanche contaminée|Le Directeur Haman de la Vallée Feregal a rapporté que d'étranges créatures ont surgi du Tunnel en ruine et commencé à attaquer les villageois.

Entre-temps, une maladie extrêmement contagieuse est apparue sur le Continent du Centre. Vous allez devoir enquêter sur ces deux problèmes de front.|Selon différentes sources, l'infection et les créatures proviendraient du même endroit. Afin d'endiguer l'infection le plus vite possible, l'Empire Heldentod et l'Union de Valence ont décidé l'envoi de troupes communes pour les besoins de l'enquête.|
337|Jungle Mayland|Section 2 : Exploration|Vous arrivez dans une nouvelle région avec les troupes des deux armées. Vous discutez avec leurs commandants respectifs pour en apprendre un peu plus et les aider dans leur enquête.

Malheureusement, votre enquête s'arrête au pied d'un énorme mur. Par chance, l'Archimage Rabbis connaît la région et possède quelques informations dignes d'intérêt.|Pendant que l'Archimage efectue des recherches, quelques soldats d'Heldentod ont été attaqués par des créatures et infectés par la maladie.

Incapables de le faire eux-mêmes, les autres soldats d'Heldentod vous demandent de les achever afin d'apaiser leurs souffrances. Les soldats infectés retrouvent leur esprit, dans ce qui semble être les derniers moments de lucidité avant de mourir. Ils vous remercient d'apaiser leurs souffrances , mais cela n'atténue pas votre peine pour autant.|
338|Jungle Mayland|Section 3 : Au pied du mur|Les recherches de l'Archimage semblent indiquer que vous avez besoin de l'énergie d'une Bête divine pour franchir le mur, énergie que vous obtiendrez via un rituel magique. Le rituel requiert un noyau et du sang d'une Bête divine.

Afin d'enquêter sur l'infection, vous devez vous rendre dans la Vallée Batelo.|Vous y obtenez beaucoup de sang du Descendant de la Bête divine, ainsi qu'un Noyau divin de Rebecca. Tout est prêt pour le rituel.

Alors que se termine le rituel, vous sentez l'énergie de la Bête divine pénétrer votre corps. Vous ne parvenez pas à oublier l'expression qu'avait la Bête divine.|
339|Bassin Shaxia|Section 4 : Infiltration|Prince Colombin vous a donné un objet de permettant de vous téléporter. Quand vous franchirez les remparts, vous pourrez l'utilisez pour invoquer des éclaireurs qu'ils vous aident dans votre enquête.

Les éclaireurs ont trouvé un vieil entrepôt qui sert de forteresse de fortune et Lucia, leur chef, vous conseille d'aller l'explorer.|Alors que vous atteignez la forteresse, vous apercevez une Fille Shaxia kidappée par les éclaireurs. En l'interrogeant, vous découvrez que d'étranges créatures portent les mêmes tenues que les membres de la Tribu Shaxia.|
340|Bassin Shaxia|Section 5 : Enquête de fond|Vous vous infiltrez dans le Bassin Shaxia afin de trouver plus d'indices. Bientôt, vous atteignez une zone sévèrement gardée.

L'éclaireur en chef Lucia vous a confectionné une tenue de camouflage pour que vous puissiez facilement y pénétrer et vous demande d'enquêter avec la Fille Shaxia.|Alors que vous atteignez la frontière du Bassin Shaxia avec la fille Shaxia, vous apercevez des membres infectés de la tribu Shaxia se faisant attaquer par d'autres membres de la tribu et décidez d'aider ces derniers à vaincre les infectés.

Une fois les infectés vaincus, l'Oracle Shaxia Jananda vous demande les raisons de votre venue. La tribu Shaxia a perdu l'énergie de leur Bête divine. Portant en vous l'énergie d'une Bête divine, ils vous prennent pour le présage qui sauvera Shaxia.|
341|Bassin Shaxia|Chapitre 6 : SOS Bête Divine|L'Oracle Shaxia Jananda vous invite à l'accompagner dans le temple et à découvrir ce qui est arrivé à la Bête Divine Shaxia Mars. Une fois arrivé, l'Oracle Shaxia invoque la Bête Divine Shaxia Mars,

qui apparaît devant vous. Après avoir écouté l'Oracle, Mars demande à la tribu Shaxia d'approcher. Soudain, la mystérieuse créature que vous avez aperçue dans le Tunnel en ruine apparaît surgit derrière eux et, dans un grondement, les empêche d'approcher, puis attaque la Bête Divine Shaxia Mars. Rapidement, la Bête divine Shaxia change d'apparence et la mystérieuse créature meurt.|Le cadavre de la mystérieuse créature se transforme peu à peu et l'Oracle reconnaît un de ses fils. L'Oracle Shaxia, dans un accès de fureur, attaque la Bête divine. Vous décidez de l'aider à affronter Mars. La Bête divine Shaxia, en mourant, explose, blessant et tuant de nombreux membres de la tribu.

C'est alors que le fantôme de la Bête Divine Shaxia Mars apparaît. Il prétend être l'image d'un corps caché dans Allolans par la Bête Divine Shaxia Mars et explique qu'un mystérieux personnage a pris le contrôle du corps de Mars il y a des années.

Le fantôme aimerait que vous l'aidiez et le sauviez. Il est prêt à retirer la rancœur de la Bête divine qui se trouve en vous afin que vous puissiez profiter pleinement de son Énergie.

Alors que vous retournez sur le Continent du Centre, vous constatez que l'infection a disparu. Malheureusement, ceux qui y ont succombé ne peuvent être ressuscités. En regardant vos mains, pensant à tous les soldats de l'Empire Heldentod et au Descendant de la Bête divine, vous avez un pincement au cœur, bien que vous ayez sauvé de nombreuses personnes.|
