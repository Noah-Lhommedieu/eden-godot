7076|Le Contrôleur de Flamme dans les mains de Liarro se met à briller d'une lumière bleue et jaune.|
7077|Liarro : Mince ! Il est possible qu'il y a des dommages collatéraux, mais je m'en moque... Encore plus si ça me permet de me débarrasser de vous tous ! |
7078|Le Contrôleur de Flamme dans les mains de Liarro se met à briller d'une lumière bleue, jaune et rouge. |
7079|(Fantôme) Garde du Duc : Peu importe que vous gagniez ou non. Vous n'êtes qu'un garde novice. Ne soyez pas si arrogant ! Allons-y !|
7080|(Fantôme) Dascha Adwin : Vous maniez l'épée avec brio ! Pourquoi n'êtes-vous toujours qu'un garde novice ? ... Vous refusez de m'adresser la parole ? Très bien. Je vous suggère de rejoindre les rangs de ma Garde dès demain !|
7081|(Fantôme) Dascha Adwin : Tenez. Quand vous vous rendrez au rassemblement de ma Garde demain, montrez-leur ceci. Ils ne vous créeront aucun problème. À propos, quel est votre nom ? |
