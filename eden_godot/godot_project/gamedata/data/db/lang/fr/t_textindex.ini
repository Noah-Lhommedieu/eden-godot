1931|Chercheurs de Kuala Lursun 
Finissez la quête des Crocs Brumeux. 

Un hameau paisible niché dans les montagnes. Aujourd'hui calme et confortable, il a été fondé par le héros Ursun, Taan Ruidan, qui était le grand maître du célèbre art martial connu sous le nom de Griffe de Bataille. 

Les villageois d'ici l'ont étudié pendant des générations. Mais malheureusement, certains secrets ont été perdus à jamais... Par chance, la force mentale et physique et l'entraînement qu'il faut pour simplement survivre dans un environnement si rude compensent largement les secrets perdus. 

Le maire actuel est considéré comme le nouveau grand maître de la Griffe de Bataille, ses prouesses lui ont valu de gagner le respect des villageois. 

|
1932|Clan des Sorcières
Finissez la quête de la Forêt Ensorcelée 

Les membres de la société secrète le Clan des Sorcières croient que le torrent d'énergie de la Forêt Ensorcelée renferme un incroyable pouvoir. Afin de trouver le secret qui se cache derrière ce pouvoir, ils ont construit un immense chaudron où ils collectent et mélangent les énergies mystiques. 

Les membres accueillent tous ceux qui veulent se joindre à leurs études. Ils croient que la sorcellerie est une force de la nature qui doit être partagée avec tous. 

Cependant, de nombreux membres pensent que s'ils sont capables d'utiliser le pouvoir du torrent, ils pourront atteindre des pouvoirs magiques à une échelle inédite. Ils souhaitent pratiquer la magie à un niveau jamais vu jusqu'ici. |
1933|Kaia 
Finissez la quête de l'Anneau du Silence

Le Cloître de Cristal situé sur le plateau au milieu du Lac de Cristal est le centre religieux des Kaia.  Chaque année, tous les fidèles convergent vers ce point pour la cérémonie annuelle. La Cérémonie est organisée par le Culte Kaia. 

Les croyants Kaia sont ceux qui vivent dans la zone tribale Kaia. Les croyants qui font preuve de la plus grande sagesse prennent la cérémonie en charge. Les autres ont un rôle dans la cérémonie en accord avec leurs aptitudes et leurs talents. 

Les croyants Kaia croient que le Cloître de Cristal leur apportera chance et bonheur dans la vie. Le pouvoir des Kaia a donné à toutes les générations de la tribu la possibilité de cultiver la terre. |
1934|Les Fils de Nolan 
Finissez la quête du Pic Frisson

Dans la région montagneuse de l'ouest du continent central, vit un groupe d'autochtones. Au vu de leur détermination, de leur vitalité et de leur condition physique extraordinaire, ils ont développé le moyen de survivre dans cet environnement sauvage et glacé. 

Ils s'appellent les Fils de Nolan. Ils ne sont pas seulement d'excellents chasseurs, mais aussi de très bon guerriers. Même les ogres ne leur arrivent pas à la cheville. Encore maintenant, on peut voir les traces qu'ont laissées les batailles sanglantes entre les deux factions. 

Les Fils de Nolan sont aussi solides et sûrs qu'un glacier. Leur persévérance a fait ses preuves au fil du temps. Que ce soit l'environnement inhospitalier ou les ogres brutaux, rien ne peut atteindre les Fils de Nolan. |
1935|Gardien de l'Esprit Sacré
Terminez les quêtes de la Vallée de la Mort

Au fin fond de cette vallée entourée d'un brouillard noir, se trouve l'habitat d'un groupe de Drakais qui suit les techniques d'enseignement de l'Esprit Saint. Contrairement à leurs homologues maléfiques, ils vivent une vie de vertu et de justice. 

Ils croient que les esprits saints se réincarnent sous différentes formes et méneront la tribu sur le droit chemin. Ces Drakais attendent ici depuis des générations et ont survécu à de nombreuses crises. 

Bien qu'ils souffrent d'incompréhensions de la part du monde extérieur et d'invasions des tribus voisines, ils croient que l'Esprit Saint les retrouvera. Vous pourriez apprendre une chose ou deux de leur dévotion. |
1936|Hall Lunaire
Terminez les quêtes de la Plaine Fleurie. 

Il y a une légende au sujet de la Plaine Fleurie. C'était autrefois un désert, mais un jour une pousse d'arbre blanc sortit du sol. À partir de cette unique pousse, fleurit une mer de fleurs. 

Pheyla est le cœur de la Plaine Fleurie et la base du Hall Lunaire. Pheyla vit principalement de l'export de plantes. 

Le Hall Lunaire a la charge du principal revenu et a suivi d'autres voies de développements. |
1937|Patrouille du Golfe
Terminez les quêtes de la Falaise des Grands Vents. 

La Patrouille du Golfe est composée des femmes et des hommes les plus courageux du Golfe. Ce sont les gardiens de la paix aux alentours de la Falaise des Grands Vents et du nord du continent. Peu importe la cruauté des bêtes ou des pirates, ces intrus n'échapperont pas à la Patrouille. 

En plus de maintenir la paix dans le Golfe, la Patrouille fournit des informations à Aven et aux Chevaliers de la Rose. 

Peu importe la taille des vagues ou la force du vent, la Patrouille du Golfe naviguera fièrement et relèvera tous les défis sur sa route. C'est une légende vivante pour les autres voyageurs des mers. |
1938|Observateurs Éternels
? Augmentation de Gloire : terminer les quêtes de la Vallée de Vulcain.
? Boutique de Gloire : Vallée de la Fournaise (579, 641)

Les Observateurs Éternels sont particulièrement actifs dans la Vallée de Vulcain. Cette mystérieuse organisation s'est donnée pour but de lutter contre les monstres et défendre les opprimés. Leur présence s'est avérée dans de nombreux évènements impliquant Heldentod.

Les habitants d'Heldentod considèrent cette organisation comme très prestigieuse. On raconte que les Observateurs Éternels comptent même des amis parmi les officiers de haut rang dans l'armée. Notamment ceux stationnés dans la Vallée de Vulcain.

Cependant, pour des raisons évidentes de neutralité avec le pouvoir central, ces liens sont un sujet sensible. C'est pourquoi les relations entre les Observateurs Éternels et Heldentod ont toujours été délicates.|
1939|Bureau du juge-avocat d'Heldentod
? Augmentation de Gloire : terminer les quêtes des Plaines du Levant
? Boutique de Gloire : Plaines du Levant (366, 671)

Pour beaucoup, le Bureau du juge-avocat est quelque chose d'assez flou et peu ancré dans la vie de tous les jours. Cependant pour les officiers supérieurs, c'est un précieux témoin de chaque instant.

Le juge-avocat est là depuis la fondation de la nation. Pendant le règne d'Heldentod III le tyran, le Bureau était intimement lié au pouvoir. Mais après de nombreux changements et restructurations, il a obtenu son indépendance.

Le Bureau est passé de la répression à tout crin à une justice équitable et indépendante. Cette impartialité fut un changement drastique, à l'opposé du régime tyrannique d'antan. Cela a apporté à l'Empire stabilité et pérennité.|
1940|Cuirassé
? Augmentation de Gloire : terminer les quêtes du Royaume Dévasté
? Boutique de Gloire : Royaume Dévasté (282, 626)

La Première Légion d'Heldentod est l'armée la plus puissante de l'Empire Heldentod. C'est une force charnière dans l'Empire. Elle possède même un titre spécial : Cuirassé.

Tout comme son titre, cette armée est froide et implacable et s'oppose à tout ce qui peut menacer l'Empire. La Légion ne se rend pas et ne bat jamais en retraite. Elle fait la gloire de l'Empire.

Ces défenseurs acharnés, torrents de sang et de fer, sont le fléau des ennemis de l'Empire. Bien que toutes les forces armées du continent méprisent cette Légion, elle reste pour les habitants d'Heldentod un symbole de fierté.|
1941|Croisés de Braider
? Augmentation de Gloire : terminer les quêtes des Plaines du Levant
? Boutique de Gloire : Plaines d'Elos (301, 629) 

La Fédération de Valence est composée de plusieurs nations. Parmi elles, le Royaume de Braider accorde une importance toute particulière à la gloire et à la chevalerie. Son écusson, composé de 2 épées croisées indique clairement le penchant militariste de cette nation.

L'Empire Heldentod et le Royaume de Braider étant souvent en guerre, le Royaume de Braider a la lourde tâche de défendre les frontières de la Fédération. Si l'ennemi arrive s'emparer du Fort Lion, plus rien ne pourrait les empêcher d'envahir les Plaines d'Elos.

Cependant, aucun ennemi n'a réussi jusqu'à présent à atteindre l'Avant-poste d'Elos. C'est en grande partie grâce à la Cavalerie du Royaume de Braider qui patrouillent inlassablement sur les routes principales.|
1942|Garnison de la Marina d'Edouard
? Augmentation de Gloire : terminer les quêtes de la Marina d'Edouard
? Boutique de Gloire : Marina d'Edouard (461, 72)

La capitale du Royaume de Braider est la Marina d'Edouard. Cette ville est réputée imprenable. En temps de paix, ce château situé au milieu d'un lac attire de nombreux touristes.

De loin, ce château semble avoir été taillé dans un bloc de marbre blanc. Ses murs sont couverts de sculptures illustrant des batailles héroïques, ce qui lui a valu son nom d'Amazone du lac. 

Une fois son pont-levis levé, la Marina d'Edouard n'a plus aucune connexion avec le monde et est virtuellement imprenable. Il est vrai que personne n'a jamais réussi à prendre ce château par la force.|
1943|Veilleurs Survivants
? Augmentation de Gloire : terminer les quêtes du Royaume Durango
? Boutique de Gloire : Royaume Durango (587, 368)

Il existe une vieille histoire, quasiment oubliée de tous, qui raconte le passé glorieux d'un royaume magique. Cependant, aucune explication n'est avancée quant à la soudaine disparition de ce royaume si puissant.

Aujourd'hui, cet ancien pays disparu est de retour dans le monde sous forme de malédiction. Il flotte dans les airs, telle l'incarnation de la Mort, crachant des flammes et projetant des météorites.

Mais il existe encore des personnes qui s'opposent à sa destruction. Bien que le sang qui coule dans leurs veines soit le même que celui de ceux qui voulaient détruire ce monde, cela n'entache pas leur désir de maintenir la paix.|
1944|Gardiens de l'Arbre Sacré
? Augmentation de Gloire : terminer les quêtes du Dôme Céleste
? Boutique de Gloire : Dôme Céleste (247, 464)

La légende raconte qu'autrefois le sud-est du continent n'était qu'une terre aride. Par manque d'eau, même l'herbe avait du mal à pousser. C'est alors qu'un pionnier a finalement trouvé une source et on raconte qu'un arbrisseau a germé de sa main.

Désormais, le Dôme Céleste foisonne de ressources naturelles et il s'agit probablement d'un des cadres les plus idylliques du continent. L'imposant Arbre de Vie distille son énergie partout dans ce pays. Son eau éternellement pure fertilise la terre et créé la vie tout autour.

Afin de protéger ce pays et l'Arbre de Vie, la Tribu Orphidée veille depuis des siècles. Elle a juré de protéger ce pays et de repousser tout envahisseur.|
1945|Ailes d'Ange Ardent
? Augmentation de Gloire : terminer les quêtes des Hauteurs Feudegivre
? Boutique de Gloire : Les Hauteurs Feudegivre (471, 603)

Personne ne sait quand cela a commencé, mais les habitants de Flammeville ont pour rituel de prier le Dieu du Feu et cela est devenu pour eux aussi naturel que de respirer. Ils croient fermement à la toute puissance de leur Dieu et sont persuadés qu'il les éloignent des monstres.

La conjonction de la chaleur du volcan et du climat des steppes du nord a formé un minerai que l'on ne trouve que là. Ce minerai peut servir à forger des armures extrêmement solides et des décorations très prisées. C'est pourquoi Flammeville vit du travail de sa forge. 

Flammeville est connue et reconnue dans tout le sud-est du continent. C'est pourquoi les habitants ont pris le Dieu du Feu comme emblème et symbole de leur ville. Ils espèrent que leur Dieu les protégera pour l'éternité. Même encore maintenant, les mineurs jouissent d'une solide réputation dans toute la partie sud-est du continent.|
1946|Bruit du silence
? Augmentation de Gloire : terminer les quêtes de Meeryasha
? Boutique de Gloire : Meeryasha (538, 668)

L'Alchimie a une place prépondérante à Grey Lynn, bien que certaines organisations y soient farouchement opposées. Elles pensent que l'alchimie peut apporter la prospérité, mais au prix de dégâts irréversibles sur l'environnement.

Ces personnes ont pris leurs distances par rapport à Grey Lynn et résident désormais dans le Village Mercura, au nord-est. Ils vivent en autarcie et bien que les ressources soient rares, ils acceptent leur situation sans se plaindre.

Ils s'efforcent à chaque instant de protéger l'environnement de Meeryasha d'une destruction de plus en plus inéluctable. Ces sentinelles agissent dans l'ombre pour nettoyer et purifier la forêt. C'est leur but ultime, leur raison de vivre.|
1947|Croisé de Valence
