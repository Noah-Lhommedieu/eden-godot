7621|Alors que vous finissez de nettoyer la corde, il vous semble entendre un appel à l'aide.|
7622|Orlam : « Aidez-moi... Je vous en prie, aidez-moi ! »|
7623|« Orlam ! » « Hein ? C'est vous ! Oh ! » À peine vous a-t-il vu qu'Orlam crache du sang. Il semble en état de choc. Il a l'air gravement blessé.|
7624|Vous lui demandez ce qui s'est passé.|
7625|Le regard dans le vague, Orlam murmure : « B... Brio... rituel... l'arrêter. »|
7626|Vos doutes concernant Brio se sont révélées fondées. Cependant, avant de vous en occuper, vous devez ramener Orlam afin qu'il se fasse soigner et informer le chef de la situation.|
7627|Une puissante éruption magique a lieu là-haut. On dirait que Brio a déjà commencé à détruire le rituel. Dépêchez-vous d'aller au rituel (187, 345) pour enquêter.|
7628|Alors que vous cherchez la source de l'éruption magique, vous apercevez Brio en train de lancer un sort visant à détruire le rituel.|
7629|« Stop ! » Vous lancez un avertissement en brandissant votre arme.|
7630|Brio : « Je n'ai pas le temps de m'occuper des intrus. Partez d'ici ! » Brio ignore votre avertissement et continue à lancer son sort.|
7631|Le rituel est sur le point d'être détruit. Il va falloir avoir recours à la force pour arrêter Brio.
Venez à bout de Brio.|
7632|Brio : « Bon sang ! « Vous ne savez pas ce que vous faites ! » Brio pousse un hurlement en tombant au sol.|
7633|Juste au moment où vous alliez parler, vous vous rendez compte que vous ne pouvez plus bouger d'un poil.|
7634|Orlam : « Je dois vraiment vous remercier, Gardien Éternel... où plutôt, pauvre imbécile ! »|
7635|Brio : « Vous laisser partir... Mais qui êtes-vous, d'abord ? »|
7636|Orlam : « Moi ? Je suis Orlam, fils du chef, et c'est vous l'imbécile, à vouloir détruire ainsi le rituel ! »|
7637|Brio : « Impossible, vous n'êtes pas Orlam ! » Brio veut attaquer Orlam, mais le combat l'a affaibli.|
7638|Orlam : « Vous tenez encore debout. Le Gardien Éternel a été gentil avec vous. Je vais vous donner un coup de main, Gardien Éternel ! »|
7639|Orlam : « La prochaine fois, ce sera votre tour, Gardien Éternel... Mais pour l'instant, j'ai des choses plus importantes à régler. Nous nous reverrons. Ah ah ah ! »|
7640|Orlam, qui avait jusqu'à présent combattu vaillamment, se détourne et disparaît, vous laissant désemparé.|
7641|Brio : « Oh. » Vous entendez un léger fredonnement derrière vous.|
7642|Vous hésitez sur la marche à suivre face à l'ennemi vicieux qui vous barre la route. Impossible de savoir où se trouve Orlam.|
7643|Voilà que Brio, bien que blessé, se traîne vers vous.|
7644|Brio : « Gardien Éternel, ne soyez pas trompé par sa magie, l'ennemi est toujours ici. » Brio commence à incanter.|
7645|Lorsque l'incantation de Brio brise le sort, l'image qui vous fait face se craquelle comme un miroir. Orlam apparaît d'un seul coup.|
7646|Orlam : « Étrange. Comment est-ce possible... Gardien Éternel ! »|
7647|Brio : « Bon, arrêtez ce que vous êtes en train de faire, ou bien vous allez le regretter ! »|
7648|Orlam : « Ah ah ah ah ! Ce sont deux imbéciles comme vous qui vont m'arrêter ? »|
7649|Brio : « Oh. Hein ? Vous montrez enfin votre vrai visage ! » De la lumière surgit brusquement du corps d'Orlam. Vous sentez qu'il s'agit d'un pouvoir exceptionnel.|
7650|Brio : « Vous ne devriez pas prendre cette magie à la légère ! »|
7651|Soudain, Orlam vous attaque, les deux mains levées, et vous repousse facilement tous les deux.|
7652|Orlam : « Vous n'arrêtez pas de me barrer la route. Cette fois, je ne ferai preuve d'aucune pitié. Mourez ! »|
7653|Orlam : « Que se passe-t-il ? Impossible de faire appel à ma force, que... ? »|
7654|Orlam se retrouve paralysé. C'est le moment idéal pour frapper.
Terrassez Orlam pendant qu'il est sans défense.|
7655|Lorsqu'il touche le sol, le corps d'Orlam laisse échapper une étrange lumière avant de se dissiper.|
7656|Une superbe jeune femme apparaît devant vous. Elle a l'air de posséder une magie aussi puissante qu'Orlam.|
7657|Jeune femme : « Grâce à vous, me voilà libérée de mes liens ! »|
7658|Brio : « Vous... Cette magie. Seriez-vous l'Arbre de Vie ? »|
7659|Esprit de l'Arbre de Vie : « Désolé ! Je ne me suis pas présenté, je suis l'Arbre de Vie. Vous avez devant vous la forme que j'utilise pour communiquer avec les humains. »|
7660|Brio : « Veuillez pardonner mon impudence, Puissant Esprit, mais pourriez-vous nous dire ce qui s'est passé ici ? »|
7661|Esprit de l'Arbre de Vie : « Très bien. La personne que vous avez vaincue n'est pas fondamentalement mauvaise. Je sens qu'une puissance étrange contrôle ses actes. »|
7662|Esprit de l'Arbre de Vie : « Les envahisseurs possèdent tous ce pouvoir spécial. Enfin, disons plutôt qu'ils sont contrôlés par ce pouvoir. »|
7663|Esprit de l'Arbre de Vie : « Ils ont réussi à détourner ma Force de Vie détournée et quelqu'un s'en est emparé. »|
7664|Esprit de l'Arbre de Vie : « Dans ma hâte d'arrêter cette personne, j'ai été attaqué au passage par ce jeune homme. Des liens puissants m'ont empêché de bouger ou d'utiliser ma puissance. »|
7665|Esprit de l'Arbre de Vie : « Ce n'est que lorsque vous êtes apparus et que vous avez commencé à combattre que j'ai réussi à reprendre la main et me libérer. J'ai utilisé ma force pour le contrôler. »|
7666|Esprit de l'Arbre de Vie : « Vous savez déjà ce qui s'est passé ensuite. »|
7667|Après avoir écouté l'Esprit de l'Arbre de Vie, vous restez plongé dans vos pensées, taraudé par l'idée qu'une puissance maléfique soit à l'œuvre.|
7668|Esprit de l'Arbre de Vie : « Une grande part de mon énergie m'a été dérobée et je ne pourrai pas rester longtemps sous cette forme. J'espère que je peux compter sur vous deux pour la suite. »|
7669|Brio : « Attendez... Attendez, grand Esprit ! » Brio a à peine le temps de parler que cette incarnation de la pensée disparaît en un flamboiement de lumière pour retourner à l'Arbre de Vie.|
