5887|Détails du Transfert d'Amélioration

- Après le transfert, l'équipement original disparaît.

- Les stats transférables comprennent les niveaux d'amélioration, les attributs bonus et les 
enchantements.

- Si la limite d'emplacement de l'équipement complété est plus basse que la limite de l'équipement original alors la limite de l'équipement complété reste la même.

- Ce transfert d'amélioration n'est valable que pour les équipements du même type de Niv. 50 et plus. Ex : Katana avec Katana ou Armure Légère avec Armure Légère.

- L'équipement original ne peut être transféré sur le même type d'équipement
que s'il a le même niveau ou un niveau supérieur.|
