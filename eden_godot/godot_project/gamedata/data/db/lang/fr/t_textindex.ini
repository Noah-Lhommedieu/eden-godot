7598|
(Garde de Grey Lynn) assigné par Gart le Garde de Grey Lynn terminé.
Toute monnaie gagnée lors des Quêtes Journalières ou des Quêtes Journalières d'instance
peut être échangée auprès de Gart contre des récompenses.

* Comment en obtenir :
1.  Terminez d'abord toutes les quêtes principales pour Gart dans la région
  et vous pourrez alors parler à Chabel par la porte d'instance pour entreprendre des Quêtes Journalières.
2. Après avoir terminé les Quêtes Journalières de Gart,
  vous pourrez recevoir 1 Médaille de Panneau du Temps.
3. Après avoir terminé les Quêtes Journalières d'instances Niv. 85,
  vous pourrez recevoir 50 Médailles de Panneau du Temps.|
