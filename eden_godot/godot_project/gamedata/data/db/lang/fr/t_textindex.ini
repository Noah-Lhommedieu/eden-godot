3985|Réserve de Villa
Vous pouvez placer votre mobilier dans cette Réserve de Villa, pour pouvoir les placer plus tard. Attention : Placer vos objets dans la Réserve de Villa les liera automatiquement/ Quand vous passez en mode Décoration, vous pouvez décorez votre Villa !

Mode Décoration
1. E bas à droite de l'écran vous voyez l'icône du Mode Décoration. Cliquez dessus pour basculer dans ce mode.

2. En mode Décoration, vous pouvez déplacer votre mobilier en cliquant-droit sur l'icône du mobilier dans l'inventaire.

3. Vous pouvez changer la position du mobilier avec la molette de votre souris.

4. Les pièces de mobiliers qui sont déjà placées ont un <E> sur leur icône. Clic-droit sur l'icône de l'objet pour le récupérer.

P.S. : S'il y a encore des visiteurs dans votre Villa au moment de passer en Mode Décoration, ils seront gentiment mis dehors.

Agrandir votre Réserve de Villa
Vous pouvez agrandir votre Réserve de Villa en cliquant sur les trois icônes de Réserve en bas à gauche. Chaque icône augmente la capacité de la Réserve de 8. Si votre Villa est remise à zéro, vous devrez agrandir votre Réserve à nouveau.

