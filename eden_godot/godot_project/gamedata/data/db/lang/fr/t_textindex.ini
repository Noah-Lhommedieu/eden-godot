5650|Cabane du Chasseur
Cette cabane a été construite en haut de la source chaude. Elle est simple mais élégante. |
5651|Bourbier Circulaire
Les bulles visqueuses qui se forment dans cette mare boueuse sont bouillantes et hautement toxiques. |
5652|Canyon Sinistre
Des geysers envoyant des tours d'eau haut dans les airs entourent cette zone. C'est l'habitat des Tritons Saphirs et des Tritons de Jade. |
