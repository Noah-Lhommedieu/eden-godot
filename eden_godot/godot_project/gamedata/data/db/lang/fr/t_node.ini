dont le sous-sol est truffé de galeries, créant ainsi un vrai labyrinthe sous la montagne. 

Le Village Andrew s'est fait connaître suite à la découverte de cristaux bleus très rares. Solides, 
étincelants et très précieux, ces cristaux ont apporté aux villageois 
une foule de nouvelles opportunités commerciales. |Village Andrew|Cottage de la Roue à Aubes |Forêt Cérilia|Carrière Angor||||||Oser Rêver|
