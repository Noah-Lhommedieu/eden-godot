# Eden Limitless — configuration connexion (équivalent connect.ini)
# Serveur local ($EDEN/tools/start-local.sh) : valeurs par défaut ci-dessous.
host=127.0.0.1
login_port=6543
ticket_port=2067
world_port=5200
zone_port=5201
account=
client_version=002.003.05.67
machine_id=BC-EC-A0-43-F3-80

# Transport réseau (phase 4-c) :
#   modern = TLS 1.3 (défaut, requis par le serveur EDEN_TRANSPORT=modern)
#   legacy = handshake RSA/RC4 historique (serveur EDEN_TRANSPORT=legacy)
transport=modern
# Dev : pinning SHA-256 du cert serveur (valeur du [TLS] thumbprint=
# logué au boot) — sinon chaîne standard en prod.
tls_thumbprint=8051B56A627AF0B3F83159BD38B127E7E764446A4361C20F43738407E596E771
# Dev : accepte n'importe quel cert (self-signed local) — warning log.
#tls_insecure=1

# Handshake de version (phase 4-d) — extension Godot-only, envoyée après
# TLS sur login/world/zone (jamais en transport=legacy).
#   version_check=1 (défaut) : VersionHello + attente Ack/Reject
#   version_check=0 : coupe le handshake (serveur EDEN_VERSION_CHECK=0)
#version_check=1
# Corpus gamedata dont le manifest SHA-256 est envoyé dans VersionHello
# (défaut : data/db de la racine gamedata résolue automatiquement).
#gamedata_dir=/chemin/vers/data/db
