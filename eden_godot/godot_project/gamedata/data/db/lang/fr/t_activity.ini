14|Le Souhait de Lucia |C'est bientôt la fête des mères. Le père de Lucia est parti depuis des années, elle est élevée par sa mère seule.  Lucia veut offrir à sa mère sa fleur préférée, la Marguerite Rose, pour cette journée spéciale mais elle a besoin d'aide. 

Gardien Éternel, merci d'aider cette fillette à rendre sa mère heureuse. 
|Pendant la Fête des Mères 

Quand vous tuez des monstres sur les cartes de Nv 20 ou plus, des Coffres de Gardien peuvent apparaître. Ouvrez-les pour obtenir une Marguerite Rose. 

