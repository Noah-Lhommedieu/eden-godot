5558|Informations sur le Champ de Bataille T.4 : 

Mardi, jeudi et samedi : 09h - 23h 

*Accessible aux joueurs de Niv. 30 et plus

Après 21h, les monstres convergeront en direction du centre. Battez-les pour invoquer le 
Boss qui garde le coffre. Le joueur qui vaincra le dernier boss, 
<Gardien du Trésor> Guranson, recevra une énergie mystérieuse.  Quand ce joueur sera vaincu, 
le statut sera transféré à d'autres joueurs. Le dernier joueur recevant l'énergie sera éligible 
pour recevoir les récompenses du chef du village. De l'équipement d'Arène est disponible pour le Champ de Bataille T.4. 

Sur le Champ de Bataille T.4, l'ennemi est partout. Vous pouvez créer un groupe mais vos camarades risquent de rapidement se retourner contre vous et 
vous finirez par devoir les attaquer.

Tuer plusieurs fois le même joueur pendant un même tour n'augmentera pas votre nombre de Créatures Tuées. 
Le score maximum est 300.

Si le joueur est du même niveau que la victime, les Créatures Tuées et le score augmentent de 1.
Si le niveau du joueur est 5 niveaux plus bas que celui de la victime, les Créatures Tuées augmentent de 1 
et le score augmente de 3. 
Si le niveau du joueur est 10 niveaux plus bas que celui de la victime, les Créatures Tuées augmentent de 1 
et le score augmente de 5.
Si le niveau du joueur est 5 niveaux plus haut que celui de la victime, les Créatures Tuées n'augmentent pas 
et le score augmente de 1.

Tuez un monstre normal pour augmenter votre score de 1.
Tuez un monstre d'élite pour augmenter votre score de 3.
Tuez un monstre boss pour augmenter votre score de 5.

Tuez 5 joueurs sur le Champ de Bataille T.4 pour augmenter votre gloire de guilde de 1.
Votre guilde recevra la gloire une fois la partie finie.

Les Créatures Tuées et les scores sont classés sur le Champ de Bataille T.4. 
Le rang est déterminé par les Créatures Tuées, les scores et les niveaux.
Les récompenses sont distribuées en fonction des classements.

Les 3e, 5e, 7e, 9e et 10e Gardiens du Trésor donnent des récompenses. 
Si vous battez des Gardiens du Trésor de niveaux plus élevés, vous gagnerez plus de coffres.

Détruisez les Seaux que vous voyez sur le Champ de Bataille T.4. 
Une fois un seau détruit, vous pouvez recevoir un Sac Étrange rempli de récompenses. 
Quand tous les seaux sont détruits, Ogre Trésorier fera son apparition sur le Champ de Bataille T.4.|
