5333|Infos sur l'amélioration de l'équipement

Infos IU :
1. Placer l'équipement à améliorer dans la colonne du haut de l'amélioration de l'équipement.
2. La colonne du bas affichera une suggestion d'amélioration pour l'équipement. Chaque fois que l'équipement est amélioré, il améliore un attribut au hasard. Plus le niveau de l'attribut est élevé, plus la capacité est élevée.

Étapes d'amélioration de l'équipement
1. Faites glisser l'armure ou l'arme que vous souhaitez améliorer dans la colonne d'amélioration.
2. Si vous améliorez une pièce d'équipement pour la première fois, vous devez sélectionner les priorités de l'attribut de l'arme. Un des attributs a de grandes chances d'être amélioré et les trois autres ont peu de chance.
3. L'équipement amélioré doit être intact pour obtenir de l'EXP.
4. Vous pouvez remplacer l'équipement amélioré par une autre pièce d'équipement. Le premier équipement gardera son EXP et son statut amélioré.
5. Les types d'équipements qui peuvent être améliorés sont : des armures pour tête, corps, taille, pieds et mains. Les armes à 1 main, à 2 mains et les boucliers peuvent aussi être améliorés.
6. Chaque pièce d'équipement a un niveau maximum d'amélioration.
7. Une Armure d'Héritage ne peut pas être améliorée.|
