170|Survie sur l'Île Déserte|L'île est parsemée de vieilles structures sur le point de s'écrouler. Bien qu'elle ait l'air inhabitée, des provisions d'origine inconnue sont disséminées un peu partout. Vous pouvez trouver de la nourriture, des armes plus ou moins utiles et même des armes de sièges dans la nature. 

Quand la nuit tombe, cette île idyllique devient soudainement glauque et terrifiante. Sous la douce lueur de la lune, les survivants du naufrage entendent l'écho d'épées qui se croisent et de cris de guerre. Ils ne sont pas seuls sur cette île et les autres occupants ne sont certainement pas pacifiques. 

Les survivants doivent utiliser toutes les ressources disponibles. Ils doivent éviter la zone qui libère constamment des gaz toxiques tout en battant quiconque se dresse sur le chemin de leur fuite. |Les dangers de la fuite de l'Île Déserte 

*Pour participer, cliquez sur l'icône du champ de bataille sur la mini carte et choisissez Survie sur l'Île Déserte. 
Vous y trouverez tous les détails sur la Survie sur l'Île Déserte, et quand l'île est ouverte, vous pouvez cliquer pour y entrer. 

*Lundi, mercredi, vendredi, dimanche 09h - 21h 

*Vous devez être au moins Niv. 20 pour participer. 

*Dans la Survie sur l'Île Déserte, absolument tout le monde est un ennemi. 
Les personnages sont appelés « survivants » car ils doivent utiliser toutes les ressources à leur disposition pour battre les autres et espérer vivre un jour de plus. 

*Dans la Survie sur l'Île Déserte, les Créatures Tuées et le nombre de victoires seront enregistrés dans les classements. La qualité des récompenses dépendra du temps de survie et des Créatures Tuées. |
171|Défi quotidien |Dans l'organisation des secours à Aven, le <Contact d'urgence> Asymo s'occupe de centraliser les informations et envoyer rapidement des équipes de secours dans les régions qui en ont besoin.|*Bataille d'Hélios : Après être entrés dans le donjon, les deux joueurs doivent chevaucher
  une monture de combat. Utilisez au mieux les capacités de votre monture pour vaincre vos ennemis.
  Les récompenses vous seront envoyées dans votre messagerie lorsque vous aurez vaincu le boss.
  *Ouvert tous les lundi et jeudi

*Fuite du labyrinthe Ramenez la personne ou l'animal et vous serez récompensé.
  Votre intelligence et l'utilisation judicieuse de vos objets sont la clé de sortie du labyrinthe.
  *Ouvert tous les lundi et jeudi

*Gardien de l'Arbre de Vie : Une fois dans le donjon, échangez 10 Pierres d'Invocation avec Grisos et utililsez-les
  pour vaincre les 10 vagues d'attaquants qui viennent pour l'Arbre de Vie. Les compétences que vous venez d'obtenir et qui sont affichées sur la barre
  vous aideront à repousser les monstres. Cependant, 1 Pierre d'Invocation sera consommée par utilisation. Chaque vague a une chance de lâcher des Pierres d'Invocation pour que vous puissiez renforcer vos défenses et continuer le combat ! 
  *Ouvert tous les mardi et vendredi

*Garde du Cimetière : Une fois dans le donjon, les deux joueurs doivent travailler de concert pour explorer
  la tombe et battre les monstres sur leur chemin. À la fin, les joueurs doivent vaincre Zegers et Esmeralda Terranova, les derniers à se tenir entre eux et une précieuse récompense. 
  *Ouvert tous les mardi et vendredi

*Le Pouvoir du Cristal d'Eternal : Protéger les cristaux contre les monstres.
  Les joueurs doivent vaincre les vagues de monstres et protéger les cristaux contre les dégâts. Après quelques vagues
  de monstres, un Boss surgira. Battez-le pour recevoir une récompense. 
  *Ouvert tous les mercredi et samedi

*Défi des Boss : Un Boss apparaît de temps en temps dans l'Arène. Les joueurs seront récompensés
  s'ils en viennent à bout.
  *Ouvert tous les mercredi et samedi

*Génération Future : Une fois dans le donjon, vous pouvez prendre un des enfants
  du Protecteur d'enfants et l'escorter jusqu'à l'entrée.
  Amenez l'enfant au Téléporteur d'enfants et vous recevrez une récompense. 
  *Ouvert tous les mercredi et samedi|
