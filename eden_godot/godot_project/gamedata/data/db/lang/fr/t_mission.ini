1542|Nv. 1  Votre Première Quête II|Vallée Feregal|Allez parler avec la Boulangère Vorisa au sud du village, puis allez ensuite bavarder avec Haman, le Directeur du Centre de Recherches de l'Amitié. Vous trouverez Haman au sud-est du village. |
1543|Nv. 2 Votre Première Quête III|Vallée Feregal|Le Monstre Roublard erre à l'entrée de Corossa. Dirigez-vous vers l'est à la sortie du village. |
1544|Nv. 2 Votre Première Quête IV|Vallée Feregal|La Boulangère Vorisa a préparé des rations pour l'armée. Amenez les rations à Tanor, Longue Patrouille. |
1545|Nv. 2 Votre Première Quête V|Vallée Feregal|Un groupe de Monstres Velus Sauvages a volé le Cristal Bleu de Tanor. Vous pouvez attirer ces bestioles avec les Muffins aux Fruits que Tanor vous a donné. Qui pourrait dire non à un Muffin aux Fruits ?! Faites un clic droit sur le muffin quand vous arrivez à l'emplacement. |
1546|Nv. 2 Inventeur Excentrique I|Vallée Feregal|Apportez le Cristal Bleu que vous avez obtenu et l'huile de Tanor au nord-ouest de Ghasia, où vous rejoindrez Éléanore et l'Intendant Marco. |
1547|Nv. 3 Inventeur Excentrique II|Vallée Feregal|L'Intendant Marco espère que vous pouvez tuer les Champignoïdes Rocailleux des environs, vous les trouverez près de Ghasia. |
1548|Nv. 3 Inventeur Excentrique III|Vallée Feregal|La tentative de l'Intendant Marco de restaurer l'éclat du cristal a été un échec. Peut-être devriez-vous ramener le cristal au Directeur Haman. |
