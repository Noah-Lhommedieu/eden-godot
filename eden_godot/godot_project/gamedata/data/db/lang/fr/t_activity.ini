238|Œuvre d'Art manquante|  Aven possède une Association artistique réputée, qui n'a pas réussi à percer dans la jungle des associations qui sont apparues en ville. À cause de ses piètres résultats, la Curie a coupé les subventions, menaçant de fermeture l'association. Elle ne pourra plus transmettre son savoir et sa culture à travers les âges et les personnes.

  En tant que neuvième <Président du Festiv'Art>, Ichiban a la ferme intention de dynamiser l'organisation. Il a eu l'idée d'inviter des maîtres de toutes les époques à participer à l'Event du Festiv'Art ! Grâce à ses amis de la Bibliothèque de la Curie, il a pris connaissance de l'existence d'un portail Spatiotemporel. Les magiciens de la Curie l'ont créé au-dessus de Aven pour amener les maîtres dans le présent !

  Le Festiv'Art a attiré de nombreux touristes à Aven. Mais le clou de l'Event, les maîtres, ne sont pas encore arrivés. À cause du manque de personnel, les visiteurs errent dans la ville, et certains n'ont même pas pu entrer. De plus, la célèbre artiste <Impératrice Envoûtante> Isuji est vexée de ne pas avoir été invitée. Est-ce que le Festiv'Art va se dérouler comme prévu ? Tout repose sur les épaules des Gardiens Éternels. |Œuvre d'Art manquante

*Les joueurs de Niv. 15 et plus peuvent aller à Aven trouver l'<Œuvre d'Art> Tablette de pierre Préhistorique et récupérer 1 Carte à gratter du Festiv'Art.
|
