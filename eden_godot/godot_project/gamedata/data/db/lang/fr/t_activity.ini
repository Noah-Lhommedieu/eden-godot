173|Réapprovisionné quotidiennement.|Les pirates du monde entier maintiennent une sorte d'ordre tacite, ne pillant que ce dont ils ont besoin. Mais quelques fois, l'affrontement est inévitable. Ceci dit, malgré ses aspects déplaisants, la vie de pirate attire toujours de nombreux candidats. Que voulez-vous... Les gens adorent les perroquets !

D'après la légende, il y aurait deux pirates célèbres : Shawde le gentleman, qui doit son nom au fait qu'il n'a jamais tué durant ses abordages, et l'ambitieux Barsuk Barbe d'argent, qui entend bien étendre son territoire jusqu'à Aven. Ces deux capitaines entretiennent une rivalité plutôt amicale. Ils ont été aperçus traçant leur chemin vers le Continent Central.|Ressources quotidiennes

*Après avoir terminé la série de missions Le Pirate Légendaire, rendez-vous à la Baie Bélouga pour parler à Shawde le gentleman (391, 311) et recevoir une quête. Renvoyez le PNJ indiqué vers Shawde et faites un rapport de vos aventures.

*Vous ne pouvez accepter cette quête qu'une fois par jour.

*Terminez la quête pour recevoir 1 Coffre aux Trésors du marin et une Boîte à bijoux gravée.|
