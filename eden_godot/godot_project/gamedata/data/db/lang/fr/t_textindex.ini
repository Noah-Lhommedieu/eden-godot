* Règles de Combat : 
1. Après être entré dans l'Arène, un compte-à-rebours de 20 secondes se déclenchera. Pendant le compte-à-rebours, 
vous ne pouvez ni bouger ni attaquer. 
2. Quand le combat commencera, le joueur recevra un sac d'objets. Ouvrez-le pour recevoir 
diverses ressources d'Arène et brisez le Baril de rations de survie pour recevoir d'autres sacs. 
3. 3 minutes après le début de la bataille, du gaz toxique se répandra dans l'air. Une alerte sera 
affichée 30 secondes avant que le gaz ne commence à s'écouler. Dans certaines zones, 
vous pouvez trouver de l'équipement de tank avant l'arrivée du gaz. Vous pouvez utiliser le tank pour éviter le poison, 
mais il vous faudra le ravitailler à l'aide de son Baril de Ravitaillement ou il explosera en tuant tout le monde. 
4. Vous ne pouvez pas regarder les stats de combat pendant un combat. Si vous mourrez ou gagnez, le classement apparaîtra. 
Quand un joueur meurt, une pierre tombale apparaîtra pour marquer l'endroit de sa défaite. L'endroit de la 
mort sera marqué par un crâne sur la carte. 

* Règles du classement : 
1. Vous serez classé suivant la durée de votre survie. Si des joueurs meurent en même temps, le classement 
sera déterminé par les Créatures Tuées. 
2. Le combat prendra fin quand il n'y aura plus qu'un seul survivant sur le terrain, 
ou quand tous les joueurs seront morts, ou au bout de 19 minutes après le début du combat. Le classement sera ensuite calculé. |
