2790|Résistance spéciale : 
Modifie le pourcentage de DÉG reçus à cause d'attaques inspirées par différentes écoles. 
Une résistance plus élevée veut dire moins de DÉG reçus par une école particulière.

*Attributs magiques : 
Feu, Foudre, Glace, RÉS Sacrée et RÉS Obscure 
réduisent le pourcentage de DÉG reçus par l'école correspondante.

*Attributs physiques : 
Résistance aux Entailles, Frappes et Percées réduit le pourcentage de 
DÉG reçus par le type d'attaque correspondant.

Armes pour entailler :  Poignard, Rapière, Épée à 1 Main, Katana,
       Épée Colossale, Hache, Pique.
Armes pour frapper : Masse, Ceste, Gourdin, Marteau, 
       Grimoire, Guitare, Bâton, Bouclier.
Armes pour percer : Arc, Pièce d'Artillerie, Faux.|
