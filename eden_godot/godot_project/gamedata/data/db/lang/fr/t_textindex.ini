Afin d'enquêter sur l'origine de la peste, une armée de Valence, menée par le <Prince de Braider> Colombin, a envoyé des troupes dans la Jungle Mayland en s'alliant avec l'Empire Heldentod. 

Mais les troupes ainsi alliées ne se font pas confiance mutuellement, ayant toujours été ennemies auparavant. 

Les troupes de Valence déployées dans la Jungle Mayland comprennent des unités de reconnaissance ainsi que de nombreux chercheurs qui doivent récupérer des matériaux dans la jungle.|
1948|Armée expéditionnaire d'Heldentod
*Augmenter la gloire : Terminez les missions Jungle Mayland et Bassin Shaxia.
*Emplacement de la Boutique de Gloire : Jungle Mayland (516, 413)

Afin d'enquêter sur l'origine de la peste, une armée d'Heldentod, menée par le Général Kasi le Cruel, a envoyé des troupes dans la Jungle Mayland en s'alliant avec l'Union de Valence. 

Mais les troupes ainsi alliées ne se font pas confiance mutuellement, ayant toujours été ennemies auparavant. 

Les troupes de l'Empire Heldentod sont composées de batailleurs, elles se sont donc vues attribuer les missions de combat et de protection du campement. La construction du campement est très importante pour elles. Peut-être envisagent-elles d'en faire un endroit séparé du territoire de l'Empire.|
