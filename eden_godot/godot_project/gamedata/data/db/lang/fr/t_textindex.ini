6419|Instructions pour changer d'Équipement 

* Interface Utilisateur 
1. Cliquez sur le bouton de Changement d'Équipement ou sur le chiffre sous le portrait du personnage pour définir et modifier l'équipement du personnage. 
2. En changeant d'équipement, le sac à dos sera automatiquement scanné à la recherche de collections et d'équipements alternatifs pour le personnage. 
3. L'équipement enlevé est placé dans votre Sac à dos. 
4. En changeant d'équipement, si un objet n'existe pas dans le sac à dos ou dans la collection, l'icône de l'équipement sera grisé. 
5. Les objets grisés ne sont pas automatiquement équipés et doivent être changés par le joueur. 
6. Chaque changement nécessite un temps de rechargement de 5 secondes. |
