6|Barde|Les bardes sont des artistes indépendants qui utilisent les rimes, les sons et les ballades pour influer sur l'ambiance d'une bataille.|Musique|Les bardes motivent leurs camarades en chantant les légendes du passé. Ils déséquilibrent l'ennemi en accélérant le tempo de leurs chansons.|Condition requise :
*personnage niveau 20|
7|Chevalier|Les chevaliers incarnent le courage. Esquivant et bloquant les coups, ils attaquent sans relâche jusqu'à obtenir la victoire.|Chevalerie|Les chevaliers vainquent leurs ennemis en combat singulier grâce à leur vivacité. Ils utilisent la magie pour améliorer leur agilité et leur défense.|Condition requise :
*personnage niveau 25
