8027|Détail Fabrication
La table à gauche montre les résultats possibles de la fabrication de diamant.
Une fois fabriqué, vous pouvez soit récupérer le diamant,
soit l'utiliser pour l'étape de fabrication suivante.

Fonctionnement :
  1.  Chaque étape de fabrication nécessite un Diamant d'Étoile-mirage.
  2. À la fin de chaque étape, vous pouvez soit récupérer le diamant créé,
    soit l'utiliser pour l'étape suivante.
  3. La valeur de la récompense est proportionnelle au niveau de transformation.
Gemmes d'Ezur améliorées :
  1.  Vous avez une chance d'obtenir un diamant d'Arc-en-ciel-mirage.
    Lorsque ce diamant est créé, le processus de fabrication s'arrête.
  2. Les Diamants d'Arc-en-ciel-mirage sont stockés dans les emplacements de droite.
    Une fois que 10 diamants ont été stockés,
    vous pouvez démarrer l'étape suivante.
  3. Vous pouvez stocker jusqu'à 999 Diamants d'Arc-en-ciel-mirage.
    L'excédent de diamants sera supprimé.|
