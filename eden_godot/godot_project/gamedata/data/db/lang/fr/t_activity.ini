195|Grand ouvert !|        Les fêtes de l'Arbre Sacré approchent à grand pas. Les Gardiens de l'Arbre Sacré préparent activement la cérémonie mais le terrible Collisionneur Kornki a fait irruption. Il prévoit de voler les rêves et les espoirs des enfants afin de renforcer ses terribles pouvoirs.
Les Gardiens de l'Arbre Sacré ont découvert que leurs pouvoirs commençaient à s'amenuiser. Il se trouve que le Collisionneur Kornki a déjà commencé à répandre sa terreur.
Les Gardiens de l'Arbre Sacré ne vieillissent pas, ils ont une grande force et sont très rapides. Leur mission est de protéger l'innocence et la créativité des Gardiens Éternels à tout prix. Mais le Collisionneur Kornki, né au plus profond du Pic du Maëlstrom, a le noir dessein de conquérir le monde par la terreur. La foi et la force des Gardiens Éternels peuvent l'arrêter ainsi que le mystérieux pouvoir magique des Gardiens de l'Arbre Sacré.
