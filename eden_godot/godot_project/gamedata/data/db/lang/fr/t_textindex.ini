4706|Comment utiliser la teinture 

Ouvrez votre Sac à dos <B>, cliquez sur une teinture, vous pourrez ensuite colorer les habits de votre classe. 

Utilisable uniquement sur les habits de classe. Les teintures de costume ne peuvent s'utiliser que sur les costumes. La teinture de costumes est divisée en deux catégories : vêtements et coiffes. Vous ne pouvez pas mélanger les deux catégories. |
4707|Comment utiliser la teinture

Cliquez sur un pot de teinture pour ouvrir la fenêtre de teinture. |
4708|Comment utiliser la teinture 

Les deux catégories, Vêtements et Coiffe, sont divisées en trois parties. Avec chaque couleur, vous ne pouvez teindre qu'une seule partie. |
4709|Comment utiliser la teinture 

Une teinture aléatoire renfermera quatre couleurs différentes. Une teinture dédiée n'a qu'une seule couleur, cliquez sur la teinture et la partie voulue pour avoir un aperçu de la coloration. |
4710|Commencer à teindre 

Une fois que vous avez sélectionné une partie, vous pouvez commencer à teindre. |
4711|Obtenir de la Gloire 

Vous pouvez obtenir de la Gloire en terminant les quêtes. Cliquez sur le bouton Gloire de la minicarte pour voir votre Gloire actuelle. |
4712|Présentation de la Gloire 

Cliquez sur la Gloire d'une zone donnée pour voir votre Gloire et la Boutique de Gloire sur cette carte particulière. Quand vous aurez assez de points de Gloire, vous pourrez acheter des Objets de Gloire avec. |
4713|Former un Groupe 

Ouvrez votre Sac à dos <B> pour trouver des groupes et des joueurs sur la même carte. Pour les donjons, vous pouvez utiliser le placement automatique pour que le système vous place automatiquement dans un groupe. |
4714|Rechercher des groupes ou des joueurs 

Cliquez sur « Trouver un Groupe » ou « Trouver un joueur », rentrez les paramètres de recherche puis cliquez sur « Recherche » pour commencer la recherche. |
4715|Commencer un Groupe 

Quand vous n'êtes pas dans un groupe, vous pouvez sélectionner « Participer » ou « Créer Groupe ». Si vous êtes déjà dans un groupe, vous avez l'option « Inviter dans le Groupe » pour demander à d'autres joueurs de se joindre à vous. |
4716|Régler les Paramètres du Groupe

Le Chef de Groupe peut régler la distribution du butin, ce qui détermine de quelle manière seront distribués les différents objets entre les membres du groupe. Le chef du groupe peut aussi définir le but du groupe. |
4717|Qu'est-ce qu'un Attribut de Faiblesse ?

Chaque boss ou monstre élite a un Attribut de Faiblesse. En utilisant l'arme ou le sort qui convient pour exploiter la faiblesse de chaque monstre, vous pourrez infliger des Dégâts de Rupture. |
4718|Détruire des parties 

Chaque boss ou monstre élite a une jauge Dégâts de Rupture. Quand les Dégâts de Rupture du monstre sont à zéro, une partie sera détruite. 

Vous pouvez obtenir un objet bonus en détruisant les parties d'un monstre ! |
