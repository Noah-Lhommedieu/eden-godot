pour les acheter.

2. Cliquez sur Fermer pour quitter cet Étal.|
4053|Contenu de l'Étal
Les joueurs peuvent placer un Étal dans la zone consacrée 
à cet effet pour vendre des objets à d'autres joueurs.

Comment faire :
1. Prix : Mettre un prix sur les objets fonctionne de la même façon
que pour l'Hôtel de Ventes. Une suggestion de prix sera donnée
au départ.

2. Nom de l'Étal : Le nom peut comporter jusqu'à 36 caractères.
