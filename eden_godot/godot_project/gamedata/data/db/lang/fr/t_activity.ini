185|Esprit Gardien (Temps Limité)|Depuis des siècles, de nombreux héros vont et viennent sur ce continent. Les habitants ne les oublient jamais, mais ne fondent pas pour autant tous leurs espoirs en eux. 
Ils ont connu des hauts et des bas avec leurs guildes, mais ils sont toujours là. Leur influence se ressent dans les Villes de Guilde et le Couloir de l'Esprit Gardien a été construit en l'honneur de ces héros. Il est d'ailleurs fort probable que son immense pouvoir ait influencé Aven. 
Afin d'éviter une augmentation de puissance incontrôlée et rétablir la confiance en les Esprits Gardiens, l'esprit de Philidor surveille la Ville Sainte et guide les Gardiens Éternels qui franchissent les portes de ce puissant domaine. |Esprit Gardien 

Conditions requises pour le Donjon : 
- Personnage de Niv. 70 minimum 
- Donjon accessible une seule fois par jour 
- Si vous êtes vaincu dans le donjon, vous ne pourrez pas y retourner avant le lendemain 
- Vous devez faire partie d'un raid pour entrer dans ce donjon Maximum : 10 joueurs. 

Règles : 
- Au début de l'Event, votre Roi et votre Dame apparaîtront au milieu du terrain. Le Gardien Éternel recevra les bénédictions du Cavalier, du Fou, des deux Tours et du Pion afin de protéger le Roi et vaincre l'ennemi. 

- Les ennemis attaqueront de quatre directions. L'avantage change de camp toutes les 10 secondes, saisissez ces opportunités. 

- Vous devez vaincre un Roi ennemi pour gagner la bataille. L'Event est terminé si un des deux rois est vaincu. 
*L'Event est terminé dès que le Roi de l'ennemi touche le vôtre.* 

Récompenses : 
- Battez les ennemis pour obtenir un Cristal Purifié. Le Chef de guilde peut les échanger contre un Coffre d'Esprit Gardien auprès de Philidor. |
186|Decorate Aven|Halloween seemed to sneak up on the residents of Aven like a black cat at midnight, but they are now eager to decorate the town with spooky flair. <Apprentice Mage> Bidot, a big fan of the holiday, waved his hand, and suddenly, a bevy of fun Halloween accessories appeared. The citizens of Aven are thrilled to use these magical decorations to get in the spirit.
To add fun and whimsy to Halloween, <Apprentice Mage> Bidot cast a special magic spell to make Floating Spirits appear throughout Aven. However, there was a slight problem with one of his spells, and unfortunately, as a result of forgetting to carry the 2 in a magical mathematical equation, an abomination known as <Slightly Screwy> Frankengrue now roams the city, wreaking havoc.
Because of the appearance of these Halloween ghouls, children have begun disguising themselves as ghosts. Look out for mistaken identities, and watch your back! Halloween is as scary as ever!
|Decorate Aven

