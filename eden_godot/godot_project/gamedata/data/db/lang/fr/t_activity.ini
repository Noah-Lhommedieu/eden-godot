200|Une invitation au banquet à Aven|Même si tout le monde ne fête pas le Nouvel An au même moment, c'est toujours une bonne excuse pour préparer des plats très sophistiqués. C'est pourquoi, pour récompenser tous les joueurs de leurs durs efforts cette année, un banquet du Nouvel An aura lieu à Aven. Vous aurez l'immense privilège de déguster les mets les plus raffinés de Jaques le Chef Cuisinier, qui proposera des plats du monde entier.

Le 1er janvier, à minuit pile, le banquet du Nouvel An d'Aven commencera. Même si vous n'avez pas assisté aux Events de cuisine précédents, vous êtes tout de même le bienvenu ! Finissez l'année 2014 tout en beauté !|Une invitation au banquet à Aven

* <Chef Cuisinier> Jacques est à Aven (446,409). Vous pouvez venir lui réclamer la Bible gourmande pour élaborer des plats festifs du monde entier. En guise de récompense, vous recevrez de l'expérience supplémentaire.

* Le 1er janvier à minuit (00:00), Aven (446,409) proposera un apéritif dinatoire pour marquer la nouvelle coutume du banquet du Nouvel An. Les participants auront le privilège de déguster des mets subtiles qui leur donneront des effets divers.
|
201|Symbole de chance de la Danse du lion|  Kitton, le marchand itinérant et ami de Zilgar le Marchand de montures, retourne à Aven lorsque le Festival du Printemps approche. Quand il remarque que les affaires ne vont pas très bien pour Zilgar, il décide de lui raconter comment les marchands des pays lointains prient pour attirer la chance de leur côté.
  D'après les dires, il faudrait se déguiser en lion pendant le Festival du Printemps et attraper le Symbole de chance tout en haut sur les toits. En accomplissant cette prouesse, l'heureux participant deviendra chanceux pendant toute une année.|Symbole de chance de la Danse du lion

* Acceptez la quête de Kitton à Aven pour recevoir
  l'effet Danse du lion. Utilisez le Saut en hauteur pour atteindre le toit de la maison derrière Ziglar.
 Utilisez Bouche ouverte pour attraper le Symbole de chance et terminer
 la quête.

* Si vous perdez l'effet Danse du lion, abandonnez cette quête et recommencez.

* Cette quête ne peut être faite qu'une fois par jour.|
202|Dehors, la Bête du Nouvel An !|  La rumeur court que l'attaque de la Bête du Nouvel An sera plus terrible encore que les années précédentes. Les écailles de la créature, qui absorbent l'énergie spirituelle du ciel et de la terre, ne peuvent être percées par de vulgaires lames. 
  Nikola a donc eu la très bonne idée de ramener de la Poudre à Canon à Kitton pour en faire des pétards. Le moment venu, tout le monde pourra utiliser les pétards pour créer un boucan d'enfer qui effraiera la Bête du Nouvel An, connue pour avoir les nerfs fragiles.|Dehors, la Bête du Nouvel An !

* En tuant des monstres, vous avez une chance de trouver un Baril de Poudre. Percez
 le Baril de Poudre pour obtenir l'objet de quête Poudre à Canon. Ramassez 4x Poudre à Canon et
 ramenez-les au <Colporteur> Kitton pour terminer la quête.

* Cette quête ne peut être faite qu'une fois par jour.

* Le surplus de Poudre à Canon peut être échangé auprès du <Colporteur> Kitton contre des bénédictions
 qui augmentent le taux d'Apparition de Butin de 5 % pendant 30 min.
|
203|Rencontre avec la Bête du Nouvel An|  Après ses mésaventures de l'année précédente, la Bête du Nouvel An est plus prudente. Elle rôde souvent autour d'Aven pour observer l'organisation stratégique locale. N'ayant pour l'instant pas absorbé assez d'énergie spirituelle, les armes normales peuvent la toucher.|Rencontre avec la Bête du Nouvel An

* La <Bête du Nouvel An> apparaîtra à Aven toutes les 4 heures pour faire ses observations.
 En la tuant, vous pouvez obtenir des récompenses.
|
204|Bête du Nouvel An légendaire|    La Bête du Nouvel An, qui a puisé dans les énergies spirituelles et telluriques, a enfin recouvré toutes ses forces. Ses écailles dures sont à l'épreuve des lames.
  Tenez-vous prêt. Prenez l'Encens allumé et les Pétards de Zilgar pour chasser cette créature gargantuesque invincible !|Bête du Nouvel An légendaire

*Tous les soirs à 22 h, l'<Invincible Bête du Nouvel An> Kirin, avec ses écailles renforcées, apparaît à Aven.
 Récupérez des Pétards auprès du <Colporteur> Kitton et chassez
 la créature avant qu'elle n'atteigne le centre d'Aven.

*L'<Invincible Bête du Nouvel An> Kirin ne peut pas être vaincue par de vulgaires lames. Vous devez utiliser la compétence Pyrotechnie jusqu'à ce que
 la panique de Kirin atteigne 100 pour pouvoir la chasser.

*Si vous terminez la quête, un Délégué d'Aven apparaîtra à (308,374).
 Jusqu'à 1 h du matin, vous pourrez récupérer une récompense auprès de ce PNJ.
|
205|Le Courage de l'Amour|Ce jour éblouissant qu'est la Saint-Valentin est enfin arrivé ! C'est le moment de sortir le portefeuille, et de trouver un cadeau qui plaira à votre moitié ! Pour l'occasion, la <marchande de la Saint Valentin> Michelle est là pour vous. Pour faire marcher les affaires, elle a fait de la publicité pour son magasin en décorant Aven avec ses ballons en forme de cœur. Une touche romantique et délicate. 

 Alors qu'elle essayait de créer une bouture spéciale à vendre pour la Saint-Valentin, la <marchande de la Saint Valentin> Michelle a accidentellement créé une plante monstrueuse, la Rose sauvage Hépyne. Autant dire que depuis, les affaires ne vont pas bon train. Mais Michelle ne veut pas se laisser abattre. Elle a donc créé une Fleur du courage qui permettra à chacun d'affronter ses sentiments avec bravoure. Avec ce nouveau produit, elle espère reconquérir sa clientèle.

Pendant cette fête tant attendue, beaucoup de célibataires en quête de l'âme sœur prennent leur courage à deux mains pour faire leur déclaration à l'élu de leur cœur. Il faut toujours tenter le coup, qui sait ! Alors, qu'attendez-vous ?|Le Courage de l'Amour

* À Aven, trouvez la <marchande de la Saint Valentin> Michelle et acceptez la quête et les objets qu'elle vous donne. Utilisez ces derniers aux endroits indiqués.

*Cette quête ne peut être faite qu'une fois par jour.

*En terminant la quête, vous obtiendrez 1 Cœur en chocolat.

*Récupérez 5 Cœurs en chocolat et échangez-les auprès de la <marchande de la Saint Valentin> Michelle contre 1 Boîte de Saint Valentin.

*Récupérez 100 Cœurs en chocolat et échangez-les auprès de la <marchande de la Saint Valentin> Michelle contre 1 <Bâton Diamant Éternel>.|
