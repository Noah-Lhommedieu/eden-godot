210|Les cours de Mlle Valéria|    Mlle Valéria à donné des cours intensifs ainsi que du matériel éducatif à chaque étudiant. Elle espère que cela leur permettra de se frayer un chemin vers le succès. En ouvrant le support de cours, vous recevrez le Certificat d'Assiduité de Mlle Valéria ainsi que l'opportunité de recevoir toutes sortes d'Amulettes d'EXP et de costumes sophistiqués. Récupérez 7 Certificats d'Assiduité et échangez-les contre de superbes récompenses.|<Calendrier d'Event de Mlle Valéria>

*Pour chaque niveau, vous pouvez suivre les cours de Mlle Valéria une seule fois par jour et par cession de cours.

*Nv. 1–60 Cours Centré sur le Niveau : EXP +50 % et EXP de classe +20 %. L'effet dure 3 heures.

*Nv. 61–79 Cours Centré sur l'EXP : EXP +50 %, EXP de classe +30 % et recevez 1 Cahier de texte du Primaire. L'effet dure 3 heures. 

*Nv. 80 et + Cours Centré sur la classe : EXP +30 %, EXP de classe +50 %, EXP Éveil de Classe +50 % et recevez 1 Cahier de texte Études supérieures. L'effet dure 3 heures.|
211|Un lapin pas si crétin|    Alice, la <Fille Mystérieuse>, est apparue à l'entrée du port.  Elle affirme être à la poursuite d'un lapin qui parle.
Ne venant pas de la ville, Alice ne connait ni ses habitants, ne ses rues, mais elle est résolue à trouver M. Lapin. Elle n'a pas d'autre choix que de vous demander de l'aider à attirer le sournois M. Lapin hors de sa cachette.|Un lapin pas si crétin

*Allez voir Alice, la <Fille Mystérieuse>, au port d'Aven (243, 272)
 pour recevoir la quête. Recevez le <Petit Gâteau> et utilisez-le pour
 déplacer le rocher, puis filez M. Lapin, qui prend la fuite vers le port (206, 277)
 et parlez-lui pour terminer la quête.

*Si <Grandir> et <Rapetisser> disparaissent, abandonnez la quête
 et recommencez-la.

*Cette quête ne peut être faite qu'une fois par jour.|
212|Retour à la maison|    C'est presque l'heure de manger ! Mais la pauvre Alice ne peut pas rentrer chez elle. Après avoir demandé alentours, elle découvre que sa maison est de l'autre côté de la rivière, à travers les bois, très, très loin...
Bien trop loin pour rentrer à pied. Elle élabore alors un plan un peu fou : récupérer des ballons et en faire un dirigeable !|Retour à la maison

*Une fois que les monstres ont été vaincus dans la nature, il est possible qu'un ballon Lapin apparaisse. Percez
 Recevez l'objet de quête <Ballon>

*Récupérez 4 Ballons et donnez-les à Alice pour terminer la quête.

*Cette quête ne peut être faite qu'une fois par jour.

*Des ballons supplémentaires peuvent être échangés avec Alice, la <Fille mystérieuse>,
 contre une paire de pantoufles de vair. Elle vous donnera une VIT DÉP +5 % jusqu'à minuit.
|
213|Promenade pour chien|    Le chien d'Alice s'est enfui. Alice veut que vous l'aidiez à retrouver Toto, son fougueux compagnon.|Promenade pour chien

*Allez voir Alice, la <Fille mystérieuse>, pour recevoir la quête <Promenade pour chien>
 et obtenir plus d'informations.

*Recueillez des informations de la part des habitants d'Aven pour découvrir
 où se cache Toto.

*Trouvez Toto et parlez à Alice, la <Fille mystérieuse>, pour terminer la quête.
|
214|La bataille des Petits Soldats|    Alice est arrivée ici par un terrier de lapin. C'est là qu'elle a entendu un groupe de Petits Soldats de plomb discuter de leur prochain plan de bataille.
La pacifique Alice vous supplie de vous rendre aux Monts Calcaires pour les arrêter ! Mais à votre arrivée, les Petits Soldats sont déjà engagés dans un combat féroce. Il vous faut un plan B.|La bataille des Petits Soldats

*Allez voir Alice, la <Fille mystérieuse>, pour recevoir la quête <Stopper la bataille des Petits Soldats>
  

*Rendez-vous aux Monts Calcaires et parlez à Alice pour recevoir l'objet de quête <Champignon magique>
 Parlez au commandant des Petits Soldats à la carrière du village et utilisez vos capacités pour disperser les Petits Soldats.

*Parlez à Alice pour terminer la quête.|
215|C'est toi, mère-grand ?|    Alice n'est pas la seule a avoir emprunté le terrier du lapin. Un Grand Méchant Loup, redoutable et cruel, l'a suivie lorsqu'elle poursuivait M. Lapin !
Il s'est déguisé en une adorable grand-mère et kidnappe des enfants dans le nord-est d'Aven. Il apparaît toutes les 3 heures. Trouvez-le et démasquez-le !|C'est toi, mère-grand ? 

*<Juste une vieille dame> Le Grand Méchant Loup apparaît à Aven toutes les 3 heures.
 Terrassez-le pour recevoir votre récompense.
|
216|Récupérez des cartes ! Échangez-les contre de superbes cadeaux !|    La chance et la béatitude sont des choses que l'on doit trouver seul ! L'Esprit Béat plane sur le monde entier. Par chance, vous êtes là pour rendre à Jeanne  la Carte du Bonheur qui y est attachée et recevoir votre PROPRE cadeau de bonheur. Soyez tous heureux !|<Tableau d'échange de cadeaux de Jeanne>

*Échangez une fois par jour contre un cadeau. Les cadeaux ne sont pas commercialisables.

*Vous pouvez échanger 5 Cartes du Bonheur contre 1 <Parchemin de Récolte Instantanée>.

*Vous pouvez échanger 15 Cartes du Bonheur contre 1 <Appel Mondial>.

*Vous pouvez échanger 30 Cartes du Bonheur contre 1 <Pierre de Sécurité de Feregal>.

*Vous pouvez échanger 50 Cartes du Bonheur contre 1 <Pierre de Sécurité>.

*Vous pouvez échanger 100 Cartes du Bonheur contre 1 <Nouvel objet Sac Smorgasbord>.|
217|Temple au Trésor|  En ce lieu incroyable, des arbres gigantesques poussent à côté du magma en ébullition et l'air brûlant circule au-dessus du sol gelé. Ces ruines enfouies abritent en leur sein une salle de contrôle en rotation perpétuelle, un espace magique frappé de perturbations gravitationnelles, une corniche brillante de richesse et une salle de prière immaculée.

  Selon certains ouvrages, c'était autrefois un temple où se tenaient des rituels de nubilité. Seuls ceux qui étaient capables de survivre à toutes sortes d'épreuves étaient initiés. Cependant, la tribu entière fut un jour décimée. Même s'ils ne purent éviter ce destin tragique, ils réussirent à piéger l'ennemi dans ce temple.

  Pour espérer mettre la main sur les trésors renfermés dans ces ruines, l'aventurier devra coopérer avec ses partenaires pour affronter les monstres d'un autre temps et vaincre l'équipe adverse.|Champ de bataille Temple au Trésor

* Comment y accéder : Cliquez sur l'icône sur la carte, puis choisissez la page Temple au Trésor.
 Cette page vous fournira des informations complémentaires.
 Vous pouvez entrer dans la file d'attente pour y accéder à l'horaire donné.

* Lundi, mercredi, vendredi, dimanche 
  19 h - 20 h
 Samedi
   14 h - 15 h

* Les joueurs de Niv. 80 ou plus peuvent participer une fois par jour.

* Au cours de cet évènement, les joueurs devront communiquer activement avec
 leurs coéquipiers et discuter de leur stratégie pour atteindre un score élevé.

* Lorsque la partie est terminée, la victoire revient à l'équipe détenant le plus de points.
 L'équipe gagnante reçoit une récompense de grande valeur.|
218|Expérience malchance|D'étranges monstres se sont glissés hors de la fissure dimensionnelle. Allez les éliminer avant que la situation ne s'aggrave.|Terrassez les monstres alchimiques.

