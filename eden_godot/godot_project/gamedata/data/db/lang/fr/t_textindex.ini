5561|Détails de la Boîte Mystique

Règles de base
 1. Matériau principal : clic droit sur l'objet dans votre sac à dos pour le sélectionner. Ou alors, cliquez sur l'objet et faites-le glisser vers un emplacement dans Matériau principal.
 2. Aperçu objets finis : lorsque les matériaux requis correspondent à la formule, une liste de produits finis possibles apparaît. Les objets finis ont leurs propres stats et ne gardent pas les stats des objets précédents.
 3. Charme : fonction disponible prochainement Restez connecté !
 4. Formule : cliquez pour visualiser les formules.

Caractéristiques
 1. Fusionner et Transformer : permet de combiner des objets afin de créer de meilleurs équipements.
 2. Reforger : change les stats de l'objet.
 3. Troc de costumes : combine des costumes afin de créer de meilleures tenues.
 4. Désassembler : désassemble des objets pour récupérer des matériaux supplémentaires.
 5. Formule secrète : cette fonction sera également disponible prochainement !|
5562|Détails de Formule

Règles de base
1. Matériau principal : objet requis.
Même en cas d'échec du processus, l'objet ne disparaîtra pas.
2. Matériau : objet requis.
Cet objet disparaît après utilisation.
 3. Objet fini : l'objet apparaît si le processus a réussi.
 4. Format d'affichage : nom de l'objet (Qualité) (Quantité)|
5563|Détails de l'objet   

Règles pour lier
Les objets finis sont toujours déliés. Peu importe si vous démarrez le processus avec des matériaux liés ou déliés.

Affichage de la qualité
Les objets normaux laissés tombés par les monstres sont de qualité Blanche.|
