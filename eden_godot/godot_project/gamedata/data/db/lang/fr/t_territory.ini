27|Arène du Temple|Champ de bataille du Temple au Trésor Règles

* Lundi, mercredi, vendredi 
  18h30  - 20h30
 Samedi
   19 h - 20 h
 Dimanche 
   14 h - 15 h

* Les joueurs de Niv. 80 ou plus peuvent participer une fois par jour.

* Règles de Combat
1.  Le combat commence lorsque 10 joueurs sont entrés. Les joueurs seront automatiquement répartis entre l'équipe bleue et l'équipe rouge.
2. Lorsque la partie commence, les joueurs d'une même équipe seront téléportés dans l'une des quatre petites salles du champ de bataille et disposeront de 5 minutes pour mettre au point leur tactique.
3. Au début du combat, les joueurs seront téléportés sur le champ de bataille pour s'affronter pendant 25 minutes. Chaque adversaire battu apportera des points, qui s'accumuleront au fil de la partie.
  Joueur Adverse : 3 points
  Petit Monstre : 2 points
  Monstre Moyen : 5 points
  Boss : 30 points (8 au total)
  Boss Final : 50 points
4.  Au début du combat, 3 Boss seront disséminés au hasard. Quand tous auront été abattus, 3 de plus apparaitront. Le Boss Final fera son apparition quand les 6 autres Boss auront été abattus.
5.  Le combat prendra fin 25 minutes après le lancement, ou après la mort du Boss Final. L'équipe avec le plus de points remporte la victoire.
6.  Après la bataille, les joueurs auront 1 minute pour récupérer les trésors et lancer les dés. Ensuite, vous serez téléportés au lieu de départ.

* Trophées de Combat
1.  Les Boss ont une petite chance de lâcher des Trophées. Le trophée lâché revient à l'équipe du joueur qui a délivré le coup de grâce. 
2. Les vainqueurs recevront une récompense supplémentaire.
