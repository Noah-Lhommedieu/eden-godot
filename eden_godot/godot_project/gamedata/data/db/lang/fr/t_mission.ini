1551|Nv. 3 Vie Éternelle I|Vallée Feregal|L'explosion a détruit le Cristal Bleu. Haman a vite copié les anciennes écritures sur un morceau de papier. Veuillez amener le papier à l'Oracle Magicienne Athéna Marie pour qu'elle l'examine. |
1552|Nv. 5 Vie Éternelle II|Vallée Feregal|L'Oracle Magicienne Athéna Marie vous demande d'aller combattre les Chauves-souris à Fruits Sucrés. Avant de soumettre la quête, faites monter votre personnage au niveau 5. |
1553|Nv. 6 Vie Éternelle III|Vallée Feregal|Les Défenseurs Antiques et les Gremlins Gourmands sont une bonne cible d'entraînement pour le combat. Vous pouvez gagner une belle quantité d'EXP en les battant. Obtenez la Pièce Percée et la Petite Pointe puis apportez-les à Deln. |
1554|Nv. 7 Vie Éternelle IV|Vallée Feregal|Éliminez les Chauves-souris à Fruits Aigres près de Torélia et les Golems des Mines de Fer dans les Restes du Tunnel pour vous entraîner. Athéna Marie vous donnera les résultats de son examen quand vous aurez fini. |
1555|Nv. 7 Vie Éternelle V|Vallée Feregal|Athéna Marie vous attend, légendaire Gardien Éternel. Allez voir Marco qui vous enverra sur le Continent du Centre. Finissez cette quête et dirigez-vous vers le portail de la Colline Tranquille qui vous transportera au prochain lieu. |
1556|Nv. 5 Délice (répét.)|Vallée Feregal|La Boulangère Vorisa a besoin de Fruits Sucrés. Rendez-vous aux Prairies de Seren et cherchez-y des Petits Buissons. Ce serait super si vous pouviez descendre quelques Chauves-souris à Fruits Sucrés au passage ! |
1557|Nv. 6 Héritage Enfoui (répét.)|Vallée Feregal|Il y a beaucoup de Monticules Instables près de Torélia. Du Cristal Noir est enterré dans ces monticules. Pourquoi ne pas en rapporter à Nelle ? Pendant que vous y êtes, éliminez quelques Défenseurs Antiques au passage. |
