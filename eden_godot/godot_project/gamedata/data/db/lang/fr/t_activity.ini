- Allez voir l'<Alchimiste> Galdi à Aven pour
 en savoir plus sur l'Event.|
219|Un refuge pour mes Damoiselles|Le Festival Floral de la Déesse est sur le point de commencer ! Kumiko et sa sœur jumelle Nanako sont les organisatrices du festival. Elles doivent non seulement divertir les invités, mais aussi gérer tous les problèmes qui peuvent survenir dans l'enceinte du sanctuaire.

Mais la cérémonie ne se déroule pas comme prévu. Les deux sœurs doivent trouver des gens pour participer au défilé des costumes et récupérer suffisamment de pétales de fleur pour la cérémonie.  De nombreux monstres ont profité de l'agitation pour s'échapper et l'<Ancêtre démoniaque> Tengou lui-même a été aperçu arpentant l'Île de Sakura. Tout ceci donne beaucoup de travail aux jumelles !

Kumiko et Nanako seront-elles capables de terminer leur mission pour cette grande occasion ? Elles auront peut-être besoin de l'aide d'un Gardien Éternel pour s'assurer que le Festival Floral de la Déesse se termine en beauté !|Un refuge pour mes Damoiselles

*Allez voir Nanako, l'<Apprentie du Sanctuaire>, sur l'Île de Sakura pour recevoir cette quête.

*Cette quête ne peut être faite qu'une fois par jour.

*Terminez la quête pour recevoir 1 Pièce de Prière.

Récupérez 5 Pièces de Prière à échanger contre une Boîte Cadeau du Festival Floral auprès de la <Demoiselle du Sanctuaire> Kumiko.

Récupérez 40 Pièces de Prière à échanger contre un Bâton de Cerisaie Fleurie auprès de la <Demoiselle du Sanctuaire> Kumiko.|
