252|Collection de Cartes de la Fête Nationale|  C'est la fête nationale ! M. Patate douce est à Aven et y reste une semaine. Habitants d'Aven, rencontrez M. Patate douce pour fêter les vacances et en apprendre plus sur les délicieuses patates douces !

|Collection et échange de Cartes de la Fête Nationale

