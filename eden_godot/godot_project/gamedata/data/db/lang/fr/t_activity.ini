20|L'Amitié, c'est Sacré|De toutes les races, ce sont probablement les Zumis les plus pacifiques. Dans leur souhait de rassembler les races et les monstres ensemble, ils ont créé le Centre de Recherches sur les Vagues d'Amitié, célèbre à travers tout le continent.

Aidez les Zumis à construire leur monde de paix en ramenant aux chercheurs des Cristaux d'Asbi !|<L'Amitié, c'est Sacré>

Vous pouvez retrouver les Cristaux d'Asbi un peu partout dans le monde, y compris dans les endroits les plus inattendus ! 

N'hésitez pas à ouvrir tous les coffres qui vous passent sous la main (ou la patte).

Niveau 11+ : Rassemblez 3 Cristaux et allez voir un Chercheur du Centre de Recherches !

Niveau 21+ : Rassemblez 6 Cristaux et allez voir un Chercheur du Centre de Recherches !

Niveau 31+ : Rassemblez 18 Cristaux et allez voir un Chercheur du Centre de Recherches !

Niveau 41+ : Rassemblez 24 Cristaux et allez voir un Chercheur du Centre de Recherches !

Niveau 51+ : Rassemblez 30 Cristaux et allez voir un Chercheur du Centre de Recherches !|
