1601|Modifier le Profil
Modifiez votre profil pour que les joueurs puissent y accéder.

Profil Verrouillé : cochez la case en haut à droite du profil pour le masquer ou le rendre accessible à tous.

Données Personnelles : sélectionnez votre sexe, spécialité, taille, signe astrologique, région et humeur.

Centres d'Intérêt : pour les partager, faites un clic gauche sur une icône, puis glissez-la dans la case correspondante.

Présentation : cliquez sur Modifier la présentation pour saisir votre texte (80 caractères max).|
1602|Afficher le Profil
Lorsque le profil d'un joueur est public, vous pouvez y accéder à partir de la fonction recherche.

Utilisation : cliquez sur le bouton correspondant au profil du joueur pour y accéder et consulter ses succès.|
1603|Communauté
Communiquez avec vos amis et gérez votre liste de personnes bloquées.

Liste d'Amis : données, canal, position actuelle et profil des amis.

Liste de Personnes Bloquées : le système filtre les messages de ces joueurs afin qu'ils ne puissent pas vous contacter.

Modifier le Profil : cliquez sur ce bouton pour ouvrir l'interface de modification du profil.

Ajouter des amis
1. Cliquez sur le bouton Ajouter en bas à droite et saisissez un nom.
2. Faites un clic droit sur l'avatar d'un joueur pour accéder aux options.
3. Faites un clic droit sur le nom d'un joueur dans la fenêtre de chat pour accéder aux options.
4. Faites un clic droit sur le nom d'un membre de la guilde pour accéder aux options.
5. Faites un clic droit sur le nom d'un joueur dans les résultats de recherche pour accéder aux options.
6. Cliquez sur le bouton Ajouter aux amis figurant sur le profil d'un joueur.

Fonctions de base : sélectionner un ami et faites un clic droit pour accéder aux options (supprimer, message privé, bloquer, inviter).

Trier : trier vos amis par nom, niveau, classe et position.|
1604|Recherche
Recherchez les profils des joueurs en ligne. Affinez les résultats avec les filtres.

Résultats : données, position, classe et profil des joueurs.

Filtres : filtrez les résultats par niveau, classe et autres. Les paramètres détaillés incluent les niveaux, les classes, les joueurs sans groupe et sans profil.

Utilisation : réglez vos filtres et cliquez sur le bouton Recherche en bas à droite pour lancer la recherche.|
1605|Couples
Consultez la progression de votre moitié et laissez-lui un message.

Données du couple : date de rencontre, durée de la relation et Pièces d'Amour acquises dans la semaine.

Pièces d'Amour : montant acquis chaque semaine en gagnant des points de succès (une pièce tous les 20 PR). Échangez vos Pièces d'Amour contre des objets dans la Boutique des Couples.

Modifier le message : votre message s'affichera sur la Plateforme de Discussion de Couple (150 caractères max).

Compétence de Couple : faites glisser les icônes de compétence dans les barres de raccourcis. La plupart des Compétences de Couple coûtent des cœurs. Achetez-en dans la Boutique des Couples.

Rupture : en cas de rupture, vous devrez attendre 24 heures avant de former un autre couple.

Remarque : après la rupture, vous n'accéderez plus à l'interface du couple et vous perdrez vos Pièces d'Amour. Les Compétences de Couple seront désactivées jusqu'à ce que vous en formiez un nouveau.|
