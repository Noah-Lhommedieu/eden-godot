2308|Messagerie
Vous permet d'envoyer des messages, des objets ou de l'argent. Des frais d'envoi vous seront facturés.

Instructions : 
 1. Renseignez le champ Destinataire ou sélectionnez un contact.
 2. Renseignez le champ Objet.
 3. Max. 300 caractères par message.
 4. Pour envoyer de l'argent ou un objet, ajustez les paramètres en bas à droite.
 5. Un seul objet par message.
 6. Au bas de l'écran s'affichent les frais d'envoi. Tarif minimum : 5 pièces d'argent.

Remarque : les envois d'objets doivent être payés à la livraison. Le destinataire doit s'acquitter du montant dû à l'expéditeur pour pouvoir récupérer l'objet.|
2309|Boîte de réception
Contient tous vos messages.

Fonctions : 
1. Capacité : 30 messages.
2. Pour récupérer les objets joints, vous devez avoir de la place dans votre sac à dos.
3. Les messages contenant de l'argent ou des objets ne peuvent être effacés.
4. Vous pouvez renvoyer gratuitement à l'expéditeur les messages indésirables.
5. Les messages lus sont automatiquement supprimés après un certain temps, que vous ayez récupéré les pièces jointes ou pas.

Vos messages seront stockés dans le système si votre boîte est pleine. Leur délai d'expiration court à partir la date de réception et non d'envoi.

Les messages sur le système sont supprimés après 365 jours.

Messages non lus : 
- Texte seul : supprimés au bout de 15 jours.
- Messages avec PJ : renvoyés à l'expéditeur au bout de 3 jours.
- Message retournés : supprimés au bout de 10 jours.
- Messages contenant des objets retournés par les enchères : supprimés au bout de 3 jours.|
