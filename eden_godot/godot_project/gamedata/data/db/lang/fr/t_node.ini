305|Zone de Guerre d'Ezur|Oyez Oyez, valeureux Guerriers d'Ezur ! 
Ici se déroulent les combats qui modèleront les rapports de pouvoir à venir ! 

Venez et combattez pour votre guilde et pour la gloire ! |Camp de Base Rouge|Marchand du Nord-Est|Camp de Base Bleu|Marchand du Sud-Ouest|Fontaine Sacrée|Générateur de Cristaux Ouest|Générateur de Cristaux Sud|Générateur de Cristaux Est|Générateur de Cristaux Nord|Pour Ezur !|
