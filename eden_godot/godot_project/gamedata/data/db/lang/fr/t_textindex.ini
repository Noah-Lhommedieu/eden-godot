8459|Infusion de Mana
Infusez de l'Équipement avec les matériaux nécessaires dans le Cube de Mana
afin d'augmenter l'Énergie de Mana et leur nombre d'Étoiles.

Fonctionnement :
 1. Placez un morceau de l'Équipement choisi dans l'emplacement approprié.
   À droite sont affichées l'Énergie et la Capacité de Mana.
 2. Placez l'Équipement nécessaire dans les emplacements prévus
   et le résultat potentiel s'affichera à droite.
 3. Cliquez sur Infusion pour entreprendre l'Infusion de Mana
   et utiliser les matériaux nécessaires.

*Infos sur l'Infusion de Mana
 1. L'Infusion de Mana ne peut fonctionner que sur de l'Équipement apte à être infusé.
 2. Les statistiques de l'Équipement choisi ne changent pas.
 3. L'Équipement source doit être du même type que celui de la cible et disparaîtra après l'Infusion.
 4. L'Équipement obtiendra une Étoile de Mana une fois la jauge d'énergie pleine. L'excédent d'énergie n'est pas transféré au niveau d'Étoile suivant.
 5. Un Équipement peut avoir au maximum 3 Étoiles.

*Équipement ne pouvant pas servir de matériau
 1. Un Costume ou de l'Équipement sans restriction de niveau.
 2. Tout Équipement ou Costume limité dans le temps qui ne peut pas être jeté, fortifié ou réparé.
 3. Tout Équipement ou Costume équipé ou en cours d'amélioration.

*Infos sur l'Énergie de Mana
 1. Pour de l'Équipement ordinaire, la Qualité et la Restriction de Niveau détermine sa quantité d'Énergie de Mana.
  Vert : Restriction de Niveau x0,1.
  Bleu : Restriction de Niveau x0,3.
  Orange : Restriction de Niveau x0,4.
 2. Pour un Costume, la qualité détermine sa quantité d'Énergie de Mana.
  Blanc : 1. Vert : 3

*Infos sur la Capacité de Mana
 1. Lorsque 1 ou 3 Étoiles sont atteintes, une Capacité de Mana est obtenue.
 2. Une Capacité de Mana ne peut pas monter de niveau, même avec une Étoile de Mana supplémentaire.
 3. Les Capacités de Mana de niveau et de nom identiques ont le même temps de rechargement et les effets ne sont pas cumulables.|
8460|Remaniement de Mana
Infusez de l'Équipement avec les matériaux nécessaires dans le Cube de Mana
pour remanier les Capacités de Mana.

Fonctionnement :
 1. Placez un morceau de l'Équipement choisi dans l'emplacement approprié.
   À droite sont affichées les Étoiles
   et les Capacités de Mana actuelles.
 2. Placez l'Équipement nécessaire dans les emplacements prévus
   et le résultat potentiel du Remaniement s'affichera à droite.
 3. Sélectionnez la Capacité de Mana que vous désirez changer.
 4. Cliquez sur Remaniement pour commencer le processus
   et utiliser les matériaux nécessaires.

*Infos sur le Remaniement de Mana
 1. Le Remaniement de Mana n'est possible qu'avec de l'Équipement possédant des Étoiles de Mana.
 2. L'Équipement source disparaîtra après le Remaniement.
 3. L'Équipement source doit être du même type que celui de la cible.
 4. Seule la Capacité de Mana choisie sera remaniée. Il est possible de recevoir la même Capacité après Remaniement.
 5. La Capacité de Mana remaniée possèdera un niveau de plus que l'original si le niveau de la Capacité de Mana choisie est inférieur au niveau d'Étoile de Mana.

*Matériaux nécessaires pour le Remaniement de Mana
 1. Pour de l'Équipement ordinaire, la quantité nécessaire est déterminée par son nombre d'Étoiles de Mana.
  1 Étoile : Vert x5, 2 Étoiles : Bleu / Orange x5,
  3 Étoiles : Bleu / Orange x7. 
 2. Pour un Costume, la quantité nécessaire est déterminée par son nombre d'Étoiles de Mana.
  1 Étoile : Vert x1, 2 Étoiles : Vert x2,
  3 Étoiles : Vert x3.  
 3. Si le Costume n'a pas été acheté dans la Boutique d'Objets, la quantité augmente de +1.

*Infos sur la Capacité de Mana
 1. Lorsque 1 ou 3 Étoiles sont atteintes, une Capacité de Mana est obtenue.
 2. Une Capacité de Mana ne peut pas monter de niveau, même avec une Étoile de Mana supplémentaire.
 3. Les Capacités de Mana de niveau et de nom identiques ont le même temps de rechargement et les effets ne sont pas cumulables.|
