Échangez 10 Graines de l'Arbre du Solstice contre un BUFF au Père Noël. 

Échangez 10 Graines de l'Arbre du Solstice contre un BUFF <Rayon de Yula> : EXP de personnage +5 % pendant 30 minutes. 

Échangez 10 Graines de l'Arbre du Solstice contre un BUFF <Photo synthèse de Yula> : PC du personnage +5 % pendant 30 minutes. |
12|Tétine Sucrée |Le Ludoscientifique Kitton a inventé une nouvelle gamme de superbes jouets pour la Journée des Enfants. Par exemple : des poupées mécaniques, des bonbons et des tétines. Mais un vilain bandit Zumi a prévu de détruire le travail de Kitton. 

Il a donc demandé de l'aide aux Gardien Éternels. 
|<Tétine Sucrée>

Le Jouet Démoniaque peut apparaître sur n'importe quelle carte à partir du Nv. 15. Il vous faudra obtenir un Détecteur de Bonbons pour localiser la Boîte à Bonbons.

Échangez 10 Barbes à papa jaunes contre un BUFF <Bébé Sage> : EXP et PC du personnage +5 % pendant 30 minutes. 

Échangez 10 Barbes à papa oranges contre un BUFF <Bébé Colérique> : Max PV et PM +10 %, VIT DÉP +5 % pendant 1 heure. |
13|La Crise des Jouets |Le Ludoscientifique Kitton a inventé une nouvelle gamme de superbes jouets pour la Journée des Enfants. Par exemple : des poupées mécaniques, des bonbons et des tétines. Mais un vilain bandit Zumi a prévu de détruire le travail de Kitton. 

