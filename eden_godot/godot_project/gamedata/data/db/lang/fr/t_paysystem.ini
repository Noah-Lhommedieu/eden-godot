1|Tenue de Gardien de Noel - Objet de Gloire|La Tenue de Gardien de Noel est la force la plus importante du Dome Celeste, la plupart de ses membres appartiennent a la Tribu Orphidee?; ils ont vecu pendant de nombreuses annees a l'endroit ou se dresse le bouclier invincible de l'Arbre de Vie qui repousse toute force malefique.

L'Ecorce de Source d'Ame symbolise au mieux cet endroit, c'est un materiau crucial, indispensable a la Tribu Orphidee.

Collectez 10 Ecorces de Source d'Ame pour augmenter la gloire de la Tenue de Gardien de Noel.|
2|Ailes d'Ange Ardent - Objet de Gloire|Si les forgerons du Village de Noir Fer sont les plus celebres du Continent du Centre, les premiers dans le sud-est sont incontestablement ceux de Flammeville. La ville a fait des offrandes au Dieu du Feu pendant de nombreuses annees et leur Aile Ardente est devenue l'embleme de l'Union.

Le Tuf de Cristal de Glace, le fameux minerai local, est unique au monde et c'est le materiau principal utilise dans les magnifiques decorations produites a partir des Ailes d'Ange Ardent.

Collectez 10 Tufs de Cristal de Glace pour augmenter la gloire des Ailes d'Ange Ardent.|
3|Bruit du silence - Objet de Gloire|Dans le nord-est de Meeryasha se trouve un petit village quelconque ou les habitants menent une vie tranquille en autarcie. Ils sont toutefois l'organisation la plus importante et la plus devouee a la defense de ce territoire.

De nombreuses plantes mystiques poussent dans cet endroit?: les feuilles de Fougere du Clair de Lune sont couvertes d'une poudre iridescente d'ou elle tire son nom. Les membres du Bruit du Silence croient resolument que les feuilles de Fougere du Clair de Lune peuvent purifier l'energie negative de la Nature.

Collectez 10 Feuilles de Fougere du Clair de Lune pour augmenter la gloire du Bruit du silence.|
4|Nv. 80 Cuisine a savourer|Commissionnaire?: Chef Cuistot

Contenu de mission?:

Je trouve qu'il manque un petit quelque chose a ma cuisine... A moins que les gens ne l'engloutissent sans prendre le temps de la savourer?? En selectionnant de delicieux plats a base de viande, peut-etre qu'ils prendraient plus le temps d'en apprecier le gout??

De plus, les reserves d'?ufs sont au plus bas. C'est un ingredient fabuleux, que ce soit pour les plats ou les desserts.

J'ai la une marmite de ragout. Pourriez-vous collecter des Pattes avant de Loup de Combat et des ?ufs d'Oiseau a Bec Dur pour moi??|
5|Nv. 80 Nouveau traitement medical|Commissionnaire?: Hank

Contenu de mission?:

Il est tres difficile de retirer la chair pourrie d'une blessure, il faut souvent utiliser un couteau pour gratter mais cela cause souvent des degats aux tissus sains. J'ai recemment decouvert que les Bebes Limaces Dents de Rubis s'en nourrissent. Pourraient-elles nettoyer les blessures??

De plus, je n'ai pas suffisamment de Secretions de Protoplasme necessaires a la fabrication du fluide sterilisant. Pourriez-vous m'amener des Bebes Limace Dents de Rubis et des Secretions de Protoplasme Bacterien??|
6|Nv. 81 Un repas risque|Commissionnaire?: Chef Cuistot

Contenu de mission?:

Prendre un repas ne devrait jamais etre ennuyeux... Peut-etre qu'une petite surprise pourrait rendre les choses plus interessantes?? Tant que je fais attention, un peu de Poison de Porc-Epi Veneneux pourrait pimenter un peu les choses?!

Pour concocter ce plat, il me faut du Poison de Porc-Epi Veneneux et de la Chair d'Ours Brun Cruel. J'espere que vous pourrez m'en trouver.|
7|Nv. 81 Ami du voyageur|Commissionnaire?: Jack

Contenu de mission?:

L'exploration n'est pas a prendre a la legere mais mon armure n'est plus en tres bon etat. Un manteau pouvant changer de couleur pour s'adapter a l'environnement et une tunique robuste me seraient tres utiles pour mes futures expeditions.

Pour le manteau, j'ai besoin d'une Peau de Cameleon des Marais Terne, et pour l'armure, d'une Armure dorsale de Bete Herissee. Pourriez-vous me les trouver??|
8|Nv. 82 Le Chemin vers les Hautes-terres|Commissionnaire?: Jack

Contenu de mission?:

Cette expedition s'acheve mais j'aimerais continuer vers le sud. Toutefois, la route est coupee par des Tritons et il est impossible de traverser. J'aimerais que quelqu'un m'aide a reduire le nombre de monstres sur le chemin.

Il y a bien sur une genereuse recompense a la cle, mais apportez-moi des Ecailles de Triton et de la Peau de Triton comme preuve.|
9|Nv. 82 Des materiaux pour une brigandine|Commissionnaire?: Vieille Tilosha

Contenu de mission?:

Mon petit-fils dit que lorsqu'il sera grand, il veut s'engager dans l'armee et proteger sa terre natale. J'aimerais donc lui coudre une Brigandine robuste pour le proteger des blessures au champ de bataille.

Il faut beaucoup de Peaux de Mouton et de Pointes pour fabriquer une Brigandine robuste. Aidez-moi a les collecter?!|
10|Nv. 82 Une bete sauvage qui bloque la route|Commissionnaire?: Riverain Wilson

Contenu de mission?:

Je gagne generalement ma vie grace aux minerais que je collecte. Malhereusement, des Monstrorites Enflammes et des Dragons Squelettes a Griffes sont soudainement apparus et ils m'empechent d'aller a la mine. Gardien Eternel, eliminez-les pour moi.

Comme preuve de votre reussite, collectez des Fragments de Meteore et des Os de Dragon Squelette a Griffes.|
11|Nv. 82 Le seul chemin pour la commission|Commissionnaire?: Jit

Contenu de mission?:

Fendis, le chef du village, est tres affaire et j'ai beaucoup de taches a effectuer pour lui, mais je me fais attaquer par des Pretah des Neiges et des Monstroroches de Glace en chemin. Gardien Eternel, eliminez-les pour moi pour que je puisse accomplir ma tache sans etre attaque.

Je veux m'assurer que vous les avez vaincus, ramenez-moi une Corne de Pretah des Neiges et un Cristal de Glace comme preuve.|
12|Nv. 82 Penurie de fournitures medicales|Commissionnaire?: Guerisseur Camus

Contenu de mission?:

Les viandes de Crabes Geants de Glace et de Betes Merveilleuses ont des proprietes curatives uniques qui accelerent la remission des malades, mais il y a de plus en plus de patients et les medicaments viennent a manquer.

Il me faut de la Viande de Crabe Geant de Glace et de la Viande de Bete Merveilleuse. Aidez-moi a les collecter?!|
13|Nv. 82 Au plus profond de la magie|Commissionnaire?: Mage Lindsay

Contenu de mission?:

J'etudie la magie de la glace et de la neige, et j'aimerais connaitre la composition de la Fourrure de Cheval Flammebleue ainsi que la forme d'une Grenouille des Glaces. Je pourrais utiliser ces informations pour mes recherches.

Il me faut suffisamment de Fourrure de Cheval Flammebleue et d'Ames de Grenouilles des Glaces. Aidez-moi a en collecter?!|
14|Niv. 83 Equipement plus resistant|Commissionnaire?: Eti

Contenu de mission?:

Ne croyez pas que je ne suis qu'un gosse, j'ai de grandes ambitions... Je veux devenir Chevalier pour pouvoir toujours proteger ma s?ur. Il me faut deux armes de l'Epeiste Aveugle et une Tunique des Guerriers Loups des Ombres pour m'entrainer et devenir plus fort.

J'ai besoin d'Epees courtes et d'une Armure de Loup. Aidez-moi a en collecter?!|
15|Nv. 83 Un delicieux repas|Commissionnaire?: Lilia

Contenu de mission?:

John Jackson est tres souvent seul. J'aimerais l'inviter a diner, il parait que la Viande d'Alligator Geant est delicieuse et que l'Esprit du Serpent Enchante a un arome particulierement epice. J'espere que vous pourrez m'aider a trouver ces delicieux ingredients.

Il me faut suffisamment de Viande d'Alligator Geant et d'Arome de Serpent. Aidez-moi a en collecter?!|
16|Nv. 83 Migration de monstres|Commissionnaire?: Anonyme

Contenu de mission?:

Depuis qu'une fissure s'est formee dans l'espace-temps, certains signes indiquent que les monstres a l'ouest de la ville se dirigent vers l'est. Les Apprentis incultes qui ont abandonne l'alchimie ne sont pas en mesure de resister aux vagues de monstres. Nous cherchons donc des gens en mesure de repousser et de tuer les monstres qui rodent dans la campagne.

En ce qui concerne la recompense, je peux vous dedommager en consequence. Mais vous devez m'apporter une Griffe d'Ours Bagarreur et une Griffe de Loup comme preuve.|
17|Niv. 83 Maison volante|Commissionnaire?: Pierre l'artisan

Contenu de mission?:

Mon reve est de parcourir le monde, mais j'hesite a quitter ma maison. Il parait que quelqu'un a recemment construit une tour volante, je me demande si je pourrais faire voler une maison??

Pour cela, j'ai besoin de grandes quantites de pierre et d'ailes de betes. J'espere que vous pourrez m'aider a les obtenir sur la Bete de la Statue Antique et sur la Bete de Meteore de Lave.|
18|Nv. 84 Un ennemi ruse|Commissionnaire?: Yvonne

Contenu de mission?:

D'etranges monstres sont recemment apparus au sud-ouest. Ils ont une apparence humaine mais sont tres ruses. Ils ont forme un groupe et attaquent sans relache la ville, ce qui encourage les autres montres a les rejoindre. Si cela continue, toutes les villes seront rasees.

Aidez-nous a repousser ces creatures penibles et ramenez les Souvenirs d'une Bete d'Ame Demoniaque et de la Peau de Lezard a Long Cou.|
