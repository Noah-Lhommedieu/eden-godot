7279|Instructions pour la préparation d'un mariage :

si vous souhaitez adresser une demande à la Chapelle, vous devez remplir les critères suivants :
1. Avoir le statut Demande en Mariage
2. Avoir le Formulaire de la Chapelle dans votre sac à dos
3. Les couples doivent être au même endroit et sur le même canal.

Une fois votre demande faite, sélectionnez le Formulaire de la Chapelle. Vous recevrez 10 Invitations au Mariage dans votre Messagerie.

Vous aurez 10 minutes pour préparer votre Mariage. Le couple doit atteindre l'Île du Mariage pendant le temps de préparation, sinon le mariage sera annulé.

Vous pouvez envoyer les Invitations au Mariage à vos amis pendant le temps de préparation. Si vous voulez plus d'invitations, attendez d'obtenir le statut En Cérémonie de Mariage.

Il peut y avoir jusqu'à 5 Cérémonies sur la liste d'attente. S'il n'y a plus de place, veuillez attendre votre tour.

Ceux qui ont reçu une invitation peuvent se téléporter sur l'Île du Mariage en suivant le couple. Chaque Cérémonie de Mariage dure 2 heures. Une fois tout le monde parti, l'évènement fermera automatiquement.|
