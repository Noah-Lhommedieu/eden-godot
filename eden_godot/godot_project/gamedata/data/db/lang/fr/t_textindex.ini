1. Choisissez entre Armure Lourde, Armure Légère ou Robe de Protection comme armure. 
*S'équiper d'une arme : 
1. Choisissez entre une Arme au Corps à Corps ou une Arme à Distance. Utilisez-la pour attaquer vos ennemis. 

