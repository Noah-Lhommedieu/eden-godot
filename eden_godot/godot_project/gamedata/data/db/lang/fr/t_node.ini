la terre fertile sont propices aux plantes géantes qui y poussent. 

De nombreuses mares colorées se trouvent entre le col et les sources d'eau chaude. 
Les différentes couleurs des mares sont dues aux bactéries présentes dans ces eaux chaudes. Ces mares sont constamment entourées 
d'un brouillard blanc. 

Cet endroit se situe à la frontière de deux pays, c'est pourquoi ce col est étroitement surveillé 
par l'armée d'Heldentod. Dans le col se dresse une haute tour de garde. 
