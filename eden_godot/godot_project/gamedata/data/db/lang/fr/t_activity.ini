116|Champ de Bataille T.4 Mystérieux  |Le Champ de Bataille T.4 se situe sur une île énigmatique que seuls les aventuriers chevronnés peuvent localiser. Les habitants de cette île ne sont jamais entrés en contact avec les gens de l'extérieur, préférant vivre isolés. L'écosystème de l'île est complexe. Son climat varié est le refuge d'un grand nombre d'espèces fascinantes mais aussi de bêtes féroces.

L'île est surtout connue pour deux raisons. D'abord pour son hostilité. Les monstres qui rôdent sur l'île n'hésitent pas à attaquer tout ce qui bouge. Ensuite pour son absence de lois. Vous pouvez attaquer autant de monde que vous voulez, et même vos alliés ! De plus, cette île abrite une infinité de trésors, tous jalousement gardés par des monstres. De nombreux aventuriers en quête de gloire et de richesse y périssent dans d'atroces souffrances. Ils sont d'ailleurs plus souvent tués par leurs pairs que par les monstres. L'or fait tourner les têtes et peut changer les meilleurs amis en ennemis jurés. Enfin, bien que l'île soit dépourvue de lois, l'appât du gain finit par aliéner ceux qui y restent trop longtemps.|Champ de Bataille T.4 Mystérieux

*Comment y accéder : Cliquez sur l'icône sur la carte, puis choisissez la page Champ de Bataille T.4
 pour en savoir plus
 et voir le calendrier d'entrée dans l'île.

