4354|Monnaie Spéciale
Cette interface vous permet d'obtenir des informations sur le compte des différentes monnaies en votre possession. 

*Information : 

1. Médaille(s) du Héros Débutant : affiche le nombre de Médailles du Héros Débutant en votre possession. Finissez des quêtes de Donjon de l'Épreuve Niv. 50 pour obtenir ces médailles. 

2. Médaille(s) du Héros Apprenti : affiche le nombre de Médailles du Héros Apprenti en votre possession.  Finissez des quêtes de Donjon de l'Épreuve Niv. 55 pour obtenir ces médailles. 

3. Médaille(s) du Héros Vétéran : affiche le nombre de Médailles du Héros Vétéran en votre possession. Finissez des quêtes de Donjon de l'Épreuve Niv. 60 pour obtenir ces médailles.

4. Médaille d'Expédition Débutante : affiche le nombre de Médailles d'Expédition Débutante en votre possession. Finissez des quêtes de Donjon de l'Épreuve Niv. 65 pour obtenir ces médailles. 

5. Pièce(s) d'Amour: affiche le nombre de Pièces d'Amour en votre possession. Vous les obtenez en vous mettant en couple. 

6. Étoile(s) d'Honneur : affiche le nombre d'Étoiles d'Honneur en votre possession. Vous les obtenez en vous battant dans l'arène. 

7. Pièce(s) Alpaga : affiche le nombre de Pièces Alpaga en votre possession. Il est possible d'obtenir ces pièces par le biais de la reproduction, de l'extension et des donjons de guilde. |
