2787|Liste de Compétences
Regroupe les Compétences Générales Communes et les Compétences Générales de Classe acquises ou non ainsi que leur niveau.

Compétences Générales Communes : 
1. Apprises auprès d'un Entraîneur.
2. Elles ne changent pas si vous adoptez une Classe du même type que votre Classe précédente.
3. Elles ne s'effacent pas si vous adoptez une Classe d'un type différent de votre Classe précédente. Cependant, elles seront inutilisables avec votre nouvelle Classe.

Compétences de Classe : 
1. Apprises en dépensant des Points de Classe. 
2. Elles sont propres à une Classe et accessibles uniquement avec un personnage de la Classe correspondante.
3. Elles ne s'effacent pas si vous changez de Classe. Cependant, elles seront inutilisables avec votre nouvelle Classe.|
