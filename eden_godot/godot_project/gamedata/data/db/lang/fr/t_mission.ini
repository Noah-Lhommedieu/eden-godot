2375|Niv. 76 Hmmm, délicieux ! (Illimitée) |Plaines d'Elos |Battez les Algomonstres et récupérez leur Cœur d'Algue. Puis apportez ces fruits à l'odeur étrange à Batali, le Chef de l'Armée. |
2376|Niv. 76 Dans la Forêt (Illimitée) |Plaines d'Elos |Tuez les Lézards Fous Indigo et les Totems Mystiques, récupérez les Gésiers Carmins et les Débris de Totem sur leurs cadavres. Une fois collectés, ramenez le tout à Batali, le Chef de l'Armée. |
2377|Niv. 76 Campement en Danger (Illimitée) |Marina d'Edouard |Tuez les Angelots Démoniaques et prenez des Morceaux d'Ailes Noires sur leurs cadavres. Puis apportez-les à Nova, Capitaine de la Garde du Palais. |
2378|Niv. 76 Total Eclipse of the Heart (Illimitée)|Marina d'Edouard |Tuez les Lutteuses Sanguinaires et récupérez leurs Lames Guerrières. Après les avoir récupérées, rapportez-les à Yorton, le Membre de la Garnison. |
2379|Niv. 76 Budget de la Défense (Illimitée) |Marina d'Edouard |Battez les Bêtes des Illusions Tatouées et les Sorciers de Roche, récupérez leurs Lames Gravées et leurs Bâtons d'Améthyste. Puis apportez ces objets à Yorton, le Membre de la Garnison. |
2380|Niv. 76 Nylès l'Humble (Illimitée) |Marina d'Edouard |Tuez les Minotaures Sanguinaires et les Artilleuses Malfaisantes puis prenez les Cornes de Minotaure et les Munitions non identifiées de leurs cadavres. Apportez ensuite ces objets à Nylès, le Membre de la Garnison. |
2381|Niv. 76 Aide d'Urgence (Illimitée) |Marina d'Edouard |Battez les Fantasbêtes Sanguinaires et les Épéistes à Écailles, récupérez les Ourlets de Chemise Charbonneux et la Garde des Épées sur leurs cadavres. Puis apportez ces objets au Noble Corson. |
2382|Niv. 77 Garde Champêtre (Illimitée) |Marina d'Edouard |Tuez les Monstrorites Enflammés et prélevez les Excroissances Rocheuses sur leurs corps. Puis apportez ces objets à Layla, la Noble. |
2383|Niv. 77 Contre-attaque (Illimitée) |Marina d'Edouard |Débarrassez-vous des Chasseurs Musclés ou des Tueurs Toxiques et récupérez les flèches brisées sur leurs corps. Puis apportez ces objets ensanglantés à Moruya, Garde du Palais. |
2384|Niv. 77 Résultats de Recherche (Illimitée) |Marina d'Edouard |Battez l'Artilleuse Malfaisante, la Flingueuse et l'Arme Biologique, puis récupérez les Munitions non identifiées ainsi que les Morceaux de Papier sur leurs dépouilles. Puis apportez ces objets à Yorton, le Membre de la Garnison. |
2385|Niv. 77 Restes Démoniaques (Illimitée) |Marina d'Edouard |Tuez les Angelots Démoniaques et prenez des Morceaux d'Ailes Noires sur leurs cadavres. Ensuite, ramenez ces restes à Moruya, Garde du Palais. |
2386|Niv. 77 Un Obstacle de Taille (Illimitée) |Marina d'Edouard |Battez les Statues Monstroroches et récupérez les Roches de Lumière des environs. Puis ramenez ces roches à Polo, le Commandant de la Garde du Palais. |
2387|Niv. 77 Le Fermier et les Semences (Illimitée) |Royaume Durango |Éliminez les Psychopathes de la Tribu et les Envoûteuses de la Tribu puis récupérez les Graines Boueuses. Apportez ensuite ces graines à Cicéron, le Fermier.|
2388|Niv. 77 Tous toqués ! (Illimitée) |Royaume Durango |Battez les Fous de la Tribu et récupérez les Ornements Tribaux. Puis apportez ces objets à la villageoise Gérona. |
2389|Niv. 77 Sans Foi, ni Loi (Illimitée) |Royaume Durango |Débarrassez-vous des Lutteurs Féroces et rassemblez les Pièces d'Armures Décorées que vous ramasserez sur eux. Puis rapportez ces armures à Binx, le villageois. |
2390|Niv. 77 Mutation (Illimitée) |Royaume Durango |Éliminez les Mutants de la Tribu Enragés et les Mutants de la Tribu Déchaînés et rassemblez les Ceintures Roussies et les Vêtements Prune trouvés sur eux. Apportez ensuite ces objets encore tièdes à la villageoise Gérona. |
2391|Niv. 77 Rénovation Extrême (Illimitée) |Royaume Durango |Éliminez les Monstres Candensabot et les Monstres Sabotpur puis récupérez les Cornes Cadencées et les Cornes Immaculées sur eux. Ensuite, apportez les cornes à Méléna, le Gourou. |
2392|Niv. 77 Tout ce qui Brille (Illimitée) |Royaume Durango |Abattez les Fées de Saphir et les Fées de Rubis puis ramassez les Saphirs Éblouissants et les Rubis Écarlates sur elles. Ensuite, apportez ces pierres à Makili, le Gourou. |
2393|Niv. 77 Lutte pour le Nectar (Illimitée) |Royaume Durango |Tuez les Diablotins Rubis et les Diablotins Saphir et récupérez les Fleurs d'Hibiscus sur eux. Ensuite, ramenez ces fleurs au Gourou Amylaé. |
2394|Niv. 77 Entêté Makili (Illimitée) |Royaume Durango |Éradiquez les Monstres d'Améthyste Cornus et les Monstres de Jade Cornus et prenez les Améthystes et les Cristaux Bleus sur leurs cadavres. Apportez ensuite ces objets à Makili, le Gourou. |
2395|Niv. 78 Le Génie dans la Bouteille (Illimitée) |Royaume Durango |Éliminez les Infâmes Génies Miniatures et les Génies Miniatures Tourmenteurs et ramassez des Colliers Maudits et des Colliers Maléfiques sur leurs corps. Apportez toute cette joaillerie à Kalina, l'Ermite. |
2396|Niv. 78 En Mission pour l'Ermite Arrogant (Illimitée) |Royaume Durango |Exterminez les Armures Trancheuses et les Armures Runiques puis récupérez les Restes de Pouvoir Magique qui refluent de leurs dépouilles. Ensuite, apportez ces restes à Luger, l'Ermite. |
2397|Niv. 78 Existences Minérales (Illimitée) |Royaume Durango |Débarrassez-vous des Colosses de Rubis et récupérez les Pierres Lumineuses sur leurs corps. Ensuite, apportez ces cailloux brillants à Molha, l'Ermite. |
2398|Niv. 78 Existences Minérales II (Illimitée)|Royaume Durango |Abattez les Colosses de Pierre et récupérez les Pierres Marbrées d'Azur de leur corps. Ensuite, apportez ces cailloux à Luger, l'Ermite. |
