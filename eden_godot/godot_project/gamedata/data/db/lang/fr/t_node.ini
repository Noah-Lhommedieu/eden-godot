35|Palais Heldentod |Quiconque pénètre dans ce majestueux palais en a le souffle coupé. Des brillantes gemmes incrustées dans le trône de l'Empereur aux rangées d'armures étincelantes bordant l'allée, tout est ici fait pour impressionner et intimider. Les visiteurs ne peuvent pas échapper au sentiment de suprématie de l'Empereur. 

