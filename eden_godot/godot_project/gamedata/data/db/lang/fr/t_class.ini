1|Guerrier|Les guerriers possèdent de solides aptitudes au combat ainsi que de lourdes armures résistantes.|Courage|Les guerriers excellent en combat de mêlée. Leurs compétences leur permettent d'assurer leur survie lors des batailles et de vite y mettre un terme.|Condition requise :
niveau débutant|
2|Magicien|Les magiciens sont spécialisés dans le contrôle des éléments, utilisant leurs propriétés uniques pour vaincre leurs ennemis.|Magie Élémentaire|Le feu peut tout détruire, la glace peut geler les ennemis et les éclairs peuvent les paralyser. Ces éléments donnent au magicien un avantage fatal.|Condition requise :
niveau débutant|
3|Chasseur|Les chasseurs utilisent leurs compétences de tir et leurs tigres pour immobiliser leurs ennemis à distance, avant de déclencher des tirs mortels.|Instinct du Chasseur|Les chasseurs aveuglent leurs ennemis avec une bombe-éclairante, puis lâchent leur tigre. Enfin, ils les affaiblissent avec des flèches empoisonnées.|Condition requise :
