240|Bouillie de Monstres|Des Monstres Infectés venus d'on ne sait où répandent un virus qui pollue les rivières. S'il n'est pas stoppé à temps, ce virus se propagera aux quatre coins du pays. Éliminez ces monstres avant que la situation ne s'aggrave.|Recherché : Monstre Infecté

