132|Maison de Marjorie|||||||||||Le quartier résidentiel de Meeryasha.|
133|Pays des souvenirs|||||||||||Pure innocence et sentiments sincères.|
134|Tunnel éboulé|||||||||||Un tunnel abandonné|
135|Jungle Mystique|||||||||||Une nouvelle zone inconnue|
136|Palais Heldentod|||||||||||Chambre du Conseil d'Heldentod |
