12|Bataille de la Forêt de Delphes|Objectif de défense :
* Pendant la Guerre de Territoire, vous devez tout faire pour protéger le Cristal des Sables à la Forteresse des Sables. Si le cristal est endommagé, vous perdrez le contrôle du territoire. 

Règles de transfert : 
* Au départ, les Défenseurs peuvent utiliser le portail de la Caserne pour se rendre à la Forêt de Longuepierre, aux Terres des Mille Aiguilles et au Volcan en Éruption, mais les portails peuvent être désactivés suivant la tournure que prendra la bataille. 

Organisation de la Zone : 
* Si le cristal du nord-ouest est détruit, les Défenseurs perdront le portail de la Forêt de Longuepierre et le Pavillon Monstrueux à l'ouest du Volcan en Éruption. 
* Si le cristal du sud-est est détruit, les Défenseurs perdront le portail des Terres des Mille Aiguilles, et le Pavillon Monstrueux au sud du Volcan en Éruption. 
* Si le Gardien Monstrueux du Volcan en Éruption est vaincu, le Volcan en Éruption sera alors occupé par les attaquants. 
* Si la Forêt de Longuepierre, les Terres des Mille Aiguilles et le Volcan en Éruption sont occupés, le Pavillon Monstrueux de la Forteresse des Sables disparaîtra. 

Condition de capture du Cristal des Sables : 
* La Forêt de Longuepierre, les Terres des Mille Aiguilles et le Volcan en Éruption doivent être occupés pour perdre le cristal, alors faites en sorte que ça n'arrive pas ! ||
13|Bataille du Pic de Noireflamme|Objectif de défense :
* Pendant la Guerre de Territoire, vous devez tout faire pour protéger le Cristal de la Mer au Port Azur. Si le cristal est endommagé, vous perdrez le contrôle du territoire.

Règles de transfert :
* Au départ, les Défenseurs peuvent utiliser le portail de la Caserne pour se rendre au Pont Bruchlin, au Port Azur et au Port de l'Océan Azur, mais les portails peuvent être désactivés suivant la tournure que prendra la bataille. 
Les Bêtes Gardiennes déterminent le cours de la bataille !
* Si Eucken est vaincu, les Défenseurs perdront alors le portail du Pont Bruchlin et ne pourront plus défendre la Zone Commerciale du Port. 
* Si Sotsuoha est vaincu, les Défenseurs perdront alors le Port de l'Océan Azur. 
* Si Dash est vaincu, la défense centrale du Port Azur disparaîtra. 
* Si le Capitaine à l'Ouest du Port Azur est vaincu, alors les Défenseurs perdront le portail vers le Port Azur. 

 Condition de capture du Cristal de la Mer : 
* Les Terres Boisées Côtières, le Port Azur et l'Étoile Océane doivent être occupés pour perdre le cristal, alors faites en sorte que ça n'arrive pas ! ||
14|Bataille des Marais Décrépits|Objectif de défense :
Pendant la Guerre de Territoire, vous devez tout faire pour protéger le Cristal de la Forêt au Quartier Général. Si le cristal est endommagé, vous perdrez le contrôle du territoire.

Règles de transfert :
* Au départ, les défenseurs peuvent utiliser le portail de la Caserne pour se rendre à l'Avant-poste et au Quartier Général, mais les portails peuvent être désactivés suivant la tournure que prendra la bataille. 
* Les cristaux déterminent le cours de la bataille. 
* Si le cristal sud-ouest est détruit, les Défenseurs perdront la Forêt des Titans au nord de l'Avant-poste, ainsi que le portail de l'Avant-poste lui-même.  
* Si le cristal nord-est est détruit, les Défenseurs perdront la Forêt des Titans, et la Place du Marché sera occupée par les Attaquants. 
* Si le Vindicateur du Village Forestier est vaincu, alors la Forêt des Titans qui mène au cristal nord-ouest disparaîtra et le Village Forestier sera occupé par les Attaquants.  
* Si le cristal nord-ouest est détruit, les Défenseurs perdront le portail vers le Quartier Général. 

Condition de capture du Cristal de la Forêt : 
L'Avant-poste, la Place du Marché et le Village Forestier doivent être occupés pour perdre le cristal, alors faites en sorte que ça n'arrive pas ! ||
