5314|Célébrités PvP 3 vs 3 
---------------------------------
Les Gardiens Éternels aiment le frisson de la bataille : ils se battent pour la gloire et la célébrité ! Le minimum qu'ils demandent est de pouvoir faire leurs preuves au cœur du combat. Ils versent leur sang au nom du courage et de la justice, c'est pour cela que leurs noms doivent être gravés ici à jamais. 

Classement : 
1. Victoires
2. Tués 
3. Niveau : du plus bas au plus élevé 
4. Si 1, 2 et 3 sont pareils, le système déterminera le classement au hasard. 
|
5315|Célébrités PvP 10 vs 10
---------------------------------
Les Gardiens Éternels aiment le frisson de la bataille : ils se battent pour la gloire et la célébrité ! Le minimum qu'ils demandent est de pouvoir faire leurs preuves au cœur du combat. Ils versent leur sang au nom du courage et de la justice, c'est pour cela que leur nom doit être gravé ici à jamais.

Classement :
1. Victoires
2. Tués 
3. Niveau : du plus bas au plus élevé
4. Si 1, 2 et 3 sont pareils, le système déterminera le classement au hasard.|
