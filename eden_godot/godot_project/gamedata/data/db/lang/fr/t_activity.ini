134|La Légende des 5 Animaux|La Bibliothèque de la Curie a réuni de nombreux ouvrages des quatre coins du monde. Les bibliothécaires ont vite remarqué que les livres concernant Les 5 Animaux étaient tous endommagés, ils ont eu peur de ne jamais découvrir les secrets de ces volumes. Cependant, grâce à l'aide d'une mystérieuse organisation du nom de Marcheurs des Ombres, la Bibliothèque de la Curie a découvert un moyen d'utiliser ces livres pour voyager dans le temps. Le Bibliothécaire Conan est ravi par cette découverte. Il pense qu'en revivant le passé, rectifiant les vieilles erreurs et en apaisant les rivalités, l'amertume entre les races pourrait disparaître. |La Légende des 5 Animaux 

