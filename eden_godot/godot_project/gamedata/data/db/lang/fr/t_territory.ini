Récompense de Participation
Les 16 meilleures Guildes seront sélectionnées pour participer à cette compétition. En se basant sur le classement, les guildes recevront différentes récompenses et un buff appelé Glorification.

Condition de Victoire
Le gagnant sera désigné quand un camp atteint le moral maximum. 

Événement Spécial A
Une zone de préparation se situe de chaque côté. Quand le combat commence, les participants peuvent utiliser un Téléporteur pour se rendre vers leur zone de préparation. Un Marchand attend dans la zone de préparation et les joueurs peuvent discuter avec lui des changements de tactique.

Événement Spécial B
Un Général de Bataille se tient dans la zone de préparation et les joueurs peuvent discuter avec lui des changements de tactique.

Événement Spécial C
Quand le moral des deux camps tombe sous 150, l'augmentation de moral double.|
