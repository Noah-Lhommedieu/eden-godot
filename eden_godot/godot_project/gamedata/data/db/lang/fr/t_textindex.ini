3. Marchandise : Vous pouvez vendre 10 objets à la fois.

4. Enlever l'Objet de la Vente : Une fois l'objet sélectionné,
vous pouvez choisir de l'enlever de l'Étal et de la vente.

5. Commencer la Vente : Cliquez sur ce bouton pour commencer à 
vendre vos objets.|
4054|Achat
Un joueur peut parcourir les objets vendus par d'autres
joueurs et acheter celui ou ceux qui lui plaisent.

Comment faire :

1. Parcourir : Affiche les objets mis en vente actuellement.

2. Achat : Cliquez sur l'objet que vous souhaitez acheter,
ensuite cliquez sur le bouton d'Achat.

3. Sortie : Fermez la fenêtre pour quitter l'Étal du joueur.|
