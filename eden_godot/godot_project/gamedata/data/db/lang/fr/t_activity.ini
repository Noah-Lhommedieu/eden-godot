88|Introduction au Classement de Guilde 

Les classements sont réactualisés toutes les 2 heures. 

Les 8 guildes avec le plus de Gloire de Guilde à la fin de la semaine peuvent rejoindre directement l'Élimination de Guilde, tandis que les 8 autres guildes seront choisies de manière aléatoire parmi celles avec le plus de Gloire de Guilde (minimum 3000). 

Les Membres de Guilde de Nv. 4 peuvent obtenir de la Gloire de Guilde en participant aux Arènes 3 Joueurs, aux Arènes 10 Joueurs et aux Arènes des Boss. 
*Arène 3 Joueurs : le gagnant reçoit 5 points, le perdant en reçoit 2. 
*Arène des Boss : le gagnant reçoit 5 points, le perdant en reçoit 2.
*Arène 10 Joueurs : le gagnant reçoit 10 points, le perdant en reçoit 3.

Les 25 meilleures guildes de chaque serveur seront classées selon leur Gloire de Guilde. Les joueurs peuvent voir les classements de Guilde en jeu. 

Le système calculera la Gloire de Guilde à 6h tous les samedis et annoncera les 16 guildes qualifiées pour l'Élimination de Guilde. La Gloire est ensuite réinitialisée. 

|  La Curie a décidé d'inviter les Gardiens Éternels du monde entier à participer à une compétition de guildes. Cette grande bataille a pour but d'affiner les compétences des Gardiens et de renforcer les relations entre les guildes.|Note sur les éliminatoires de guildes 

*Les guildes recevront des Points de Prestige hebdomadaires. Les guildes classées de 1 à 8 se qualifieront automatiquement pour les éliminatoires. Les guildes classées 9 à 16 seront sélectionnées au hasard par les guildes ayant reçu 3 000 Points de Prestige pour les éliminatoires.

*Les guildes de niveau 4 et + sont éligibles pour les sélections et seuls
 les personnages de niveau 30 et + peuvent participer.

*Seuls 50 membres par guilde peuvent participer aux éliminatoires.

*Les guildes de niveau 4 et + peuvent participer à des duels dans l'Arène 3v3, l'Arène de monstres ou l'Arène 10v10 afin d'augmenter le prestige de la guilde.
Combat dans l'Arène 3 joueurs / Monstres / 10 joueurs     Gagnant : 5 points   Perdant : 2 points

*Le système compilera les Points de Prestige samedi à 06 h.
 Les 16 guildes qualifiées pour les éliminatoires seront annoncées sur le tableau de résultats.
 Tous les Points de Prestige des guildes seront remis à zéro pour les éliminatoires. 

*Les guildes éligibles pour la sélection des Éliminatoires de guildes ne peuvent pas recruter de nouveaux membres avant l'annonce des résultats du combat. Les guildes seront ensuite automatiquement autorisées à recruter de nouveaux membres.

*Récompenses :
A. 1er prix
*Maître : Surprise de la Gloire Sainte x1 et Surprise Glorieuse x100
*Membres : effet Couronne du Champion(toutes les stats +3%).

B. 2e prix :
* Maître : Surprise de la Gloire Sainte x1 et Surprise Glorieuse x75
* Membres : effet Couronne d’Argent (toutes les stats +2%).

C. 3e prix : 
* Maître : Surprise de la Gloire Sainte x1 et Surprise Glorieuse x50
* Membres : effet Couronne de Bronze(toutes les stats +1%).

E : Du 5e au 8e prix :
* Maître : Surprise Glorieuse x50.
F : Du 9e au 16e prix :
* Maître : Surprise Glorieuse x25.

