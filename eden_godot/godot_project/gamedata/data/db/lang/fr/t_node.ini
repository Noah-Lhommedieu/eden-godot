Les îlots étaient connectés grâce à un réseau avec en son centre, 
une île qui servait de centre d'échanges. Sur les îlots, 
la végétation était épineuse et les arbres immenses. 

L'île principale abritait une cité et un palais royal. Cependant, plus aucun autochtone n'occupe aujourd'hui les lieux et 
