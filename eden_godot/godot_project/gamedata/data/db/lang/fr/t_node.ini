308|Arène Sacrée : Le Crucifix |On peut retrouver dans les ruines des morceaux de la magnificence passée de cet endroit. Des glyphes délicats entourent tout le palais, lui donnant un air mystique. 

De faibles rayons de lumière éclairent cet endroit plongé dans les ténèbres. 
 
Sur la place centrale de ce grand palais se tiennent de nombreuses statues, chacune représentant une figure humaine levant les bras vers le ciel. Elles représentent la foi des villageois en une entité supérieure. Bien que l'histoire de leur religion a été oubliée il y a longtemps, ces statues représentent les grandes qualités de leurs croyances. 
|Barrière Nord-Est |Barrière Nord-Ouest|Barrière Sud-Ouest |Barrière Sud-Est|Barrière Centrale |Zone de Préparation Rouge A|Zone de Préparation Rouge B|Zone de Préparation Bleue A|Zone de Préparation Bleue B|Croisade Honorable |
309|Survie sur l'Île Déserte|Cette île présente une ancienne architecture oubliée depuis longtemps. Des fournitures d'origine inconnue sont dispersées dans toute l'île : nourriture, armes et même des armes de siège apparemment encore en état de marche. 

De jour, elle a l'air tranquille, mais lorsque la lune se lève, un glacial voile de terreur tombe sur l'île. D'après la légende, alors que l'île semble déserte, la nuit, les visiteurs peuvent entendre des cris de guerre venant de loin. Les autres habitants de cette île ne sont pas vraiment sympathiques. 

Si vous voulez survivre dans ce terrible endroit, vous devez tirer avantage de toutes les ressources à votre disposition. Vous devez également veiller à bien éviter la partie de l'île où des poisons naturels remplissent l'air humide de toxines. Pour vous échapper, vous devez abattre tous les ennemis se dressant sur votre chemin. Si vous passez trop de temps à réfléchir aux différentes options, vous ne verrez pas le prochain lever de soleil. |Section A|Section B |Section C |Section D |Section E |Section F |Section G |Section H |Section I |Fuyez la dangereuse Île Déserte  |
401|Arène Phénix|Cette arène fait de roche grise solide était autrefois une armurerie où étaient entreposées
armes et armures avant que la Curie Métérole ne décide de les déplacer
vers l'Arsenal Fédéral.

Laissée à l'abandon, un des membres de la Curie, Antony, se rappela
de son existence et proposa de la reconstruire
en abattant les murs pour ne garder qu'une seule grande pièce pour
s'en servir comme arène. Elle fut décorée de drapeaux représentant un aigle
et fut baptisée Arène de l'Aigle de Feu.

Antony avait l'espoir que cette arène servirait non seulement de lieu de tournois et de batailles
mais aussi d'école où les participants pourraient apprendre
la camaraderie et appréhender différentes techniques pour créer une
synergie entre les habitants.|||||||||||
402|Arène des Boss|L'Arène des Boss est un bunker construit il y a longtemps en cas de catastrophe. Les locaux ont beaucoup aidé à construire cet endroit exceptionnel. 

C'est maintenant un centre de recherche animale et une arène d'entraînement. La Curie d'Aven et le Centre de l'Amitié ont collaboré pour créer un rayon laser qui peut transformer n'importe qui en monstre de manière temporaire. Les guerriers peuvent prendre la forme d'un monstre pour approfondir leur entraînement. 

Tinnech espère qu'en procédant ainsi, les guerriers comprendront mieux les monstres et amélioreront leurs compétences de combat. Il espère aussi mieux comprendre les monstres pour qu'ils puissent un jour vivre en harmonie avec les humains. |||||||||||
