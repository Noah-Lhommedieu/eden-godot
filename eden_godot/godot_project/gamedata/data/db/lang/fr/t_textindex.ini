1128|Équipement du personnage
Placez les armes, trophées, accessoires et costumes dans les cases du haut et les armures lourdes, légères ou de tissu dans les cases du bas.

Équipement ordinaire : armures lourdes, légères ou de tissu. Chaque classe ne peut s'équiper que d'un certain type d'armure.

Utilisation : cliquez sur l'objet et faites-le glisser dans l'emplacement voulu. Seuls les costumes modifient l'apparence du personnage.

Remarque : pour changer d'équipement, il faut appartenir à la classe correspondante. Si vous changez de classe, votre équipement d'origine est sauvegardé. |
1129|Titres
Chaque titre confère certains bonus ayant un impact sur les statistiques du personnage.

Obtention : vous pouvez obtenir un titre en accomplissant une quête ou en remplissant certaines conditions.

Choix : sélectionnez un titre dans la liste, cliquez sur Adopter en bas à droite.|
1130|Gloire
Gagnez des Points de Gloire à échanger contre des objets.

Pts de Gloire Régionaux : obtenus dans les villages.

Pts de Gloire Généraux : obtenus en restituant des objets de quête.

Pts de Gloire Spéciaux : obtenus lors des Quêtes de Livres ou sur le champ de bataille.|
1131|Interface des Quêtes
Gérez vos quêtes en cours.

Quota de Quêtes :
Vous pouvez accepter 25 quêtes à la fois maximum.

Liste de Quêtes :
Comprend toutes les quêtes acceptées. Cliquez sur le titre d'une quête à gauche pour afficher sa description.

Abandonner une Quête :
Cliquez sur le titre d'une quête, puis sur Abandonner la quête, en bas de l'écran. Vous pourrez la reprendre plus tard.

Partager les Quêtes :
Vous pouvez les partager avec vos amis sur la même carte pour leur éviter d'avoir à les accepter auprès du PNJ.

Suivi des Quêtes :
1. Appuyez sur Maj et faites un clic gauche sur le titre de la quête à ajouter au suivi des quêtes. Elle apparaîtra en rouge. Procédez de la même façon pour la supprimer.
2. Cliquez sur Afficher le Suivi, en haut de la fenêtre, pour afficher ou masquer l'outil de suivi.|
1132|Interface de la légende
Quêtes et progression de votre personnage. Les quêtes acceptées ou accomplies figurent dans la section Légende.

Utilisation : cliquez pour accéder à un chapitre de l'histoire. Seules les quêtes accomplies s'afficheront.|
1133|Archives
Vous pouvez y sauvegarder équipement, montures, trophées et autres objets. Sélectionnez la catégorie à gauche pour accéder à la collection correspondante.

Remarque : les personnages associés au même compte partagent leurs archives et les objets qui y sont stockés.|
1134|Carte Régionale
La carte de la région actuelle s'affiche à l'écran. La fonction sélection permet de repérer les données cartographiées.

Cartes : consultez les cartes des autres régions.

Monstres : sélectionnez un monstre pour le localiser.

PNJ : sélectionnez un PNJ pour le localiser.

Affichage : vous pouvez afficher tous les PNJ et Portails sur la carte.

Remarque : clic droit sur la Carte Régionale pour afficher la Carte du Monde.|
1135|Carte du Monde
Elle vous permet de visualiser toutes les régions du monde connu. Sélectionnez une région pour en afficher les détails.|
1136|Archivage
Faites glisser l'objet à archiver dans l'emplacement du bas puis cliquez sur le bouton Archiver pour le ranger.

Remarque : seuls les objets de collection peuvent être sauvegardés.|
