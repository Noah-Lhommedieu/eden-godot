5865|Conseils - Tour des Cieux : 

1. Quand une équipe est formée, seul le meneur peut cliquer pour accéder 
au niveau suivant. 
2. La Tour des Cieux est munie d'un point de sauvegarde tous les 10 niveaux. 
3. Si vous quittez la Tour des Cieux, vous reprendrez le défi 
à partir d'un point de sauvegarde. 
4. Dans la Tour des Cieux, votre progression est sauvegardée tous les 10 niveaux. 
Si vous la quittez puis revenez, vous reprenez la partie au dernier niveau sauvegardé. 
5. Après avoir terminé les 50 niveaux, 
vous pouvez recommencer au 1er niveau et retenter votre chance. 
