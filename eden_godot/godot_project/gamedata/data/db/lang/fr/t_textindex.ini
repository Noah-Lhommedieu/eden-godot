4970|Conseils pour l'Expédition 25 Joueurs 
Vous pouvez recruter une expédition ici. Pendant le recrutement de l'Expédition, les joueurs peuvent encore obtenir de l'EXP, des PC et des Succès. Une fois l'Expédition créée, les joueurs ne peuvent acquérir l'EXP, les PC et les Succès que dans les Donjons 25 joueurs. 

Liste des Membres : montre le nombre et les détails des joueurs ayant rejoint l'Expédition. Les joueurs qui se déconnectent sont en gris. 

Infos Chef : montre le chef de l'Expédition et sa guilde, ainsi que le Donjon qu'il/elle a choisi.

Inviter : cliquez et entrez un nom de personnage pour envoyer l'invitation. Les joueurs dont le niveau n'est pas suffisant ou qui ont déjà été dans la file d'attente ou dans l'Expédition ne peuvent pas être invités. 

Entrer dans le Donjon : quand les 25 joueurs sont recrutés, cliquez sur cette option pour les envoyer tous dans le donjon. Si vous êtes déconnecté pendant la téléportation, vous pouvez cliquer dessus pour réentrer dans le donjon. L'Expédition 25 Joueurs n'est accessible qu'une fois par jour. |
