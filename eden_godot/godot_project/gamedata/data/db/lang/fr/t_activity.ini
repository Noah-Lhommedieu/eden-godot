258|Chasse et cueillette|Les citoyens d'Aven vont faire un banquet pour Thanksgiving. La Chef Flora, l'organisatrice, prépare la nourriture pour cette occasion.

Puisque Thanksgiving est un des plus importants festivals d'Aven, Flora tient à ce que tout le monde y assiste. Elle a besoin d'un coup de main des Gardiens Éternels pour obtenir assez d'ingrédients afin que tout le monde ait assez à manger.

Récupérer des ingrédients est généralement assez facile, mais pas à Thanksgiving. C'est dans ces moments-là que Bradrick le Glouton apparaît et sème le désordre. Aidez Flora à récupérer les ingrédients et assurez-vous que le banquet se tienne comme prévu. 
|Chasse et cueillette

*Rendez-vous à Aven et acceptez la quête de la Chef Flora.

*Cette quête ne peut être faite qu'une fois par jour.

*En terminant la quête, vous obtiendrez un Coupon de Thanksgiving et le Buff Gratitude : PV Max et PM Max +10 % pendant 1 heure.

*Échangez 1 Coupon de Thanksgiving contre 5 Viandes de dinde auprès de Stareo

*Échangez 5 Coupons de Thanksgiving contre 1 Boîte Cadeau de Thanksgiving auprès de Stareo

*Échangez 30 Coupons de Thanksgiving contre 1 Couteau tranchant auprès de Stareo

*Échangez 30 Coupons de Thanksgiving contre 1 Fourchette brillante auprès de Stareo


