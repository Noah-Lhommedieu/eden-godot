6200|Le Chemin de la Destinée

*Carte de la Destinée : 
Quand la figure d'échec est posée à un certain endroit, ça déclenchera un incident 
correspondant. 

*Barre du Statut : 
Affiche l'étape actuelle et suggère la prochaine étape. 

*Points d'Aventure : 
Avec le temps, vous recevrez 1 Point d'Aventure quand vous atteignez 100 %. 
Chaque production de la Carte de la Destinée vous coûtera 1 Point d'Aventure. 
Vous récupérerez 1 point pour 2 heures en jeu dans la limite de 10 points. 

*Mobilité : 
Chaque lancé de dé coûtera 1 point de mobilité. Vous pouvez battre des 
monstres jusqu'à 5 niveaux inférieurs et 9 niveaux supérieurs à vous afin de recevoir 
de l'Expérience de Destinée pour récupérer de la mobilité. Le maximum récupérable est de 10 points. À chaque fois que vous finissez le Chemin de la Destinée, les points seront remis à zéro. 

* Vous ne pouvez lancer le dé et vous déplacer que dans Aven, sur le Terrain ou dans la Ville de Guilde. |
6201|Sélection de la fonction

*Dé : 
À chaque fois que vous lancez le dé, vous perdrez un tour. Quand vous produisez la Carte de la Destinée, les tours seront remis à 10. 

*Actions : 
Lancez le dé pour obtenir un nombre entre 1 et 6. Vous pouvez également choisir dans la liste des outils de dé ou bouger de suite. 

  2. Bouger : 
La figure d'échec sera déplacée selon le compte final et déclenchera les événements correspondants. 

  3. Utilisation du Trèfle : 
le Trèfle a plusieurs utilisations possibles. 

  4. Production de la Carte de la Destinée : 
si vous produisez une nouvelle Carte de la Destinée, le dé, la figure d'échec, la liste Fonction et la liste d'EXP de la Destinée seront tous réinitialisés. 

* Quand les outils de dé sont lancés, vous pouvez utiliser la liste pour sélectionner un changement du résultat 
avant de bouger. Chaque sélection ne peut être utilisée 
qu'une fois jusqu'à la prochaine production de carte. 

* Le nombre maximum de points de déplacement dans un tour est 6. Le minimum est 1. |
