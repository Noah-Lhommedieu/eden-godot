5186|Introduction au Classement de Guilde 

Les classements sont réactualisés toutes les 2 heures. 

Les 8 guildes avec le plus de Gloire de Guilde à la fin de la semaine peuvent rejoindre directement l'Élimination de Guilde, tandis que les 8 autres guildes seront choisies de manière aléatoire parmi celles avec le plus de Gloire de Guilde (minimum 3000). 

Les Membres de Guilde de Nv. 4 peuvent obtenir de la Gloire de Guilde en participant aux Arènes 3 Joueurs, aux Arènes 10 Joueurs et aux Arènes des Boss. 
*Arène 3 Joueurs : le gagnant reçoit 5 points, le perdant en reçoit 2. 
*Arène des Boss : le gagnant reçoit 5 points, le perdant en reçoit 2.
*Arène 10 Joueurs : le gagnant reçoit 10 points, le perdant en reçoit 3.

Les 25 meilleures guildes de chaque serveur seront classées selon leur Gloire de Guilde. Les joueurs peuvent voir les classements de Guilde en jeu. 

Le système calculera la Gloire de Guilde à 6h tous les samedis et annoncera les 16 guildes qualifiées pour l'Élimination de Guilde. La Gloire est ensuite réinitialisée. 

|
5187|Quotidien |
5188|Indisponible |
5189|Infos de Programme de Jeu 

Le système calcule la Gloire de Guilde à 6h tous les samedis et annonce les 16 guildes qualifiées pour l'Élimination de Guilde. La Gloire est ensuite réinitialisée.

Les 8 guildes avec le plus de Gloire de Guilde à la fin de la semaine peuvent rejoindre directement l'Élimination de Guilde, tandis que les 8 autres guildes seront choisies de manière aléatoire parmi celles avec le plus de Gloire de Guilde (minimum 3000).

Pour chaque guilde, 50 joueurs maximum sont autorisés à rejoindre l'Élimination de Guilde. 

Quand un champion est déterminé, son nom sera affiché jusqu'à la prochaine Élimination de Guilde. 

Passez la souris sur chaque guilde pour voir le programme d'Élimination de Guilde. 

Cliquez sur Arène - Élimination de Guilde sur la mini-carte pour voir les infos d'Élimination de Guilde et rejoindre le combat. 

Les guildes participant à l'Élimination de Guilde ne peuvent pas recruter de nouveaux membres jusqu'à la fin de l'Élimination de Guilde. |
