7089|Chevalier Morris : Aurore ? Réveillez-vous ! Aurore ? Regardez ce que vous avez fait !! Je ne vous le pardonnerai jamais !|
7090|Le fantôme de Dascha Adwin se manifeste à nouveau devant vous. Voyons où il compte se rendre à présent.|
