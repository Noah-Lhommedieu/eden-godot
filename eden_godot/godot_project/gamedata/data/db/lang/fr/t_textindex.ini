Elle vous permet de renforcer votre équipement et d'en améliorer les stats. À partir d'un certain niveau, elle lui confère des attributs bonus.

Utilisation :
1. Placez l'équipement dans la case du haut. Sa description s'affiche à droite.
2. Placez le Parchemin d'Amélioration dans la case en bas à gauche et payez les frais pour commencer.

Objets Spéciaux : certains objets facilitent le processus d'Amélioration.

Atelier d'Amélioration : cliquez sur ce bouton pour accéder à l'atelier.

Attributs bonus : une Amélioration de niveau 6, 8 ou 10 confère des attributs supplémentaires à l'équipement amélioré.

Remarque : lorsque vous excédez le Seuil d'Amélioration, votre équipement risque d'être détruit si l'opération échoue.|
2795|Atelier d'Amélioration
Passez commande auprès de l'Atelier d'Amélioration, spécifiez le nombre de tentatives d'Amélioration à effectuer ou le niveau d'Amélioration désiré.

Tentatives d'Amélioration : nombre de tentatives à effectuer.

Niveau ciblé : niveau d'Amélioration à atteindre.|
2796|Infos Municipales
Niveau de la Ville, population, Gloire, fonds et autres.

Vous pouvez aussi y consulter la liste des célébrités, commerces et monuments.
|
2797|Succès
Succès accomplis lors des quêtes et au combat.
 
Rapport de Succès : bilan des succès et progression actuels.

Déclaration de Victoire : elle sera diffusée lorsque vous vaincrez un autre joueur ou un boss.

Déclaration de Défaite : elle sera diffusée en cas de défaite contre un autre joueur.|
2798|Teinture
Teignez votre équipement à l'aide de pigments.

Utilisation :
1. L'aperçu des couleurs disponibles s'affiche en haut. Cliquez pour voir les différents choix.
2. Commandes de la caméra : utilisez la souris pour effectuer un zoom avant ou arrière et faire pivoter le personnage en mode aperçu.
3. Changer d'équipement : choisissez une tenue compatible avec votre Classe à l'aide des boutons de droite.
4. Aperçu des pièces : sélectionnez les pièces d'équipement à teindre à l'aide des boutons du bas.

Types de couleurs :
1. Couleur de Vêtements : teint l'objet dans la couleur indiquée.
2. Couleur Aléatoire : teint l'objet d'une couleur aléatoire.
3. Couleur Clignotante : teint l'objet de deux couleurs.

Remarque : la teinture peut varier en fonction des matériaux de base de l'équipement.|
2799|Services aux Membres
Interface de communication de la guilde, historique et événements de la guilde.

Commentaires :
1. Disponibles pour les guildes de niveau 2
2. Réservés aux membres accrédités
3. Titre : 30 caractères max. Corps : 320 caractères max.
4. Capacité : 20 commentaires. L'excédent doit être supprimé par un membre accrédité.
5. Les commentaires non lus sont référencés comme Nouveaux.|
2800|Commandes Municipales
Attribuez des postes et accréditations et consultez la Gloire de la Guilde et ses résultats en compétition.

Postes : définissez le nom des postes.

Accréditations : accréditations liées à chaque poste.|
2801|Candidatures Municipales
Dès le niveau 30, si la guilde dispose de 500 pièces d'or et de 30 membres, vous pouvez demander à fonder une Ville auprès du Chef des Guildes.
 
Remarque : si le serveur compte plus de 50 Villes, les frais s'élèvent à 10 000 pièces d'or.|
2802|Urbanisme
Gérez votre Ville, suivez vos contrats et déplacez les objets sacrés.
 
Dépôt des Bâtiments : contient les bâtiments à construire. Glissez-en un dans la case de gauche pour l'utiliser. 

Dépôt des Contrats : contient divers contrats. Glissez-en un dans la case de gauche pour l'utiliser.|
2803|Infos sur la guilde
 
Niveau : obtenez des Points de Gloire ou accomplissez des Quêtes de Guilde pour progresser.
 
Gloire : chaque membre doit gagner des Points de Gloire pour améliorer les stats de la guilde.
 
Fonds : recettes des taxes imposées aux membres et des dons.
 
Revenu : un pourcentage des gains acquis par les membres lors des quêtes revient à la guilde.
 
Taux de Taxe : les joueurs extérieurs à la guilde doivent payer une taxe pour commercer dans la Ville. Fixez le Taux de Taxe avec le Gérant de la Guilde.
 
Liste de Villes : contient toutes les Villes existantes et permet de visiter celles des autres guildes.|
2804|Liste des membres
Cochez la case Afficher les membres hors ligne pour consulter la liste de tous les membres de la guilde.
 
Trier : triez les résultats par nom, niveau, classe, poste, gloire, canal, position et données de profil.
 
Définir le Badge : l'image choisie doit être un fichier BMP de 32 x 32 pixels. Pour une couleur d'arrière-plan transparente, les paramètres RVB doivent être (255, 0, 255). Disponible pour les guildes de niveau 3 ou plus.|
2805|Recherche de membres
Consultez la liste des membres d'une Ville (noms, niveaux, postes et positions actuelles).

Utilisation :
1. Sélectionnez une Ville en bas à gauche et cliquez sur Chercher les membres pour en afficher la liste.
2. Triez les résultats par nom, niveau ou poste.|
2806|Liste des Villes
Faites une recherche pour trouver une Ville. Cliquez sur le bouton Entrer, en dessous, pour vous y rendre.
 
Recherche : paramétrez vos filtres et cherchez une Ville. Les résultats s'affichent en dessous.|
2807|Infos Municipales
Caractéristiques de la Ville sélectionnée (Chef de Guilde, Gloire, Effectifs, Taux de Taxe, Bâtiments et Visiteurs Célèbres). 
 
Taux de Taxe : taxe imposée aux joueurs extérieurs à la guilde pour commercer dans la Ville.|
2808|Raccourcis
Définissez de nouveaux raccourcis ou restaurez les paramètres par défaut.

Utilisation : cliquez sur une entrée, puis appuyez sur la nouvelle touche.|
2809|Paramètres de l'interface
Modifiez la taille, la police et le thème de l'interface.
 
Taille : ajustez la taille des fenêtres et cadres. 
Police : ajustez la taille de la police de l'interface.
Police du chat : ajustez la taille de la police du chat.|
2810|Résurrection
Le personnage meurt quand ses PV tombent à 0. Vous pouvez ressusciter :
 
1. Au Point d'Ancrage le plus proche. 
2. Au dernier point de sauvegarde.
3. À l'aide d'objets de la Boutique d'Objets.
 
Remarque : parlez aux Gardiens de l'Âme pour activer les points de sauvegarde.|
2811|Boutique d'Objets
Cliquez sur le bouton Achat d´AP en bas à droite pour acheter des Points Aeria.

Achats :
1. Cliquez sur le bouton Achat de l'objet désiré.
2. Confirmez l'achat.
3. Vos acquisitions s'affichent temporairement en bas à gauche.

Cadeau : cliquez sur le bouton Cadeau, saisissez le nom du destinataire et cliquez sur Confirmer pour envoyer l'objet par e-mail.

Acquérir des objets : cliquez sur Acquérir des objets, puis saisissez le numéro de série et le mot de passe de l'objet pour l'obtenir.|
2812|Acheter des objets :
1. Faites un clic droit ou cliquez sur le bouton Acheter de l'objet désiré.
2. Précisez la quantité.
3. Vos acquisitions s'affichent temporairement en bas à gauche.

Cadeau : cliquez sur le bouton Cadeau et utilisez des Points Bonus pour offrir l'objet.|
