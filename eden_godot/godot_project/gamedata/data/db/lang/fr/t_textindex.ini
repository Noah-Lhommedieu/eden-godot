4048|Étal Personnel
Les joueurs peuvent créer leur propre étal de vente afin de 
vendre leurs objets directement aux autres joueurs.

Comment faire :
1. Cliquez sur l'icône de Main orange dans le coin inférieur
droit de votre fenêtre d'Inventaire pour ouvrir la fenêtre d'Étal.

2. Les joueurs peuvent déplacer les objets qu'ils souhaitent 
vendre dans la fenêtre d'Étal. Une fois le prix décidé, cliquez 
sur "Placer dans l'Étal" pour les mettre en vente.

3. Vous pouvez décider du nom de votre Étal dans le coin
supérieur droit. Cliquez sur n'importe quel objet qui se trouve
dans l'Étal pour le retirer de la vente.

4. Quand vous aurez fini de choisir les objets à mettre en vente,
cliquez sur "Commencer la Vente" pour placer votre Étal !

5. En mode de vente, les joueurs ne peuvent entamer aucune autre
action, ni parler.

6. Fermez la fenêtre d'Étal pour terminer la session de vente.|
