4413|Présentation de la Recherche de Groupe 
Les joueurs peuvent utiliser « Inviter dans le Groupe » pour inviter d'autres joueurs dans votre groupe. Vous pouvez utiliser la fonction Groupe de Donjon pour vous grouper avec des joueurs de façon aléatoire. 

* Groupe normal : Vous pouvez écrire le but du groupe dans le champ « description ». Cliquez sur le bouton en bas à gauche de la fenêtre pour sélectionner des conditions spéciales pour rejoindre le groupe. Avec ça, les candidats au groupe devront être approuvés avant d'être acceptés. Vous pouvez aussi choisir si la description sera affichée ou non sur la page de résultats de recherche. 

*Groupe de Donjon : Un groupe formé pour affronter les donjons. 

1. Sélection des rôles - Chaque joueur aura un rôle dans le groupe pour équilibrer et optimiser l'efficacité de l'équipe. Le système déterminera la force de chaque joueur et formera des équipes qui consistent d'au moins un tank et un guérisseur. 

2. Liste de Donjons - En se basant sur la force et les capacités du personnage, le système fournira une liste des donjons dans lequel le joueur peut entrer. La liste est affichée dans l'ordre de difficulté du plus dur au plus facile. Le joueur peut être sur la file d'attente de maximum 4 groupes différents à la fois. 

3.  Entrer dans la File d'Attente - Un joueur peut entrer dans la file d'attente d'un groupe après avoir sélectionné le rôle qu'il prendra et sélectionné le donjon dans lequel il veut entrer. Quand le groupe est formé, les membres seront téléportés vers le donjon. 

4. Sortir de la File d'Attente - Recliquez sur recherche de groupe, vous pouvez ensuite quitter la file d'attente. 
