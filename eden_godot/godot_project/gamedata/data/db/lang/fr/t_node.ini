701|Carrière Angor|Construite autour de la première veine de minerai trouvée dans les Monts Calcaires, 
cette mine est la plus vieille de l'histoire locale. Elle a été le terrain de jeu et éventuellement 
le lieu de travail de centaines de villageois d'Andrew.

Cependant, les créatures qui vivaient près de la mine sont devenues agressives. Les mineurs se sont 
défendus, mais les créatures devinrent de plus en plus monstrueuses. Ainsi, les hommes en perdirent le contrôle. 
La mine est maintenant complètement envahie et inutilisable.|||||||||||
702|Fort Verdure|Un vieux fort se dresse au fin fond de la Colline Tranquille. Ce fort, oublié, avait été construit 
par les premiers immigrants pour se défendre contre les attaques extérieures. Avec l'expansion 
de la Colline Tranquille, la menace a disparu et le fort est tombé à l'abandon.

Un jour, un membre du Gang des Aigles a trouvé le fort abandonné. Le gang a alors réaménagé 
le bâtiment et accroché une bannière représentant un aigle, affirmant ainsi qu'ils prenaient possession des lieux.|||||||||||
703|Canal Tassos|Un vieux tunnel traverse la Forêt Arc-en-ciel. Ses origines sont un mystère. Cependant, 
ses nombreuses entrées et sorties en font plus un labyrinthe qu'un passage.

Le tunnel a été condamné à cause des dangers que représente exploration. On dit aussi 
qu'une force incroyable, assez puissante pour transformer toute la faune et la flore de la forêt, 
y est dissimulée. Le Gang du Marais Noir s'est juré d'obtenir cette force, par n'importe quel moyen.|||||||||||
704|Caverne de Schiste|La Caverne de Schiste, en ruine depuis des siècles, est cachée sous un vaste désert et renferme 
d'antiques technologies. Les scientifiques l'ont cherchée pendant des années, sans succès, jusqu'à 
ce qu'un événement géologique ouvre une fissure y menant.

Au cœur de cette civilisation légendaire, les scientifiques ont découvert des machines qui fonctionnent 
de manière automatique et un garde devenu fou. Un scientifique nommé Nikola est parti mener son enquête, 
mais il est tombé dans un grand danger...|||||||||||
705|Éroda|Éroda, la plus profonde caverne des Monts Arides, est jonchée de fragments d'os. Les animaux 
fuient cet endroit, l'air sent l'humidité et le rance. Des griffes ont laissé des traces sur les murs.

Les Cenanas croient qu'il s'agit de la tombe d'un dragon responsable d'un cataclysme il y a des 
siècles de cela. Le Gang de la Griffe Dorée, lui, croit que la caverne renferme des trésors et ils 
montent une expédition pour les trouver.|||||||||||
706|Morticora|Près de la Baie Bélouga, les bois sont si épais que les frondaisons bloquent le soleil. L'humidité 
et la brume constantes en font un parfait habitat pour les moules et les champignons.

Les voyageurs sont souvent assaillis par des esprits malins dans les bois. Les spectres se délectent 
de ce climat froid et humide et ils ont apprivoisé de nombreuses créatures vénéneuses. Ce mal 
grandissant menace désormais les habitants du Port Bélouga.|||||||||||
707|Racine Branda|La Racine Branda se trouve sous un vieil arbre près d'un marais primordial. Les feuilles, branches 
et racines de cet arbre imposant fournissent toute la nourriture et la protection nécessaires aux créatures pour survivre.

La Racine Branda elle-même est devenue une part importante de l'écologie locale après avoir 
absorbé de l'eau magique et être devenue magique elle-même. Des gardes ont prêté serment à vie 
de la protéger contre le mal pendant des générations.|||||||||||
708|Palais des Malices|Cet ancien palais a presque entièrement sombré dans le sol et est maintenant recouvert de couches 
de lichen et de lianes. Il est presque impossible d'en trouver l'entrée.

Un puissant mage y vivait autrefois. Il a étudié avec tant d'ardeur qu'il en serait mort. On dit que 
son fantôme est toujours là. Ses recherches ne connaissent pas de fin et le mage emplit le palais 
d'un désespoir si puissant qu'il peut rendre fou les faibles d'esprit.|||||||||||
709|Pourriture|Berceau d'insectes monstrueux, la Pourriture a également empoisonné les eaux de la Vallée des Rois. 
La puanteur de la pollution emplit l'air. Les plantes ont absorbé l'eau toxique et sont devenues elles-mêmes 
vénéneuses, mettant encore plus en danger l'écologie locale.

Des oeufs en forme de pustules s'alignent à l'entrée de la ruche, maintenus par un mucus gluant. 
Les pupes se nourrissent frénétiquement lorsqu'elles éclosent, ne laissant pas grand-chose aux autres créatures.
|||||||||||
710|Abîme de Baram|Le Volcan Avila a creusé une gorge profonde dans une imposante falaise. De là irradient chaleur et 
pouvoir. Les Tuskars croient que la brèche mène au Cristal Enflammé qui garde le volcan.

Une rivière de lave coule à travers la gorge, entre d'immenses cristaux étincelants. La loi de la jungle 
prévaut ; seuls les animaux les plus forts y survivent...|||||||||||
711|Coeur Baltaroï|Faite de solides briques, la capitale des Tuskars se situe près du cratère du volcan ; parfois, la lave 
bouillonnante se répand dans les rues.

Des statues de valeureux soldats Tuskars sont réparties dans toute la cité et leurs actes héroïques sont 
gravés dans la pierre. Les drapeaux accrochés symbolisent l'unité Tuskar. Cependant, des fanatiques religieux 
ont capturé la ville et manigancent : ils veulent faire rentrer le volcan en éruption.|||||||||||
712|Rêve du Maire|Ce monde matérialise les cauchemars du Maire Réginald. Bien qu'il ait l'air doux et bénin à la surface, 
en dessous, le mal grouille, incarné par les innombrables monstres qui y rôdent.

Cette aura malveillante attend le bon moment pour tout engloutir et a déjà piégé l'âme de Reginald 
dans son propre rêve, afin qu'il ne se réveille jamais.|||||||||||
713|Fléau|Des milliers de monstrueux insectes se cachent dans les Terres des Dunes Éternelles, prêts à tout dévorer. Ils proviennent 
d'une petite grotte qui est, on ne sait comment, reliée à une autre dimension.

Le Prince du Fléau a ouvert un portail interdimensionnel et contrôle les insectes grâce à sa puissante magie. 
Ainsi manipulés, les monstres sèment la destruction.|||||||||||
714|Chambre de Baïra|Le roi qui dirigeait autrefois le Royaume d'Amur fut enterré dans un glorieux mausolée dans le désert. 
Dans ses salles remplies de trésors, des totems proclament l'amour que son peuple lui vouait.

Ses restes étaient gardés depuis des siècles, jusqu'à ce que le Prince du Fléau corrompe les terres. 
Il a transformé les âmes pures du peuple Amur en une armée de goules à sa botte et a réveillé le roi mort, 
espérant ainsi conquérir le monde.|||||||||||
715|Crypticône|Les ogres se réunissent à la bouche du Geyser Etalia, d'où émanent des odeurs
de souffre et de pourriture. De nombreuses bêtes à crocs vivent ici, et les sources chaudes de la tanière
maintiennent une température caniculaire et humide.

Étonnamment, une race religieuse, les Ogres, croient que le rouge est une couleur sacrée.
Dans de grandes cérémonies, ils jettent du minerai de fer dans les sources chaudes pour se porter chance. Quand le minerai colore l'eau en rouge, ils
y voient un miracle.||||||||||Le Contremaître Brisé|
716|Temple de Delphes|Cet ancien sanctuaire était le foyer des Pixies de la Forêt Putride. Au fil du temps,
il s'est enfoncé sous la forêt tropicale, enfermant les monstres à l'intérieur. Une construction militaire impériale
l'a ouvert et réveillé les pixies qui se battent maintenant
pour s'échapper.

Les scientifiques explorant les secrets du sanctuaire l'ont endommagé par inadvertance. Il
tombe en morceaux et a sûrement perdu ses pouvoirs originaux.||||||||||Cœur en Exil|
717|Veine Tordue|Cette mine profonde se trouve dans une zone volcanique. L'air y est brûlant et empli de
gaz toxiques. La lave bouillonne à tous les coins, éclairant les tunnels d'une lueur écarlate.

Le Minerai Arc-en-ciel, un minerai rare qu'on ne trouve qu'ici, est ultra solide et brille comme
 un prisme. Ça a énormément de valeur, ce qui a poussé le Magnat du Crime Stirling
à s'emparer de la mine. Il a prévu d'en tirer de très gros profits.||||||||||Cendre et Paille|
718|Autel du Culte de Mara|Situé au fin fond de la Base du Culte de Mara, cet autel est un site cérémonial clé. Des totems
 en os rapellent avec horreur la forte croyance du culte en la puissance des sacrifices.
Bien qu'ils pensent que les animaux sont acceptables, ils préfèrent les sacrifices humains.

Les villageois du Pic de Noireflamme détestent le culte mais ils ont trop peur pour
se mesurer à eux. L'autel sacré du Culte de Mara est l'endroit le mieux gardé de
toute la base.||||||||||Le Plaisir de Tuer|
719|Chutes des Âmes en Peine|Les Chutes des Âmes en Peine sont sacrées pour les habitants de Bonmalmo, c'est la dernière source 
d'eau pure des Marais Décrépits. La chute de l'eau de source créé également
une sublime cascade.

Des fleurs et des plantes inhabituelles poussent en haut de la montagne, toutes sont
utiles pour la médecine et l'alchimie. Elles ont une grande valeur car difficiles
 à obtenir ; le chemin vers le pic est dur et rempli de monstres.||||||||||Terres de Pureté|
720|Vortek|Un tourbillon géant est apparu au centre du Marais de Galt. Les autochtones croient
que le marais a été empoisonné, mettant en colère Galt, le Dieu du Marais,
qui a alors créé le tourbillon.

Les gens pensent que le vortex du tourbillon est connecté au palais de Galt, mais
que le tourbillon en bloque l'accès. Un groupe d'inventeurs espère
utiliser le sous-marin qu'ils ont construit pour découvrir ce qu'il se passe.||||||||||Le Tourbillon Furieux|
721|Arsenal Fédéral|L'Arsenal se trouve près du Fort du Lion et c'est de là que viennent toutes les armes 
utilisées par les soldats de la région. Ses murs hexagonaux sont assez solides, et il est gardé nuit et jour.

Un petit fort est le seul chemin pour entrer ou sortir des installations souterraines. Tous les systèmes
d'eau et d'électricité sont opérés indépendamment à la surface. La
Fédération y développe et améliore également les armes.||||||||||Arsenal de Valence|
764|Bataille d'Hélios [Groupe]|Une petite île au large du Continent du Centre, dotée de ports de commerce au nord et au sud.
Entourée de falaises vertigineuses, elle est facile
à défendre.

Un petit régiment de l'Alliance de l'ouest y a installé une base secrète, utilisant les édifices des civiles
comme protection pour leur port militaire. Ils fabriquent des
armes dont même l'Alliance centrale n'a pas entendu parler.

Les Valtores ont cependant eu vent de l'existence de cette base et rassemblent
à présent leurs forces non loin de là. La tension est palpable et
la guerre peut éclater à tout moment. |Port venteux|Port céleste|Hélios|Arsenal des forces alliées||||||Zone neutre de la 7e baie des forces alliées (Défi de DJN) (Recommandé pour les groupes de 2 joueurs)|
765|Sortir des méandres du Fort (Solo)|Ken, le Chef Dentsanglante a ordonné la construction de ce fort imprenable.
Les Crocs géants à l'entrée sont le symbole de la tribu.

La salle scellée au centre de ce fort est protégée par un labyrinthe parsemé de pièges.
Pour pouvoir créer des pièges encore plus complexes pour le labyrinthe,
Popeni s'est enfermé et mène des recherches confidentielles.

Courageux Gardien Éternel. Bardez-vous de bravoure et de patience ! Dévoilez la
vérité !||||||||||Salle scellée au cœur du labyrinthe du Fort Dentsanglante [Donjon] [1 joueur]|
766|Passage spatiotemporel|Un Pays des Merveilles étrange dans Errea. Personne ne sait où se trouve ce Pays des Merveilles et 
nul ne sait comment y entrer. Au fil du temps, le Pays des Merveilles 
est devenu un conte que l'on raconte à Errea. 

On raconte qu'un monstre se terre dans le Passage spatiotemporel et qu'il 
est capable de contrôler le temps et l'espace, les déformant à volonté 
pour transporter quiconque dans le temps ou dans l'espace. Mais ce n'est qu'une légende.||||||||||Pays des Merveilles parallèle (DJN solo) (de 1 à 3 joueurs)|
767|Une cave où l'on entrepose de la bière.|Il s'agit de la cave du <Riche Brasseur> Himilu. on peut y trouver 
des tonneaux de bière destinés à la vente. Malheureusement, un vagabond s'est glissé dans la cave et en a bu 
la plupart en cachette. Cela n'a pas du tout plu à Himilu. 

Il semblerait que le vagabond se cache dans un des tonneaux. 
Trouvez-le et éliminez-le.||||||||||Event du Buveur abusé|
768|Canal d'Aven|Un ancien canal situé dans le centre d'Aven. Personne ne sait quand il a été construit, 
ni pourquoi. Le canal comporte plusieurs entrées et sorties ainsi 
que différents embranchements. C'est un vrai labyrinthe. 

Bien qu'il soit délabré et à sec, de nombreux 
animaux et plantes y ont élu domicile, rendant le lieu 
très dangereux. Même les habitants de la région la considèrent comme zone interdite.||||||||||Canal d'Aven (DJN solo) (de 1 à 3 joueurs)|
769|Arène du Démon des Enfers - Assemblée|L'Arène du Démon des Enfers était jadis une prison abandonnée. 
Des aventuriers découvrirent accidentellement cet endroit et l'utilisèrent 
comme arène pour ceux qui voulaient s'entraîner et se dépasser.

Dernièrement, les aventuriers assez braves pour pénétrer dans cette arène
ont été attaqués par de puissants et féroces monstres. 
Ces monstres étaient autrefois les Boss de différents donjons disséminés dans ce monde.

Une puissance inconnue est derrière tout ça... Elle y a rassemblé toutes ces
puissantes créatures pour quelque plan machiavélique.
Les Gardiens Éternels sont les seuls capables de déjouer cette machination.||||||||||Défi des Boss <Event de DJN> (de 3 à 5 joueurs) |
770|Courez ! Des vaches ! Courez !|Une petit mine près du Ranch Camina, seulement connue de quelques personnes. Le Propriétaire du Ranch y 
a mis des vaches devenues folles 
pour proposer un défi aux gens. 

Au plus profond de la mine, le propriétaire a placé un coffre au trésor. Dans le coffre se trouve 
un certificat prouvant que vous avez réussi à passer l'épreuve des vaches. Lorsque vous mettrez la main sur ce certificat, 
alors vous pourrez demander une récompense supplémentaire au propriétaire du Ranch. 

Les vaches adorent courir. Vous ne devriez pas les sous-estimer.||||||||||Event « Courez Des vaches ! Courez ! »|
771|Dimension du chaos <Groupe>|De nombreux spécialistes aidèrent l'Église à créer cette Dimension du chaos. 
Dans la Dimension du chaos, on retrouve les mêmes monstres que ceux du Labo Vingot 
et de la Dimension Dévastée. 

La Dimension du chaos regorge d'étranges créatures.
Elles se battent pour survivre et dévorent les plus faibles. 
On peut entendre leurs râles de douleur dans toute la dimension. 

Beaucoup d'intrépides pensant être prêts se sont aventurés dans la Dimension du Chaos. 
Pour la plupart, l'échec les attendait dès le début. 
Quelques héros réussirent cependant et furent récompensés pour leurs efforts.
Êtes-vous réellement prêt ? Réfléchissez bien avant de prendre une décision. ||||||||||Dimension établie par l'Église|
772|Purgatoire : Arène des Chevaliers Templiers |Il existe quatre tailles d'Arènes différentes à essayer : petite, moyenne, grande et géante.  
Différents environnements ont été créées pour aider
à choisir les participants les plus qualifiés. 

Des milliers de personnes ont tenté leur chance et obtenu le titre de Chevalier Templier, 
mais cent fois plus ont échoué. 
C'est peut-être justement ce qui attire les gens : pour que le titre soit prestigieux,
il faut que beaucoup échouent. 

Pour se prémunir d'évènements inopportuns, la Curie Métérole et la Salle des Chevaliers Templiers 
organisent les épreuves. Les enjeux sont si élevés qu'ils ont choisi d'organiser les épreuves  dans l'Arène des Chevaliers Templiers.
Comme si cela ne suffisait pas, les meilleurs membres de la Curie Métérole et de la Salle des Chevaliers Templiers
feront partie du jury.  ||||||||||Épreuve du Purgatoire (DJN 5 joueurs)|
773|Course d'Alpagas |Une course d'alpages a lieu chaque année aux Crocs Brumeux. 
Cette année, c'est le marchand de montures, Ziglar, qui a généreusement financé la course. 
Vous pouvez être sûr que la Course d'Alpagas est l'évènement le plus excitant de l'année ! 

Grâce à lui, et pour la toute première fois, les Gardiens Éternels 
sont autorisés à participer. 

La foule s'agglutine autour de la ligne de départ. 
Ceux qui n'ont pu trouvé un bon poste d'observation se hissent sur la pointe des pieds. 
Les encouragements se font entendre. La course d'Alpagas est sur le point de commencer ! 
|Point de passage 1 |Point de passage 2 |Point de passage 3 |Ligne d'arrivée||||||Traces de la Course d'Alpagas |
774|Ville de Guilde : Couloir de l'Esprit Gardien |De nombreuses guildes ont été fondées par des personnes qui essayaient de survivre dans des conditions difficiles. 
Pour eux, l'appartenance à une guilde avait plus d'importance que la race ou la nationalité. 
D'après la légende, chaque Guilde aurait son propre Esprit Gardien. 

Cependant, quand une guilde est dissoute, son Esprit Gardien est alors abandonné. Son âme erre alors, sans but. Au fil des ans, de nombreux Esprits Gardiens sans guildes se sont rassemblés ici. 
Ils sont encore attachés aux idéaux de leur ancienne guilde, 
mais il ne faudrait pas pour autant les sous-estimer. Ils n'ont rien perdu de leur force et de leur pouvoir. 

Une rumeur raconte que si un membre d'une guilde obtient l'approbation d'un Esprit Gardien, celui-ci offrira ses pouvoirs à la Ville de Guilde toute entière. 
Nombreux sont ceux qui ont essayé, nombreux aussi sont ceux qui ont échoué. 
Les Esprits Gardiens sont là, attendant que quelqu'un les impressionne. 
La question est donc la suivante, Gardien Éternel : êtes-vous prêt à relever le défi ? ||||||||||Couloir de l'Esprit Gardien |
775|Aventure fabuleuse : Cœur de Dragon |Immergez-vous dans ce conte de fées et lancez-vous dans une aventure exceptionnelle. 

Cette histoire se déroule dans un lointain royaume, il y a fort longtemps. Suite à 
la mort du roi, la reine, avide de pouvoir, exerça 
ses prérogatives sur le peuple. Souhaitant asseoir son 
autorité, elle usa de mesures extrêmes pour obtenir le soutien des 
pays voisins. Elle promit même la main de la princesse Nica, 
une jeune fille à la beauté exceptionnelle, à un prince d'une nation voisine 
dans l'espoir de renforcer son pouvoir. 

Le fils du duc, Robin, et la princesse étaient amis depuis l'enfance. 
Dès qu'il eut vent du complot, il s'infiltra dans le palais pour 
prévenir sa princesse bien-aimée. Il engagea également cinq hommes pour l'aider 
dans sa mission. Hélas, sa route allait être semée 
de nombreuses embûches... |Chemin de Repli |Terrains d'Entraînement |Autel |Tour Prison ||||||Le conte de fées |
776|Terrains d'Entraînement|Cette petite ville a été construite en haut d'une colline escarpée à la terre rouge. 
Des stalactites brisées et des roches sont éparpillées tout autour et des volcans 
se dressent au nord-est. 

D'apparence stérile et sec, le sol renferme 
des veines de minerai. Depuis des générations, les villageois gagnent leur vie 
grâce à ces précieux matériaux. Au fil du temps, les méthodes d'extraction de minerai se sont grandement développées. 

Cependant, depuis l'invasion du Camp du Fléau, les villageois ont dû 
posé les pelles et prendre les armes pour défendre leur ville. Peut-être qu'avec 
l'aide du Gardien Éternel, ils pourront vaincre. Cette zone n'est qu'une illusion 
prévue pour l'entraînement. À l'œil nu, ça a vraiment l'air réel. ||||||||||Invasion du Camp du Fléau |
777|Forêt Camoufle |Dans cette forêt luxuriante poussent de grandes fougères et de dangereuses ronces. 
L'épaisse végétation dissimule toutes les créatures vivantes qui y vivent. 

Les Chevaliers Templiers y ont ressenti la présence du Prince du Fléau. Malheureusement, surveiller la 
zone n'a donné aucun résultat, le Prince n'ayant laissé très peu d'indices. 

Le Général des Chevaliers Templiers a engagé le Gardien Éternel dans l'espoir que 
les pouvoirs d'observation de ce dernier puissent aider à localiser le sinistre 
Prince du Fléau avant qu'il ne cause plus de dégâts. ||||||||||Repaire du Prince du Fléau |
778|Gardien de l'Arbre de Vie  <1 joueur> |Les gens croient que l'Arbre de Vie possède un esprit qui peut guérir 

les malades et apporter la paix à ceux qui la cherchent. Quand le Prince du Fléau en a eu vent, il a relâché 

une troupe de monstres vicieux pour détruire l'Arbre de Vie. Le leader du peuple, Grisos, s'est dressé contre 

ces bêtes et a recruté des héros aux origines diverses pour aider à défendre le précieux Arbre de Vie. ||||||||||Sanctuaire de Forlointain |
779|Garde du Cimetière <Event de groupe> |Les Tuskars pensent que les héros du passé deviendront des 
âmes héroïques qui protégeront leurs terres. Pour permettre à ces guerriers de reposer 
en paix, les citoyens de Baltaroï ont commencé à rénover le mausolée. 

Les Gardes du Cimetière ont pris position autour du monument et 
les Tuskars ont également posé des pièges pour en protéger les trésors. Cependant, de tels efforts n'ont fait 
qu'attiser la curiosité du Gang des Pilleurs de Tombe, un groupe de voleurs rusés. 

Ces bandits ont attaqué sans pitié, laissant dans leur sillage des 
Gardes du Cimetière blessés et frustrés. Ils ont demandé l'aide du Gardien Éternel, espérant empêcher 
le Gang des Pilleurs de Tombe de voler les trésors du site. Malheureusement, si un 
Gardien Éternel veut les aider, il lui faudra d'abord éviter les pièges 
posés pour les pilleurs. ||||||||||Test Chimique (Défi de DJN) (Recommandé pour les groupes de 2 joueurs) |
780|||||||||||||
781|||||||||||||
782|||||||||||||
783|Conte de légende : les voleurs de trésor et le lutin légendaire. |Tous les habitants d'Eden connaissent par cœur cet incroyable conte d'aventure, fruit de l'imagination fertile de la conteuse. 

Il relate l'histoire d'un groupe de voleurs expérimentés qui pillaient des caravanes et dissimulaient jalousement leurs butins dans un lieu tenu secret. Bien que tout le monde eût connu l'existence de cet endroit, il ne fut longtemps jamais découvert par les autorités ni personne. 

Un jour, le héros de l'histoire découvrit, bien par hasard, cette cachette et réussit à déchiffrer le code pour y pénétrer. Une fois les voleurs vaincus, il réveilla le lutin qui y sommeillait... ||||||||||Le conte de fées fantastique|
784|Les 5 Animaux : La légende de Bonka <Event 1 joueur>|D'aussi loin que quiconque se souvienne, les Lutins Démons kidnappent les habitants 
du Pic de Noireflamme pour les sacrifier à leur dieu. C'est pour ça que nombreux sont ceux qui n'osent pas s'aventurer près de leur autel. 

En ayant assez des enlèvements et des meurtres, Bonka, un corsaire Anuran, est parti vers l'autel. 
Le danger le guettait à chaque tournant et il était sur le point de mourir 
quand un docteur Torturra le sauva. 

Maintenant, les Gardiens Éternels peuvent utiliser le sort secret des Marcheurs des Ombres pour retourner dans le passé 
et se battre aux côtés du Torturra afin de vaincre les maudits lutins. ||||||||||Le Plaisir de Tuer <Donjon> <1 joueur>|
785|Les 5 Animaux : La légende de Yula <Event 1 joueur>|Les Zumis du Continent du Centre sont des créatures actives et agiles, mais ils 
excellent également dans le développement technologique et sont très créatifs. Ils viennent de la Vallée 
Fegeral, connue pour sa grande production de fruits. 

Le Scientifique Singa a capturé le directeur et les chercheurs du Centre de Recherches de l'Amitié. Il a également menacé 
de faire exploser Ghasia et de détruire Corossa. L'Illusionniste Zumi Yula s'est dressé contre 
les forces du mal, il a affronté et vaincu Singa, sauvant ainsi un grand nombre de vies. 

Les Gardiens Éternels peuvent utiliser le sort secret des Marcheurs des Ombres pour retourner dans le passé et faire 
l'expérience de ce que Yula a fait pour son peuple. Profitez de cette superbe opportunité pour voir comment il a sauvé Corossa de Singa. |Ghasia|Bombe|Dolmen|???A|?|B???|?|?|?|Aventure de l'Excellent Yula <Donjon> <1 joueur>|
786|Les 5 Animaux : La légende de Barlilu <Event 1 joueur>|Dans la campagne de la Colline Tranquille, on peut trouver un château en ruines. 
Le Gang des Aigles a sauté sur l'occasion de s'emparer du dit château. Ils ont réparé le 
bâtiment et en ont fait leur QG. 

Barlilu, un jeune voleur Tuskar, est tombé sur un homme riche transportant une statue dorée. Il l'a volée, 
n'en croyant pas sa chance ! Mais il n'avait aucune idée de ce qu'il venait de déclencher. En prenant cette 
idole en or, Barlilu se mêlait à une conspiration pour invoquer le diable. Afin de protéger 
le monde (et de garder sa précieuse statue en or), il devait infiltrer le château. 

Avec l'aide du Marcheur des Ombres, les Gardiens Éternels se transformeront en Barlilu et entreront dans le dangereux Fort Verdure. 
Vous aurez la chance de vivre cette aventure en personne ; vous devez battre les membres du culte et leur chef pour sauver le monde, et bien sûr, cette précieuse statue en or. ||||||||||Une Forteresse Défaite <Donjon> <1 joueur>|
787|Les 5 Animaux : La légende de Ron <Event 1 joueur>|Cette ville exotique, entourée de plages de sable blanc, est une des destinations touristiques phares du Continent du Centre. 
La plupart des gens ne connaissent pas l'extraordinaire légende qui se cache derrière cette ville pittoresque. 

Le fameux Assassin Ursun, Ron, a réussi à tromper la mort et à battre de nombreux ennemis pour protéger ce bel endroit. 

Maintenant, vous pouvez utiliser le sort du Marcheur des Ombres pour vous transformer en Ron et voir l'histoire à travers ses yeux. |Lanceur d'Onde Électro|Lanceur d'Onde Électro|Dinghy|Dinghy|Phare|||||Bataille de la Plage de Ron <Donjon> <1 joueur>|
788|Les 5 Animaux : La légende de Maschatta <Event 1 joueur>|Les Torturras ont fait de leur mieux pour sauver la Grotte de la Vérité, un lieu saint découvert par leurs ancêtres. 
Cette grotte est sacrée pour les Torturras et le point central de leur foi. 

Maschatta a décidé d'essayer de se battre pour la grotte sainte mais il a été attaqué par de terribles bêtes. 
Personne ne sait comment ces créatures se manifestent ni comment il a survécu, 
mais il a fini par vaincre ces ombres et a quitté la grotte sans trop d'égratignures. 

Avec l'aide du Marcheur des Ombres, les Gardiens Éternels vivront tout l'évènement à travers les yeux de Maschatta. 
Préparez-vous à affronter les ombres. Les esprits anciens guideront votre voyage. ||||||||||Le Voyage de Maschatta <Donjon> <1 joueur>|
789|Défi des Boss <Groupe> |L'Arène du Démon des Enfers était jadis une prison abandonnée. Un groupe d'aventuriers la découvrit et 
Aven la reconvertit en une arène d'entraînement. 

Toutefois, des monstres s'en prirent aux guerriers de l'arène. Grâce à l'enquête menée 
par la Curie d'Aven, nous découvrîmes que ces monstres étaient en réalité des Boss d'autres donjons. 

Ces Boss, furieux d'avoir été battus tant de fois par les Gardiens Éternels, 
s'unirent pour s'emparer de l'Arène du Démon des Enfers. Ils ont pour objectif de lancer un ultime défi aux Gardiens Éternels ! ||||||||||Défi des Boss <Event de DJN> (de 3 à 5 joueurs) |
790|Le Pouvoir du Cristal d'Eternal <Groupe> |Des Cristaux d'Eden scintillants, trouvés pour la plupart dans le sol d'Aven, contribuent quotidiennement aux affaires de la ville. 
Ces gemmes approvisionnent Aven en Énergie Magique. 

Malheureusement, l'énergie magique des Cristaux d'Eden attira d'horribles monstres. 
Ces bêtes traversèrent les dimensions et les tunnels qui se trouvent sous Aven afin de s'emparer des cristaux et d'absorber leur pouvoir. 

Les monstres, imbibés de la force de ces gemmes, devinrent bien plus puissants et dangereux. 
Aven décida de demander aux Gardiens Éternels de régler ce problème. ||||||||||Combat pour protéger le Cristal d'Eternal <Event de DJN> (de 3 à 5 joueurs)|
791|Génération Future <Groupe>|Afin de renforcer leur pouvoir, les Lutins Démons de l'Autel du Culte de Mara décidèrent de capturer 
des enfants du monde entier. Ils espéraient pouvoir créer une nouvelle 
génération de lutins néfastes. 

Le Gardien de l'Âme pénétra dans l'autel pour trouver les enfants et tenter de les sauver. 
Il se servit de sa magie pour cacher les enfants mais il ne put les sauver. 
L'horrible issue de cette histoire est inévitable. 

Les Gardiens Éternels doivent donc venir en aide au Gardien de l'Âme et sauver ces innocents. ||||||||||Sauver les enfants (Défi de DJN) (de 3 à 5 joueurs) |
792|Profondeurs du Canal Tassos |Un vieux tunnel parcourt la Forêt Arc-en-Ciel, son origine est un mystère. Cependant,
avec toutes ses entrées et sorties, tout le monde sait que c'est plus un labyrinthe qu'un tunnel. 

Son accès a été condamné à cause des dangers qu'encourent ceux qui y pénètrent. On dit aussi 
qu'une incroyable force, assez puissante pour changer la flore et la faune 
de la forêt, s'y cache. Le Gang du Marais Noir est décidé à s'approprier cette force
coûte que coûte.||||||||||Cristal Arc-en-Ciel <DJN Normal> |
793|Abîme de Baram|Le Volcan Avila a fait exploser une vallée et l'a transformée en falaise. De la chaleur et un grand pouvoir 
irradient de cet endroit. Les Tuskar pensent que la crevasse mène au Cristal Enflammé 
qui garde le volcan. 

Un rivière de lave s'écoule dans la crevasse entre de géants cristaux lumineux. La
loi de la jungle prévaut entre les animaux féroces qui y vivent, 
seuls les plus forts survivent. ||||||||||Cristal Enflammé <DJN Normal> |
794|Mine du Village Andrew|Cette modeste mine se trouve près du Village Andrew. Récemment, des mineurs ont trouvé 
des cristaux bleus de grande qualité, ce qui a propulsé la popularité du village très rapidement. 

Des dizaines de légendes entourent les cristaux. Il paraît que Laz, le Contremaître de la Mine, 
a découvert un cristal bleu renfermant un enfant. On dit que cet enfant 
pourrait changer le cours de l'histoire... ||||||||||Cristal Bleu <DJN Normal> |
795|Temple de Delphes|Cet ancien sanctuaire était le foyer des Pixies de la Forêt Putride. Au fil du temps,
il s'est enfoncé sous la forêt tropicale, enfermant les monstres à l'intérieur. Une construction militaire impériale
l'a ouvert et réveillé les pixies qui se battent maintenant
pour s'échapper.

Les scientifiques explorant les secrets du sanctuaire l'ont endommagé par inadvertance. Il
tombe en morceaux et a sûrement perdu ses pouvoirs originaux.||||||||||Souvenirs de Kimmy <DJN Normal> |
796|Les Profondeurs de l'Abysse Glacée de Skleros |Cette forteresse se dresse dans une solitude imposante, ses murs de glace craquelés 
témoignent d'un passé difficile.

Dans cette forteresse, se trouve un chemin menant à l'Abysse Glacée de Skleros, un étonnant monde 
souterrain de cryolite, un endroit oublié de beaucoup.  On craint que le pouvoir maléfique qui y est enfermé 
ne s'échappe un jour pour mettre notre monde à feu et à sang.

||||||||||Esprit du Dragon <DJN Normal> |
797|Ancien Autel|Avant que cet endroit ne devienne l'autel du Culte Démoniaque, c'était l'habitat naturel de nombreux monstres. L'aura qui y réside nourrit l'énergie des monstres. 

Le Roi Sage a autrefois forgé l'Orbe Sacrée en ce lieu même. L'Ancien Autel sert aussi de champ de bataille dans la guerre opposant le Roi Sage et la Tribu Sang Noir.

Le Maître des Ombres vous demande de vous rendre à cet endroit pour découvrir la faiblesse de la Tribu Sang Noir. 
||||||||||Origine de l'Orbe Sacrée|
798|Refuge des Sang Noir|Personne ne sait ce qu'il s'est passé dans le Refuge des Sang Noir. Il est rempli de souris mortes et de sang. 

Après avoir commencé l'épreuve du Sage, suivez les instructions du Maître des Ombres pour trouver les survivants Sang Noir. Vous trouverez ensuite le Jade Sanglant qui vous permettra de plonger dans l'histoire de la Tribu Sang Noir. 

Ensuite, allez voir le bibliothécaire d'Aven pour obtenir plus d'informations sur la Tribu Sang Noir. 
||||||||||Abri Ensanglanté |
799|Salle Ulta|Après que le Maître des Ombres vous ait accepté, il vous restera une dernière étape dans l'épreuve du Sage. 

L'Élève des Ombres vous demande de secourir la Tribu Sang Noir en les délivrant du sort jeté sur eux. 

Quand vous arriverez à la Salle Ulta, sa grandeur vous donnera l'impression qu'un grand challenge vous attend. ||||||||||Épreuve Finale du Sage|
801|Base des Vilrequins|La Base des Vilrequins est une crique naturelle de la Baie Bélouga. Les pirates ont investi beaucoup de temps et d'argent à perfectionner ce refuge.

Elle a été démolie durant une terrible bataille contre les Gardiens d'Eternal il y a des années. Le Chef des Pirates était furieux quand il a découvert sa base réduite en cendre. Il a tout de suite commencé à planifier la destruction des Gardiens d'Eternal et des habitants du Port Bélouga pour se venger.|||||||||||
802|Salle Ulta|La Salle Ulta est un important palais de la Vallée des Rois, gardée par des Torturras. 
Le Gang Carmela a entendu dire qu'une épée sacrée y était cachée, mais ils n'ont pas réussi 
à la voler grâce aux héroïques efforts des Gardiens d'Eternal.

Cependant, le gang n'a pas l'intention de baisser les bras si facilement. Ils n'en ont plus seulement 
après l'épée, mais aussi après les gardiens sacrés qui protègent la salle, et qu'ils espèrent contrôler grâce à un charme maléfique.|||||||||||
803|Crocvenin|Le Fort du Gang Œil de Loup s'enorgueillit de plusieurs murs aussi solides que des montagnes.
 Au début, le gang se composait de jeunes hommes passionnés déterminés à aider les pauvres. 
Le temps a passé et le groupe s'est agrandi.

Même les plus nobles intentions peuvent se dégrader avec le temps. De nos jours, le Gang Œil de Loup 
a oublié ses buts initiaux. Ils lancent des raids et pillent, gangrénant cette tranquille prairie.|||||||||||
804|Écarlate|Le fort a été construit sous la supervision du chef de la fière Tribu Dentsanglante, Ken. 
Il sert à emprisonner des esclaves et à construire. La dent géante à l'entrée est l'emblème de la tribu.

Le fort est empli de relents de sang et de mort et résonne des cris des esclaves. Les Ogres ne se fatiguent 
jamais de la guerre. En vue de préparer leur expansion, ils font tout pour faire de la Forêt de Delphes un enfer.||||||||||Avant-poste des Envahisseurs|
805|Siècle|Cette place forte s'élève au sommet du Pic de Noireflamme dans l'Empire Heldentod. La 
forteresse servait autrefois à loger des soldats d'élite commandés par le Général Néondo. 
Cependant, elle est tombée dans les mains du Culte de Mara après la découverte d'un totem maudit.

Aujourd'hui, la forteresse sert à la création de zombies. Les soldats sans âme qui en sortent s'attaquent 
à quiconque ose approcher, ce qui rend malaisées les investigations pour savoir ce qu'il s'y trame.||||||||||Forteresse du Chagrin|
806|Manoir|Situé sous le Fort du Lion, le Manoir est la prison des Hautes-terres. Valence y enferme 
les prisonniers de guerre et les criminels. Afin d'empêcher toute évasion, ses couloirs sont de vrais labyrinthes.

Bien qu'aucun prisonnier ne se soit jamais échappé, les prisonniers se mutinèrent pendant l'invasion de l'Empire 
Heldentod et tuèrent bon nombre de matons.||||||||||Une Folle Nuit d'Hiver|
807|Frontière de Basel|L'Empire Heldentod a commencé à faire des raids dans le territoire de l'Union de Valence. Au début, 
les soldats de l'Union parvenaient à les repousser, mais l'intensité et la fréquence des attaques 
les forcèrent à se retrancher dans un château à la frontière. 

La plupart des maisons environnantes fut détruite par les envahisseurs venus de l'Empire Heldentod. 
De nombreux civils furent tués et la politique de la terre brûlée fut appliquée. 
Les fumées noires qui s'élevaient renforçaient l'atmosphère apocalyptique. 

Bien que les défenseurs de Valence réussissent pour l'instant à garder la place forte, 
les provisions s'amenuisent. Si des renforts arrivent de leur côté, l'Empire Heldentod capturera le château : 
ce n'est qu'une question de temps.||||||||||Front de Guerre (DJN solo) (DJN multijoueur) (1 à 3 joueurs)|
808|Sturmfrau|Une énergie instable vibre dans l'air du Clan des Sorcières. Sturmfrau, situé au
 centre des bois, est le cœur du torrent d'énergie. Il repose sur une rivière calme, mais 
il y a quelque chose d'étrange dans cette atmosphère.

Derrière ce paysage luxuriant, on peut remarquer que l'écorce de l'arbre commence à se détacher. 
La cause de ce phénomène est inconnue, mais ça déstabilise l'équilibre naturel de l'énergie.||||||||||Origine de la Tempête|
809|Abysse Glacée de Skleros|Cette forteresse se dresse dans une solitude imposante, ses murs de glace craquelés 
témoignent d'un passé difficile.

Dans cette forteresse, se trouve un chemin menant à l'Abysse Glacée de Skleros, un étonnant monde 
souterrain de cryolite, un endroit oublié de beaucoup.  On craint que le pouvoir maléfique qui y est enfermé 
ne s'échappe un jour pour mettre notre monde à feu et à sang.
|||||||||| Tanière du Dragon des Neiges|
810|Cratère des Géants|Ce cratère, au nord-est de la Forêt Ensorcelée, procure de l'énergie pour toute la forêt. 
C'est le berceau de toute l'alchimie de la forêt et c'est là que se trouve le QG du Clan des Sorcières.

L'équipement d'alchimie et les données de recherche sont stockés dans le cratère.

Malheureusement, le Gang de la Main Noire a de terribles plans pour voler
 le secret du contrôle de l'énergie de la forêt.||||||||||Cœur d'Énergie Mystérieuse|
811|Antre des Échos|Une couche de neige cristalline recouvre la Forêt Givrée tout au long de l'année. Seuls les monstres les plus 
violents et vicieux peuvent survivre ici. La plupart vivent dans l'Antre des Échos, une grotte faite 
de piliers de cristal et d'une étincelante cascade figée sous une épaisse couche de glace.

La grotte résonne des grondements des tempêtes et vents violents. On pourrait 
mourir, juste en attendant un moment de silence dans l'antre.||||||||||Tanière de la Bête|
812|Prison Ossuaire|Heldentod s'est récemment emparé de cette région. C'était autrefois une prison valencienne mais elle abrite maintenant un ancien prisonnier qui travaille pour Heldentod. 

L'Empire a installé un labo dans une pièce au plus profond du bâtiment et y a développé une arme de destruction massive. Cette arme pourrait causer une catastrophe pour les riverains et les troupes de Valence. 

Heldentod a capturé quelqu'un, l'a enfermé dans la pièce et prévoit de faire des expériences sur lui. 
||||||||||Labo du Prisonnier Fou <DJN Normal> (Recommandé pour les groupes de 1 à 3 joueurs) |
813|Guillotine|C'est l'endroit sacré où vivent les Drakai dans la Vallée de la Mort, ils y mènent leurs cérémonies sacrées. 

Cet endroit sert aussi à punir les criminels, c'est pour ça qu'on l'appelle Guillotine.

Après que l'Esprit Mauvais eut envahi cette zone, tous les pouvoirs magiques se sont éteints. On y trouve maintenant des esprits maléfiques et des monstres. Ils utilisent des Statues de la Destruction pour détruire l'atmosphère sacrée du site saint. 
||||||||||Cour Sacrée <DJN Normal> (Recommandé pour les groupes de 1 à 3 joueurs)|
814|Cap Hurlant|Vous trouverez cette route cachée près de la Falaise des Grands Vents. Chaque tronçon est plus dangereux que le précédent.

La route est difficile à localiser, la plupart de la végétation de la région est flétrie, personne n'a envie de vivre dans le coin.

Mais grâce à son emplacement, cette route est l'endroit parfait pour stationner les soldats en défense contre les attaques extérieures.
||||||||||Forteresse Vigilante <Défi Mode Donjon> (Recommandé pour les groupes de 1-3 joueurs)|
815|Abysse de Siècle|Autrefois importante forteresse Heldentod, cette abysse a été détruite et est devenue un repaire de monstres venus d'un autre monde. 

Les guerriers ont fini par éradiquer les bêtes mais personne n'osa plus se réaventurer dans les obscures profondeurs de Siècle. 

Le Mal a commencé à se répandre une nouvelle fois dans l'abysse. Des démons se cachent dans chaque coin. Peut-être est-ce un signe que la fin du monde est proche. ||||||||||Forteresse Démoniaque <DJN Normal> (Recommandé pour les groupes de 1-3 joueurs)|
816| Temple Spirenfer|Au milieu du Royaume Dévasté se dresse le Temple Spirenfer. Il était autrefois majestueux, mais il a perdu de sa gloire. Les colonnes sur les côtés sont enserrées par d'horribles vignes grimpantes qui semblent prêtes à avaler tout visiteur.

Même si les ruines sont sinistres, il est évident que le temple était autrefois glorieux et vivant. Malheureusement, tout ce qu'il reste, ce sont de la poussière et des débris.

Cette région a beau être presque totalement détruite et abandonnée, elle inspire la peur à quiconque s'en approche.
||||||||||Temple Antique <Normal Mode Donjon> (Recommandé pour les groupes de 1-3 joueurs)|
817|Temple de la Rose|Le Premier Ministre d'Heldentod vit dans ce luxueux Temple de la Rose. 

Les murs sont incrustés de pierres précieuses, des fourrures recouvrent le sol et des richesses s'entassent dans tous les coins. D'ailleurs, les gens disent qu'il y a plus de trésors dans ces murs que de livres dans la Bibliothèque de la Curie. Nombreux sont les voleurs qui ont essayé de s'emparer de ces merveilles, mais le temple est hautement sécurisé et la plupart de ceux qui s'y sont risqué ont fini au cachot.

Une rumeur raconte que le Premier Ministre possède une chambre secrète dans les profondeurs du temple. Personne ne sait si c'est vraiment vrai.
||||||||||Résidence du Premier Ministre <Normal Mode Donjon> (Recommandé pour les groupes de 1-3 joueurs)|
818|Grotte Non Répertoriée|Un paradis caché dans la Vallée Brûlante. D'immenses vignes grimpantes forment un passage vers une magnifique grotte ornée de stalactites de pierres précieuses. Le soleil se reflète sur sa surface, lui donnant une étrange lueur arctique. C'est un endroit à absolument voir au moins d'une fois dans sa vie.

Dans ce paradis, se trouve une chambre secrète qui renferme d'anciens manuscrits. Cette langue ancienne est très difficile à comprendre, mais les chercheurs savent que ces manuscrits renferment d'horribles vérités. 

Derrière une haute porte dorée se trouve une pièce vide entièrement peinte en blanc. Les lumières qui éclairent cet endroit lui donnent une atmosphère étrange et oppressante. 

||||||||||Région Désertique <Normal Mode Donjon> (Recommandé pour les groupes de 1-3 joueurs)|
819|Cratère Météoritique <Solo>|Un cratère immense défigure le paysage 
après qu'une météorite est entrée en collision avec la Terre. Le sol y est noirci et 
encore chaud. En son centre, une cavité invite ceux qui l'osent 
à partir à l'aventure. 

En-deçà gît une caverne lugubre. Des stalactites 
sont accrochées à la voûte de la grotte, 
tandis que des stalagmites entourent un gouffre sans fond.

Les parois rocheuses sont quant à elles recouvertes de mousse à cause de l'humidité. Des milliers de chauves-souris 
ont élu domicile dans la Cavité aux Stalactites. La Chute de Cielmont 
constitue l'unique source de lumière de la caverne. ||||||||||Cavité Souterraine (DJN Solo) (Seul 1 joueur peut entrer)|
820|Grotte de la Marée des Ombres <Solo>|Au cœur de la Chaîne du Mont Gowen se niche une caverne froide et humide 
enchevêtrée de ronces. Le sol de la grotte est recouvert d'un tapis 
d'herbe et de végétaux variés assez drus pour servir de cachette aux forces rebelles.

Un petit avant-poste garde l'entrée des lieux. En s'enfonçant un peu plus en avant dans le camp, 
il est possible de découvrir des habitations spacieuses. Bien qu'elles semblent relativement confortables, 
les os blanchis qui jonchent le sol donnent 
froid dans le dos. 

Plus loin encore, les hommes ont aménagé un accès menant 
dans les profondeurs de la grotte. Cependant, aucune activité humaine n'est à signaler au-delà, et 
seuls les rugissements de quelques créatures des ténèbres rompent parfois le silence. 
||||||||||Grotte des Rebelles (DJN Solo) (Seul 1 joueur peut entrer)|
821|Tour Kahlo <Solo>|Les armoiries du Royaume Durango habillent les murs de la 
Chambre du Congrès du Palais Magique aux côtés de fresques 
qui représentent d'envoûtants paysages du Continent du Centre.

Un atrium abrite également un jardin luxuriant et offre une vue imprenable sur la ville et l'horizon. 
Nuit et jour, il est bercé par la lumière orange d'un Cristal magique. Cette pierre semble 
irradier davantage encore quand les ténèbres s'installent.

La Chambre du Congrès du Royaume Durango est une structure recouverte 
par un dôme de verre. Pendant la nuit, la lumière de la lune et des étoiles inonde la pièce et lui donne 
des reflets éthérés. Bien que le temps ait laissé sa marque, il est encore 
possible d'imaginer la beauté des lieux pendant l'âge d'or du royaume. ||||||||||Tour Kahlo (Solo) (Seul 1 joueur peut entrer)|
822|Iyernafalo <Solo>|Iyernafalo, plus communément connu sous le nom de Sanctuaire de Voléclat, 
s'élève au-dessus des brumes et surplombe les nuages. Cet imposant édifice est un chef-d'œuvre d'architecture dont 
les cristaux d'ornement, scintillant au crépuscule, émerveillent ceux qui posent leurs yeux dessus.

La légende raconte qu'Iyernafalo renfermerait le pouvoir secret 
qui permet au Royaume Durango de flotter dans les airs. Le cristal magique 
incrusté au cœur de la structure brille d'une énergie indescriptible.

Malheureusement, les forces du Prince du Fléau ont réussi à infiltrer Iyernafalo 
et ont pris le contrôle de ses gardes. Nul ne sait quel sort attend ce 
sanctuaire majestueux. ||||||||||Cité Céleste Royale (DJN Solo) (Seul 1 joueur peut entrer)|
823|Terre sacrée de Kamodo <Solo>|Le légendaire arbre de vie pousse au centre du Dôme Céleste
et la Tribu Orphidée, qui dépend de cet arbre pour vivre, organise un rituel de prières tous les 60 ans 
pour exprimer sa reconnaissance.

Il semblerait que l'Arbre de Vie réagisse à ces rituels, puisqu'il 
a tracé petit à petit un mystérieux passage menant à un endroit inconnu : 
la Terre sacrée de Kamodo.

L'Arbre de Vie communique avec la tribu
à travers les pensées et grâce à ce guide inattendu,
la tribu prospère.||||||||||La volonté de l'Arbre de Vie <DJN multijoueur> (de 1 à 5 joueurs)|
824|Temple aquatique <Solo>|Le Temple aquatique se trouve au milieu d'un lac qui ne gèle jamais, même avec des températures négatives. Tout le monde
pense que c'est une bénédiction du Dieu de la rivière
pour que la rivière puisse couler en tout temps et irriguer les terres.

Pour exprimer leur reconnaissance au Dieu de la rivière et le remercier de ce don,
ils ont construit au sud
le Temple aquatique.

Bâti avec de solides pierres, des statues de dieux ornent le vaste hall et des cascades jaillissent de toute part.
C'est le témoignage du respect et de l'admiration 
qu'ont les indigènes pour le dieu de la rivière.||||||||||Protection de la source des hautes terres <DJN multijoueur> (de 3 à 5 joueurs)|
825|Labo Antigravité <Solo>|Le gouvernement de Grey Lynn, pour mettre leur plan à exécution en secret,
a utilisé la tour de garde au nord comme couverture, construisant à son pied un labo secret d'Antigravité
d'où il opère désormais.

Des murs qui menacent de s'écrouler, des livres poussiéreux éparpillés et une entrée délabrée 
donnent l'impression que cet endroit est abandonné mais, caché au plus profond de ces ruines,
se déroulent d'effroyables recherches.

En plus de ces illusions, d'autres précautions ont été prises 
pour empêcher ces recherches d'être découvertes au grand jour : tout intrus est immédiatement capturé
et disparaît à jamais.||||||||||La vérité cachée <DJN solo> (de 1 à 5 joueurs)|
826|Grey Lynn <Solo>|La majestueuse façade du bâtiment du gouvernement de Grey Lynn
cache en son sein une sombre vérité.
Peu sont au courant de ce qui se trame vraiment juste sous leur nez.

Un ascenseur s'enfonce dans les entrailles du bâtiment vers une installation souterraine
où le gouvernement effectue des projets classés top secret.
Cependant, l'accès à cet ascenseur est strictement réservé au personnel autorisé.

Pour protéger cet endroit de toute intrusion, il est
étroitement gardé. Le gouvernement a investi énormément d'argent dans des recherches qui pourraient détruire l'humanité...
Les recherches sont entrées dans leur phase finale.||||||||||Commencement et Fin <DJN Solo> (de 3 à 5 joueurs)|
827|Vallée Batelo (Solo)|La Vallée Batelo n'est accessible que par l'entrée sud-est de la Jungle Mayland. 
À peine entré dans la vallée, le voyageur est plongé dans un monde totalement à part. Dans la vallée, le ciel est sombre et rouge, 
les paysages de cette vallée sont uniques et l'atmosphère mystérieuse. 

Cette vallée est recouverte de prairie. La seule route qui la traverse est bordée 
d'arbres. Alors que le voyageur marchera sur la route, 
sa vue sera limitée par les feuilles et les branches.||||||||||Tanière du Descendant de la Bête divine (DJN multijoueur) (de 1 à 5 joueurs)|
828|Allolans (Solo)|En entrant dans la temple du Bassin Shaxia, le voyageur ne verra aucun bâtiment, 
mais fera face à quelque chose d'absolument fantastique qu'il ne verra nulle par ailleurs. Porte du Temple 
Donne sur Allolans, la tanière de la Bête divine de Shaxia. 

Les aurores boréales donnent à cet endroit 
une ambiance unique, comme si on était perdu dans l'espace. Les plantes qui y poussent sont tout à fait étranges et uniques. 
De mystérieuses fleurs bleues émettent des rayons de lumière, participant au décor surréaliste.||||||||||Îles Flottantes (DJN solo) (de 1 à 5 joueurs)|
829|Illusion Destructrice : Carrière Angor (Solo)|Un univers créé de toutes pièces par la tribu Shaxia grâce à la magie noire. Leur Bête Divine a le pouvoir de 
matérialiser le Pays des Merveilles afin d'entraîner les jeunes 
soldats de la tribu et à les aider à surmonter leur peur. 

L'apparence du Pays des Merveilles dépend des souvenirs de la recrue et de la volonté de la Bête Divine. 
Lorsque la recrue surmonte toutes les épreuves, elle reçoit 
un immense pouvoir de la Bête divine.||||||||||En souvenir du Pays des Merveilles (DJN Solo) (seul 1 joueur peut entrer)|
