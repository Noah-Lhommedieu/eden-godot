209|Un accident est si vite arrivé|Ce jour éblouissant qu'est la Saint-Valentin est enfin arrivé ! C'est le moment de sortir le portefeuille, et de trouver un cadeau qui plaira à votre moitié ! Pour l'occasion, la marchande professionnelle de la Saint Valentin Michelle est là pour vous. Pour faire marcher les affaires, elle a fait de la publicité pour son magasin en décorant Aven avec ses ballons en forme de cœur. Une touche romantique d'un extrême raffinement. 

